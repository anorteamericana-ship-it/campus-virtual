// MODAL CAMBIAR ESTATUS
// ─────────────────────────────────────────────────────────────────────────
function ModalEstatus({ estudiante, nivel, onClose, onSuccess }) {
  const [nuevoEstatus, setNuevoEstatus] = React.useState(estudiante.estatus || 'CA');
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState('');

  const estados = ['CA','APR','REP','CNV','RI','RJ','PE'];

  async function handleGuardar() {
    if (!nuevoEstatus || nuevoEstatus === estudiante.estatus) { onClose(); return; }
    setLoading(true); setError('');
    try {
      const resp = await fetch(SCRIPT_URL_AS, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          fn: 'actualizarEstatus',
          codigo: estudiante.codigo,
          nivel,
          estatus: nuevoEstatus,
          nota: estudiante.nota || null,
        })
      });
      const data = await resp.json();
      if (data.ok) { onSuccess(); onClose(); }
      else setError(data.error || 'Error al actualizar');
    } catch(e) { setError('Error de conexión'); }
    finally { setLoading(false); }
  }

  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.4)', zIndex:1000, display:'flex', alignItems:'center', justifyContent:'center' }}>
      <div style={{ background:'white', borderRadius:12, padding:24, minWidth:320, boxShadow:'0 8px 32px rgba(0,0,0,0.2)' }}>
        <div style={{ fontWeight:700, fontSize:15, marginBottom:16 }}>
          Cambiar estatus — {nivel}
        </div>
        <div style={{ fontSize:13, color:'var(--text-secondary, #666)', marginBottom:12 }}>
          {estudiante.display || estudiante.nombre} · actual: <strong>{estudiante.estatus}</strong>
        </div>
        <div style={{ display:'flex', flexWrap:'wrap', gap:8, marginBottom:16 }}>
          {estados.map(s => (
            <button key={s} onClick={() => setNuevoEstatus(s)} style={{
              padding:'6px 14px', borderRadius:6, border:'2px solid',
              borderColor: nuevoEstatus===s ? 'var(--brand, #14213D)' : 'var(--border, #ddd)',
              background: nuevoEstatus===s ? 'var(--brand, #14213D)' : 'white',
              color: nuevoEstatus===s ? 'white' : 'var(--text, #222)',
              fontWeight:700, fontSize:12, cursor:'pointer'
            }}>{s}</button>
          ))}
        </div>
        {error && <div style={{ color:'var(--err, #C62828)', fontSize:12, marginBottom:8 }}>{error}</div>}
        <div style={{ display:'flex', gap:8, justifyContent:'flex-end' }}>
          <button onClick={onClose} style={{ padding:'7px 16px', borderRadius:6, border:'1px solid var(--border, #ddd)', background:'white', cursor:'pointer' }}>Cancelar</button>
          <button onClick={handleGuardar} disabled={loading} style={{ padding:'7px 16px', borderRadius:6, background:'var(--brand, #14213D)', color:'white', border:'none', fontWeight:700, cursor:'pointer' }}>
            {loading ? 'Guardando...' : 'Guardar'}
          </button>
        </div>
      </div>
    </div>
  );
}

function nivelToId(nivelTexto) {
  const map = {

    'B1':'B1','B2':'B2','I1':'I1','I2':'I2',

// ─────────────────────────────────────────────────────────────────────────
// LÓGICA DE LECCIÓN ESTIMADA
// ─────────────────────────────────────────────────────────────────────────
function calcularLeccionActual(startDate, diasCode, estatus) {
  // Si el nivel está APR → 32/32
  if (estatus === 'APR') return 32;
  if (!startDate) return 0;

  const diasMap = { LM:[1,3], KJ:[2,4], LJ:[1,4], SA:[6] };
  const dias = diasMap[diasCode] || [1,3];
  const inicio = new Date(startDate);
  inicio.setHours(0,0,0,0);
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  if (hoy < inicio) return 0;

  let count = 0;
  const cursor = new Date(inicio);
  while (cursor <= hoy) {
    if (dias.includes(cursor.getDay())) count++;
    cursor.setDate(cursor.getDate() + 1);
  }
  // SA y LJ dan 2 lecciones por sesión
  if (diasCode === 'SA' || diasCode === 'LJ') count *= 2;
  return Math.min(count, 32);
}

  return (
    <div style={{ display:'flex', gap:3 }}>
      {Array.from({ length: total }, (_, i) => (
        <span key={i} style={{

          lineHeight: 1,

  );
}

// ─────────────────────────────────────────────────────────────────────────
// SUBTÍTULO POR NIVEL (según mezcla de estados)
// ─────────────────────────────────────────────────────────────────────────
function calcularSubtitulo(estudiantes) {
  // Usar nivel_estado del Apps Script si está disponible
  const estadoReal = estudiantes[0]?.nivel_estado;
  if (estadoReal === 'En curso')    return 'En curso';
  if (estadoReal === 'Cerrado')     return 'Cerrado';
  if (estadoReal === 'Proyectado')  return 'Proyectado — próximo nivel';
  // Fallback si no viene del backend
  const estados = estudiantes.map(e => e.estatus);
  if (!estados.length) return '';
  if (estados.every(e => e === 'PE')) return 'Proyectado — próximo nivel';
  if (estados.some(e => e === 'CA'))  return 'En curso';
  if (estados.every(e => e === 'APR')) return 'Cerrado';
  return 'Cerrado';
}

// ─────────────────────────────────────────────────────────────────────────
// TABLA DE NIVEL
// ─────────────────────────────────────────────────────────────────────────
function rowBg(estatus, idx) {
  if (estatus === 'APR') return 'rgba(76,175,80,0.07)';   // verde muy suave
  if (estatus === 'CA')  return idx%2===0 ? 'white' : 'var(--surface, #FAFAF7)'; // normal
  if (estatus === 'RI' || estatus === 'RJ') return 'rgba(0,0,0,0.03)'; // gris muy suave
  if (estatus === 'REP') return 'rgba(232,55,42,0.05)';  // rojo muy suave
  return idx%2===0 ? 'white' : 'var(--surface, #FAFAF7)';
}

// COMPONENTE PRINCIPAL

function AdminEstudiantesView({ onNavigate }) {
  const { grupos, loading: loadingGrupos } = useAdminGrupos();
  const [grupoSel, setGrupoSel] = React.useState(null);
  const [refreshKey, setRefreshKey] = React.useState(0);
  const [estudiantePanelAbierto, setEstudiantePanelAbierto] = React.useState(null);
  const { data, loading: loadingRad } = useRadiografia(grupoSel, refreshKey);
  const grupoInfoDetalle = useGrupoInfo(grupoSel);

  // Estado de ordenamiento (compartido entre tablas de niveles)
  const [sortCol, setSortCol] = React.useState('codigo');
  const [sortDir, setSortDir] = React.useState('asc');

  function toggleSort(col) {
    if (sortCol === col) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortCol(col); setSortDir('asc'); }
  }

  function sortEstudiantes(lista) {
    return [...lista].sort((a, b) => {
      let va = a[sortCol];
      let vb = b[sortCol];
      if (va == null) va = '';
      if (vb == null) vb = '';
      if (typeof va === 'number' && typeof vb === 'number') {
        return sortDir === 'asc' ? va - vb : vb - va;
      }
      return sortDir === 'asc'
        ? String(va).localeCompare(String(vb), 'es')
        : String(vb).localeCompare(String(va), 'es');
    });
  }

  // Al tener grupos, seleccionar el primero automáticamente
  React.useEffect(() => {
    if (grupos.length && !grupoSel) setGrupoSel(grupos[0].code);
  }, [grupos]); // eslint-disable-line react-hooks/exhaustive-deps

  const grupoInfo = grupos.find(g => g.code === grupoSel);

  // Construir secciones desde getRadiografiaGrupo (data.niveles = { B1:[], B2:[], I1:[], I2:[] })
  const secciones = React.useMemo(() => {
    if (!data || !data.niveles) return [];
    return ORDEN_NIVELES
      .filter(n => data.niveles[n] && data.niveles[n].length > 0)
      .map(n => ({ nivel: n, estudiantes: data.niveles[n] }));
  }, [data]);

  // Lección estimada — derivada del código del grupo (NIVEL-DIAS-...-NNYY)
  const diasCode = extraerDias(grupoSel);
  const leccionActual = grupoInfoDetalle
    ? calcularLeccionActual(grupoInfoDetalle.startDate, diasCode, 'CA')
    : 0;

  return (
    <div style={{ padding: 24 }}>
      <PageHeader
        kicker="Administración"
        title={<>Grupos <em>activos</em></>}
        sub="Click en un grupo para ver su radiografía completa"
      />

      {/* Grid de chips */}
      {loadingGrupos ? (
        <div style={{ color:'var(--ink-3, #888)', padding:20 }}>Cargando grupos…</div>
      ) : grupos.length === 0 ? (
        <div style={{ color:'var(--ink-3, #888)', padding:20 }}>No hay grupos activos.</div>
      ) : (
        <div style={{ display:'grid', gridTemplateColumns:'repeat(5, minmax(0,1fr))', gap:12, marginBottom:32 }}>
          {grupos.map(g => (
            <ChipGrupo
              key={g.code}
              grupo={g}
              seleccionado={grupoSel === g.code}
              onClick={() => setGrupoSel(g.code)}
            />
          ))}
        </div>
      )}

      {/* Panel radiografía */}
      {grupoSel && grupoInfo && (
        <div>
          {/* Header del grupo */}
          <div style={{
            background:'var(--an-navy, #14213D)', color:'white', borderRadius:10,
            padding:'14px 20px', marginBottom:20, display:'flex',
            alignItems:'center', gap:24, flexWrap:'wrap',
          }}>
            <div>
              <div style={{ fontWeight:800, fontSize:16, fontFamily:'var(--f-mono, monospace)', letterSpacing:'-0.01em' }}>{grupoInfo.code}</div>
              <div style={{ fontSize:12, opacity:0.75, marginTop:2 }}>
                {(grupoInfo.schedule || grupoInfo.horario || '—')}
                {grupoInfo.programa ? ` · ${grupoInfo.programa}` : ''}
              </div>
            </div>
            <div style={{ flex:1, minWidth:20 }} />
            <div style={{ textAlign:'center', minWidth:140 }}>
              <div style={{ fontSize:10, opacity:0.7, letterSpacing:'0.1em', textTransform:'uppercase' }}>Docente</div>
              <div style={{ fontWeight:600, fontSize:13, marginTop:2 }}>{grupoInfo.docente || grupoInfo.teacher || '—'}</div>
            </div>
            <div style={{ textAlign:'center', minWidth:90 }}>
              <div style={{ fontSize:10, opacity:0.7, letterSpacing:'0.1em', textTransform:'uppercase' }}>Estudiantes</div>
              <div style={{ fontWeight:700, fontSize:20, marginTop:1, fontFamily:'var(--f-serif, Fraunces, serif)', letterSpacing:'-0.02em' }}>
                {grupoInfo.estudiantes ?? grupoInfo.students ?? 0}
              </div>
            </div>
            <div style={{ textAlign:'center', minWidth:90 }}>
              <div style={{ fontSize:10, opacity:0.7, letterSpacing:'0.1em', textTransform:'uppercase' }}>Lección</div>
              <div style={{ fontWeight:700, fontSize:20, marginTop:1, fontFamily:'var(--f-serif, Fraunces, serif)', letterSpacing:'-0.02em' }}>
                {leccionActual}<span style={{ fontSize:13, opacity:0.6 }}>/32</span>
              </div>
            </div>
          </div>

          {/* Secciones por nivel */}
          {loadingRad ? (
            <div style={{ textAlign:'center', padding:40, color:'var(--ink-3, #888)' }}>
              Cargando radiografía del grupo…
            </div>
          ) : secciones.length === 0 ? (
            <div style={{ textAlign:'center', padding:40, color:'var(--ink-3, #888)' }}>
              Sin estudiantes registrados en este grupo
            </div>
          ) : (
            secciones.map(s => (
              <TablaEstudiantes
                key={s.nivel}
                estudiantes={s.estudiantes}
                nivelKey={s.nivel}
                sortCol={sortCol}
                sortDir={sortDir}
                toggleSort={toggleSort}
                sortEstudiantes={sortEstudiantes}
                onRefresh={() => setRefreshKey(k => k + 1)}
                onNavigate={onNavigate}
                onAbrirPanel={(est) => setEstudiantePanelAbierto(est)}
              />
            ))
          )}
        </div>
      )}

      {estudiantePanelAbierto && (
        <PanelEstudianteDrawer
          est={estudiantePanelAbierto}
          onClose={() => setEstudiantePanelAbierto(null)}
          onNavigate={onNavigate}
        />
      )}
    </div>
  );
}

            <TabPagosPanel pagosEst={pagosEst} niveles={niveles} detalle={detalle} onNavigate={onNavigate} est={est} />
          )}
          {tabActiva === 'notas' && !cargando && (
            <TabNotasPanel niveles={niveles} nivelActivo={nivelActivo} />
          )}
          {tabActiva === 'asistencia' && !cargando && (

            <TabDocumentosPanel est={est} detalle={detalle} nivelActivo={nivelActivo} niveles={niveles} />

}

// ── TAB ASISTENCIA ────────────────────────────────────────────────────────
function TabAsistenciaPanel({ est, detalle }) {
  const [asistencia, setAsistencia] = React.useState(null);
  const [cargando, setCargando]     = React.useState(true);

  React.useEffect(() => {
    const codigo = est.codigo || est.rec_m;
    if (!codigo) return;
    fetch(`${SCRIPT_URL_PANEL}?fn=getAsistenciaEstudiante&codigo=${encodeURIComponent(codigo)}`)
      .then(r => r.json())
      .then(d => { if (d.ok) setAsistencia(d.asistencia || []); })
      .catch(() => {})
      .finally(() => setCargando(false));
  }, [est.codigo, est.rec_m]);

  if (cargando) return <div style={{ padding:'20px', textAlign:'center', color:'var(--ink-3, #999)', fontSize:13 }}>⏳ Cargando asistencia…</div>;

  if (!asistencia || asistencia.length === 0) {
    return (
      <div style={{ textAlign:'center', padding:'40px', color:'var(--ink-3, #999)' }}>
        <div style={{ fontSize:36, marginBottom:10 }}>📅</div>
        <div style={{ fontSize:13 }}>No hay registros de asistencia aún.</div>
      </div>
    );
  }

  const total     = asistencia.length;
  const presentes = asistencia.filter(a => a.presente === true || a.presente === 'TRUE').length;
  const pct       = Math.round((presentes / total) * 100);
  const colorPct  = pct >= 85 ? '#2E7D32' : pct >= 70 ? '#C67100' : '#C00000';

  return (
    <div>
      <div style={{ fontFamily:'var(--f-serif, serif)', fontSize:20, fontWeight:500, color:'var(--an-navy-ink, #14213D)', marginBottom:16 }}>
        Asistencia
      </div>

      <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:10, marginBottom:20 }}>
        {[
          { label:'Lecciones', val: total },
          { label:'Presentes', val: presentes },
          { label:'Asistencia', val: `${pct}%`, color: colorPct },
        ].map(({ label, val, color }) => (
          <div key={label} style={{ padding:'14px 16px', background:'var(--surface-2, #f9f9f9)', border:'1px solid var(--line, #eee)', borderRadius:'var(--r-md, 8px)', textAlign:'center' }}>
            <div style={{ fontSize:10, fontWeight:700, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--ink-3, #999)', marginBottom:6 }}>{label}</div>
            <div style={{ fontFamily:'var(--f-serif, serif)', fontSize:26, fontWeight:500, color: color || 'var(--an-navy-ink, #14213D)' }}>{val}</div>
          </div>
        ))}
      </div>

      <div style={{ height:8, background:'var(--line, #eee)', borderRadius:4, marginBottom:20, overflow:'hidden' }}>
        <div style={{ width:`${pct}%`, height:'100%', background: colorPct, borderRadius:4, transition:'width 0.5s' }} />
      </div>

      <div style={{ fontWeight:700, fontSize:12, color:'var(--ink-3, #999)', marginBottom:10, letterSpacing:'0.08em', textTransform:'uppercase' }}>
        Detalle por lección
      </div>
      <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
        {asistencia.map((a, i) => {
          const presente = a.presente === true || a.presente === 'TRUE';
          const comentario = a.comentario || a.retroalimentacion || '';
          return (
            <div key={i} style={{
              display:'grid', gridTemplateColumns:'auto auto 1fr',
              gap:10, alignItems:'flex-start',
              padding:'10px 14px',
              background: presente ? 'color-mix(in srgb,#2E7D32 4%,white)' : 'color-mix(in srgb,#C00000 4%,white)',
              border:`1px solid ${presente ? 'color-mix(in srgb,#2E7D32 20%,white)' : 'color-mix(in srgb,#C00000 15%,white)'}`,
              borderRadius:'var(--r-md, 8px)',
            }}>
              <div style={{ fontSize:11, fontWeight:700, fontFamily:'var(--f-mono, monospace)', color:'var(--ink-3, #999)', minWidth:24 }}>
                #{a.leccion_num || (i+1)}
              </div>
              <div style={{
                padding:'2px 8px', borderRadius:999, fontSize:10, fontWeight:700,
                background: presente ? '#2E7D32' : '#C00000',
                color:'white', whiteSpace:'nowrap',
              }}>
                {presente ? '✓ Presente' : '✗ Ausente'}
              </div>
              <div>
                {a.fecha_leccion && (
                  <div style={{ fontSize:11, color:'var(--ink-3, #999)', marginBottom: comentario ? 3 : 0 }}>
                    {a.fecha_leccion}
                  </div>
                )}
                {comentario && (
                  <div style={{ fontSize:11, color:'var(--ink-2, #555)', lineHeight:1.4 }}>
                    {comentario}
                  </div>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── TAB DOCUMENTOS ────────────────────────────────────────────────────────
function TabDocumentosPanel({ est, detalle, nivelActivo, niveles }) {
  const NIVEL_LABEL_D = { B1:'Básico I', B2:'Básico II', I1:'Intermedio I', I2:'Intermedio II' };
  const NIVEL_COLOR_D = { B1:'#E5A823', B2:'#E8372A', I1:'#2B7FC1', I2:'#4CAF50' };

  const nivelAntMap  = { B1:null, B2:'B1', I1:'B2', I2:'I1' };
  const nivAnt       = nivelAntMap[nivelActivo];
  const estatusAnt   = nivAnt ? String(niveles[nivAnt]?.estatus || '').toUpperCase() : null;
  const estatusAct   = String(niveles[nivelActivo]?.estatus || '').toUpperCase();
  const certNum      = String(niveles[nivelActivo]?.cert || '').trim();

  const docs = [
    {
      tipo: 'CERTIFICADO',
      titulo: 'Documento de Inscripción',
      desc: 'Constancia oficial de matrícula al programa. Incluye nivel, horario y lineamientos.',
      icono: '📋', color: '#2B7FC1',
      ok: !!detalle,
      razon: !detalle ? 'Cargando datos…' : null,
    },
    {
      tipo: 'MATRICULA_2',
      titulo: 'Carta No Deuda CONAPE',
      desc: `Requerida por CONAPE para ${NIVEL_LABEL_D[nivelActivo] || nivelActivo}. Requiere nivel anterior aprobado.`,
      icono: '🏦', color: '#4CAF50',
      ok: !!nivAnt && estatusAnt === 'APR',
      razon: !detalle ? 'Cargando…' : !nivAnt ? 'No aplica para Básico I' : estatusAnt !== 'APR' ? `${nivAnt} debe estar APR (actual: ${estatusAnt || '—'})` : null,
    },
    {
      tipo: 'CERTIFICACION',
      titulo: 'Certificación de Nivel',
      desc: `Título oficial de ${NIVEL_LABEL_D[nivelActivo] || nivelActivo}. Requiere APR y certificado pagado.`,
      icono: '🏅', color: '#E5A823',
      ok: estatusAct === 'APR' && !!certNum,
      razon: !detalle ? 'Cargando…' : estatusAct !== 'APR' ? `Nivel debe estar APR (actual: ${estatusAct || '—'})` : !certNum ? 'REG_CERTIFICADOS vacío' : null,
    },
  ];

  const [gen, setGen] = React.useState({});
  const [res, setRes] = React.useState({});

  const generar = async (tipo) => {
    if (gen[tipo]) return;
    setGen(g => ({...g, [tipo]: true}));
    setRes(r => ({...r, [tipo]: null}));
    try {
      const resp = await fetch(SCRIPT_URL_PANEL, {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ fn:'generarDocumento', tipo, codigo: String(est.codigo || est.rec_m || ''), nivel: nivelActivo }),
      });
      const data = await resp.json();
      setRes(r => ({...r, [tipo]: data.ok ? { url:data.url, nombre:data.nombre } : { error:data.error }}));
    } catch(e) {
      setRes(r => ({...r, [tipo]: { error:'Error de conexión' }}));
    } finally {
      setGen(g => ({...g, [tipo]: false}));
    }
  };

  return (
    <div>
      <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:16, fontSize:13, color:'var(--ink-3, #999)' }}>
        Nivel activo:
        <span style={{ padding:'3px 12px', borderRadius:999, fontWeight:700, fontSize:12, background:`color-mix(in srgb, ${NIVEL_COLOR_D[nivelActivo]} 14%, white)`, color: NIVEL_COLOR_D[nivelActivo] }}>
          {NIVEL_LABEL_D[nivelActivo] || nivelActivo}
        </span>
      </div>

      <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
        {docs.map(({ tipo, titulo, desc, icono, color, ok, razon }) => {
          const r = res[tipo]; const cargando = gen[tipo];
          return (
            <div key={tipo} style={{
              border:`2px solid ${ok ? color : 'var(--line, #eee)'}`,
              borderRadius:'var(--r-lg, 12px)', padding:'16px 18px',
              background: ok ? `color-mix(in srgb, ${color} 4%, white)` : 'var(--surface-2, #f9f9f9)',
              opacity: ok ? 1 : 0.65,
            }}>
              <div style={{ display:'grid', gridTemplateColumns:'40px 1fr auto', gap:12, alignItems:'flex-start' }}>
                <div style={{ width:40, height:40, borderRadius:'var(--r-md, 8px)', background:`color-mix(in srgb, ${color} 15%, white)`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:20 }}>
                  {icono}
                </div>
                <div>
                  <div style={{ fontWeight:700, fontSize:13, marginBottom:3 }}>{titulo}</div>
                  <div style={{ fontSize:11, color:'var(--ink-3, #999)', lineHeight:1.4 }}>{desc}</div>
                  {razon && (
                    <div style={{ marginTop:6, fontSize:11, color:'#C67100', fontWeight:600, padding:'2px 8px', background:'color-mix(in srgb,#E5A823 10%,white)', borderRadius:5, display:'inline-block' }}>
                      🔒 {razon}
                    </div>
                  )}
                  {r?.url && (
                    <div style={{ marginTop:8, padding:'8px 12px', background:'color-mix(in srgb,#2E7D32 8%,white)', border:'1px solid #2E7D32', borderRadius:'var(--r-md, 8px)', display:'flex', alignItems:'center', gap:8 }}>
                      <span>✅</span>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontSize:11, fontWeight:700, color:'#2E7D32', marginBottom:1 }}>PDF generado</div>
                        <div style={{ fontSize:10, color:'var(--ink-3, #999)', fontFamily:'var(--f-mono, monospace)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{r.nombre}</div>
                      </div>
                      <a href={r.url} target="_blank" rel="noreferrer" style={{ padding:'4px 12px', borderRadius:5, background:'#2E7D32', color:'white', fontSize:11, fontWeight:700, textDecoration:'none' }}>Abrir</a>
                    </div>
                  )}
                  {r?.error && (
                    <div style={{ marginTop:6, padding:'6px 10px', background:'color-mix(in srgb,#C00000 8%,white)', border:'1px solid #C00000', borderRadius:'var(--r-md, 8px)', fontSize:11, color:'#8B0000' }}>❌ {r.error}</div>
                  )}
                </div>
                <button
                  disabled={!ok || cargando}
                  onClick={() => generar(tipo)}
                  style={{ padding:'8px 14px', borderRadius:'var(--r-md, 8px)', border:`2px solid ${ok ? color : 'var(--line, #eee)'}`, background: ok ? color : 'var(--surface-3, #eee)', color: ok ? 'white' : 'var(--ink-3, #999)', fontWeight:700, fontSize:11, cursor: ok && !cargando ? 'pointer' : 'not-allowed', whiteSpace:'nowrap', opacity: cargando ? 0.7 : 1 }}>
                  {cargando ? '⏳…' : 'Generar'}
                </button>
              </div>
            </div>
          );
        })}
      </div>

      <div style={{ marginTop:14, fontSize:11, color:'var(--ink-3, #999)', padding:'10px 14px', background:'var(--surface-2, #f9f9f9)', borderRadius:'var(--r-md, 8px)' }}>
        📁 Los PDFs se guardan automáticamente en Drive en la carpeta del estudiante.
      </div>
    </div>
  );
}

function FichaEstudiante({ est, onBack, detalle, cargandoDet, errDetalle }) {
  const conapeData = (CONAPE || {})[String(est.cedula)] || null;
  const hasConape = !!conapeData || est.convenio === 'CONAPE';
  const [tabActiva, setTabActiva] = React.useState('niveles');

  // Construir nivelMap: preferir datos reales del servidor
  const nivelMap = {};
  if (detalle?.niveles) {
    Object.entries(detalle.niveles).forEach(([niv, info]) => {
      nivelMap[niv] = {
        nivel:  niv,
        status: info.estatus || info.status || 'PE',
        nota:   info.nota    || 0,
        grupo:  detalle.grupo?.COD_GRUPO || est.grupo_actual || '',
        fecha:  null,
        cert:   null,
      };
    });
  } else {
    (est.historial || []).forEach(h => { nivelMap[h.nivel] = h; });
  }

  // Pagos reales o del bundle
  const pagosEst = detalle
    ? [...(detalle.pagos || []), ...(detalle.otrosPagos || [])]
    : (PAGOS || {})[String(est.rec_m)] || [];

  // Cuota pactada individual
  const cuotaPactada = detalle?.pendientes?.cuota_mensual || null;
  // Grupo real
  const grupoReal    = detalle?.grupo || null;

  return (
    <div>

        color:'white',

        <div style={{ display:'grid', gridTemplateColumns:'1fr auto', gap:20, alignItems:'flex-start', position:'relative' }}>

              <span>Código: <strong style={{ fontFamily:'var(--f-mono)' }}>{est.rec_m}</strong></span>
              {(grupoReal?.COD_GRUPO || est.grupo_actual) && <span>Grupo: <strong>{grupoReal?.COD_GRUPO || est.grupo_actual}</strong></span>}
              {grupoReal?.DOCENTE && <span>Docente: <strong>{grupoReal.DOCENTE}</strong></span>}

            </div>
          </div>

          {/* Badge CONAPE */}
          <div style={{ textAlign:'center', flexShrink:0 }}>
            {hasConape ? (
              <div style={{ background:'color-mix(in srgb, #2E7D32 20%, white)', border:'2px solid #2E7D32', borderRadius:'var(--r-md)', padding:'12px 18px', color:'#1B5E20' }}>
                <div style={{ fontSize:10, fontWeight:700, letterSpacing:'0.12em', textTransform:'uppercase', marginBottom:4 }}>CONAPE</div>
                <div style={{ fontSize:22, marginBottom:2 }}>✓</div>
                <div style={{ fontSize:11, fontWeight:600, fontFamily:'var(--f-mono)' }}>{conapeData.expediente || conapeData.nombre}</div>
                <div style={{ fontSize:10, color:'#2E7D32', marginTop:2 }}>{conapeData.fecha ? new Date(conapeData.fecha+'T00:00:00').toLocaleDateString('es-CR',{day:'numeric',month:'short',year:'numeric'}) : ''}</div>
              </div>
            ) : (
              <div style={{ background:'color-mix(in srgb, #C00000 12%, white)', border:'2px solid #C00000', borderRadius:'var(--r-md)', padding:'12px 18px', color:'#8B0000' }}>
                <div style={{ fontSize:10, fontWeight:700, letterSpacing:'0.12em', textTransform:'uppercase', marginBottom:4 }}>CONAPE</div>

              </div>
            )}
          </div>
        </div>
      </div>

      {/* Tabs */}
      <div className="tabs" style={{ marginBottom:16 }}>
        {[['niveles','Niveles y notas'],['pagos','Pagos'],['documentos','📄 Documentos']].map(([k,l]) => (
          <button key={k} className={`tab ${tabActiva===k?'active':''}`} onClick={() => setTabActiva(k)}>{l}</button>

      {tabActiva === 'niveles' && (
        <div style={{ display:'grid', gridTemplateColumns:'repeat(2, 1fr)', gap:14 }}>

                  {h ? <StatusChip code={h.status} /> : <StatusChip code="PE" />}

                  <>
                    {/* Nota final */}
                    <div style={{ display:'flex', alignItems:'baseline', gap:8, marginBottom:12 }}>
                      <div style={{ fontFamily:'var(--f-serif)', fontSize:42, fontWeight:500, color:c, lineHeight:1, letterSpacing:'-0.04em' }}>

  );
}

function PanelDocumentos({ est, detalle }) {
  const SCRIPT_URL_B = 'https://script.google.com/macros/s/AKfycbx8O8dxCNhHQQLdRFd4vqOY_yIzE0KUG7ljk7vkieHf9hKWeund_WC0ZpuKU-Toj8sYHQ/exec';
  const nivelActivo = detalle?.grupo?.NIVEL_ACTUAL_ID || est.nivel_actual || 'B1';
  const niveles = detalle?.niveles || {};
  const NIVEL_LABEL = { B1:'Básico I', B2:'Básico II', I1:'Intermedio I', I2:'Intermedio II' };
  const NIVEL_COLOR = { B1:'#E5A823', B2:'#E8372A', I1:'#2B7FC1', I2:'#4CAF50' };

  const nivelAntMap = { B1:null, B2:'B1', I1:'B2', I2:'I1' };
  const nivAnt = nivelAntMap[nivelActivo];
  const estatusAnt = nivAnt ? String(niveles[nivAnt]?.estatus || '').toUpperCase() : null;
  const estatusActivo = String(niveles[nivelActivo]?.estatus || '').toUpperCase();
  const certNum = String(niveles[nivelActivo]?.cert || '').trim();

  const docs = [
    {
      tipo: 'CERTIFICADO',
      titulo: 'Documento de Inscripción',
      desc: 'Constancia oficial de matrícula. Incluye nivel, horario y lineamientos.',
      icono: '📋',
      color: '#2B7FC1',
      ok: !!detalle,
      razon: !detalle ? 'Cargando datos…' : null,
    },
    {
      tipo: 'MATRICULA_2',
      titulo: 'Carta No Deuda CONAPE',
      desc: `Requerida por CONAPE para el nivel ${NIVEL_LABEL[nivelActivo] || nivelActivo}. Requiere nivel anterior aprobado.`,
      icono: '🏦',
      color: '#4CAF50',
      ok: !!nivAnt && estatusAnt === 'APR',
      razon: !detalle ? 'Cargando datos…' : !nivAnt ? 'No aplica para Básico I' : estatusAnt !== 'APR' ? `${nivAnt} debe estar APR (actual: ${estatusAnt || '—'})` : null,
    },
    {
      tipo: 'CERTIFICACION',
      titulo: 'Certificación de Nivel',
      desc: `Título oficial de ${NIVEL_LABEL[nivelActivo] || nivelActivo}. Requiere nivel APR y certificado pagado.`,
      icono: '🏅',
      color: '#E5A823',
      ok: estatusActivo === 'APR' && !!certNum,
      razon: !detalle ? 'Cargando datos…' : estatusActivo !== 'APR' ? `Nivel activo debe estar APR (actual: ${estatusActivo || '—'})` : !certNum ? 'REG_CERTIFICADOS vacío' : null,
    },
  ];

  const [gen, setGen] = React.useState({});
  const [res, setRes] = React.useState({});

  const generar = async (tipo) => {
    if (gen[tipo]) return;
    setGen(g => ({...g, [tipo]: true}));
    setRes(r => ({...r, [tipo]: null}));
    try {
      const resp = await fetch(SCRIPT_URL_B, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fn:'generarDocumento', tipo, codigo: String(est.rec_m || ''), nivel: nivelActivo }),
      });
      const data = await resp.json();
      setRes(r => ({...r, [tipo]: data.ok ? { url: data.url, nombre: data.nombre } : { error: data.error }}));
    } catch(e) {
      setRes(r => ({...r, [tipo]: { error: 'Error de conexión' }}));
    } finally {
      setGen(g => ({...g, [tipo]: false}));
    }
  };

  return (
    <div>
      {!detalle && (
        <div style={{ padding:'12px 16px', background:'color-mix(in srgb,var(--an-navy) 6%,white)', border:'1px solid color-mix(in srgb,var(--an-navy) 20%,white)', borderRadius:'var(--r-md)', fontSize:13, color:'var(--an-navy)', marginBottom:16 }}>
          ⏳ Esperando datos para calcular disponibilidad…
        </div>
      )}
      {detalle && (
        <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:16, fontSize:13, color:'var(--ink-3)' }}>
          Nivel activo:
          <span style={{ padding:'3px 12px', borderRadius:999, fontWeight:700, fontSize:12, background:`color-mix(in srgb, ${NIVEL_COLOR[nivelActivo]} 14%, white)`, color: NIVEL_COLOR[nivelActivo] }}>
            {NIVEL_LABEL[nivelActivo] || nivelActivo}
          </span>
        </div>
      )}
      <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
        {docs.map(({ tipo, titulo, desc, icono, color, ok, razon }) => {
          const r = res[tipo];
          const cargando = gen[tipo];
          return (
            <div key={tipo} style={{ border:`2px solid ${ok ? color : 'var(--line)'}`, borderRadius:'var(--r-lg)', padding:'18px 22px', background: ok ? `color-mix(in srgb, ${color} 4%, white)` : 'var(--surface-2)', opacity: ok ? 1 : 0.65 }}>
              <div style={{ display:'grid', gridTemplateColumns:'44px 1fr auto', gap:14, alignItems:'flex-start' }}>
                <div style={{ width:44, height:44, borderRadius:'var(--r-md)', background:`color-mix(in srgb, ${color} 15%, white)`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:22 }}>{icono}</div>
                <div>
                  <div style={{ fontWeight:700, fontSize:14, color:'var(--ink)', marginBottom:3 }}>{titulo}</div>
                  <div style={{ fontSize:12, color:'var(--ink-3)', lineHeight:1.5 }}>{desc}</div>
                  {razon && (
                    <div style={{ marginTop:6, fontSize:11, color:'#C67100', fontWeight:600, padding:'3px 10px', background:'color-mix(in srgb,#E5A823 10%,white)', borderRadius:6, display:'inline-block' }}>
                      🔒 {razon}
                    </div>
                  )}
                  {r?.url && (
                    <div style={{ marginTop:10, padding:'9px 13px', background:'color-mix(in srgb,#2E7D32 8%,white)', border:'1px solid #2E7D32', borderRadius:'var(--r-md)', display:'flex', alignItems:'center', gap:10 }}>
                      <span>✅</span>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontSize:12, fontWeight:700, color:'#2E7D32', marginBottom:1 }}>PDF generado</div>
                        <div style={{ fontSize:11, color:'var(--ink-3)', fontFamily:'var(--f-mono)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{r.nombre}</div>
                      </div>
                      <a href={r.url} target="_blank" rel="noreferrer" style={{ padding:'5px 13px', borderRadius:6, background:'#2E7D32', color:'white', fontSize:12, fontWeight:700, textDecoration:'none' }}>Abrir PDF</a>
                    </div>
                  )}
                  {r?.error && (
                    <div style={{ marginTop:8, padding:'7px 11px', background:'color-mix(in srgb,#C00000 8%,white)', border:'1px solid #C00000', borderRadius:'var(--r-md)', fontSize:12, color:'#8B0000' }}>❌ {r.error}</div>
                  )}
                </div>
                <button
                  disabled={!ok || cargando}
                  onClick={() => generar(tipo)}
                  style={{ padding:'9px 16px', borderRadius:'var(--r-md)', border:`2px solid ${ok ? color : 'var(--line)'}`, background: ok ? color : 'var(--surface-3)', color: ok ? 'white' : 'var(--ink-3)', fontWeight:700, fontSize:12, cursor: ok && !cargando ? 'pointer' : 'not-allowed', whiteSpace:'nowrap', opacity: cargando ? 0.7 : 1 }}>
                  {cargando ? '⏳ Generando…' : 'Generar PDF'}
                </button>
              </div>
            </div>
          );
        })}
      </div>
      <div style={{ marginTop:14, fontSize:11, color:'var(--ink-3)', padding:'10px 14px', background:'var(--surface-2)', borderRadius:'var(--r-md)' }}>
        📁 Los PDFs se guardan automáticamente en Google Drive en la carpeta del estudiante.
      </div>
    </div>
  );
}

// BUSCADOR PRINCIPAL

function BuscadorEstudiantes() {
  const [query, setQuery]           = React.useState('');
  const [seleccionado, setSeleccionado] = React.useState(null);
  const [detalle, setDetalle]       = React.useState(null);
  const [cargandoDet, setCargandoDet] = React.useState(false);
  const [errDetalle, setErrDetalle] = React.useState('');

  const seleccionar = async (est) => {
    setSeleccionado(est);
    setDetalle(null);
    setErrDetalle('');
    setCargandoDet(true);
    try {
      const res  = await fetch(`${SCRIPT_URL_B}?fn=getEstudiante&codigo=${encodeURIComponent(est.rec_m)}`);
      const data = await res.json();
      if (data.ok) setDetalle(data);
      else setErrDetalle(data.error || 'No se encontró el estudiante en el servidor');
    } catch(e) {
      setErrDetalle('Error de conexión: ' + e.message);
    } finally {
      setCargandoDet(false);
    }
  };

  const volver = () => {
    setSeleccionado(null);
    setDetalle(null);
    setErrDetalle('');
    setCargandoDet(false);
  };

  const resultados = React.useMemo(() => {
    // Lista local vacía: ESTUDIANTES_COMPLETOS fue eliminado de data.jsx.
    // La búsqueda real se conectará a Apps Script más adelante.
    return [];
  }, [query]);

  if (seleccionado) {
    return <FichaEstudiante est={seleccionado} onBack={volver} detalle={detalle} cargandoDet={cargandoDet} errDetalle={errDetalle} />;
  }

  return (
    <div>
      <PageHeader
        kicker="Base de datos"
        title={<>Buscador de <em>Estudiantes</em></>}
        sub={`153 estudiantes registrados · escribí el nombre, cédula o código del estudiante para buscar`}
      />

      {/* Barra de búsqueda */}
      <div style={{
        display:'flex', alignItems:'center', gap:14,
        background:'var(--surface)', border:'2px solid var(--an-navy)',
        borderRadius:'var(--r-lg)', padding:'14px 20px',
        marginBottom:20, boxShadow:'0 4px 20px rgba(12,45,92,0.1)',
      }}>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--an-navy)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/>
        </svg>
        <input
          value={query}
          onChange={e => setQuery(e.target.value)}
          placeholder="Buscar por nombre, cédula o código de expediente…"
          autoFocus
          style={{
            flex:1, border:'none', outline:'none', background:'transparent',
            fontFamily:'var(--f-sans)', fontSize:17, color:'var(--ink)',
          }}
        />
        {query && (
          <button onClick={() => setQuery('')} style={{ background:'none', border:'none', color:'var(--ink-3)', cursor:'pointer', fontSize:20, lineHeight:1 }}>×</button>
        )}
      </div>

      {/* Estado vacío */}
      {!query.trim() && (
        <div style={{ textAlign:'center', padding:'48px 20px', color:'var(--ink-3)' }}>
          <div style={{ fontSize:52, marginBottom:12 }}>🔍</div>
          <div style={{ fontFamily:'var(--f-serif)', fontSize:22, fontWeight:500, color:'var(--an-navy-ink)', marginBottom:6 }}>
            Busca un estudiante
          </div>
          <div style={{ fontSize:14, maxWidth:360, margin:'0 auto', lineHeight:1.6 }}>
            Escribe al menos 2 caracteres del nombre o cédula para ver resultados.
          </div>
        </div>
      )}

      {/* Sin resultados */}
      {query.trim().length >= 2 && resultados.length === 0 && (
        <div style={{ textAlign:'center', padding:'40px 20px', color:'var(--ink-3)' }}>
          <div style={{ fontSize:40, marginBottom:10 }}>😕</div>
          <div style={{ fontFamily:'var(--f-serif)', fontSize:20, fontWeight:500, color:'var(--ink-2)', marginBottom:4 }}>
            Sin resultados
          </div>
          <div style={{ fontSize:13 }}>Intentá con otro nombre, cédula o código de expediente.</div>
        </div>
      )}

      {/* Resultados */}
      {resultados.length > 0 && (
        <>
          <div style={{ fontSize:12, color:'var(--ink-3)', marginBottom:10, fontWeight:600 }}>
            {resultados.length} resultado{resultados.length!==1?'s':''}{resultados.length===30?' (mostrando primeros 30)':''}
          </div>
          <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
            {resultados.map(est => {
              const niv = est.nivel_actual;
              const c = NIVEL_COLOR_B[niv] || 'var(--ink-3)';
              const cursando = est.historial?.find(h => h.status==='CA');
              return (
                <div key={est.rec_m} onClick={() => seleccionar(est)} style={{
                  display:'grid', gridTemplateColumns:'auto 1fr auto',
                  gap:16, alignItems:'center',
                  background:'var(--surface)', border:'1px solid var(--line)',
                  borderRadius:'var(--r-md)', padding:'14px 18px',
                  cursor:'pointer', transition:'all .15s',
                  borderLeft:`4px solid ${c}`,
                }}
                onMouseEnter={e => { e.currentTarget.style.boxShadow='var(--sh-1)'; e.currentTarget.style.transform='translateY(-1px)'; }}
                onMouseLeave={e => { e.currentTarget.style.boxShadow='none'; e.currentTarget.style.transform='none'; }}>
                  {/* Avatar */}
                  <div style={{
                    width:42, height:42, borderRadius:'50%',
                    background: niv ? c : 'var(--an-navy)',
                    color:'white', fontSize:14, fontWeight:700,
                    display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0,
                  }}>
                    {(est.display || est.nombre).split(' ').slice(0,2).map(w=>w[0]).join('')}
                  </div>

                  {/* Info */}
                  <div style={{ minWidth:0 }}>
                    <div style={{ fontWeight:700, fontSize:15, color:'var(--ink)', marginBottom:2 }}>
                      {est.nombre}
                    </div>
                    <div style={{ display:'flex', gap:10, alignItems:'center', flexWrap:'wrap' }}>
                      <span style={{ fontSize:12, color:'var(--ink-3)', fontFamily:'var(--f-mono)' }}>
                        {est.cedula}
                      </span>
                      <span style={{ fontSize:10, color:'var(--ink-3)' }}>·</span>
                      <span style={{ fontSize:11, color:'var(--ink-3)' }}>Exp. {est.rec_m}</span>
                      {est.grupo_actual && (
                        <>
                          <span style={{ fontSize:10, color:'var(--ink-3)' }}>·</span>
                          <span style={{ fontSize:11, color:'var(--ink-2)' }}>{est.grupo_actual}</span>
                        </>
                      )}
                    </div>
                  </div>

                  {/* Badges */}
                  <div style={{ display:'flex', gap:6, alignItems:'center', flexShrink:0 }}>
                    {niv && <NivelBadge nivel={niv} />}
                    <StatusChip code={est.status_actual} small />
                    {est.convenio && (
                      <span style={{ padding:'3px 8px', borderRadius:999, background:'color-mix(in srgb, #2E7D32 10%, white)', color:'#2E7D32', fontSize:10, fontWeight:700 }}>CONAPE</span>
                    )}
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M9 18l6-6-6-6"/>
                    </svg>
                  </div>
                </div>
              );
            })}
          </div>
        </>
      )}
    </div>
  );
}

const fmtCRC = n => '₡' + (n||0).toLocaleString('es-CR');

// Construir rubros de un nivel según pagos existentes y modalidad
function buildRubrosNivel(nivel, histEntry, pagosEst) {
  const MAT = 20000;
  const CERT = 15000;
  const CUOTA_MAP = { B1:74800, B2:74800, I1:74800, I2:116483 };
  const cuota = CUOTA_MAP[nivel] || 74800;

  // Detectar modalidad: si el grupo contiene 'B' (bimestral) → 8 cuotas, sino 4
  const grupo = histEntry?.grupo || '';
  const esBimestral = grupo.includes('-B') || grupo.includes('-b');
  const nCuotas = esBimestral ? 8 : 4;

// Pagos reales de este nivel — filtrar por concepto que mencione el nivel
  const pagosNivel = pagosEst.filter(p => {
    const concepto = (p.concepto || '').toUpperCase();
    return concepto.includes(nivel);
  });

  // Si no hay ningún match por nivel en el concepto, intentar por grupo
  const pagosNivelFinal = pagosNivel.length > 0
    ? pagosNivel
    : pagosEst.filter(p => {
        const g = (p.grupo || '').toUpperCase();
        const gr = grupo.toUpperCase();
        return g === gr;
      });

  const findPago = (keyword) => pagosNivelFinal.find(p =>
    (p.concepto||'').toLowerCase().includes(keyword.toLowerCase())
  );

  const rubros = [];

  // Matrícula
  const pagoMat = findPago('Matr') || findPago('matricula');
  rubros.push({
    concepto: 'Matrícula',
    obligatorio: true,
    monto: MAT,
    estado: pagoMat ? 'PAGADO' : 'PENDIENTE',
    fecha: pagoMat?.fecha || null,
    recibo: pagoMat?.recibo || pagoMat?.id || null,
  });

  // Cuotas
  for (let i = 1; i <= nCuotas; i++) {
    const pagoCuota = findPago(`Cuota ${i}`) || findPago(`cuota ${i}`) ||
      pagosNivel.find(p => (p.concepto||'').toLowerCase().includes(`${i}/${nCuotas}`));
    rubros.push({
      concepto: `Cuota ${i}/${nCuotas}`,
      obligatorio: true,
      monto: cuota,
      estado: pagoCuota ? 'PAGADO' : 'PENDIENTE',
      fecha: pagoCuota?.fecha || null,
      recibo: pagoCuota?.recibo || null,
    });
  }

  // Certificado
  const pagoCert = findPago('cert') || findPago('Cert');
  rubros.push({
    concepto: 'Certificado del nivel',
    obligatorio: false,
    monto: CERT,
    estado: pagoCert ? 'PAGADO' : 'PENDIENTE',
    fecha: pagoCert?.fecha || null,
    recibo: pagoCert?.recibo || null,
  });

  const totalPagado = rubros.filter(r=>r.estado==='PAGADO').reduce((a,r)=>a+r.monto,0);
  const totalTotal  = rubros.reduce((a,r)=>a+r.monto,0);
  return { rubros, totalPagado, totalTotal, nCuotas };
}

/* global React, PageHeader */

// ─────────────────────────────────────────────────────────────────────────
// IMPORTADOR BANCARIO — BCR extracto XLS/HTML
// T-02: Parseo real del HTML del BCR + llamada al Apps Script
// ─────────────────────────────────────────────────────────────────────────

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx8O8dxCNhHQQLdRFd4vqOY_yIzE0KUG7ljk7vkieHf9hKWeund_WC0ZpuKU-Toj8sYHQ/exec';

// ── Parseo real del HTML del BCR ──────────────────────────────────────────
function parsearExtractoBCR(htmlContent) {
  // El BCR exporta HTML disfrazado de XLS
  // Formato de fila: Fecha Contable | Fecha Registro | Hora | N°Doc | Descripcion | Oficina | Debitos | Creditos
  // Montos: "334200,00" (coma decimal) o "-" cuando no aplica

  const parser = new DOMParser();
  const doc = parser.parseFromString(htmlContent, 'text/html');
  const rows = doc.querySelectorAll('tr');
  const movimientos = [];
  let headerEncontrado = false;

  rows.forEach(row => {
    const celdas = Array.from(row.querySelectorAll('td,th')).map(c => c.textContent.trim());
    if (celdas.length < 8) return;

    // Detectar fila de encabezado
    if (celdas[0] === 'Fecha Contable' || celdas[3] === 'Número Documento') {
      headerEncontrado = true;
      return;
    }
    if (!headerEncontrado) return;

    // Parsear monto: "334200,00" -> 334200 | "-" -> 0
    const parseMonto = (s) => {
      if (!s || s === '-' || s.trim() === '') return 0;
      // Quitar puntos de miles si los hay, reemplazar coma decimal por punto
      const limpio = s.replace(/\./g, '').replace(',', '.');
      return Math.round(parseFloat(limpio) || 0);
    };

    const fechaContable  = celdas[0];
    const fechaRegistro  = celdas[1];
    const hora           = celdas[2];
    const doc_num        = celdas[3];
    const descripcion    = celdas[4];
    const oficina        = celdas[5];
    const debito         = parseMonto(celdas[6]);
    const credito        = parseMonto(celdas[7]);

    // Validar que sea una fila de datos real (fecha en formato DD/MM/YYYY)
    if (!/^\d{2}\/\d{2}\/\d{4}$/.test(fechaContable)) return;
    if (!doc_num) return;

    movimientos.push({
      fechaContable,
      fechaRegistro,
      hora,
      doc: doc_num,
      descripcion,
      oficina,
      debito:  debito > 0 ? debito : null,
      credito: credito > 0 ? credito : null,
    });
  });

  return movimientos;
}

const fmtCRC = n => n != null ? '₡' + n.toLocaleString('es-CR') : '—';

// ── Stepper ───────────────────────────────────────────────────────────────
function Stepper({ paso }) {
  const pasos = ['Subir archivo', 'Revisar movimientos', 'Confirmar importación'];
  return (
    <div style={{ display:'flex', alignItems:'center', gap:0, marginBottom:28 }}>
      {pasos.map((label, i) => {
        const num = i + 1;
        const activo = paso === num;
        const hecho = paso > num;
        return (
          <React.Fragment key={i}>
            <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:6, flex: i<2?0:1, minWidth:0 }}>
              <div style={{
                width:36, height:36, borderRadius:'50%',
                background: hecho ? 'var(--ok)' : activo ? 'var(--an-navy)' : 'var(--bg-deep)',
                color: hecho||activo ? 'white' : 'var(--ink-3)',
                display:'flex', alignItems:'center', justifyContent:'center',
                fontWeight:700, fontSize:14,
                boxShadow: activo ? '0 0 0 4px color-mix(in srgb, var(--an-navy) 18%, transparent)' : 'none',
                transition:'all .2s',
              }}>
                {hecho ? '✓' : num}
              </div>
              <div style={{
                fontSize:11, fontWeight: activo?700:500,
                color: activo?'var(--an-navy)':hecho?'var(--ok)':'var(--ink-3)',
                textAlign:'center', whiteSpace:'nowrap',
              }}>{label}</div>
            </div>
            {i < 2 && (
              <div style={{
                flex:1, height:2, margin:'0 8px', marginBottom:20,
                background: paso > i+1 ? 'var(--ok)' : 'var(--line-2)',
                borderRadius:1,
              }} />
            )}
          </React.Fragment>
        );
      })}
    </div>
  );
}

// ── Componente principal ──────────────────────────────────────────────────
function ImportadorBancario() {
  const [paso, setPaso]             = React.useState(1);
  const [archivo, setArchivo]       = React.useState(null);
  const [movimientos, setMovimientos] = React.useState([]);
  const [seleccionados, setSeleccionados] = React.useState(new Set());
  const [importado, setImportado]   = React.useState(false);
  const [cargando, setCargando]     = React.useState(false);
  const [error, setError]           = React.useState(null);
  const [resultadoImport, setResultadoImport] = React.useState(null);
  const [docsExistentes, setDocsExistentes]   = React.useState(new Set());
  const dragRef  = React.useRef(null);
  const [dragOver, setDragOver]     = React.useState(false);

  // Cargar docs existentes del Sheet al montar
  React.useEffect(() => {
    fetch(`${SCRIPT_URL}?fn=getComprobantes`)
      .then(r => r.json())
      .then(data => {
        if (data.ok) {
          const docs = new Set(data.comprobantes.map(c => String(c.doc).trim()));
          setDocsExistentes(docs);
        }
      })
      .catch(() => {}); // Si falla, seguimos sin docs existentes
  }, []);

  // Clasificar movimientos
  const movimientosConEstado = movimientos.map(m => ({
    ...m,
    esNuevo:     !docsExistentes.has(m.doc) && m.credito != null,
    esExistente:  docsExistentes.has(m.doc),
    esDebito:     m.debito != null && m.credito == null,
  }));

  const nuevos     = movimientosConEstado.filter(m => m.esNuevo);
  const existentes = movimientosConEstado.filter(m => m.esExistente);
  const debitos    = movimientosConEstado.filter(m => m.esDebito);

  const toggleSel = (doc) => {
    setSeleccionados(s => {
      const n = new Set(s);
      n.has(doc) ? n.delete(doc) : n.add(doc);
      return n;
    });
  };
  const selectAll = () => setSeleccionados(new Set(nuevos.map(m => m.doc)));
  const clearAll  = () => setSeleccionados(new Set());

  // Procesar archivo real
  const procesarArchivo = (file) => {
    setArchivo(file);
    setError(null);
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const content = e.target.result;
        const movs = parsearExtractoBCR(content);
        if (movs.length === 0) {
          setError('No se encontraron movimientos en el archivo. Verificá que sea el extracto XLS del BCR.');
          return;
        }
        setMovimientos(movs);
        // Preseleccionar todos los nuevos créditos
        setSeleccionados(new Set(
          movs.filter(m => !docsExistentes.has(m.doc) && m.credito != null).map(m => m.doc)
        ));
        setPaso(2);
      } catch(err) {
        setError('Error al leer el archivo: ' + err.message);
      }
    };
    reader.onerror = () => setError('Error al leer el archivo.');
    reader.readAsText(file, 'utf-8');
  };

  // Confirmar e importar al Sheet
  const confirmar = async () => {
    setCargando(true);
    setError(null);
    try {
      const filasAImportar = movimientosConEstado
        .filter(m => seleccionados.has(m.doc))
        .map(m => ({
          fechaContable:  m.fechaContable,
          fechaRegistro:  m.fechaRegistro,
          hora:           m.hora,
          doc:            m.doc,
          descripcion:    m.descripcion,
          oficina:        m.oficina,
          debito:         m.debito || 0,
          credito:        m.credito || 0,
        }));

      const res = await fetch(`${SCRIPT_URL}?fn=importarExtracto`, {
        method: 'POST',
        body: JSON.stringify(filasAImportar),
      });
      const data = await res.json();

      if (data.error) {
        setError('Error del servidor: ' + data.error);
        return;
      }

      // Actualizar docs existentes localmente
      setDocsExistentes(prev => {
        const next = new Set(prev);
        filasAImportar.forEach(f => next.add(f.doc));
        return next;
      });

      setResultadoImport(data);
      setImportado(true);
      setPaso(3);
    } catch(err) {
      setError('Error de conexión: ' + err.message);
    } finally {
      setCargando(false);
    }
  };

  const reiniciar = () => {
    setArchivo(null);
    setMovimientos([]);
    setSeleccionados(new Set());
    setImportado(false);
    setResultadoImport(null);
    setError(null);
    setPaso(1);
  };

  const onDrop = (e) => {
    e.preventDefault();
    setDragOver(false);
    const file = e.dataTransfer.files[0];
    if (file) procesarArchivo(file);
  };

  return (
    <div>
      <PageHeader
        kicker="Conciliación bancaria"
        title={<>Importar <em>extracto BCR</em></>}
        sub="Sube el extracto mensual XLS/HTML del BCR y marca los pagos nuevos para importar"
      />

      <Stepper paso={paso} />

      {/* Error global */}
      {error && (
        <div style={{ padding:'12px 16px', background:'color-mix(in srgb,#C00000 8%,white)', border:'1px solid #C00000', borderRadius:'var(--r-md)', marginBottom:16, fontSize:13, color:'#C00000' }}>
          ⚠️ {error}
        </div>
      )}

      {/* ── PASO 1 ─────────────────────────────────────────────────────── */}
      {paso === 1 && (
        <div>
          <div
            ref={dragRef}
            onDragOver={e => { e.preventDefault(); setDragOver(true); }}
            onDragLeave={() => setDragOver(false)}
            onDrop={onDrop}
            style={{
              border: `2px dashed ${dragOver ? 'var(--an-navy)' : 'var(--line-2)'}`,
              borderRadius:'var(--r-xl)',
              background: dragOver ? 'color-mix(in srgb, var(--an-navy) 4%, white)' : 'var(--surface)',
              padding:'52px 32px',
              textAlign:'center',
              transition:'all .2s',
              marginBottom:16,
              cursor:'pointer',
            }}
            onClick={() => document.getElementById('file-input-banco').click()}
          >
            <div style={{ fontSize:52, marginBottom:12 }}>📄</div>
            <div style={{ fontFamily:'var(--f-serif)', fontSize:24, fontWeight:500, color:'var(--an-navy-ink)', marginBottom:6 }}>
              {archivo ? archivo.name : 'Arrastrá el extracto aquí'}
            </div>
            <div style={{ fontSize:13, color:'var(--ink-3)' }}>
              {archivo
                ? `Listo para procesar · ${(archivo.size/1024).toFixed(1)} KB`
                : 'o hacé clic para seleccionar el archivo XLS del BCR'}
            </div>
            <input id="file-input-banco" type="file" accept=".xls,.xlsx,.html,.htm" style={{ display:'none' }}
              onChange={e => { if (e.target.files[0]) procesarArchivo(e.target.files[0]); }} />
          </div>

          <div style={{ padding:'14px 18px', background:'color-mix(in srgb, var(--an-navy) 5%, white)', border:'1px solid color-mix(in srgb, var(--an-navy) 20%, white)', borderRadius:'var(--r-md)', fontSize:12, color:'var(--an-navy-ink)', lineHeight:1.6 }}>
            <strong>¿Cómo exportar del BCR?</strong> Banca en Línea BCR → Cuentas → Movimientos → Exportar → Formato Excel (XLS). El sistema lee automáticamente el formato estándar del BCR.
          </div>
        </div>
      )}

      {/* ── PASO 2 ─────────────────────────────────────────────────────── */}
      {paso === 2 && (
        <div>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:12, marginBottom:18 }}>
            {[

      {paso === 3 && importado && (

          <button onClick={reiniciar} className="btn btn-primary"

}

/* global React, PageHeader */

// ─────────────────────────────────────────────────────────────────────────
// APLICAR PAGO — conectado a Apps Script / APOLLO_G3
// ─────────────────────────────────────────────────────────────────────────

const SCRIPT_URL_AP = 'https://script.google.com/macros/s/AKfycbx8O8dxCNhHQQLdRFd4vqOY_yIzE0KUG7ljk7vkieHf9hKWeund_WC0ZpuKU-Toj8sYHQ/exec';

const NIVEL_COLOR_A = { B1:'#E5A823', B2:'#E8372A', I1:'#2B7FC1', I2:'#4CAF50' };
const NIVEL_LABEL_A = { B1:'Básico I', B2:'Básico II', I1:'Intermedio I', I2:'Intermedio II' };
const NIVEL_ORDER_A = ['B1','B2','I1','I2'];
const STATUS_APROBADO = ['APR','CNV'];

const fmtCRC_A = n => '₡' + (n||0).toLocaleString('es-CR');

// ── Stepper ──────────────────────────────────────────────────────────────
function StepperA({ paso }) {
  const pasos = ['Estudiante', 'Nivel', 'Comprobante', 'Aplicar'];
  return (
    <div style={{ display:'flex', alignItems:'center', marginBottom:24 }}>
      {pasos.map((label, i) => {
        const n = i + 1;
        const activo = paso === n;
        const hecho  = paso > n;
        return (
          <React.Fragment key={i}>
            <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:5, flex: i<3?0:1, minWidth:0 }}>
              <div style={{
                width:34, height:34, borderRadius:'50%',
                background: hecho?'var(--ok)': activo?'var(--an-granate)':'var(--bg-deep)',
                color: (hecho||activo)?'white':'var(--ink-3)',
                display:'flex', alignItems:'center', justifyContent:'center',
                fontWeight:700, fontSize:13,
                boxShadow: activo?'0 0 0 4px color-mix(in srgb,var(--an-granate) 20%,transparent)':'none',
              }}>{hecho?'✓':n}</div>
              <div style={{ fontSize:10, fontWeight:activo?700:500, color:activo?'var(--an-granate)':hecho?'var(--ok)':'var(--ink-3)', whiteSpace:'nowrap' }}>
                {label}
              </div>
            </div>
            {i < 3 && <div style={{ flex:1, height:2, margin:'0 6px', marginBottom:18, background:paso>i+1?'var(--ok)':'var(--line-2)', borderRadius:1 }} />}
          </React.Fragment>
        );
      })}
    </div>
  );
}

// ── Panel lateral — resumen del flujo ────────────────────────────────────
function PanelResumen({ est, nivel, comprobante, totalAplicar }) {
  const c = nivel ? NIVEL_COLOR_A[nivel] : 'var(--an-navy)';
  const saldo = comprobante ? (comprobante.saldo ?? (comprobante.credito - comprobante.aplicado)) : 0;
  return (
    <div style={{ background:'var(--surface)', border:'1px solid var(--line)', borderRadius:'var(--r-lg)', padding:'18px 16px', display:'flex', flexDirection:'column', gap:14 }}>
      <div style={{ fontSize:10, fontWeight:700, letterSpacing:'0.14em', textTransform:'uppercase', color:'var(--ink-3)' }}>Resumen</div>

      <div>
        <div style={{ fontSize:9, fontWeight:700, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--ink-3)', marginBottom:4 }}>Estudiante</div>
        {est ? (
          <>
            <div style={{ fontWeight:700, fontSize:13, color:'var(--ink)', lineHeight:1.2 }}>{est.NOMBRE || est.nombre || '—'}</div>
            <div style={{ fontSize:11, color:'var(--ink-3)', fontFamily:'var(--f-mono)', marginTop:2 }}>{est.CEDULA || est.cedula} · {est.CODIGO || est.rec_m}</div>
          </>
        ) : <div style={{ fontSize:12, color:'var(--ink-3)', fontStyle:'italic' }}>Sin seleccionar</div>}
      </div>

      <div>
        <div style={{ fontSize:9, fontWeight:700, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--ink-3)', marginBottom:4 }}>Nivel</div>
        {nivel ? (
          <span style={{ display:'inline-flex', alignItems:'center', gap:6, padding:'4px 10px', borderRadius:999, background:`color-mix(in srgb,${c} 12%,white)`, color:c, fontSize:12, fontWeight:700 }}>
            {NIVEL_LABEL_A[nivel] || nivel}
          </span>
        ) : <div style={{ fontSize:12, color:'var(--ink-3)', fontStyle:'italic' }}>Sin seleccionar</div>}
      </div>

      <div>
        <div style={{ fontSize:9, fontWeight:700, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--ink-3)', marginBottom:4 }}>Comprobante BCR</div>
        {comprobante ? (
          <>
            <div style={{ fontFamily:'var(--f-mono)', fontSize:12, fontWeight:700 }}>#{comprobante.doc}</div>
            <div style={{ fontSize:11, color:'var(--ink-3)', marginTop:2 }}>{comprobante.fecha}</div>
            <div style={{ fontSize:11, color:'#2E7D32', fontWeight:700, marginTop:4 }}>Saldo: {fmtCRC_A(saldo)}</div>
          </>
        ) : <div style={{ fontSize:12, color:'var(--ink-3)', fontStyle:'italic' }}>Sin seleccionar</div>}
      </div>

      <div style={{ borderTop:'2px solid var(--line)', paddingTop:14 }}>
        <div style={{ fontSize:9, fontWeight:700, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--ink-3)', marginBottom:4 }}>Total a aplicar</div>
        <div style={{ fontFamily:'var(--f-serif)', fontSize:26, fontWeight:500, color: totalAplicar>0?'var(--an-granate)':'var(--ink-3)', letterSpacing:'-0.03em', lineHeight:1 }}>
          {totalAplicar > 0 ? fmtCRC_A(totalAplicar) : '—'}
        </div>
        {comprobante && totalAplicar > 0 && (
          <div style={{ fontSize:11, marginTop:4, color: totalAplicar > saldo ? '#C00000':'#2E7D32', fontWeight:600 }}>
            {totalAplicar > saldo ? '⚠ Excede el saldo' : `Saldo restante: ${fmtCRC_A(saldo - totalAplicar)}`}
          </div>
        )}
      </div>
    </div>
  );
}

// ── Fila de rubro con stepper de cantidad ────────────────────────────────
function RubroRow({ label, monto, qty, maxQty, onQty }) {
  const subtotal = qty * monto;
  return (
    <div style={{ display:'grid', gridTemplateColumns:'1fr auto auto auto auto', gap:12, alignItems:'center', padding:'12px 16px', background:'var(--surface)', border:'1px solid var(--line)', borderRadius:'var(--r-md)' }}>
      <div>
        <div style={{ fontWeight:600, fontSize:13 }}>{label}</div>
        <div style={{ fontSize:11, color:'var(--ink-3)', fontFamily:'var(--f-mono)' }}>{fmtCRC_A(monto)} c/u</div>
      </div>
      <button onClick={()=>onQty(Math.max(0,qty-1))} style={{ width:32,height:32,borderRadius:8,border:'1px solid var(--line)',background:'var(--surface)',fontWeight:700,fontSize:18,cursor:'pointer',color:'var(--ink-2)',lineHeight:1 }}>−</button>
      <div style={{ width:36,textAlign:'center',fontFamily:'var(--f-mono)',fontWeight:700,fontSize:16 }}>{qty}</div>
      <button onClick={()=>onQty(Math.min(maxQty,qty+1))} style={{ width:32,height:32,borderRadius:8,border:'1px solid var(--line)',background:'var(--surface)',fontWeight:700,fontSize:18,cursor:'pointer',color:'var(--ink-2)',lineHeight:1 }}>+</button>
      <div style={{ fontFamily:'var(--f-mono)',fontWeight:700,fontSize:14,color:qty>0?'var(--an-granate)':'var(--ink-3)',textAlign:'right',minWidth:100 }}>
        {qty > 0 ? fmtCRC_A(subtotal) : '—'}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────
// COMPONENTE PRINCIPAL
// ─────────────────────────────────────────────────────────────────────────
function AplicarPago() {
  const [paso, setPaso]             = React.useState(1);
  const [estSel, setEstSel]         = React.useState(null);   // objeto estudiante del servidor
  const [estData, setEstData]       = React.useState(null);   // { niveles, pagos, pendientes, grupo }
  const [nivelSel, setNivelSel]     = React.useState(null);
  const [comprSel, setComprSel]     = React.useState(null);
  const [comprobantes, setComprobantes] = React.useState([]);
  const [error, setError]           = React.useState('');
  const [confirmado, setConfirmado] = React.useState(null);
  const [cargando, setCargando]     = React.useState(false);
  const [totalAplicarPanel, setTotalAplicarPanel] = React.useState(0);

  // Prefill desde admin_students (botón 💳)
  React.useEffect(() => {
    const raw = sessionStorage.getItem('an_pago_prefill');
    if (!raw) return;
    sessionStorage.removeItem('an_pago_prefill');
    try {
      const { codigo, nivel } = JSON.parse(raw);
      if (!codigo) return;
      setCargando(true);
      fetch(`${SCRIPT_URL_AP}?fn=getEstudiante&codigo=${encodeURIComponent(codigo)}`)
        .then(r => r.json())
        .then(data => {
          if (!data.ok) return;
          setEstSel(data.estudiante);
          setEstData({
            niveles:    data.niveles    || {},
            pagos:      data.pagos      || [],
            otrosPagos: data.otrosPagos || [],
            grupo:      data.grupo      || '',
            pendientes: data.pendientes || {},
          });
          if (nivel) setNivelSel(nivel);
          setPaso(nivel ? 3 : 2); // si viene nivel saltar directo al comprobante
        })
        .catch(() => {})
        .finally(() => setCargando(false));
    } catch(e) {}
  }, []);

  const reiniciar = () => {
    setPaso(1); setEstSel(null); setEstData(null); setNivelSel(null);
    setComprSel(null); setComprobantes([]); setError(''); setConfirmado(null);
    setCargando(false); setTotalAplicarPanel(0);
  };

  const handlePrev = () => {
    setError('');
    if (paso === 2) { setPaso(1); setNivelSel(null); }
    else if (paso === 3) { setPaso(2); setComprSel(null); }
    else if (paso === 4) { setPaso(3); setConfirmado(null); }
  };

  // ── PASO 1 — Buscar estudiante ────────────────────────────────────────
  const Paso1 = () => {
    const [q, setQ] = React.useState('');
    const [buscando, setBuscando] = React.useState(false);
    const [errLocal, setErrLocal] = React.useState('');

    const buscar = async () => {
      const codigo = q.trim();
      if (!codigo) return;
      setBuscando(true);
      setErrLocal('');
      try {
        const res = await fetch(`${SCRIPT_URL_AP}?fn=getEstudiante&codigo=${encodeURIComponent(codigo)}`);
        const data = await res.json();
        if (!data.ok) { setErrLocal(data.error || 'Estudiante no encontrado'); return; }
        setEstSel(data.estudiante);
        setEstData({ niveles: data.niveles || {}, pagos: data.pagos || [], otrosPagos: data.otrosPagos || [], grupo: data.grupo || '', pendientes: data.pendientes || {} });
        setError('');
        setPaso(2);
      } catch(e) {
        setErrLocal('Error de conexión: ' + e.message);
      } finally {
        setBuscando(false);
      }
    };

    return (
      <div>
        <div style={{ fontFamily:'var(--f-serif)', fontSize:22, fontWeight:500, marginBottom:16, color:'var(--an-navy-ink)' }}>
          Buscar estudiante
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:12, background:'var(--surface)', border:'2px solid var(--an-granate)', borderRadius:'var(--r-lg)', padding:'12px 18px', marginBottom:12 }}>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--an-granate)" strokeWidth="2.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
          <input value={q} onChange={e=>setQ(e.target.value)} autoFocus
            onKeyDown={e=>{ if(e.key==='Enter') buscar(); }}
            placeholder="Código de expediente (ej: 17024)…"
            style={{ flex:1, border:'none', outline:'none', fontFamily:'var(--f-mono)', fontSize:16, background:'transparent', color:'var(--ink)' }} />
          {q && <button onClick={()=>setQ('')} style={{ background:'none',border:'none',color:'var(--ink-3)',cursor:'pointer',fontSize:20 }}>×</button>}
        </div>
        <button onClick={buscar} disabled={!q.trim() || buscando} className="btn btn-primary"
          style={{ width:'100%', padding:13, fontSize:15, background:'var(--an-granate)', borderColor:'var(--an-granate)', marginBottom:12, opacity: q.trim()&&!buscando?1:0.5 }}>
          {buscando ? 'Buscando…' : 'Buscar estudiante →'}
        </button>
        {errLocal && (
          <div style={{ padding:'10px 14px', background:'color-mix(in srgb,#C00000 8%,white)', border:'1px solid #C00000', borderRadius:'var(--r-md)', color:'#C00000', fontSize:13 }}>
            ⚠ {errLocal}
          </div>
        )}
      </div>
    );
  };

  // ── PASO 2 — Seleccionar nivel ────────────────────────────────────────
  const Paso2 = () => {
    const niveles   = estData?.niveles  || {};
    const pendientes = estData?.pendientes || {};
    const grupo     = estData?.grupo    || '';

    // Desbloqueo: B1 siempre; siguiente requiere APR/CNV del anterior
    const desbloq = {};
    NIVEL_ORDER_A.forEach((niv, i) => {
      if (i === 0) { desbloq[niv] = true; return; }
      const prev = NIVEL_ORDER_A[i-1];
      desbloq[niv] = STATUS_APROBADO.includes(niveles[prev]?.estatus);
    });

    const seleccionarNivel = (niv) => {
      if (!desbloq[niv]) return;
      setNivelSel(niv);
      setError('');
      setPaso(3);
    };

    // Precios de pendientes (globales por estudiante, no por nivel)
    const cuota     = pendientes.cuota_mensual || 0;
    const matricula = pendientes.matricula     || 0;
    const cert      = pendientes.certificado   || 0;

    return (
      <div>
        <div style={{ fontFamily:'var(--f-serif)', fontSize:22, fontWeight:500, marginBottom:6, color:'var(--an-navy-ink)' }}>Seleccionar nivel</div>
        <div style={{ fontSize:13, color:'var(--ink-3)', marginBottom:18 }}>Solo los niveles desbloqueados pueden recibir pagos.</div>

        {/* Info estudiante */}
        <div style={{ padding:'12px 16px', background:'color-mix(in srgb,var(--an-navy) 5%,white)', border:'1px solid color-mix(in srgb,var(--an-navy) 20%,white)', borderRadius:'var(--r-md)', marginBottom:18, display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:8 }}>
          <div>
            <div style={{ fontWeight:700, fontSize:14 }}>{estSel?.NOMBRE || '—'}</div>
            <div style={{ fontSize:11, color:'var(--ink-3)', fontFamily:'var(--f-mono)' }}>{estSel?.CEDULA} · Cód. {estSel?.CODIGO} {grupo ? `· ${grupo}` : ''}</div>
          </div>

        <div style={{ display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:12 }}>
          {NIVEL_ORDER_A.filter(niv => niv in niveles || NIVEL_ORDER_A.indexOf(niv) === 0).map(niv => {
            const c   = NIVEL_COLOR_A[niv];
            const h   = niveles[niv];
            const ok  = desbloq[niv];
            return (
              <div key={niv} onClick={()=>seleccionarNivel(niv)} style={{
                padding:'18px 20px', borderRadius:'var(--r-lg)',
                border:`2px solid ${ok?c:'var(--line)'}`,
                background: ok?`color-mix(in srgb,${c} 5%,white)`:'var(--surface-2)',
                opacity: ok?1:0.5, cursor: ok?'pointer':'not-allowed',
                transition:'all .15s',
              }}
              onMouseEnter={e=>{ if(ok){ e.currentTarget.style.boxShadow='var(--sh-1)'; e.currentTarget.style.transform='translateY(-1px)'; }}}
              onMouseLeave={e=>{ e.currentTarget.style.boxShadow='none'; e.currentTarget.style.transform=''; }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10 }}>
                  <span style={{ padding:'3px 10px', borderRadius:999, background:c, color:'white', fontSize:11, fontWeight:700 }}>{NIVEL_LABEL_A[niv]}</span>
                  {h?.estatus && <span style={{ padding:'3px 8px', borderRadius:999, background:`color-mix(in srgb,${c} 14%,white)`, color:c, fontSize:10, fontWeight:700 }}>{h.estatus}</span>}
                </div>
                {ok ? (
                  <>
                    <div style={{ fontSize:11, color:'var(--ink-3)', marginBottom:4 }}>{grupo || 'Sin grupo asignado'}</div>
                    <div style={{ fontSize:12, color:'var(--ink-2)' }}>
                      {cuota > 0
                        ? <>Cuota: <strong style={{ color:c }}>{fmtCRC_A(cuota)}</strong></>
                        : <span style={{ color:'#2E7D32', fontWeight:600 }}>✓ Sin cuotas pendientes</span>}
                    </div>
                    {matricula > 0 && <div style={{ fontSize:11, color:'var(--ink-3)', marginTop:2 }}>Matrícula: {fmtCRC_A(matricula)}</div>}
                  </>
                ) : (
                  <div style={{ fontSize:12, color:'var(--ink-3)', fontStyle:'italic' }}>
                    🔒 Debe promover el nivel anterior primero
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  // ── PASO 3 — Buscar comprobante ───────────────────────────────────────
  const Paso3 = () => {
    const [q, setQ] = React.useState('');
    const [cargandoCompr, setCargandoCompr] = React.useState(false);
    const [errLocal, setErrLocal] = React.useState('');

    React.useEffect(() => {
      if (comprobantes.length > 0) return; // ya cargados
      setCargandoCompr(true);
      fetch(`${SCRIPT_URL_AP}?fn=getComprobantes`)
        .then(r => r.json())
        .then(data => {
          if (!data.ok) { setErrLocal(data.error || 'Error al cargar comprobantes'); return; }
          setComprobantes(data.comprobantes || []);
        })
        .catch(e => setErrLocal('Error de conexión: ' + e.message))
        .finally(() => setCargandoCompr(false));
    }, []);

    const resultados = comprobantes.filter(m => {
      const saldo = m.saldo ?? (m.credito - m.aplicado);
      if (saldo <= 0) return false;
      if (!q.trim()) return true;
      const qn = q.trim().toLowerCase();
      return String(m.doc).includes(qn) || (m.descripcion||'').toLowerCase().includes(qn) || (m.fecha||'').includes(qn);
    });

    return (
      <div>
        <div style={{ fontFamily:'var(--f-serif)', fontSize:22, fontWeight:500, marginBottom:6, color:'var(--an-navy-ink)' }}>Buscar comprobante bancario</div>
        <div style={{ fontSize:13, color:'var(--ink-3)', marginBottom:14 }}>Solo se muestran comprobantes con saldo disponible mayor a ₡0.</div>

        <div style={{ display:'flex', alignItems:'center', gap:10, background:'var(--surface)', border:'2px solid var(--an-granate)', borderRadius:'var(--r-md)', padding:'10px 16px', marginBottom:14 }}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--an-granate)" strokeWidth="2.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
          <input value={q} onChange={e=>setQ(e.target.value)} autoFocus placeholder="N° documento, fecha o descripción…"
            style={{ flex:1, border:'none', outline:'none', fontFamily:'var(--f-mono)', fontSize:14, background:'transparent' }} />
        </div>

        {errLocal && (
          <div style={{ padding:'10px 14px', background:'color-mix(in srgb,#C00000 8%,white)', border:'1px solid #C00000', borderRadius:'var(--r-md)', color:'#C00000', fontSize:13, marginBottom:12 }}>
            ⚠ {errLocal}
          </div>
        )}

        {cargandoCompr ? (
          <div style={{ textAlign:'center', padding:40, color:'var(--ink-3)', fontSize:14 }}>Cargando comprobantes…</div>
        ) : (
          <div className="card" style={{ padding:0, overflow:'hidden' }}>
            <table className="table-soft" style={{ fontSize:12 }}>
              <thead>
                <tr>
                  <th>Fecha</th>
                  <th>N° Documento</th>
                  <th>Descripción</th>
                  <th style={{ textAlign:'right' }}>Crédito</th>
                  <th style={{ textAlign:'right' }}>Saldo disponible</th>
                </tr>
              </thead>
              <tbody>
                {resultados.length > 0 ? resultados.map((m, i) => {
                  const saldo = m.saldo ?? (m.credito - m.aplicado);
                  return (
                    <tr key={i} onClick={()=>{ setComprSel(m); setPaso(4); setError(''); }} style={{ cursor:'pointer' }}>
                      <td style={{ fontFamily:'var(--f-mono)', fontSize:11 }}>{m.fecha}</td>
                      <td style={{ fontFamily:'var(--f-mono)', fontWeight:700, color:'var(--an-navy)' }}>{m.doc}</td>
                      <td style={{ maxWidth:260, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{m.descripcion}</td>
                      <td style={{ textAlign:'right', fontFamily:'var(--f-mono)' }}>{fmtCRC_A(m.credito)}</td>
                      <td style={{ textAlign:'right' }}>
                        <span style={{ fontFamily:'var(--f-mono)', fontWeight:700, fontSize:14, color:'#2E7D32' }}>{fmtCRC_A(saldo)}</span>
                      </td>
                    </tr>
