        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────
// INLINE CALENDAR — shown as the "Calendario" tab inside Materiales
// ─────────────────────────────────────────────────────────────────────────
function InlineCalendar({ schedule, onOpenLesson }) {
  const [month, setMonth] = React.useState(TODAY.getMonth());
  const [year, setYear] = React.useState(TODAY.getFullYear());
  const [selected, setSelected] = React.useState(null);
  const [showSuspendModal, setShowSuspendModal] = React.useState(null);

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startWeekDay = firstDay.getDay();
  const daysInMonth = lastDay.getDate();

  const cells = [];
  for (let i = 0; i < startWeekDay; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(year, month, d));

  const lessonsByDate = {};
  schedule.forEach(s => {
    const k = s.date.toDateString();
    if (!lessonsByDate[k]) lessonsByDate[k] = [];
    lessonsByDate[k].push(s);
  });

  const navMonth = (delta) => {
    let m = month + delta, y = year;
    if (m < 0) { m = 11; y--; }
    if (m > 11) { m = 0; y++; }
    setMonth(m); setYear(y);
  };

  return (
    <>
      {/* Legend */}
      <div style={{
        display:'flex', gap:14, flexWrap:'wrap', padding:'10px 14px',
        background:'var(--surface-2)', border:'1px solid var(--line)',
        borderRadius:'var(--r-md)', marginBottom:14, fontSize:11,
      }}>
        {[
          ['Completada', 'var(--ok)'],
          ['Hoy / Próxima', 'var(--an-granate)'],
          ['Programada', 'var(--an-navy)'],
          ['Reprogramada', 'var(--an-gold)'],
          ['Suspendida (cascada)', 'var(--warn)'],
        ].map(([l,c]) => (
          <div key={l} style={{ display:'flex', alignItems:'center', gap:6 }}>
            <span style={{ width:10, height:10, borderRadius:3, background:c }} />
            <span style={{ color:'var(--ink-2)' }}>{l}</span>
          </div>
        ))}
      </div>

      <div style={{ display:'grid', gridTemplateColumns:'2fr 1fr', gap:16 }}>
        {/* Calendar grid */}
        <div className="card" style={{ padding:16 }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
            <button className="btn btn-ghost" onClick={() => navMonth(-1)}>← Mes anterior</button>
            <div style={{ fontFamily:'var(--f-serif)', fontSize:22, fontWeight:500, color:'var(--an-navy-ink)', textTransform:'capitalize' }}>
              {new Date(year, month, 1).toLocaleDateString('es-CR', { month:'long', year:'numeric' })}
            </div>
            <button className="btn btn-ghost" onClick={() => navMonth(1)}>Mes siguiente →</button>
          </div>

          <div style={{ display:'grid', gridTemplateColumns:'repeat(7, 1fr)', gap:4, marginBottom:4 }}>
            {['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'].map(d => (
              <div key={d} style={{ fontSize:10, fontWeight:700, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--ink-3)', textAlign:'center', padding:'4px 0' }}>{d}</div>
            ))}
          </div>

          <div style={{ display:'grid', gridTemplateColumns:'repeat(7, 1fr)', gap:4 }}>
            {cells.map((d, i) => {
              if (!d) return <div key={i} />;
              const lessons = lessonsByDate[d.toDateString()] || [];
              const isToday = d.toDateString() === TODAY.toDateString();
              return (
                <div key={i} style={{
                  minHeight: 70, padding: 6,
                  background: isToday ? 'color-mix(in srgb, var(--an-granate) 8%, white)' : 'var(--surface)',
                  border: isToday ? '2px solid var(--an-granate)' : '1px solid var(--line)',
                  borderRadius: 6,
                  cursor: lessons.length ? 'pointer' : 'default',
                  opacity: d < TODAY && lessons.length === 0 ? 0.5 : 1,
                }}
                onClick={() => lessons[0] && setSelected(lessons[0])}>
                  <div style={{ fontSize: 11, fontWeight: isToday ? 700 : 500, color: isToday ? 'var(--an-granate)' : 'var(--ink-2)', marginBottom: 3 }}>{d.getDate()}</div>
                  {lessons.map(l => (
                    <div key={l.n} style={{
                      fontSize: 9, padding:'2px 4px', marginBottom:2, borderRadius:3,
                      background: l.computedStatus==='done' || l.computedStatus==='done-rescheduled' ? 'var(--ok)'
                        : l.computedStatus==='today' ? 'var(--an-granate)'
                        : l.computedStatus==='rescheduled' ? 'var(--an-gold)'
                        : l.computedStatus==='suspended' ? 'var(--warn)'
                        : 'var(--an-navy)',
                      color:'white', fontWeight:600,
                      overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap',
                    }}>
                      L{l.n} · {l.kind==='exam-oral' ? 'Oral' : l.kind==='exam-written' ? 'Escrito' : l.unit.replace('Unit ','U')}
                    </div>
                  ))}
                </div>
              );
            })}
          </div>
        </div>

        {/* Detail panel */}
        <div className="card" style={{ padding:18, height:'fit-content' }}>
          {!selected ? (
            <>
              <div style={{ fontSize:11, fontWeight:700, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--ink-3)', marginBottom:6 }}>
                Próximas lecciones
              </div>
              <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                {schedule.filter(s => s.computedStatus === 'today' || s.computedStatus === 'upcoming' || s.computedStatus === 'rescheduled').slice(0,5).map(s => (
                  <div key={s.n} onClick={() => setSelected(s)} style={{
                    padding:'10px 12px', borderRadius:8,
                    background:'var(--surface-2)', border:'1px solid var(--line)',
                    cursor:'pointer',
                  }}>
                    <div style={{ display:'flex', gap:8, alignItems:'baseline' }}>
                      <span style={{ fontFamily:'var(--f-mono)', fontSize:10, color:'var(--ink-3)', fontWeight:600 }}>L{String(s.n).padStart(2,'0')}</span>
                      <span style={{ fontSize:13, fontWeight:600, color:'var(--ink)' }}>{s.title}</span>
                    </div>
                    <div style={{ fontSize:11, color:'var(--ink-2)', marginTop:2 }}>{fmtDateLong(s.date)}</div>
                  </div>
                ))}
              </div>

              <div style={{ marginTop:16, paddingTop:14, borderTop:'1px dashed var(--line)', fontSize:11, color:'var(--ink-3)', lineHeight:1.5 }}>
                <div style={{ fontWeight:700, color:'var(--ink-2)', marginBottom:4 }}>Suspensiones registradas</div>
                {[].map((s,i) => (
                  <div key={i} style={{ marginBottom:6 }}>
                    <strong style={{ color: s.action==='rescheduled'?'var(--an-gold)':'var(--warn)' }}>L{s.lessonN}</strong>
                    {' · '}{s.reason}
                  </div>
                ))}
              </div>
            </>
          ) : (
            <LessonDetailPanel
              lesson={selected}
              onClose={() => setSelected(null)}
              onSuspendRequest={() => setShowSuspendModal(selected)}
              onOpenMaterials={() => onOpenLesson(selected.n)} />
          )}
        </div>
      </div>

      {showSuspendModal && (
        <SuspendModal lesson={showSuspendModal} onClose={() => setShowSuspendModal(null)} />
      )}
    </>
  );
}

function LessonRow({ lesson, isOpen, onToggle }) {
  return <LessonRowInner lesson={lesson} isOpen={isOpen} onToggle={onToggle} />;
}

function LessonRowInner({ lesson, isOpen, onToggle }) {
  const s = lesson;
  const statusMeta = {
    'done':              { label:'Completada',  color:'var(--ok)',         dot:'var(--ok)' },
    'done-rescheduled':  { label:'Dada (recuperada)', color:'var(--ok)',   dot:'var(--ok)' },
    'today':             { label:'Hoy',         color:'var(--an-granate)', dot:'var(--an-granate)' },
    'upcoming':          { label:'Próxima',     color:'var(--an-navy)',    dot:'var(--an-navy)' },
    'suspended':         { label:'Suspendida (cascada)', color:'var(--warn)', dot:'var(--warn)' },
    'rescheduled':       { label:'Reprogramada', color:'var(--an-gold)',   dot:'var(--an-gold)' },
  }[s.computedStatus] || { label:'Planificada', color:'var(--ink-3)', dot:'var(--ink-3)' };

  const kindMeta = {
    'lesson':       { label:'Lección',        bg:'color-mix(in srgb, var(--an-navy) 10%, white)', color:'var(--an-navy)' },

  return (
    <div id={`lesson-row-${lesson.n}`} className="card" style={{
      padding: 0,
      borderLeft: `4px solid ${statusMeta.dot}`,

          display:'grid',

          gap:16,

          width:44, height:44, borderRadius:10,
          background: s.computedStatus==='done' || s.computedStatus==='done-rescheduled' ? 'var(--ok)'

            : s.computedStatus==='suspended' ? 'var(--warn)'

              {s.title}

          <div style={{ fontSize:11, color:'var(--ink-3)', marginTop:2 }}>

                · reprogramada desde {fmtDate(s.baseDate)}

            )}

        {/* Status */}
        <div style={{ display:'flex', flexDirection:'column', alignItems:'flex-end', gap:3, minWidth:90 }}>

            fontSize:10, fontWeight:700, letterSpacing:'0.05em',
            whiteSpace:'nowrap',

            {statusMeta.label}
          </div>
          <div style={{ fontSize:11, color:'var(--ink-3)', fontFamily:'var(--f-mono)' }}>{s.hours}h</div>

            </div>

              {s.activity}

              s.kind === 'exam-written' && { t:'Formulario FORMS / Drive', tone:'granate', type:'Link', sub:'evaluación' },
            ].filter(Boolean).map((m, i) => (
              <div key={i} style={{
                padding:'8px 10px', background:'var(--surface-2)', borderRadius:8,
                display:'flex', alignItems:'center', gap:10, marginBottom:6,

                  padding:'2px 6px', borderRadius:4,
                  background: m.tone==='red' ? 'color-mix(in srgb, var(--danger) 14%, white)'

                    : 'color-mix(in srgb, var(--an-navy) 14%, white)',
                  color: m.tone==='red' ? 'var(--danger)' : m.tone==='granate' ? 'var(--an-granate)' : 'var(--an-navy)',

                  <div style={{ fontSize:12, fontWeight:500, color:'var(--ink)' }}>{m.t}</div>
                  <div style={{ fontSize:10, color:'var(--ink-3)' }}>{m.sub}</div>

      )}

      {/* Detalle de suspensión si aplica */}
      {(s.computedStatus === 'suspended' || s.computedStatus === 'rescheduled') && s.suspension && !isOpen && (
        <div style={{
          padding:'8px 18px 12px',

      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────
// CALENDARIO — cronograma del grupo con suspender/recuperar
// ─────────────────────────────────────────────────────────────────────────
function CalendarioView() {
  const { grupoInfo, grupo, codGrupo, loading } = useGroupFromSession();
  const schedule = useScheduleState(grupoInfo, grupo);
  if (loading) return <SyllabusLoadingState />;
  if (!grupoInfo || !grupo) return <SyllabusLoadingState message="No se encontró el grupo del estudiante." />;
  const nivelLbl = LEVEL_LABEL[grupoInfo.levelId] || grupoInfo.levelId || '—';
  const [month, setMonth] = React.useState(TODAY.getMonth());
  const [year, setYear] = React.useState(TODAY.getFullYear());
  const [selectedLesson, setSelectedLesson] = React.useState(null);
  const [showSuspendModal, setShowSuspendModal] = React.useState(null);

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startWeekDay = firstDay.getDay();
  const daysInMonth = lastDay.getDate();

  // Build calendar grid
  const cells = [];
  for (let i = 0; i < startWeekDay; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(year, month, d));

  // Lessons by date
  const lessonsByDate = {};
  schedule.forEach(s => {
    const k = s.date.toDateString();
    if (!lessonsByDate[k]) lessonsByDate[k] = [];
    lessonsByDate[k].push(s);
  });

  const navMonth = (delta) => {
    let m = month + delta, y = year;
    if (m < 0) { m = 11; y--; }
    if (m > 11) { m = 0; y++; }
    setMonth(m); setYear(y);
  };

  return (
    <div>
      <PageHeader
        kicker="Cronograma del grupo"
        title={<>Mi <em>Calendario</em></>}
        sub={`${codGrupo} · ${nivelLbl} · ${grupo.scheduleDays} · Inicio ${fmtDateLong(new Date(grupoInfo.startDate))}`}
        right={
          <div style={{ display:'flex', gap:8, alignItems:'center' }}>
            <Chip tone="granate" dot>Lección actual: L{schedule.find(s => s.computedStatus === 'today' || s.computedStatus === 'upcoming')?.n || 1}</Chip>
          </div>
        }
      />

      {/* Legenda de estados */}
      <div style={{
        display:'flex', gap:14, flexWrap:'wrap', padding:'10px 14px',
        background:'var(--surface-2)', border:'1px solid var(--line)',
        borderRadius:'var(--r-md)', marginBottom:16, fontSize:11,
      }}>
        {[
          ['Completada', 'var(--ok)'],
          ['Hoy / Próxima', 'var(--an-granate)'],
          ['Programada', 'var(--an-navy)'],
          ['Reprogramada', 'var(--an-gold)'],
          ['Suspendida (cascada)', 'var(--warn)'],
        ].map(([l,c]) => (
          <div key={l} style={{ display:'flex', alignItems:'center', gap:6 }}>
            <span style={{ width:10, height:10, borderRadius:3, background:c }} />
            <span style={{ color:'var(--ink-2)' }}>{l}</span>
          </div>
        ))}
      </div>

      <div style={{ display:'grid', gridTemplateColumns:'2fr 1fr', gap:16 }}>
        {/* Calendar grid */}
        <div className="card" style={{ padding:16 }}>
          {/* Month nav */}
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
            <button className="btn btn-ghost" onClick={() => navMonth(-1)}>← Mes anterior</button>
            <div style={{ fontFamily:'var(--f-serif)', fontSize:22, fontWeight:500, color:'var(--an-navy-ink)', textTransform:'capitalize' }}>
              {new Date(year, month, 1).toLocaleDateString('es-CR', { month:'long', year:'numeric' })}
            </div>
            <button className="btn btn-ghost" onClick={() => navMonth(1)}>Mes siguiente →</button>
          </div>

          {/* Weekday headers */}
          <div style={{ display:'grid', gridTemplateColumns:'repeat(7, 1fr)', gap:4, marginBottom:4 }}>
            {['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'].map(d => (
              <div key={d} style={{ fontSize:10, fontWeight:700, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--ink-3)', textAlign:'center', padding:'4px 0' }}>{d}</div>
            ))}
          </div>

          {/* Days */}
          <div style={{ display:'grid', gridTemplateColumns:'repeat(7, 1fr)', gap:4 }}>
            {cells.map((d, i) => {
              if (!d) return <div key={i} />;
              const lessons = lessonsByDate[d.toDateString()] || [];
              const isToday = d.toDateString() === TODAY.toDateString();
              return (
                <div key={i} style={{
                  minHeight: 70,
                  padding: 6,
                  background: isToday ? 'color-mix(in srgb, var(--an-granate) 8%, white)' : 'var(--surface)',
                  border: isToday ? '2px solid var(--an-granate)' : '1px solid var(--line)',
                  borderRadius: 6,
                  cursor: lessons.length ? 'pointer' : 'default',
                  opacity: d < TODAY && lessons.length === 0 ? 0.5 : 1,
                }}
                onClick={() => lessons[0] && setSelectedLesson(lessons[0])}>
                  <div style={{
                    fontSize: 11, fontWeight: isToday ? 700 : 500,
                    color: isToday ? 'var(--an-granate)' : 'var(--ink-2)',
                    marginBottom: 3,
                  }}>{d.getDate()}</div>
                  {lessons.map(l => (
                    <div key={l.n} style={{
                      fontSize: 9, padding:'2px 4px', marginBottom:2, borderRadius:3,
                      background: l.computedStatus==='done' || l.computedStatus==='done-rescheduled' ? 'var(--ok)'
                        : l.computedStatus==='today' ? 'var(--an-granate)'
                        : l.computedStatus==='rescheduled' ? 'var(--an-gold)'
                        : l.computedStatus==='suspended' ? 'var(--warn)'
                        : 'var(--an-navy)',
                      color:'white',
                      fontWeight:600,
                      overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap',
                    }}>
                      L{l.n} · {l.kind==='exam-oral' ? 'Oral' : l.kind==='exam-written' ? 'Escrito' : l.unit.replace('Unit ','U')}
                    </div>
                  ))}
                </div>
              );
            })}
          </div>
        </div>

        {/* Detail panel */}
        <div className="card" style={{ padding:18, height:'fit-content' }}>
          {!selectedLesson ? (
            <>
              <div style={{ fontSize:11, fontWeight:700, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--ink-3)', marginBottom:6 }}>
                Próximas lecciones
              </div>
              <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                {schedule.filter(s => s.computedStatus === 'today' || s.computedStatus === 'upcoming' || s.computedStatus === 'rescheduled').slice(0,5).map(s => (
                  <div key={s.n} onClick={() => setSelectedLesson(s)} style={{
                    padding:'10px 12px', borderRadius:8,
                    background:'var(--surface-2)', border:'1px solid var(--line)',
                    cursor:'pointer',
                  }}>
                    <div style={{ display:'flex', gap:8, alignItems:'baseline' }}>
                      <span style={{ fontFamily:'var(--f-mono)', fontSize:10, color:'var(--ink-3)', fontWeight:600 }}>L{String(s.n).padStart(2,'0')}</span>
                      <span style={{ fontSize:13, fontWeight:600, color:'var(--ink)' }}>{s.title}</span>
                    </div>
                    <div style={{ fontSize:11, color:'var(--ink-2)', marginTop:2 }}>{fmtDateLong(s.date)}</div>
                  </div>
                ))}
              </div>

              <div style={{ marginTop:16, paddingTop:14, borderTop:'1px dashed var(--line)', fontSize:11, color:'var(--ink-3)', lineHeight:1.5 }}>
                <div style={{ fontWeight:700, color:'var(--ink-2)', marginBottom:4 }}>Suspensiones registradas</div>
                {[].map((s,i) => (
                  <div key={i} style={{ marginBottom:6 }}>
                    <strong style={{ color: s.action==='rescheduled'?'var(--an-gold)':'var(--warn)' }}>L{s.lessonN}</strong>
                    {' · '}{s.reason}
                    {s.by === 'teacher' && ' · propuesto por docente, aprobado admin'}
                  </div>
                ))}
              </div>
            </>
          ) : (
            <LessonDetailPanel
              lesson={selectedLesson}
              onClose={() => setSelectedLesson(null)}
              onSuspendRequest={() => setShowSuspendModal(selectedLesson)} />
          )}
        </div>
      </div>

      {showSuspendModal && (
        <SuspendModal lesson={showSuspendModal} onClose={() => setShowSuspendModal(null)} />
      )}
    </div>
  );
}

function SuspendModal({ lesson, onClose }) {
  const [action, setAction] = React.useState('rescheduled'); // suspended | rescheduled
  const [reason, setReason] = React.useState('Enfermedad del profesor');
  const [detail, setDetail] = React.useState('');
  const [newDate, setNewDate] = React.useState('');

  return (
    <div style={{
      position:'fixed', inset:0, background:'rgba(20,18,30,0.55)',
      display:'flex', alignItems:'center', justifyContent:'center',
      zIndex:100, padding:20,
    }} onClick={onClose}>
      <div onClick={e => e.stopPropagation()} style={{
        background:'var(--surface)', borderRadius:'var(--r-lg)',
        maxWidth:520, width:'100%', padding:26, boxShadow:'var(--sh-3)',
      }}>
        <div style={{ fontSize:10, fontWeight:700, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--an-granate)' }}>
          Solicitud de cambio · Lección {lesson.n}
        </div>
        <div style={{ fontFamily:'var(--f-serif)', fontSize:22, fontWeight:500, color:'var(--an-navy-ink)', marginTop:4 }}>
          {lesson.title}
        </div>
        <div style={{ fontSize:12, color:'var(--ink-2)', marginTop:2, marginBottom:18 }}>
          {fmtDateLong(lesson.date)}
        </div>

        <div style={{ fontSize:11, fontWeight:700, color:'var(--ink-2)', marginBottom:6 }}>Tipo de cambio</div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginBottom:16 }}>
          {[
            ['rescheduled', 'Recuperar en otro día', 'La lección se da en fecha nueva — no afecta al resto'],
            ['suspended',   'Suspender (cascada)',   'Mueve esta y todas las siguientes un slot adelante'],
          ].map(([k, l, d]) => (
            <label key={k} style={{
              padding:'10px 12px', border:`2px solid ${action===k?'var(--an-granate)':'var(--line)'}`,
              borderRadius:8, cursor:'pointer',
              background: action===k ? 'color-mix(in srgb, var(--an-granate) 5%, white)' : 'var(--surface)',
            }}>
              <input type="radio" name="action" checked={action===k} onChange={() => setAction(k)} style={{ marginRight:6 }} />
              <strong style={{ fontSize:12 }}>{l}</strong>
              <div style={{ fontSize:10, color:'var(--ink-3)', marginTop:3, lineHeight:1.4 }}>{d}</div>
            </label>
          ))}
        </div>

        {action === 'rescheduled' && (
          <>
            <div style={{ fontSize:11, fontWeight:700, color:'var(--ink-2)', marginBottom:6 }}>Nueva fecha</div>
            <input type="date" value={newDate} onChange={e => setNewDate(e.target.value)}
              style={{ width:'100%', padding:'10px 12px', border:'1px solid var(--line)', borderRadius:8, marginBottom:14, fontFamily:'inherit' }} />
          </>
        )}

        <div style={{ fontSize:11, fontWeight:700, color:'var(--ink-2)', marginBottom:6 }}>Motivo</div>
        <select value={reason} onChange={e => setReason(e.target.value)}
          style={{ width:'100%', padding:'10px 12px', border:'1px solid var(--line)', borderRadius:8, marginBottom:14, fontFamily:'inherit' }}>
          {['Feriado oficial','Enfermedad del profesor','Clima / emergencia','Evento institucional','Falta de quórum','Decisión administrativa','Otro'].map(r => (
            <option key={r}>{r}</option>
          ))}
        </select>

        <div style={{ fontSize:11, fontWeight:700, color:'var(--ink-2)', marginBottom:6 }}>Detalle</div>
        <textarea value={detail} onChange={e => setDetail(e.target.value)} rows={3}
          placeholder="Ej. Acordamos con los estudiantes por WhatsApp dar la lección el sábado..."
          style={{ width:'100%', padding:'10px 12px', border:'1px solid var(--line)', borderRadius:8, marginBottom:14, fontFamily:'inherit', fontSize:12, resize:'vertical' }} />

        <div style={{ fontSize:11, color:'var(--ink-3)', padding:'10px 12px', background:'var(--surface-2)', borderRadius:6, marginBottom:16, lineHeight:1.5 }}>
          ℹ️ Esta solicitud pasará al admin para aprobación. Recibirás notificación por correo.
        </div>

        <div style={{ display:'flex', gap:8, justifyContent:'flex-end' }}>
          <button onClick={onClose} className="btn btn-ghost">Cancelar</button>
          <button onClick={onClose} className="btn btn-primary">Enviar solicitud</button>
        </div>
      </div>
    </div>
  );
}

function TeacherCalendarRow({ teacher }) {
  // Generate 30 days of Abril with random pattern deterministic by teacher id
  const seed = teacher.id.charCodeAt(1);
  const days = Array.from({ length: 30 }, (_, i) => {
    const d = i + 1;
    const hasClass = (d + seed) % 2 === 0 && ![4,5,11,12,18,19,25,26].includes(d);
    if (!hasClass) return { d, type: 'none' };
    const cancelled = (d * seed) % 17 === 0;
    return { d, type: cancelled ? 'cancelled' : 'given' };
  });

  return (
    <div style={{ display:'grid', gridTemplateColumns:'180px 1fr auto', gap:12, alignItems:'center' }}>
      <div style={{ display:'flex', alignItems:'center', gap:10 }}>
        <div style={{ width:28, height:28, borderRadius:'50%', background:teacher.color, color:'white', fontSize:10, fontWeight:700, display:'flex', alignItems:'center', justifyContent:'center' }}>{teacher.avatar}</div>
        <div style={{ fontSize:12, fontWeight:600, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{teacher.name}</div>
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(30, 1fr)', gap:2 }}>
        {days.map((d, i) => (
          <div key={i} title={`Día ${d.d} · ${d.type==='given'?'Dada':d.type==='cancelled'?'Cancelada':'Sin clase'}`} style={{
            height: 22, borderRadius:3,
            background: d.type==='given' ? 'var(--ok)' : d.type==='cancelled' ? 'var(--warn)' : 'var(--bg-deep)',
            opacity: d.type==='none' ? 0.4 : 1,
          }} />
        ))}
      </div>
      <div style={{ fontSize:11, color:'var(--ink-2)', textAlign:'right', minWidth:90 }}>
        <div style={{ color:'var(--ok)', fontWeight:700, fontFamily:'var(--f-mono)' }}>{teacher.totalGiven}h dadas</div>
        {teacher.totalCancelled > 0 && <div style={{ color:'var(--warn)', fontFamily:'var(--f-mono)' }}>{teacher.totalCancelled}h canc.</div>}

const SCRIPT_URL_TV = 'https://script.google.com/macros/s/AKfycbx8O8dxCNhHQQLdRFd4vqOY_yIzE0KUG7ljk7vkieHf9hKWeund_WC0ZpuKU-Toj8sYHQ/exec';

// ── Lección sugerida según fecha de inicio + días de clase ──────────────
function calcularLeccionSugerida(startDate, diasCode) {
  if (!startDate) return '';
  const inicio = new Date(startDate);
  inicio.setHours(0,0,0,0);
  const hoy = new Date();
  hoy.setHours(0,0,0,0);
  if (hoy < inicio) return '1';

  // Días de clase según código (0=Dom, 1=Lun, ..., 6=Sáb)
  const diasMap = {
    'LM': [1,3], 'KJ': [2,4], 'LJ': [1,4],
    'SA': [6],   'LM94': [1,3],
  };
  const codigo = (diasCode || '').replace(/\d/g,'').toUpperCase();
  const dias = diasMap[codigo] || [1,3];

  let leccion = 0;
  const cursor = new Date(inicio);
  while (cursor <= hoy) {
    if (dias.includes(cursor.getDay())) leccion++;
    cursor.setDate(cursor.getDate() + 1);
  }
  if (codigo === 'SA') leccion = leccion * 2;
  if (codigo === 'LJ') leccion = leccion * 2;

  return String(Math.min(Math.max(leccion, 1), 32));
}

// Deriva startDate del último segmento del codGrupo (MMYY → día 1 del mes)
function __startDateFromCodGrupo(codGrupo) {
  const parts = (codGrupo || '').split('-');
  const last = parts[parts.length - 1] || '';
  if (!/^\d{4}$/.test(last)) return null;
  const mm = parseInt(last.slice(0,2), 10);
  const yy = parseInt(last.slice(2,4), 10);
  if (!mm || mm < 1 || mm > 12) return null;
  return new Date(2000 + yy, mm - 1, 1);
}

// ── Sesión real del docente ──────────────────────────────────────────────
// Hook que lee la sesión del sessionStorage y trae el roster del Apps Script.
// Cache en módulo para que, al cambiar de vista, no se refetchee siempre.
let __TV_ROSTER_CACHE = null; // { codGrupo, roster }

function useTeacherSession() {
  const [state, setState] = React.useState(() => {
    let usuario = null;
    try { usuario = JSON.parse(sessionStorage.getItem('an_usuario') || 'null'); } catch(_) {}
    const codGrupo   = usuario?.grupo || '';
    const programa   = usuario?.programa || 'SIN_INA';
    const nombre     = usuario?.nombre || '';
    // leccionNum NO viene de sesión: el docente la ingresa manualmente en cada vista
    if (__TV_ROSTER_CACHE && __TV_ROSTER_CACHE.codGrupo === codGrupo) {
      return { codGrupo, programa, nombre, roster: __TV_ROSTER_CACHE.roster, loading:false, error:null };
    }
    return { codGrupo, programa, nombre, roster: [], loading: !!codGrupo, error: codGrupo ? null : 'No hay sesión de docente activa.' };
  });

  React.useEffect(() => {
    if (!state.codGrupo || !state.loading) return;
    let cancel = false;
    (async () => {
      try {
        const url = `${SCRIPT_URL_TV}?fn=getGrupoEstudiantes&cod_grupo=${encodeURIComponent(state.codGrupo)}`;
        const res  = await fetch(url);
        const data = await res.json();
        if (cancel) return;
        if (!data.ok) {
          setState(s => ({ ...s, loading:false, error: data.error || 'No se pudo cargar el grupo.' }));
          return;
        }
        const roster = (data.estudiantes || []).map(e => ({
          code: e.code,
          name: e.name,
          status: 'al-dia',
          att: null, avg: null, oral: null, lastSeen: null,
        }));
        __TV_ROSTER_CACHE = { codGrupo: state.codGrupo, roster };
        setState(s => ({ ...s, loading:false, error:null, roster }));
      } catch(e) {
        if (cancel) return;
        setState(s => ({ ...s, loading:false, error: 'Error de conexión: ' + e.message }));
      }
    })();
    return () => { cancel = true; };
  }, [state.codGrupo, state.loading]);

  // grupoInfo derivado: startDate desde el último segmento del codGrupo (MMYY)
  const grupoInfo = React.useMemo(() => ({
    startDate: __startDateFromCodGrupo(state.codGrupo),
  }), [state.codGrupo]);

  return { ...state, grupoInfo };
}

// ── Tareas pendientes derivadas del cronograma real ─────────────────────
function calcularTareasPendientes(startDate, diasCode, leccionActual) {
  const lec = parseInt(leccionActual) || 1;
  const tareas = [];

  // Progress Check — cada 4 lecciones aproximadamente
  const lcProgress = [4,8,13,16,21,24,28,30];
  const proximoPC = lcProgress.find(l => l >= lec);
  if (proximoPC) {
    const unidadesMap = {
      4:'U1-U2', 8:'U3-U4', 13:'U5-U6', 16:'U7-U8',
      21:'U9-U10', 24:'U11-U12', 28:'U13-U14', 30:'U15-U16'
    };
    tareas.push({
      t: 'Progress Check ' + (unidadesMap[proximoPC] || ''),
      g: 'Lección ' + proximoPC,
      pr: proximoPC - lec <= 2 ? 'alta' : 'media',
    });
  }

  // Exámenes orales — lecciones 9,17,25,31
  const lcOrales = [9,17,25,31];
  const proximoOral = lcOrales.find(l => l >= lec);
  if (proximoOral) {
    const unidOrales = { 9:'U1-U4', 17:'U5-U8', 25:'U9-U12', 31:'U13-U16' };
    tareas.push({
      t: 'Oral ' + (unidOrales[proximoOral] || ''),
      g: 'Lección ' + proximoOral,
      pr: proximoOral - lec <= 2 ? 'alta' : 'media',
    });
  }

  // Exámenes escritos — lecciones 18 y 32
  const lcEscritos = [18,32];
  const proximoEscrito = lcEscritos.find(l => l >= lec);
  if (proximoEscrito) {
    tareas.push({
      t: 'Escrito ' + (proximoEscrito === 18 ? 'U1-U8' : 'U9-U16'),
      g: 'Lección ' + proximoEscrito,
      pr: proximoEscrito - lec <= 2 ? 'alta' : 'baja',
    });
  }

  return tareas;
}

    </div>
  );
}

function GruposView() {
  const { codGrupo, roster, loading, error } = useTeacherSession();
  if (loading || error) return <TeacherLoadingState loading={loading} error={error} />;

  // Derivar nivel humano del código del grupo: B1-LM69-C3-0225 → "Básico I"
  const NIVEL_LABEL = { B1:'Básico I', B2:'Básico II', I1:'Intermedio I', I2:'Intermedio II', A1:'Avanzado I', A2:'Avanzado II' };
  const nivelInicio = (codGrupo.split('-')[0] || '').toUpperCase();
  const nivelLabel  = NIVEL_LABEL[nivelInicio] || nivelInicio || '—';

  // Promedio y asistencia reales del roster cargado
  const valid    = roster.filter(r => typeof r.avg === 'number');
  const avgClass = valid.length ? (valid.reduce((a,r)=>a+r.avg,0)/valid.length).toFixed(1) : null;
  const attValid = roster.filter(r => typeof r.att === 'number');
  const attClass = attValid.length ? Math.round(attValid.reduce((a,r)=>a+r.att,0)/attValid.length) : null;

  return (
    <div>
      <PageHeader
        kicker="Gestión académica"
        title={<>Mi <em>Grupo</em></>}
        sub={`Lista de matriculados de ${codGrupo}`}
      />
      <div className="tabs">
        <button className="tab active">{codGrupo} · {nivelLabel}</button>
      </div>

      <div className="grid-4" style={{ marginBottom:20 }}>
        <Stat label="Matriculados"   num={roster.length}                 sub="Máximo: 12" pct={roster.length/12*100} color="var(--an-navy)" />
        <Stat label="Nivel actual"   num={nivelLabel}                    sub={codGrupo}   pct={0}                    color="var(--an-granate)" />
        <Stat label="Promedio grupo" num={avgClass ?? '—'} suffix={avgClass?'%':''} sub={avgClass?'Sobre 100':'Sin notas aún'} subTone={avgClass?'ok':'muted'} pct={avgClass?Number(avgClass):0} color="var(--ok)" />
        <Stat label="Asistencia"     num={attClass ?? '—'} suffix={attClass!=null?'%':''} sub={attClass!=null?'Promedio del grupo':'Sin registro aún'} subTone={attClass!=null?'warn':'muted'} pct={attClass||0} color="var(--warn)" />
      </div>

      <div className="card" style={{ padding:0, overflow:'hidden' }}>
        <div className="card-h" style={{ padding:'18px 20px' }}>
          <div className="card-title">Roster · {codGrupo}</div>
          <div style={{ display:'flex', gap:8 }}>
            <button className="btn btn-ghost"><Icon name="download" size={14} className="" /> Exportar</button>
          </div>
        </div>
        <table className="table-soft">
          <thead>
            <tr>
              <th>Cód.</th>
              <th>Estudiante</th>
              <th style={{ textAlign:'right' }}>Promedio</th>
              <th style={{ textAlign:'right' }}>Asistencia</th>
              <th style={{ textAlign:'right' }}>Oral 1 /15</th>
              <th>Últ. visto</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {roster.map((r,i) => (
              <tr key={i}>
                <td style={{ fontFamily:'var(--f-mono)', color:'var(--ink-3)' }}>{r.code}</td>
                <td>
                  <div style={{ display:'flex', gap:10, alignItems:'center' }}>
                    <div style={{ width:30, height:30, borderRadius:'50%', background:'var(--an-navy)', color:'white', fontSize:11, fontWeight:700, display:'flex', alignItems:'center', justifyContent:'center' }}>
                      {r.name.split(' ').slice(0,2).map(w=>w[0]).join('')}
                    </div>
                    <span style={{ fontWeight:500 }}>{r.name}</span>
                  </div>
                </td>
                <td style={{ textAlign:'right', fontWeight:600, color: r.avg==null?'var(--ink-3)':r.avg>=85?'var(--ok)':r.avg>=75?'var(--ink)':'var(--danger)' }}>{r.avg ?? '—'}</td>

                  {r.att==null ? <span style={{ color:'var(--ink-3)' }}>—</span> : (
                    <div style={{ display:'inline-flex', alignItems:'center', gap:6 }}>

function CalificarView({ toast }) {
  const { codGrupo, programa, roster, grupoInfo, loading, error } = useTeacherSession();
  const diasCode = (codGrupo || '').split('-')[1] || 'LM';
  const leccionSugerida = calcularLeccionSugerida(grupoInfo?.startDate, diasCode);
  const [tipoEval, setTipoEval]   = React.useState('ORAL_2');
  const [leccion,  setLeccion]    = React.useState(leccionSugerida || '');
  const [cargando, setCargando]   = React.useState(false);
  const [resultado, setResultado] = React.useState(null); // { ok, guardados, errores }
  const [errGlobal, setErrGlobal] = React.useState('');

  const evalDef = EVAL_TYPES_SIN_INA.find(e => e.key === tipoEval) || EVAL_TYPES_SIN_INA[0];

  // El docente ingresa la lección manualmente en cada vista.

  const [notas, setNotas] = React.useState({});
  // Re-init notas cuando cambia el roster
  React.useEffect(() => {
    const o = {};
    roster.forEach(r => { o[r.code] = ''; });
    setNotas(o);
  }, [roster]);

  if (loading || error) return <TeacherLoadingState loading={loading} error={error} />;

  const setNota = (code, v) => {
    if (v !== '' && (parseFloat(v) < 0 || parseFloat(v) > evalDef.max)) return;
    setNotas(prev => ({ ...prev, [code]: v }));
  };

  const guardar = async () => {
    setCargando(true);
    setErrGlobal('');
    setResultado(null);

    const lec = parseInt(leccion);
    if (!lec || lec < 1 || lec > 32) {
      setErrGlobal('Ingresá un número de lección válido (1–32) antes de guardar.');
      setCargando(false);
      return;
    }

    const estudiantesConNota = roster.filter(r => notas[r.code] !== '' && parseFloat(notas[r.code]) > 0);

    if (estudiantesConNota.length === 0) {
      setErrGlobal('Ingresá al menos una nota antes de guardar.');
      setCargando(false);
      return;
    }

    try {
      const resultados = await Promise.allSettled(
        estudiantesConNota.map(r =>
          fetch(`${SCRIPT_URL_TV}?fn=registrarEvaluacion`, {
            method: 'POST',
            body: JSON.stringify({
              cod_grupo:      codGrupo,
              cod_estudiante: r.code,
              nivel:          'B1',
              programa:       programa,
              tipo_eval:      tipoEval,
              leccion_num:    lec,
              nota_obtenida:  parseFloat(notas[r.code]),
              registrado_por: 'DOCENTE',
            }),
          }).then(res => res.json())
        )
      );

      const ok  = resultados.filter(r => r.status==='fulfilled' && r.value?.ok).length;
      const err = resultados.length - ok;
      setResultado({ ok, errores: err, total: resultados.length });
      if (toast) toast(`${ok} calificación${ok!==1?'es':''} guardada${ok!==1?'s':''}`);
    } catch(e) {
      setErrGlobal('Error de conexión: ' + e.message);
    } finally {
      setCargando(false);
    }
  };

  return (
    <div>
      <PageHeader
        kicker="Evaluación"
        title={<>Calificar · <em>{evalDef.label}</em></>}
        sub={`${codGrupo} · Programa ${programa} · ${evalDef.max} pts máximo`}
        right={
          <button className="btn btn-primary" onClick={guardar} disabled={cargando}
            style={{ opacity: cargando?0.6:1 }}>
            {cargando ? 'Guardando…' : 'Guardar calificaciones'}
          </button>
        }
      />

      {/* Selector de tipo de evaluación y lección */}
      <div className="card" style={{ marginBottom:16, display:'flex', gap:16, flexWrap:'wrap', alignItems:'center' }}>
        <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
          <label style={{ fontSize:11, fontWeight:700, color:'var(--ink-3)', letterSpacing:'0.1em', textTransform:'uppercase' }}>Tipo de evaluación</label>
          <select value={tipoEval} onChange={e => setTipoEval(e.target.value)}
            style={{ padding:'8px 12px', border:'1.5px solid var(--line)', borderRadius:'var(--r-md)', fontFamily:'inherit', fontSize:13, fontWeight:600, outline:'none', cursor:'pointer' }}>
            {EVAL_TYPES_SIN_INA.map(ev => (
              <option key={ev.key} value={ev.key}>{ev.label} ({ev.max} pts)</option>
            ))}
          </select>
        </div>
        <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
          <label style={{ fontSize:11, fontWeight:700, color:'var(--ink-3)', letterSpacing:'0.1em', textTransform:'uppercase' }}>N° Lección (1–32)</label>
          <input type="number" value={leccion} onChange={e => setLeccion(e.target.value)} min={1} max={32}
            placeholder="—"
            style={{ width:90, padding:'8px 12px', border:'1.5px solid var(--line)', borderRadius:'var(--r-md)', fontFamily:'var(--f-mono)', fontSize:13, fontWeight:600, outline:'none' }} />
          <div style={{ fontSize:11, color:'var(--ink-3)', marginTop:4 }}>
            Sugerida según fecha de inicio del grupo
          </div>
        </div>
        <div style={{ marginLeft:'auto', padding:'10px 16px', background:'color-mix(in srgb,var(--an-navy) 6%,white)', borderRadius:'var(--r-md)', fontSize:12, color:'var(--an-navy)', fontWeight:600 }}>
          Programa: {programa} · Grupo: {codGrupo}
        </div>
      </div>

      {/* Tabla de notas */}
      <div className="card" style={{ padding:0, overflow:'hidden', marginBottom:16 }}>
        <table className="table-soft">
          <thead>
            <tr>
              <th>Estudiante</th>
              <th style={{ textAlign:'center', width:120 }}>Nota / {evalDef.max}</th>
              <th style={{ textAlign:'center' }}>Estado</th>
              <th>Comentario</th>
            </tr>
          </thead>
          <tbody>
            {roster.map(r => {
              const nota = parseFloat(notas[r.code]) || 0;
              const pct  = evalDef.max > 0 ? nota / evalDef.max : 0;
              const aprobado = pct >= 0.7;
              return (
                <tr key={r.code}>
                  <td>
                    <div style={{ fontWeight:600, fontSize:13 }}>{r.name}</div>
                    <div style={{ fontFamily:'var(--f-mono)', fontSize:10, color:'var(--ink-3)' }}>{r.code}</div>
                  </td>
                  <td style={{ textAlign:'center', padding:'8px' }}>
                    <input
                      value={notas[r.code]}
                      onChange={e => setNota(r.code, e.target.value)}
                      placeholder="—"
                      type="number" min={0} max={evalDef.max} step={0.5}
                      style={{
                        width:72, height:40, textAlign:'center',
                        border:'1.5px solid var(--line)', borderRadius:8,
                        fontFamily:'var(--f-mono)', fontSize:15, fontWeight:700,
                        outline:'none',
                      }}
                    />
                  </td>
                  <td style={{ textAlign:'center' }}>
                    {notas[r.code] === '' ? (
                      <span style={{ fontSize:11, color:'var(--ink-3)', fontStyle:'italic' }}>Sin nota</span>
                    ) : (
                      <span style={{ display:'inline-block', padding:'5px 12px', borderRadius:999, background: aprobado?'color-mix(in srgb,var(--ok) 14%,white)':'color-mix(in srgb,var(--danger) 14%,white)', fontFamily:'var(--f-mono)', fontWeight:700, color: aprobado?'var(--ok)':'var(--danger)', fontSize:12 }}>
                        {nota}/{evalDef.max} {aprobado?'✓':'✕'}
                      </span>
                    )}
                  </td>
                  <td style={{ padding:'8px' }}>
                    <input placeholder="Retroalimentación breve…"
                      style={{ width:'100%', height:38, padding:'0 10px', border:'1px solid var(--line)', borderRadius:8, fontSize:12, outline:'none', fontFamily:'inherit' }} />
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* Errores y resultado */}
      {errGlobal && (
        <div style={{ padding:'10px 14px', background:'color-mix(in srgb,#C00000 8%,white)', border:'1px solid #C00000', borderRadius:'var(--r-md)', color:'#C00000', fontSize:13, marginBottom:12 }}>
          ⚠ {errGlobal}
        </div>
      )}
      {resultado && (
        <div style={{ padding:'14px 18px', background: resultado.errores===0?'color-mix(in srgb,var(--ok) 8%,white)':'color-mix(in srgb,var(--warn) 10%,white)', border:`1px solid ${resultado.errores===0?'var(--ok)':'var(--warn)'}`, borderRadius:'var(--r-md)', fontSize:13, fontWeight:600, color: resultado.errores===0?'#166534':'#92400E' }}>
          {resultado.errores === 0
            ? `✅ ${resultado.ok} calificación${resultado.ok!==1?'es':''} guardada${resultado.ok!==1?'s':''}  correctamente en APOLLO_G3`
            : `⚠ ${resultado.ok} guardadas, ${resultado.errores} con error — revisá la conexión`}
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────
function AsistenciaView({ toast }) {
  const { codGrupo, programa, roster, grupoInfo, loading, error } = useTeacherSession();
  const diasCode = (codGrupo || '').split('-')[1] || 'LM';
  const leccionSugerida = calcularLeccionSugerida(grupoInfo?.startDate, diasCode);
  const [leccion, setLeccion]     = React.useState(leccionSugerida || '');
  const [att, setAtt]             = React.useState({});
  const [cargando, setCargando]   = React.useState(false);
  const [resultado, setResultado] = React.useState(null);
  const [errGlobal, setErrGlobal] = React.useState('');

  // Re-init att cuando cambia el roster
  React.useEffect(() => {
    const o = {};
    roster.forEach(r => { o[r.code] = 'present'; });
    setAtt(o);
  }, [roster]);

  if (loading || error) return <TeacherLoadingState loading={loading} error={error} />;

  const counts = {
    present: Object.values(att).filter(v => v==='present').length,
    late:    Object.values(att).filter(v => v==='late').length,
    absent:  Object.values(att).filter(v => v==='absent').length,
  };

  const cerrarLista = async () => {
    setCargando(true);
    setErrGlobal('');
    setResultado(null);

    const lec = parseInt(leccion);
    if (!lec || lec < 1 || lec > 32) {
      setErrGlobal('Ingresá un número de lección válido (1–32) antes de cerrar la lista.');
      setCargando(false);
      return;
    }

    const hoy = new Date().toLocaleDateString('es-CR', { day:'2-digit', month:'2-digit', year:'numeric' }).replace(/\//g,'/');

    const body = {
      cod_grupo:      codGrupo,
      leccion_num:    lec,
      fecha_leccion:  hoy,
      programa:       programa,
      registrado_por: 'DOCENTE',
      lista: roster.map(r => ({
        cod_estudiante: r.code,
        presente:       att[r.code] !== 'absent',
      })),
    };

    try {
      const res  = await fetch(`${SCRIPT_URL_TV}?fn=registrarAsistencia`, {
        method: 'POST',
        body:   JSON.stringify(body),
      });
      const data = await res.json();

      if (!data.ok) {
        setErrGlobal(data.error || 'Error al registrar asistencia');
        return;
      }

      setResultado({ presentes: counts.present + counts.late, ausentes: counts.absent });
      if (toast) toast(`Asistencia registrada · ${counts.present + counts.late} presentes`);
    } catch(e) {
      setErrGlobal('Error de conexión: ' + e.message);
    } finally {
      setCargando(false);
    }
  };

  const total = roster.length;

  return (
    <div>
      <PageHeader
        kicker={`Asistencia · ${new Date().toLocaleDateString('es-CR',{weekday:'short',day:'numeric',month:'short'})}`}
        title={<>Pasar <em>lista</em></>}
        sub={`${codGrupo} · Programa ${programa}`}
        right={
          <div style={{ display:'flex', gap:10, alignItems:'flex-end' }}>
            <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
              <label style={{ fontSize:10, fontWeight:700, color:'var(--ink-3)', letterSpacing:'0.1em', textTransform:'uppercase' }}>N° Lección (1–32)</label>
              <input type="number" value={leccion} onChange={e => setLeccion(e.target.value)} min={1} max={32}
                placeholder="—" disabled={!!resultado}
                style={{ width:90, padding:'8px 12px', border:'1.5px solid var(--line)', borderRadius:'var(--r-md)', fontFamily:'var(--f-mono)', fontSize:13, fontWeight:600, outline:'none' }} />
              <div style={{ fontSize:11, color:'var(--ink-3)', marginTop:4 }}>
                Sugerida según fecha de inicio del grupo
              </div>
            </div>
            <button className="btn btn-primary" onClick={cerrarLista} disabled={cargando || !!resultado}
              style={{ opacity: cargando||resultado?0.6:1 }}>
              {cargando ? 'Guardando…' : resultado ? 'Lista cerrada ✓' : 'Cerrar lista'}
            </button>
          </div>
        }
      />

      <div className="grid-4" style={{ marginBottom:20 }}>
        <div className="card" style={{ textAlign:'center', background:'color-mix(in srgb, var(--ok) 10%, white)', borderColor:'var(--ok)' }}>
          <div style={{ fontFamily:'var(--f-serif)', fontSize:42, fontWeight:500, color:'var(--ok)' }}>{counts.present}</div>
          <div style={{ fontSize:11, fontWeight:700, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--ok)' }}>Presentes</div>
        </div>
        <div className="card" style={{ textAlign:'center', background:'color-mix(in srgb, var(--warn) 10%, white)', borderColor:'var(--warn)' }}>
          <div style={{ fontFamily:'var(--f-serif)', fontSize:42, fontWeight:500, color:'var(--warn)' }}>{counts.late}</div>
          <div style={{ fontSize:11, fontWeight:700, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--warn)' }}>Tardíos</div>
        </div>
        <div className="card" style={{ textAlign:'center', background:'color-mix(in srgb, var(--danger) 10%, white)', borderColor:'var(--danger)' }}>
          <div style={{ fontFamily:'var(--f-serif)', fontSize:42, fontWeight:500, color:'var(--danger)' }}>{counts.absent}</div>
          <div style={{ fontSize:11, fontWeight:700, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--danger)' }}>Ausentes</div>
        </div>
        <div className="card" style={{ textAlign:'center' }}>
          <div style={{ fontFamily:'var(--f-serif)', fontSize:42, fontWeight:500, color:'var(--an-navy-ink)' }}>
            {total > 0 ? (((counts.present+counts.late)/total)*100).toFixed(0) : 0}%
          </div>
          <div style={{ fontSize:11, fontWeight:700, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--ink-3)' }}>Asistencia hoy</div>
        </div>
      </div>

      <div className="card" style={{ marginBottom:16 }}>
        <div style={{ display:'grid', gap:8 }}>
          {roster.map(r => (
            <div key={r.code} style={{ display:'grid', gridTemplateColumns:'auto 1fr auto', gap:14, alignItems:'center', padding:'10px 12px', background:'var(--surface-2)', borderRadius:'var(--r-md)', opacity: resultado?0.7:1 }}>
              <div style={{ width:36, height:36, borderRadius:'50%', background:'var(--an-navy)', color:'white', fontSize:12, fontWeight:700, display:'flex', alignItems:'center', justifyContent:'center' }}>
                {r.name.split(' ').slice(0,2).map(w=>w[0]).join('')}
              </div>
              <div>
                <div style={{ fontWeight:600, fontSize:14 }}>{r.name}</div>
                <div style={{ fontSize:11, color:'var(--ink-3)', fontFamily:'var(--f-mono)' }}>{r.code}{r.att!=null && ` · Asistencia general ${r.att}%`}</div>
              </div>
              <div style={{ display:'flex', gap:4 }}>
                {[
                  ['present', 'P', 'var(--ok)'],
                  ['late',    'T', 'var(--warn)'],
                  ['absent',  'A', 'var(--danger)'],
                ].map(([k, lab, color]) => (
                  <button key={k} onClick={() => { if (!resultado) setAtt(prev => ({ ...prev, [r.code]: k })); }}
                    disabled={!!resultado}
                    style={{
                      width:42, height:42, borderRadius:10,
                      border: att[r.code]===k ? `2px solid ${color}` : '1px solid var(--line)',
                      background: att[r.code]===k ? `color-mix(in srgb, ${color} 18%, white)` : 'white',
                      color: att[r.code]===k ? color : 'var(--ink-3)',
                      fontWeight:700, fontSize:14, cursor: resultado?'not-allowed':'pointer',
                    }}>
                    {lab}
                  </button>
                ))}
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* Error */}
      {errGlobal && (
        <div style={{ padding:'10px 14px', background:'color-mix(in srgb,#C00000 8%,white)', border:'1px solid #C00000', borderRadius:'var(--r-md)', color:'#C00000', fontSize:13, marginBottom:12 }}>
          ⚠ {errGlobal}
        </div>
      )}

      {/* Confirmación */}
      {resultado && (
        <div style={{ padding:'16px 20px', background:'color-mix(in srgb,var(--ok) 8%,white)', border:'1px solid var(--ok)', borderRadius:'var(--r-md)', display:'flex', alignItems:'center', gap:14 }}>
          <div style={{ fontSize:28 }}>✅</div>
          <div>
            <div style={{ fontWeight:700, fontSize:14, color:'#166534' }}>Lista cerrada correctamente</div>
            <div style={{ fontSize:12, color:'#166534', marginTop:2 }}>
              {resultado.presentes} presente{resultado.presentes!==1?'s':''} · {resultado.ausentes} ausente{resultado.ausentes!==1?'s':''} · Lección {leccion} · {codGrupo}
            </div>
          </div>
          <button onClick={() => setResultado(null)} className="btn btn-ghost" style={{ marginLeft:'auto', fontSize:12 }}>
            Editar
          </button>
        </div>
      )}
    </div>
  );
}

Object.assign(window, { TeacherDashboard, GruposView, CalificarView, AsistenciaView });

// Hook: lee el dashboard administrativo desde Apps Script
// Devuelve { data, loading, error, refetch } — data trae { kpis, grupos, alertas }

function useNovedadesConape() {
  const [novedades, setNovedades] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [ultimoSync, setUltimoSync] = React.useState(null);
  const [resumen, setResumen] = React.useState({ total: null, sinVincular: 0, sinDesembolso: 0 });
  React.useEffect(() => {
    fetch(`${SCRIPT_URL_AV}?fn=getNovedadesConape`)
      .then(r => r.json())
      .then(d => {
        if (d.ok) {
          setNovedades(d.novedades || []);
          setUltimoSync(d.ultimoSync || null);
          setResumen({
            total: d.total ?? null,
            sinVincular: d.sinVincular || 0,
            sinDesembolso: d.sinDesembolso || 0,
          });
        }
      })
      .catch(() => {})
      .finally(() => setLoading(false));
  }, []);
  return { novedades, loading, ultimoSync, resumen };
}

function useAdminDashboard() {
  const [data, setData]       = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const [error, setError]     = React.useState(null);
  const [tick, setTick]       = React.useState(0);

  React.useEffect(() => {
    let cancel = false;
    setLoading(true);
    setError(null);
    fetch(`${SCRIPT_URL_AV}?fn=getAdminDashboard`)
      .then(r => r.json())
      .then(d => {
        if (cancel) return;
        if (d.ok) setData(d);
        else      setError(d.error || 'No se pudo cargar el dashboard');
      })
      .catch(e => { if (!cancel) setError(e.message); })
      .finally(()=> { if (!cancel) setLoading(false); });
    return () => { cancel = true; };
  }, [tick]);

  return { data, loading, error, refetch: () => setTick(t => t + 1) };
}

// Mapa de días → código de 2 letras
const DIAS_CODIGO = {
  'Lun/Mié':            'LM',
  'Mar/Jue':            'KJ',
  'Sáb':                'SA',
  'Sáb (día completo)': 'SA',
  'Lun/Mar/Mié/Jue':    'L4',
  'Mar/Mié/Jue/Vie':    'L4',
  'Lun/Mié/Jue/Vie':    'L4',
};

// Mapa hora inicio → código de 2 dígitos (hora inicio + hora fin abreviada)
// 06:00 → 6 a 9   = "69"
// 09:00 → 9 a 4   = "94"
const HORA_CODIGO = {
  '06:00': '69',
  '09:00': '94',
};

// Periodo derivado de la fecha de inicio + modalidad.
// Intensivo (cuatrimestre): Ene→C1, May→C2, Sep→C3
// Súper Intensivo (bimestre): Ene→B1, Mar→B2, May→B3, Jul→B4, Sep→B5, Nov→B6
function periodoFromFecha(fechaIso, modalidad) {
  if (!fechaIso) return '';
  const m = new Date(fechaIso).getMonth(); // 0-11
  if (modalidad === 'super_intensivo') {
    const map = { 0:'B1', 2:'B2', 4:'B3', 6:'B4', 8:'B5', 10:'B6' };
    return map[m] || `B${Math.floor(m/2)+1}`;
  }
  const map = { 0:'C1', 4:'C2', 8:'C3' };
  return map[m] || `C${Math.floor(m/4)+1}`;
}

// Lee el consecutivo más alto en `grupos` y devuelve el siguiente como string de 2 dígitos.
// Soporta tanto el formato viejo (G0033-2026) como el nuevo (B1-LM69-C3-0126).
// `grupos` es la lista que viene de useAdminDashboard().data.grupos
function siguienteConsecutivo(grupos) {
  let max = 0;
  (grupos || []).forEach(g => {
    const c = g.code || '';
    // Nuevo formato: ...-NNYY al final
    let m = c.match(/-(\d{2})(\d{2})$/);
    if (m) { const n = parseInt(m[1], 10); if (n > max) max = n; return; }
    // Viejo formato: G0033-2026
    m = c.match(/G0*(\d+)-\d{4}/);
    if (m) { const n = parseInt(m[1], 10); if (n > max) max = n; }
  });
  return (max + 1).toString().padStart(2, '0');
}

// Genera el código de grupo: NIVEL-DIASHORA-PERIODO-CONSECYY
// Ej: B1-LM69-C3-0126
function generarCodigoGrupo(form, grupos) {
  const nivel    = (form.niveles?.[0] || 'b1').toUpperCase();
  const diasCod  = DIAS_CODIGO[form.dias] || 'XX';
  const horaCod  = HORA_CODIGO[form.horaInicio] || form.horaInicio.replace(':','').slice(0,2);
  const periodo  = periodoFromFecha(form.fechaInicio, form.modalidad) || 'C1';
  const consec   = siguienteConsecutivo(grupos);
  const año      = form.fechaInicio
    ? String(new Date(form.fechaInicio).getFullYear()).slice(-2)
    : String(new Date().getFullYear()).slice(-2);
  return { code: `${nivel}-${diasCod}${horaCod}-${periodo}-${consec}${año}`, consec, periodo, año };
}

// Tipo de lección según número
function tipoLeccion(n) {
  if ([9,17,25,31].includes(n)) return 'oral';
  if ([18,32].includes(n)) return 'escrito';
  if ([4,8,13,16,21,24,28,30].includes(n)) return 'progress';
  return 'normal';
}

// Avanzar al siguiente día hábil (sin feriados, dentro de los días del grupo)
function nextClassDay(fecha, diasSemana) {
  const d = new Date(fecha);
  d.setDate(d.getDate() + 1);
  for (let i = 0; i < 60; i++) {
    const iso = d.toISOString().slice(0,10);
    if (diasSemana.includes(d.getDay()) && !FERIADOS_CR_2026.has(iso)) return new Date(d);
    d.setDate(d.getDate() + 1);
  }
  return d;
}

// Generar cronograma de 32 lecciones
function generarCronograma(fechaInicio, diasSemana) {
  const lecciones = [];
  let cur = new Date(fechaInicio);
  // Encontrar primer día hábil válido desde fechaInicio
  while (!diasSemana.includes(cur.getDay()) || FERIADOS_CR_2026.has(cur.toISOString().slice(0,10))) {
    cur.setDate(cur.getDate() + 1);
  }
  for (let n = 1; n <= 32; n++) {
    lecciones.push({ n, fecha: new Date(cur), tipo: tipoLeccion(n) });
    cur = nextClassDay(cur, diasSemana);
  }
  return lecciones;
}

// Días de la semana según texto
function parseDias(str) {
  const m = { 'dom':0,'lun':1,'mar':2,'mié':3,'mie':3,'jue':4,'vie':5,'sáb':6,'sab':6 };
  const lower = str.toLowerCase();
  return Object.keys(m).filter(k => lower.includes(k)).map(k => m[k]);
}

const fmtCR = (d) => {
  if (!d) return '—';
  return d.toLocaleDateString('es-CR',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
};
const fmtMes = (d) => d ? d.toLocaleDateString('es-CR',{day:'numeric',month:'short'}) : '—';
const fmtMoney = (n) => '₡' + (n||0).toLocaleString('es-CR');

// Fechas de inicio válidas (primero de cada período, no feriado)
function fechasValidas(modalidad) {
  const year = 2026;
  const candidatos = modalidad === 'super_intensivo'
    ? [ // Inicio de bimestre
        new Date(year,0,5), new Date(year,2,2), new Date(year,4,4),
        new Date(year,6,6), new Date(year,8,1), new Date(year,10,2),
      ]
    : [ // Inicio de cuatrimestre
        new Date(year,0,5), new Date(year,4,4), new Date(year,8,1),
      ];
  return candidatos.filter(d => !FERIADOS_CR_2026.has(d.toISOString().slice(0,10)));
}

  const [form, setForm] = React.useState(initState());
  const [errors, setErrors]     = React.useState({});
  const [guardando, setGuardando] = React.useState(false);

  const nCuotas = form.modalidad === 'super_intensivo' ? 2 : 4;

  // Resumen financiero
  const descuento = form.beca === 'impacta' ? 0.25 : form.beca === 'mujer' ? 0.50 : form.beca === 'custom' ? (form.becaCustomPct/100) : 0;
  const matBase = form.matriculaObligatoria ? form.matricula : 0;
  const cuotasBase = form.cuota * nCuotas;
  const matFinal = Math.round(matBase * (1 - descuento));
  const cuotasFinal = Math.round(cuotasBase * (1 - descuento));
  const totalNivel = matFinal + cuotasFinal;
  const nNiveles = form.niveles.length;
  const certTotal = form.niveles.reduce((s,k) => s + (form.certificadosPorNivel[k]||0), 0)
    + (nNiveles === 4 ? form.certificadoPrograma : 0);
  const totalPrograma = totalNivel * nNiveles + certTotal;

  // Validación por paso
  const validate = () => {
    const e = {};
    if (step === 1) {
      if (!form.nivel) e.nivel = 'Selecciona un nivel';
      if (!form.modalidad) e.modalidad = 'Selecciona modalidad';
    }
    if (step === 2) {
      if (!form.dias) e.dias = 'Selecciona días';
      if (!form.fechaInicio) e.fechaInicio = 'Selecciona fecha de inicio';
    }
    if (step === 3) {
      if (!form.docente) e.docente = 'Selecciona un docente';
    }
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const next = () => {
    if (!validate()) return;
    if (step === 4) {
      // Generate cronograma
      if (form.fechaInicio) {
        const dias = parseDias(form.dias);
        const cr = generarCronograma(new Date(form.fechaInicio), dias.length ? dias : [1,3]);
        set('cronograma', cr);

    if (step < 6) setStep(s => s + 1);

  const prev = () => { if (step > 1) setStep(s => s - 1); };

  const confirmar = async () => {
    if (!form.confirmado || guardando) return;
    const { code, consec, periodo } = generarCodigoGrupo(form, grupos);
    const docenteObj = DOCENTES_ACTIVOS.find(d => d.id === form.docente);

    // Intentar guardar en Apps Script con timeout de 5 s
    setGuardando(true);
    try {
      const controller = new AbortController();
      const tid = setTimeout(() => controller.abort(), 5000);
      const res = await fetch(`${SCRIPT_URL_AV}?fn=crearGrupo`, {
        method: 'POST',
        body: JSON.stringify({
          codigo_grupo:   code,
          docente:        docenteObj?.nombre || '—',
          modalidad:      form.modalidad,
          dias:           form.dias,
          hora_inicio:    form.horaInicio,
          fecha_inicio:   form.fechaInicio,
          periodo_inicio: periodo,
          programa:       form.modelo === 'ina' ? 'CON_INA' : 'SIN_INA',
          activo:         true,
          capacidad:      form.capacidad || 40,
          // Campos adicionales requeridos por la hoja
          nivel_inicio:   (form.niveles[0] || 'b1').toUpperCase(),
          tipo_periodo:   form.modalidad === 'super_intensivo' ? 'B' : 'C',
          año_inicio:     form.fechaInicio ? new Date(form.fechaInicio).getFullYear() : new Date().getFullYear(),
          dias_sem:       form.modalidad === 'super_intensivo'
                            ? 4
                            : (form.dias.includes('Sáb') ? 1 : 2),
          hora_fin:       form.horaInicio === '06:00' ? '21:00' : '16:00',
          consecutivo:    parseInt(consec, 10),
        }),
        signal: controller.signal,
      });
      clearTimeout(tid);
      const data = await res.json();
      if (!data.ok) setAvisoManual(true);
    } catch(_) {
      setAvisoManual(true);
    } finally {
      setGuardando(false);
    }

    onCrear(code);
    onClose();
  };

  const STEPS_LABELS = ['Tipo y nivel','Horario','Docente','Precios','Cronograma','Confirmación'];

  return (
    <div style={{
      position:'fixed', inset:0, background:'rgba(10,8,20,0.7)', zIndex:300,

      <div style={{
        background:'var(--surface)', borderRadius:'var(--r-xl)',
        width:'100%', maxWidth:980, maxHeight:'90vh',
        display:'flex', flexDirection:'column',
        boxShadow:'0 24px 80px rgba(0,0,0,0.4)',
        overflow:'hidden',
      }}>
        {/* Header */}
        <div style={{
          padding:'18px 28px', borderBottom:'1px solid var(--line)',
          display:'flex', alignItems:'center', justifyContent:'space-between', flexShrink:0,
          background: `linear-gradient(135deg, color-mix(in srgb, ${nivel.color} 8%, white) 0%, var(--surface) 100%)`,

                {STEPS_LABELS[step-1]}

                background: i+1 < step ? 'var(--ok)' : i+1===step ? nivel.color : 'var(--line-2)',

            {STEPS_LABELS.map((l, i) => (

            ))}

            {/* Mini summary sidebar */}
            {step >= 2 && (
              <div style={{ marginTop:18, padding:12, background:'var(--surface)', borderRadius:'var(--r-md)', border:'1px solid var(--line)' }}>
                <div style={{ fontSize:9, fontWeight:700, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--ink-3)', marginBottom:8 }}>Resumen</div>
                {[
                  [nivel.nombre, nivel.emoji],
                  [form.modalidad==='super_intensivo'?'Súper Intensivo':'Intensivo', '⚡'],
                  [form.modelo==='ina'?'Con INA':'Sin INA', '📋'],
                  form.fechaInicio && [fmtMes(new Date(form.fechaInicio)), '📅'],

              matFinal={matFinal} cuotasFinal={cuotasFinal} descuento={descuento} />}
            {step===5 && <Step5 form={form} set={set} nivel={nivel} />}
