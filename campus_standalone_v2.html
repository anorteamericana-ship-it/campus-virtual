<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Virtual · Academia Norteamericana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ========================================================================
   Academia Norteamericana — Design Tokens
   ======================================================================== */
:root {
  /* Brand — extracted from logos & ads */
  --an-granate: #8B1E3F;          /* logo A dark red */
  --an-granate-ink: #5C1229;       /* darker for text on light */
  --an-red: #D32F2F;               /* bold accent red (ads) */
  --an-red-bright: #E11D2E;
  --an-navy: #0C2D5C;              /* Academia wordmark blue */
  --an-navy-ink: #061735;
  --an-gold: #E5A823;              /* CONAPE gold — secondary accent */
  --an-gold-soft: #F4C860;

  /* Neutrals — warm cream, not black */
  --bg:        #F7F3EC;            /* page background */
  --bg-deep:   #EEE8DC;            /* sunken */
  --surface:   #FFFFFF;            /* cards */
  --surface-2: #FBF8F2;            /* soft cards */
  --ink:       #1A1613;            /* primary text */
  --ink-2:     #4A413A;            /* secondary text */
  --ink-3:     #8B8178;            /* tertiary / labels */
  --line:      #E8DFD2;            /* borders */
  --line-2:    #D4C9B6;

  /* Interchange level tokens (consistent with calendar) */
  --lvl-basic1: #E5A823;           /* yellow / intro */
  --lvl-basic2: #E8372A;           /* red / book 1 */
  --lvl-inter1: #2B7FC1;           /* blue / book 2 */
  --lvl-inter2: #4CAF50;           /* green / book 3 */

  /* Semantic */
  --ok:     #2E7D32;
  --warn:   #C67100;
  --danger: #B3261E;
  --info:   #0C447C;

  /* Radius, shadow */
  --r-xs: 6px;
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 28px;
  --r-pill: 999px;

  --sh-1: 0 1px 2px rgba(26,22,19,0.06), 0 2px 6px rgba(26,22,19,0.04);
  --sh-2: 0 2px 4px rgba(26,22,19,0.06), 0 12px 24px -8px rgba(26,22,19,0.10);
  --sh-3: 0 8px 40px -12px rgba(26,22,19,0.18);
  --sh-press: inset 0 -3px 0 rgba(0,0,0,0.12);

  /* Type */
  --f-serif: 'Fraunces', 'DM Serif Display', Georgia, serif;
  --f-sans:  'Plus Jakarta Sans', -apple-system, 'Inter', system-ui, sans-serif;
  --f-mono:  'JetBrains Mono', 'Courier New', monospace;
}

</style>
<style>
/* ========================================================================
   Campus — Global styles
   ======================================================================== */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--f-sans);
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; color: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }

/* ── APP SHELL ───────────────────────────────────────────────────────────── */
.app {
  display: grid;
  grid-template-columns: 260px 1fr;
  min-height: 100vh;
}
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
}

/* ── SIDEBAR ─────────────────────────────────────────────────────────────── */
.sb {
  background: var(--surface);
  border-right: 1px solid var(--line);
  padding: 20px 16px 16px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.sb-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 8px 14px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 8px;
}
.sb-logo {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: white;
  background-image: url('../assets/logo_circular.jpg');
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
  flex-shrink: 0;
}
.sb-brand-text { line-height: 1.15; }
.sb-brand-t1 {
  font-family: var(--f-serif);
  font-weight: 700;
  font-size: 16px;
  color: var(--an-navy-ink);
  letter-spacing: -0.02em;
}
.sb-brand-t2 {
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-top: 2px;
}

.sb-role-switch {
  background: var(--bg-deep);
  border-radius: var(--r-md);
  padding: 4px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2px;
  margin-bottom: 6px;
}
.sb-role-switch button {
  border: none;
  background: transparent;
  padding: 8px 4px;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-2);
  border-radius: 10px;
  letter-spacing: 0.01em;
  transition: all .18s;
}
.sb-role-switch button.active {
  background: var(--an-navy);
  color: white;
  box-shadow: var(--sh-1);
}

.sb-section {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-3);
  padding: 14px 12px 6px;
}

.sb-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: var(--r-md);
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-2);
  cursor: pointer;
  border: none;
  background: transparent;
  text-align: left;
  width: 100%;
  transition: all .15s;
  position: relative;
}
.sb-item:hover { background: var(--bg-deep); color: var(--ink); }
.sb-item.active {
  background: var(--an-granate);
  color: white;
  font-weight: 600;
  box-shadow: var(--sh-1);
}
.sb-item.active .sb-icon { color: white; }
.sb-icon {
  width: 20px; height: 20px;
  flex-shrink: 0;
  color: var(--ink-3);
  stroke-width: 2;
}
.sb-item:hover .sb-icon { color: var(--an-granate); }
.sb-badge {
  margin-left: auto;
  background: var(--an-red);
  color: white;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: var(--r-pill);
  min-width: 18px;
  text-align: center;
}
.sb-item.active .sb-badge {
  background: white;
  color: var(--an-granate);
}

.sb-user {
  margin-top: auto;
  background: var(--bg-deep);
  border-radius: var(--r-md);
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.sb-avatar {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--an-granate);
  color: white;
  font-weight: 700;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  border: 2px solid white;
}
.sb-user-t1 { font-size: 13px; font-weight: 700; color: var(--ink); line-height: 1.2; }
.sb-user-t2 { font-size: 11px; color: var(--ink-3); }

/* ── MAIN PANEL ──────────────────────────────────────────────────────────── */
.main {
  padding: 28px 36px 64px;
  max-width: 1400px;
  width: 100%;
}
@media (max-width: 900px) {
  .main { padding: 16px 14px 40px; }
  .sb { position: fixed; top: 0; left: 0; right: 0; bottom: auto; height: auto; z-index: 20; flex-direction: row; gap: 8px; padding: 10px; overflow-x: auto; }
  .sb-brand { border: none; padding: 0; margin: 0; flex-shrink: 0; }
  .sb-brand-text { display: none; }
  .sb-role-switch { flex-shrink: 0; }
  .sb-section, .sb-user { display: none; }
  .sb-item { padding: 8px 10px; font-size: 12px; flex-shrink: 0; }
  .sb-item .sb-label { display: none; }
  .app { padding-top: 74px; }
}

/* ── HEADER / HERO ───────────────────────────────────────────────────────── */
.hero {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  padding: 28px 32px;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}
.hero-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 32px;
  align-items: center;
}
@media (max-width: 800px) { .hero-grid { grid-template-columns: 1fr; } }

.hero-kicker {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--an-granate);
  display: flex;
  align-items: center;
  gap: 8px;
}
.hero-kicker::before {
  content: "";
  width: 24px; height: 2px;
  background: var(--an-granate);
  display: inline-block;
}
.hero-h1 {
  font-family: var(--f-serif);
  font-weight: 400;
  font-size: 48px;
  line-height: 1.02;
  letter-spacing: -0.035em;
  color: var(--an-navy-ink);
  margin: 12px 0 4px;
}
.hero-h1 em {
  font-style: italic;
  font-weight: 500;
  color: var(--an-granate);
}
.hero-sub {
  font-size: 14px;
  color: var(--ink-2);
  margin-bottom: 18px;
}

/* Ring progress (big circular) */
.ring-wrap {
  position: relative;
  width: 220px; height: 220px;
  margin: 0 auto;
}
.ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-track { fill: none; stroke: var(--bg-deep); stroke-width: 14; }
.ring-prog  { fill: none; stroke: var(--an-granate); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1); }
.ring-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.ring-pct {
  font-family: var(--f-serif);
  font-weight: 500;
  font-size: 56px;
  line-height: 1;
  color: var(--ink);
  letter-spacing: -0.04em;
}
.ring-pct sup { font-size: 20px; color: var(--ink-3); margin-left: 2px; font-weight: 400; vertical-align: top; top: 8px; position: relative; }
.ring-label {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-top: 4px;
  font-weight: 600;
}

/* Level book spine */
.level-spine {
  display: inline-flex;
  align-items: center;
  gap: 0;
  background: var(--bg-deep);
  border-radius: var(--r-md);
  padding: 5px;
}
.level-spine span {
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 700;
  border-radius: 8px;
  color: var(--ink-3);
  letter-spacing: 0.01em;
}
.level-spine span.on { background: var(--lvl-basic1); color: white; box-shadow: var(--sh-1); }

/* ── CARD SYSTEM ─────────────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 20px;
}
.card-h {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.card-title {
  font-family: var(--f-serif);
  font-weight: 500;
  font-size: 20px;
  color: var(--ink);
  letter-spacing: -0.02em;
}
.card-title small {
  font-family: var(--f-sans);
  font-size: 11px;
  color: var(--ink-3);
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-left: 8px;
}

.bento {
  display: grid;
  gap: 16px;
}

/* stat card — big numeral, serif */
.stat {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 18px 20px;
  position: relative;
  overflow: hidden;
  transition: transform .2s, box-shadow .2s;
}
.stat:hover { transform: translateY(-2px); box-shadow: var(--sh-2); }
.stat-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.stat-num {
  font-family: var(--f-serif);
  font-weight: 500;
  font-size: 42px;
  line-height: 1;
  margin: 6px 0 4px;
  letter-spacing: -0.04em;
  color: var(--ink);
}
.stat-num em {
  font-style: normal;
  font-size: 22px;
  color: var(--ink-3);
  font-weight: 400;
  margin-left: 2px;
}
.stat-sub { font-size: 12px; color: var(--ink-2); }
.stat-sub.ok   { color: var(--ok); font-weight: 600; }
.stat-sub.warn { color: var(--warn); font-weight: 600; }
.stat-sub.bad  { color: var(--danger); font-weight: 600; }

.stat-bar { height: 4px; border-radius: 2px; background: var(--bg-deep); margin-top: 10px; overflow: hidden; }
.stat-bar > div { height: 100%; border-radius: 2px; transition: width 1s cubic-bezier(.22,1,.36,1); }

/* Pill / Chip */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: var(--r-pill);
  letter-spacing: 0.02em;
}
.chip-granate { background: color-mix(in srgb, var(--an-granate) 12%, white); color: var(--an-granate-ink); }
.chip-navy    { background: color-mix(in srgb, var(--an-navy) 10%, white); color: var(--an-navy-ink); }
.chip-gold    { background: color-mix(in srgb, var(--an-gold) 18%, white); color: #6B4A00; }
.chip-green   { background: #E2F1E5; color: var(--ok); }
.chip-red     { background: #FCE6E4; color: var(--danger); }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  padding: 9px 16px;
  border-radius: var(--r-md);
  border: 1px solid transparent;
  background: var(--surface);
  color: var(--ink);
  transition: all .15s;
  letter-spacing: 0.01em;
}
.btn:hover { transform: translateY(-1px); }
.btn-primary { background: var(--an-granate); color: white; border-color: var(--an-granate); box-shadow: var(--sh-1); }
.btn-primary:hover { background: var(--an-granate-ink); }
.btn-navy    { background: var(--an-navy); color: white; border-color: var(--an-navy); }
.btn-ghost   { background: transparent; border-color: var(--line); color: var(--ink-2); }
.btn-ghost:hover { border-color: var(--ink-3); color: var(--ink); }
.btn-icon { padding: 9px 11px; }

/* ── Grids ───────────────────────────────────────────────────────────────── */
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.grid-2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 20px; }
@media (max-width: 1000px) {
  .grid-3, .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .grid-2 { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .hero-h1 { font-size: 34px; }
  .hero { padding: 20px; }
}

/* ── Class timeline (vertical roadmap) ───────────────────────────────────── */
.timeline { position: relative; padding-left: 30px; }
.timeline::before {
  content: "";
  position: absolute;
  left: 11px; top: 8px; bottom: 8px;
  width: 2px;
  background: repeating-linear-gradient(to bottom, var(--line-2) 0 4px, transparent 4px 10px);
}
.t-item { position: relative; padding: 10px 0 14px; }
.t-item::before {
  content: "";
  position: absolute;
  left: -25px; top: 14px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--bg);
  border: 2px solid var(--line-2);
}
.t-item.done::before { background: var(--ok); border-color: var(--ok); }
.t-item.next::before {
  background: var(--an-granate); border-color: var(--an-granate);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--an-granate) 20%, transparent);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--an-granate) 20%, transparent); }
  50%      { box-shadow: 0 0 0 9px color-mix(in srgb, var(--an-granate) 0%, transparent); }
}
.t-item.exam::before { background: var(--an-gold); border-color: var(--an-gold); }
.t-date {
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-3);
  font-family: var(--f-mono);
}
.t-title {
  font-size: 15px; font-weight: 600;
  color: var(--ink); margin-top: 2px;
}
.t-sub { font-size: 12px; color: var(--ink-2); margin-top: 2px; }

/* ── Cards: Next class wide ──────────────────────────────────────────────── */
.next-class {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 18px;
  align-items: center;
  background: linear-gradient(135deg, var(--an-navy) 0%, #1A3E75 100%);
  color: white;
  border-radius: var(--r-lg);
  padding: 20px 24px;
  position: relative;
  overflow: hidden;
}
.next-class::after {
  content: "";
  position: absolute;
  right: -60px; bottom: -60px;
  width: 260px; height: 260px;
  background: var(--an-granate);
  border-radius: 50%;
  opacity: 0.14;
}
.nc-date-box {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: var(--r-md);
  width: 76px;
  text-align: center;
  padding: 10px 6px;
  backdrop-filter: blur(6px);
}
.nc-day { font-family: var(--f-serif); font-size: 36px; font-weight: 500; line-height: 1; letter-spacing: -0.03em; }
.nc-month { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.75; margin-top: 2px; }
.nc-kicker { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.7; }
.nc-title { font-family: var(--f-serif); font-size: 22px; font-weight: 500; line-height: 1.2; letter-spacing: -0.01em; margin-top: 3px; }
.nc-meta { font-size: 12px; opacity: 0.8; margin-top: 4px; }

/* ── ICAN Sessions ───────────────────────────────────────────────────────── */
.ican-card {
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 14px;
  background: var(--surface);
  transition: all .2s;
  cursor: pointer;
}
.ican-card:hover { border-color: var(--an-gold); transform: translateY(-1px); box-shadow: var(--sh-1); }
.ican-card.enrolled {
  background: color-mix(in srgb, var(--an-gold) 10%, white);
  border-color: var(--an-gold);
}
.ican-card.full { opacity: 0.55; cursor: not-allowed; }

/* ── Tabla suave ─────────────────────────────────────────────────────────── */
.table-soft {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 13px;
}
.table-soft th {
  text-align: left;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-2);
}
.table-soft td {
  padding: 12px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
.table-soft tr:hover td { background: var(--surface-2); }
.table-soft tr:last-child td { border-bottom: none; }

/* ── Toast ───────────────────────────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--ink);
  color: white;
  padding: 12px 22px;
  border-radius: var(--r-pill);
  font-size: 13px;
  font-weight: 500;
  box-shadow: var(--sh-3);
  z-index: 100;
  transition: transform .3s cubic-bezier(.22,1,.36,1);
  display: flex;
  align-items: center;
  gap: 10px;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ── Progress dots (mini tracker) ─────────────────────────────────────────── */
.dots { display: flex; gap: 4px; }
.dots span {
  width: 14px; height: 4px; border-radius: 2px;
  background: var(--line-2);
}
.dots span.done { background: var(--ok); }
.dots span.now  { background: var(--an-granate); }

/* ── Tabs ────────────────────────────────────────────────────────────────── */
.tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 20px;
  overflow-x: auto;
}
.tab {
  padding: 12px 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-3);
  border: none;
  background: transparent;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  white-space: nowrap;
  transition: all .15s;
}
.tab:hover { color: var(--ink); }
.tab.active { color: var(--an-granate); border-bottom-color: var(--an-granate); }

/* ── Module cards (Interchange books grid) ───────────────────────────────── */
.book-card {
  border-radius: var(--r-lg);
  padding: 20px;
  color: white;
  position: relative;
  overflow: hidden;
  min-height: 140px;
  cursor: pointer;
  transition: transform .2s;

// ── Day pattern parsing: 'Mar/Jue 6–9pm' → [2,4] ────────────────────────
// 0=dom, 1=lun, 2=mar, 3=mié, 4=jue, 5=vie, 6=sáb
const DAY_MAP = { 'dom':0, 'lun':1, 'mar':2, 'mié':3, 'mie':3, 'jue':4, 'vie':5, 'sáb':6, 'sab':6 };
function parseScheduleDays(sch) {
  const days = [];
  const norm = sch.toLowerCase().replace(/[–—-]/g, '-');
  Object.keys(DAY_MAP).forEach(k => { if (norm.includes(k)) days.push(DAY_MAP[k]); });
  return [...new Set(days)].sort((a,b)=>a-b);
}

// Add days to a date, advancing by scheduled weekdays only
function addLessonDays(startDate, weekdays, lessonIdx) {
  // lessonIdx=0 returns startDate if startDate is on a weekday
  const d = new Date(startDate.getTime());
  let count = 0;
  while (true) {
    if (weekdays.includes(d.getDay())) {
      if (count === lessonIdx) return new Date(d.getTime());
      count++;
    }
    d.setDate(d.getDate() + 1);
  }
}

// ── Build group schedule: spread syllabus over real dates ────────────────
// group: { scheduleDays: 'Mar/Jue 6–9pm', startDate: '2026-05-05' }
// suspensions: [{ lessonN, action:'suspended'|'rescheduled', newDate?, reason, by, detail }]
function buildGroupSchedule(levelId, group, suspensions = []) {
  const syl = SYLLABUS_BY_LEVEL[levelId];
  if (!syl) return [];
  const weekdays = parseScheduleDays(group.scheduleDays || 'Lun/Mié');
  const start = new Date(group.startDate + 'T00:00:00');

  // 1) base scheduled dates — 32 lessons, skip I CAN (I CAN is separate stream)
  const items = [];
  for (let i = 0; i < syl.lessons.length; i++) {
    const les = syl.lessons[i];
    const date = addLessonDays(start, weekdays, i);
    items.push({
      ...les,
      baseDate: date,
      date: new Date(date.getTime()),  // may change via suspensions
      status: 'scheduled',              // scheduled | done | suspended | rescheduled
      suspension: null,
    });
  }

  // 2) apply suspensions (in order)
  suspensions.forEach(s => {
    const idx = items.findIndex(x => x.n === s.lessonN);
    if (idx < 0) return;
    if (s.action === 'suspended' && !s.newDate) {
      // cascade: push this and subsequent lessons to next scheduled weekday
      // simpler: bump each following lesson to the next weekday slot
      for (let j = idx; j < items.length; j++) {
        const cur = items[j];
        // advance by 1 weekday slot
        const d = new Date(cur.date.getTime());
        d.setDate(d.getDate() + 1);
        while (!weekdays.includes(d.getDay())) d.setDate(d.getDate() + 1);
        items[j].date = d;
      }
      items[idx].status = 'suspended';
      items[idx].suspension = s;
    } else if (s.action === 'rescheduled' && s.newDate) {
      // moved to a specific new date; subsequent lessons stay
      items[idx].date = new Date(s.newDate + 'T00:00:00');
      items[idx].status = 'rescheduled';
      items[idx].suspension = s;
    }
    if (s.action === 'done') items[idx].status = 'done';
  });

  return items;
}

function Icon({ name, size = 20, stroke = 2, className = 'sb-icon' }) {
  const d = ICONS[name];
  if (!d) return null;
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" className={className}>
      <path d={d} />
    </svg>
  );
}

// Ring progress (SVG)
function Ring({ pct = 0, size = 220, stroke = 14, label = 'Progreso', children }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const off = c * (1 - pct / 100);
  return (
    <div className="ring-wrap" style={{ width: size, height: size }}>
      <svg viewBox={`0 0 ${size} ${size}`}>
        <circle className="ring-track" cx={size/2} cy={size/2} r={r} />
        <circle className="ring-prog"  cx={size/2} cy={size/2} r={r}
          strokeDasharray={c} strokeDashoffset={off} />
      </svg>
      <div className="ring-center">
        {children || <>
          <div className="ring-pct">{pct}<sup>%</sup></div>
          <div className="ring-label">{label}</div>
        </>}
      </div>
    </div>
  );
}

function Toast({ msg, onClose }) {
  useEffect(() => {
    if (!msg) return;
    const t = setTimeout(onClose, 2800);
    return () => clearTimeout(t);
  }, [msg, onClose]);
  return <div className={`toast ${msg ? 'show' : ''}`}>{msg}</div>;
}

function AnimatedBar({ pct, color = 'var(--an-granate)' }) {
  const [w, setW] = useState(0);
  useEffect(() => {
    const t = setTimeout(() => setW(pct), 100);
    return () => clearTimeout(t);
  }, [pct]);
  return (
    <div className="stat-bar">
      <div style={{ width: `${w}%`, background: color }} />
    </div>
  );
}

function Stat({ label, num, suffix, sub, subTone, pct, color }) {
  return (
    <div className="stat">
      <div className="stat-label">{label}</div>
      <div className="stat-num">{num}{suffix && <em>{suffix}</em>}</div>
      {sub && <div className={`stat-sub ${subTone || ''}`}>{sub}</div>}
      {pct != null && <AnimatedBar pct={pct} color={color} />}
    </div>
  );
}

function Chip({ tone = 'granate', children, dot }) {
  return <span className={`chip chip-${tone}`}>
    {dot && <i style={{ width: 6, height: 6, borderRadius: '50%', background: 'currentColor' }} />}
    {children}
  </span>;
}

    if (usr?.codigo) return String(usr.codigo);
  } catch {}
  return typeof STUDENT !== 'undefined' ? String(STUDENT.rec_m) : '17055';

function calcularAcceso(datosReales) {
  if (!datosReales) return { nivel: 'sin_acceso', leccionesDesbloqueadas: [] };
  const convenio = datosReales?.estudiante?.CONVENIO || '';
  const grupoActual = datosReales?.grupo?.CODIGO_GRUPO || '';
  const todosLosPagos = datosReales?.pagos || [];
  // Solo contar pagos del grupo actual (nivel activo)
  const pagos = todosLosPagos.filter(p =>
    !grupoActual || String(p.grupo || '').trim() === grupoActual
  );
  const otros    = datosReales?.otrosPagos || [];

  // CONAPE — acceso completo
  if (convenio === 'CONAPE') {
    return { nivel: 'completo', leccionesDesbloqueadas: Array.from({length:32},(_,i)=>i+1) };
  }

  // Verificar matrícula pagada
  const tieneMatricula = otros.some(p => String(p.descripcion || '').toUpperCase().includes('MATRICULA'));
  if (!tieneMatricula) return { nivel: 'sin_acceso', leccionesDesbloqueadas: [] };

  // Cuatrimestre completo — 4+ cuotas pagadas
  if (pagos.length >= 4) {
    return { nivel: 'completo', leccionesDesbloqueadas: Array.from({length:32},(_,i)=>i+1) };
  }

  // Por cuota — cada cuota habilita 8 lecciones aprox
  const cuotasPagadas = pagos.length;
  if (cuotasPagadas === 0) {
    // Solo matrícula → lecciones 1 y 2
    return { nivel: 'matricula', leccionesDesbloqueadas: [1, 2] };
  }
  const hasta = Math.min(cuotasPagadas * 8, 32);
  return {
    nivel: 'parcial',
    leccionesDesbloqueadas: Array.from({length: hasta}, (_, i) => i + 1),
    cuotasPagadas,
  };
}

function estaDesbloqueada(leccionNum, acceso) {
  if (!acceso) return false;
  if (acceso.nivel === 'completo') return true;
  return acceso.leccionesDesbloqueadas.includes(Number(leccionNum));
}

function useEstadoConape(cedula) {
  const [estado, setEstado] = React.useState(null);
  const [loading, setLoading] = React.useState(false);
  React.useEffect(() => {
    if (!cedula) return;
    setLoading(true);
    fetch(`${SCRIPT_URL_SD}?fn=getEstadoConape&cedula=${encodeURIComponent(cedula)}`)
      .then(r => r.json())
      .then(d => { if (d.ok) setEstado(d); })
      .finally(() => setLoading(false));
  }, [cedula]);
  return { estado, loading };
}

// Mapea pagos reales del servidor al formato de LEVEL_FINANCE
function patchLevelFinance(baseFinance, pagos, otrosPagos, cuotaMensual) {
  if (!pagos && !otrosPagos && !cuotaMensual) return baseFinance;
  const todosPagos = [...(pagos||[]), ...(otrosPagos||[])];
  return baseFinance.map(level => {
    const niv = level.id?.toUpperCase(); // B1, B2, I1, I2
    const pagosNivel = todosPagos.filter(p =>
      (p.concepto||'').toUpperCase().includes(niv) ||
      (p.nivel||'').toUpperCase() === niv
    );
    const tieneMatricula = pagosNivel.some(p => (p.concepto||'').toLowerCase().includes('matr'));
    const tieneCert      = pagosNivel.some(p => (p.concepto||'').toLowerCase().includes('cert'));
    const cuotasPagadas  = pagosNivel.filter(p =>
      (p.concepto||'').toLowerCase().includes('cuota') ||
      (p.tipo||'').toLowerCase() === 'cuota'
    ).length;
    const montoBase = cuotaMensual || level.cuotas[0]?.amount || 74800;
    return {
      ...level,
      matricula: { ...level.matricula, status: tieneMatricula ? 'paid' : level.matricula.status },
      certificado: { ...level.certificado, status: tieneCert ? 'paid' : level.certificado.status },
      cuotas: level.cuotas.map((c, i) => ({
        ...c,
        amount: montoBase,
        status: i < cuotasPagadas ? 'paid' : c.status,
      })),
    };
  });
}

    .filter(g => g.type === 'prg')
    .sort((a,b) => a.lesson - b.lesson);

  const completed = GRADES_EVAL.filter(g => g.pct != null);
  const avg = completed.length ? (completed.reduce((a,g) => a + g.pct, 0) / completed.length).toFixed(1) : '—';
  const [filter, setFilter] = React.useState('all');

  return (
    <div>
      <PageHeader
        kicker="Mi rendimiento"
        title={<>Mis <em>Notas</em></>}
        sub="Historial completo de evaluaciones de Básico I · Interchange Intro"
      />

      <div className="grid-4" style={{ marginBottom: 24 }}>
        <Stat label="Promedio acumulado" num={avg} suffix="%" sub="A − Muy bueno" subTone="ok" pct={parseFloat(avg)||0} color="var(--an-granate)" />
        <Stat label="Asistencia" num="94" suffix="%" sub="17/18 clases" subTone="ok" pct={94} color="var(--ok)" />
        <Stat label="Evaluaciones hechas" num={completed.length} suffix={`/${GRADES_EVAL.length}`} sub={`Pendientes: ${GRADES_EVAL.length - completed.length}`} subTone="" pct={(completed.length/GRADES_EVAL.length)*100} color="var(--an-navy)" />
        <Stat label="Peor / Mejor" num="80" suffix="·100" sub="Margen sólido" subTone="" pct={100} color="var(--an-gold)" />
      </div>

      {/* Tabs — sin progress checks */}
      <div className="tabs">
        {[
          ['all', 'Todo'],
          ['oral', 'Orales'],
          ['esc', 'Escritos'],
        ].map(([k, l]) => (
          <button key={k} className={`tab ${filter===k?'active':''}`} onClick={() => setFilter(k)}>{l}</button>
        ))}
      </div>

      {/* Tabla de evaluaciones — sin progress checks, ordenada por lección */}
      <div className="card" style={{ padding: 0, overflow:'hidden' }}>
        <table className="table-soft">
          <thead>
            <tr>
              <th>Lec.</th>
              <th>Evaluación</th>
              <th>Fecha</th>
              <th style={{ textAlign:'right' }}>Puntaje</th>
              <th style={{ textAlign:'right' }}>%</th>
              <th>Peso</th>
              <th style={{ textAlign:'right' }}>Contribución</th>
              <th style={{ textAlign:'center' }}>Nota</th>
            </tr>
          </thead>
          <tbody>
            {GRADES_EVAL.filter(g => filter === 'all' || g.type === filter).map((g, i) => {
              const unlocked = acceso ? estaDesbloqueada(g.lesson, acceso) : true;
              if (!unlocked) {
                return (
                  <tr key={i} style={{ opacity:0.55 }}>
                    <td style={{ fontFamily:'var(--f-mono)', color:'var(--ink-3)' }}>L{String(g.lesson).padStart(2,'0')}</td>
                    <td colSpan={7} style={{ fontSize:12, color:'var(--ink-3)' }}>
                      🔒 Lección bloqueada · {acceso?.nivel === 'matricula' ? 'pagá tu primera cuota para desbloquear.' : 'pagá la siguiente cuota para continuar.'}
                    </td>
                  </tr>
                );
              }
              return (
                <tr key={i} style={{ opacity: g.status==='pending'?0.55:1 }}>
                  <td style={{ fontFamily:'var(--f-mono)', color:'var(--ink-3)' }}>L{String(g.lesson).padStart(2,'0')}</td>
                  <td>
                    <div style={{ fontWeight:600 }}>{g.title}</div>
                    <div style={{ fontSize:11, color:'var(--ink-3)' }}>{g.unit}</div>
                  </td>
                  <td style={{ fontSize:12, color:'var(--ink-2)' }}>{g.date}</td>
                  <td style={{ textAlign:'right', fontFamily:'var(--f-mono)' }}>{g.score!=null ? `${g.score}/${g.max}` : '—'}</td>
                  <td style={{ textAlign:'right', fontWeight:600 }}>{g.pct!=null ? `${g.pct}%` : '—'}</td>
                  <td><Chip tone="navy">{g.weight}</Chip></td>
                  <td style={{ textAlign:'right', fontFamily:'var(--f-mono)', color:'var(--ink-2)' }}>{g.final}</td>
                  <td style={{ textAlign:'center' }}>
                    <span style={{
                      display:'inline-flex', alignItems:'center', justifyContent:'center',
                      width:36, height:36, borderRadius:10,
                      background: g.pct!=null ? `color-mix(in srgb, ${gradeColor(g.grade)} 14%, white)` : 'var(--bg-deep)',
                      color: gradeColor(g.grade),
                      fontFamily:'var(--f-serif)', fontSize:16, fontWeight:600,
                    }}>{g.grade}</span>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* Progress Checks — sin nota, solo como referencia */}
      {GRADES_PROGRESS.length > 0 && (
        <div style={{ marginTop:24 }}>
          <div className="card-h" style={{ padding:'0 4px', marginBottom:10 }}>
            <div className="card-title">Progress Checks <small>Evaluación formativa · sin nota</small></div>
          </div>
          <div style={{ padding:'10px 14px', background:'color-mix(in srgb, var(--an-navy) 6%, white)', border:'1px solid color-mix(in srgb, var(--an-navy) 20%, white)', borderRadius:'var(--r-md)', fontSize:12, color:'var(--an-navy-ink)', marginBottom:10 }}>
            ℹ️ Los Progress Checks son evaluaciones formativas. <strong>No tienen nota</strong> — verifican el avance por unidades y reciben retroalimentación del docente.
          </div>
          {GRADES_PROGRESS.map((g, i) => (
            <div key={i} className="fb" style={{ marginBottom:8 }}>
              <div className="fb-meta">L{String(g.lesson).padStart(2,'0')} · {g.unit} · {g.date}</div>
              <div className="fb-text" style={{ color:'var(--ink-3)', fontStyle:'italic' }}>Sin retroalimentación registrada</div>
            </div>
          ))}
        </div>
      )}

      {/* Feedback del docente */}
      <div style={{ marginTop:24 }}>
        <div className="card-h" style={{ padding:'0 4px' }}>
          <div className="card-title">Retroalimentación del docente</div>
          <Chip tone="granate">{FEEDBACK.length} comentarios</Chip>
        </div>
        {FEEDBACK.map((f,i) => (
          <div key={i} className="fb">
            <div className="fb-meta">L{f.lesson} · {f.date} · {f.teacher}</div>
            <div className="fb-text">{f.text}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function ICANView({ toast }) {
  const [enrolled, setEnrolled] = React.useState(() => new Set(ICAN_SESSIONS.filter(s => s.enrolled).map(s => s.id)));

  const toggle = (s) => {
    if (s.seats === 0 && !enrolled.has(s.id)) { toast('Sesión llena'); return; }
    const next = new Set(enrolled);
    if (next.has(s.id)) { next.delete(s.id); toast('Reserva cancelada'); }
    else { next.add(s.id); toast(`Reservaste: ${s.topic}`); }
    setEnrolled(next);
  };

  return (
    <div>
      <PageHeader
        kicker="Club de conversación"
        title={<>Club <em>I CAN</em></>}
        sub="Sesiones semanales sin costo para practicar inglés en contexto real con otros estudiantes"
      />

      {/* Explainer strip */}
      <div style={{
        background: 'linear-gradient(135deg, #FCF6E5, #FBEEC9)',
        border: '1px solid var(--an-gold-soft)',
        borderRadius: 'var(--r-lg)',
        padding: '20px 24px',
        display: 'grid',
        gridTemplateColumns: 'repeat(4, 1fr)',
        gap: 16,
        marginBottom: 24,
      }}>
        {[
          ['8/9', 'Sesiones asistidas'],
          ['2h', 'Duración promedio'],
          ['Gratuito', 'Para matriculados'],
          ['Reserva', '24h antes'],
        ].map(([n,l], i) => (
          <div key={i}>
            <div style={{ fontFamily:'var(--f-serif)', fontSize:28, fontWeight:500, color:'var(--an-navy-ink)' }}>{n}</div>
            <div style={{ fontSize:11, fontWeight:700, letterSpacing:'0.12em', textTransform:'uppercase', color:'#6B4A00' }}>{l}</div>
          </div>
        ))}
      </div>

      <div className="card-h" style={{ padding:'0 4px' }}>
        <div className="card-title">Próximas sesiones</div>
        <Chip tone="gold">{enrolled.size} reservadas</Chip>
      </div>

      <div style={{ display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:14 }}>
        {ICAN_SESSIONS.map(s => {
          const isEnrolled = enrolled.has(s.id);
          const pct = (s.seats/s.cap)*100;
          return (
            <div key={s.id} className={`ican-card ${isEnrolled?'enrolled':''} ${s.seats===0?'full':''}`} onClick={() => toggle(s)}>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:10 }}>
                <div style={{ fontSize:11, fontWeight:700, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--an-granate)' }}>
                  {s.shift==='tarde'?'🌙':'☀️'} {s.day}
                </div>
                {isEnrolled && <Chip tone="gold" dot>Reservada</Chip>}
              </div>
              <div style={{ fontFamily:'var(--f-serif)', fontSize:18, fontWeight:500, lineHeight:1.2, color:'var(--ink)' }}>
                {s.topic}
              </div>
              <div style={{ fontSize:12, color:'var(--ink-2)', marginTop:4 }}>
                {s.time} · {s.teacher}
              </div>
              <div style={{ marginTop:12, paddingTop:10, borderTop:'1px solid var(--line)', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <div style={{ fontSize:11, color:'var(--ink-3)' }}>
                  <strong style={{ color:'var(--ink)' }}>{s.seats}</strong> / {s.cap} cupos
                </div>
                <div style={{ width:70, height:4, background:'var(--bg-deep)', borderRadius:2, overflow:'hidden' }}>
                  <div style={{ width:`${100-pct+(s.seats/s.cap)*0}%`, height:'100%', background: pct < 25 ? 'var(--danger)' : pct < 50 ? 'var(--warn)' : 'var(--ok)' }} />
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

  );
}

// ── A single LEVEL BLOCK — matrícula + cuotas + certificado ───────────────
function LevelFinanceCard({ level, showAmounts, expanded, onToggle }) {
  const fmt = (n) => '₡' + n.toLocaleString('es-CR');
  const mask = (n) => showAmounts ? fmt(n) : '₡ • • •';

  // counts
  const conceptsPaid = (level.matricula.status === 'paid' ? 1 : 0)
                     + level.cuotas.filter(c => c.status === 'paid').length
                     + (level.certificado.status === 'paid' ? 1 : 0);
  const conceptsTotal = 2 + level.cuotas.length; // mat + cuotas + cert
  const conceptsPending = (level.matricula.status === 'pending' ? 1 : 0)
                        + level.cuotas.filter(c => c.status === 'pending' || c.status === 'upcoming').length
                        + (level.certificado.status === 'pending' ? 1 : 0);

  const levelIsLocked = level.status === 'locked';

  // headline line: status-aware, NO big amount
  let headline;
  if (level.status === 'completed') {
    headline = <>Nivel <strong>aprobado</strong> y al día. Felicidades.</>;
  } else if (level.status === 'current') {
    if (conceptsPending === 0) headline = <>Al día en este nivel.</>;
    else headline = <><strong>{conceptsPending} cuota{conceptsPending>1?'s':''}</strong> por cubrir este ciclo.</>;
  } else if (level.status === 'next') {
    headline = <>Matrícula abierta · <strong>reserva tu cupo</strong> antes de que inicie.</>;
  } else {
    headline = <>Se habilita al aprobar el nivel anterior.</>;
  }

  // CTA
  let cta = null;
  if (level.matricula.status === 'pending' && level.status === 'next') {
    cta = <button className="btn btn-primary" style={{ fontSize:13 }}>Matricular Nivel →</button>;
  } else if (level.status === 'current' && conceptsPending > 0) {
    cta = <button className="btn btn-primary" style={{ fontSize:13 }}>
      <Icon name="payments" size={14} className="" /> Pagar próxima cuota
    </button>;
  }

  return (
    <div className="card" style={{
      padding: 0,
      overflow: 'hidden',
      opacity: levelIsLocked ? 0.62 : 1,
      borderColor: level.status === 'current' ? level.color : 'var(--line)',
      borderWidth: level.status === 'current' ? 2 : 1,
      transition:'all .2s',
    }}>
      {/* ── Header row — color bar + title + status + toggle ───────────── */}
      <div style={{
        display:'grid',
        gridTemplateColumns:'auto 1fr auto auto',
        gap:18,
        alignItems:'center',
        padding:'18px 22px',
        background: level.status === 'current'
          ? `linear-gradient(90deg, color-mix(in srgb, ${level.color} 10%, white) 0%, var(--surface) 60%)`
          : 'var(--surface)',
        borderBottom: expanded ? '1px solid var(--line)' : 'none',
        cursor: levelIsLocked ? 'default' : 'pointer',
      }} onClick={levelIsLocked ? undefined : onToggle}>
        {/* color indicator (book spine) */}
        <div style={{
          width: 6, height: 44,
          borderRadius: 3,
          background: level.color,
          opacity: levelIsLocked ? 0.4 : 1,
        }} />

        {/* title block */}
        <div>
          <div style={{ display:'flex', alignItems:'center', gap:10, flexWrap:'wrap' }}>
            <div style={{
              fontFamily:'var(--f-serif)', fontWeight:500,
              fontSize:22, letterSpacing:'-0.02em',
              color: levelIsLocked ? 'var(--ink-3)' : 'var(--ink)',
              lineHeight:1.1,
            }}>
              {level.name}
            </div>
            <LevelStatusChip status={level.status} />
            {level.status === 'current' && conceptsPending === 0 && (
              <span className="chip chip-green" style={{ fontSize:10 }}>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M5 13l4 4L19 7" /></svg>
                AL DÍA
              </span>
            )}
          </div>
          <div style={{ fontSize:12, color:'var(--ink-3)', marginTop:3 }}>
            {level.book} · {level.period}
          </div>
          <div style={{ fontSize:13, color:'var(--ink-2)', marginTop:6 }}>
            {headline}
          </div>
        </div>

        {/* concept progress compact — 6 dots on a row */}
        <div style={{ display:'flex', flexDirection:'column', alignItems:'flex-end', gap:6, minWidth:140 }}>
          <div style={{ fontSize:10, fontWeight:700, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--ink-3)' }}>
            {conceptsPaid}/{conceptsTotal} cubiertos
          </div>
          <div style={{ display:'flex', gap:4 }}>
            <span title="Matrícula"><FinanceDot status={level.matricula.status} /></span>
            {level.cuotas.map((c, i) => (
              <span key={i} title={`Cuota ${c.label}`}><FinanceDot status={c.status} /></span>
            ))}
            <span title="Certificado"><FinanceDot status={level.certificado.status} /></span>
          </div>
          <div style={{ fontSize:10, color:'var(--ink-3)', display:'flex', gap:8, letterSpacing:'0.04em' }}>
            <span>MAT</span>
            <span>·</span>
            <span>CUOTAS</span>
            <span>·</span>
            <span>CERT</span>
          </div>
        </div>

        {/* chevron */}
        {!levelIsLocked && (
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
            stroke="var(--ink-3)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"
            style={{ transform: expanded ? 'rotate(180deg)' : 'none', transition:'transform .25s' }}>
            <path d="M6 9l6 6 6-6" />
          </svg>
        )}
        {levelIsLocked && (
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        )}
      </div>

      {/* ── Expanded detail — 3 sections: matrícula / cuotas / certificado ── */}
      {expanded && !levelIsLocked && (
        <div style={{ padding:'4px 0 18px' }}>
          {/* MATRÍCULA */}
          <FinanceRow
            section="Matrícula"
            icon={
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3l10 6-10 6L2 9l10-6z" /><path d="M6 10.6V16c3 2 9 2 12 0v-5.4" /></svg>
            }
            items={[{
              label: level.matricula.note ? `Apertura de cupo · ${level.matricula.note}` : 'Apertura de cupo',
              amount: level.matricula.amount,
              status: level.matricula.status,
              date: level.matricula.date,
              id: level.matricula.id,
            }]}
            showAmounts={showAmounts}
            mask={mask}
            color={level.color}
          />

          {/* CUOTAS — en UNA sola línea (4 cuotas lado a lado, se pagan juntas) */}
          <FinanceRowInline
            section={`Cuotas mensuales · ${level.cuotas.length}`}
            icon={
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M3 10h18M8 3v4M16 3v4" /></svg>
            }
            items={level.cuotas.map(c => ({
              label: c.label,
              amount: c.amount,
              status: c.status,
              date: c.date,
              id: c.id,
              n: c.n,
            }))}
            showAmounts={showAmounts}
            mask={mask}
            color={level.color}
            allowPagarJuntas={level.status === 'current' || level.status === 'next'}
          />

          {/* CERTIFICADO */}
          <FinanceRow
            section="Certificado del nivel"
            icon={
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="6" /><path d="M8.5 13L7 22l5-3 5 3-1.5-9" /></svg>
            }
            items={[{
              label: level.certificado.label + (level.certificado.note ? ` · ${level.certificado.note}` : ''),
              amount: level.certificado.amount,
              status: level.certificado.status,
            }]}
            showAmounts={showAmounts}
            mask={mask}
            color={level.color}
            muted={level.certificado.status === 'locked' || level.certificado.status === 'pending'}
          />

          {/* CTA strip */}
          {cta && (
            <div style={{
              margin:'14px 22px 0',
              padding:'14px 16px',
              background:'var(--surface-2)',
              borderRadius:'var(--r-md)',
              display:'flex', alignItems:'center', justifyContent:'space-between',
              gap:12, flexWrap:'wrap',
            }}>
              <div style={{ fontSize:13, color:'var(--ink-2)' }}>
                {level.status === 'next'
                  ? '¿Listo para seguir? Asegura tu cupo sin compromiso por las siguientes cuotas.'
                  : 'Continúa con tu ciclo sin interrupciones.'}
              </div>
              {cta}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── Single concept row inside an expanded level ──────────────────────────
function FinanceRow({ section, icon, items, showAmounts, mask, color, muted }) {
  return (
    <div style={{ padding:'14px 22px 4px' }}>
      <div style={{
        display:'flex', alignItems:'center', gap:8,
        fontSize:10, fontWeight:700, letterSpacing:'0.14em', textTransform:'uppercase',
        color: muted ? 'var(--ink-3)' : color,
        marginBottom: 8,
      }}>
        <span style={{ color: muted ? 'var(--ink-3)' : color, display:'inline-flex' }}>{icon}</span>
        {section}
      </div>
      <div style={{ display:'flex', flexDirection:'column', gap:2 }}>
        {items.map((it, i) => (
          <div key={i} style={{
            display:'grid', gridTemplateColumns:'auto 1fr auto auto', gap:14, alignItems:'center',
            padding:'10px 4px', borderBottom: i < items.length-1 ? '1px dashed var(--line)' : 'none',
          }}>
            <FinanceDot status={it.status} />
            <div style={{ minWidth:0 }}>
              <div style={{ fontSize:13, fontWeight:500, color: it.status==='locked' ? 'var(--ink-3)' : 'var(--ink)' }}>
                {it.label}
              </div>
              <ConceptStatusLabel status={it.status} date={it.date} />
            </div>
            <div style={{
              fontFamily: showAmounts ? 'var(--f-mono)' : 'var(--f-sans)',
              fontWeight: 600,
              fontSize: 13,
              color: it.status === 'locked' ? 'var(--ink-3)' : 'var(--ink)',
              minWidth: 90, textAlign:'right',
              letterSpacing: showAmounts ? 0 : '0.1em',
            }}>
              {it.status === 'locked' && !showAmounts ? '—' : mask(it.amount)}
            </div>
            <div style={{ minWidth: 36, textAlign:'right' }}>
              {it.status === 'paid' && it.id && (
                <button className="btn btn-icon btn-ghost" title={`Descargar ${it.id}`}>
                  <Icon name="download" size={12} className="" />
                </button>
              )}
              {it.status === 'pending' && (
                <button className="btn" style={{ fontSize:11, padding:'6px 10px', background:'var(--an-granate)', color:'white', border:'none' }}>
                  Pagar
                </button>
              )}
              {it.status === 'upcoming' && (
                <span style={{ fontSize:10, color:'var(--ink-3)', letterSpacing:'0.08em' }}>PRÓXIMO</span>
              )}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Inline (horizontal) financial row — for cuotas que suelen pagarse juntas ─
function FinanceRowInline({ section, icon, items, showAmounts, mask, color, allowPagarJuntas }) {
  const fmt = (n) => '₡' + n.toLocaleString('es-CR');
  const unpaidItems = items.filter(it => it.status === 'pending' || it.status === 'upcoming');
  const totalUnpaid = unpaidItems.reduce((a, it) => a + it.amount, 0);
  const totalAll = items.reduce((a, it) => a + it.amount, 0);
  const allPaid = unpaidItems.length === 0;

  return (
    <div style={{ padding:'14px 22px 4px' }}>
      {/* Section header with summary line */}
      <div style={{
        display:'flex', alignItems:'center', justifyContent:'space-between', gap:12,
        marginBottom: 10, flexWrap:'wrap',
      }}>
        <div style={{
          display:'flex', alignItems:'center', gap:8,
          fontSize:10, fontWeight:700, letterSpacing:'0.14em', textTransform:'uppercase',
          color: color,
        }}>
          <span style={{ color: color, display:'inline-flex' }}>{icon}</span>
          {section}
        </div>
        {showAmounts && !allPaid && (
          <div style={{
            fontSize:11, color:'var(--ink-3)', letterSpacing:'0.04em',
            display:'inline-flex', alignItems:'center', gap:6,
          }}>
            <span>Pendiente: </span>
            <span style={{ fontFamily:'var(--f-mono)', fontWeight:700, color:'var(--ink)' }}>{fmt(totalUnpaid)}</span>
            <span style={{ opacity:0.5 }}>·</span>
            <span>Total ciclo: </span>
            <span style={{ fontFamily:'var(--f-mono)', fontWeight:600 }}>{fmt(totalAll)}</span>
          </div>
        )}
      </div>

      {/* 4-column grid of quota cards */}
      <div style={{
        display:'grid',
        gridTemplateColumns:`repeat(${items.length}, 1fr)`,
        gap: 8,
      }}>
        {items.map((it, i) => {
          const isPaid = it.status === 'paid';
          const isLocked = it.status === 'locked';
          const isPending = it.status === 'pending';
          const isUpcoming = it.status === 'upcoming';
          return (
            <div key={i} style={{
              padding:'12px 10px 10px',
              borderRadius:'var(--r-md)',
              border:`1px solid ${isPaid ? 'color-mix(in srgb, var(--ok) 30%, var(--line))'
                : isUpcoming ? color
                : isPending ? 'var(--an-gold)'
                : 'var(--line)'}`,
              background: isPaid ? 'color-mix(in srgb, var(--ok) 6%, white)'
                : isUpcoming ? `color-mix(in srgb, ${color} 5%, white)`
                : isPending ? 'color-mix(in srgb, var(--an-gold) 8%, white)'
                : 'var(--surface-2)',
              opacity: isLocked ? 0.55 : 1,
              display:'flex', flexDirection:'column', gap:4,
              position:'relative',
              cursor: (isPending || isUpcoming) ? 'pointer' : 'default',
              transition:'transform .15s, box-shadow .15s',
            }}
            onMouseEnter={e => {
              if (isPending || isUpcoming) {
                e.currentTarget.style.transform = 'translateY(-1px)';
                e.currentTarget.style.boxShadow = 'var(--sh-1)';
              }
            }}
            onMouseLeave={e => {
              e.currentTarget.style.transform = '';
              e.currentTarget.style.boxShadow = '';
            }}>
              {/* top row: cuota number + dot */}
              <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:6 }}>
                <div style={{
                  fontSize:10, fontWeight:700, letterSpacing:'0.1em',
                  color: isLocked ? 'var(--ink-3)' : color,
                  textTransform:'uppercase',
                }}>
                  Cuota {it.n}
                </div>
                <FinanceDot status={it.status} />
              </div>

              {/* month */}
              <div style={{
                fontFamily:'var(--f-serif)', fontWeight:500,
                fontSize:18, lineHeight:1.1, letterSpacing:'-0.02em',
                color: isLocked ? 'var(--ink-3)' : 'var(--ink)',
              }}>
                {it.label}
              </div>

              {/* amount */}
              <div style={{
                fontFamily: showAmounts ? 'var(--f-mono)' : 'var(--f-sans)',
                fontSize: 13, fontWeight: 600,
                color: isLocked ? 'var(--ink-3)' : 'var(--ink)',
                letterSpacing: showAmounts ? 0 : '0.1em',
                marginTop:2,
              }}>
                {isLocked && !showAmounts ? '—' : mask(it.amount)}
              </div>

              {/* date / status line */}
              <div style={{
                fontSize:10, marginTop:2, letterSpacing:'0.02em',
                color: isPaid ? 'var(--ok)'
                  : isPending ? 'var(--warn)'
                  : isUpcoming ? color
                  : 'var(--ink-3)',
                fontWeight: 600,
              }}>
                {isPaid && <>✓ Pagado · {it.date}</>}
                {isPending && <>Vence {it.date}</>}
                {isUpcoming && <>{it.date}</>}
                {isLocked && <>—</>}
              </div>
            </div>
          );
        })}
      </div>

      {/* PAGAR JUNTAS — atajo para cuando se cancelan todas de una vez */}
      {allowPagarJuntas && unpaidItems.length >= 2 && (
        <div style={{
          marginTop: 10,
          padding: '10px 14px',
          background: `linear-gradient(90deg, color-mix(in srgb, ${color} 8%, white) 0%, var(--surface-2) 100%)`,
          border: `1px dashed ${color}`,
          borderRadius:'var(--r-md)',
          display:'flex', alignItems:'center', justifyContent:'space-between',
          gap:12, flexWrap:'wrap',
        }}>
          <div style={{ fontSize:12, color:'var(--ink-2)', lineHeight:1.4 }}>
            <strong style={{ color:'var(--ink)' }}>¿Pagar las {unpaidItems.length} cuotas juntas?</strong>
            {' '}Es lo más común — un solo pago cubre todo el ciclo.
            {showAmounts && <> Total: <span style={{ fontFamily:'var(--f-mono)', fontWeight:700, color:'var(--ink)' }}>{fmt(totalUnpaid)}</span></>}
          </div>
          <button className="btn" style={{
            background: color, color:'white', border:'none', fontSize:12,
          }}>
            <Icon name="payments" size={13} className="" /> Pagar ciclo completo
          </button>
        </div>
      )}
    </div>
  );
}

// ──────────────────────────────────────────────────────────────────────────
function PagosView({ tweaks = {} }) {
  const [showAmounts, setShowAmounts] = React.useState(tweaks.showAmounts !== false);

  // Datos reales del servidor
  const [datosReales, setDatosReales] = React.useState(null);
  React.useEffect(() => {
    fetch(`${SCRIPT_URL_SM}?fn=getEstudiante&codigo=${encodeURIComponent(COD_ESTUDIANTE_SM)}`)
      .then(r => r.json())
      .then(data => { if (data.ok) setDatosReales(data); })
      .catch(() => {});
  }, []);

  // LEVEL_FINANCE patcheado con datos reales (o base si no hay)
  const financeData = React.useMemo(() => {
    if (!datosReales) return LEVEL_FINANCE;
    return patchLevelFinance(
      LEVEL_FINANCE,
      datosReales.pagos,
      datosReales.otrosPagos,
      datosReales.pendientes?.cuota_mensual
    );
  }, [datosReales]);

  React.useEffect(() => {
    if (tweaks.showAmounts !== undefined) setShowAmounts(tweaks.showAmounts);
  }, [tweaks.showAmounts]);
  const [expandedId, setExpandedId] = React.useState(() => {
    const cur = financeData.find(l => l.status === 'current');
    return cur ? cur.id : financeData[0].id;
  });

  // global status — flattens all levels for the hero
  const allCuotas    = financeData.flatMap(l => l.cuotas);
  const allConcepts  = financeData.flatMap(l => [l.matricula, ...l.cuotas, l.certificado]);
  const paidCount    = allConcepts.filter(c => c.status === 'paid').length;
  const pendingCount = allConcepts.filter(c => c.status === 'pending').length;
  const upcomingCount= allConcepts.filter(c => c.status === 'upcoming').length;
  const isAlDia      = pendingCount === 0;

  const currentLevel = financeData.find(l => l.status === 'current');

  return (
    <div>
      <PageHeader
        kicker="Finanzas por nivel"
        title={<>Estado de <em>cuenta</em></>}
        sub="Tu progreso financiero nivel por nivel · matrícula, cuotas y certificado"
        right={
          <button className="btn btn-ghost" onClick={() => setShowAmounts(v => !v)} style={{ fontSize:12 }}>
            {showAmounts
              ? <><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg> Ocultar montos</>
              : <><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Ver montos</>}
          </button>
        }
      />

      {/* ── HERO compacto: status del nivel actual ────────────────────────── */}
      <div className="card" style={{
        padding: '22px 28px',
        marginBottom: 16,
        background: isAlDia
          ? 'linear-gradient(135deg, #FBF8F2 0%, #FFFFFF 50%, color-mix(in srgb, var(--ok) 8%, white) 100%)'
          : 'linear-gradient(135deg, #FBF8F2 0%, #FFFFFF 50%, color-mix(in srgb, var(--an-gold) 10%, white) 100%)',
        position:'relative', overflow:'hidden',
      }}>
        <div style={{ position:'absolute', right:-30, top:-30, width:180, height:180, borderRadius:'50%',
          background: isAlDia ? 'var(--ok)' : 'var(--an-gold)', opacity: 0.05, pointerEvents:'none' }} />
        <div style={{ display:'grid', gridTemplateColumns:'auto 1fr auto', gap:24, alignItems:'center', position:'relative' }}>
          <div style={{
            width:60, height:60, borderRadius:'50%',
            background: isAlDia ? 'var(--ok)' : 'var(--an-gold)',
            display:'flex', alignItems:'center', justifyContent:'center',
            color:'white', flexShrink:0,
            boxShadow: `0 8px 20px -6px ${isAlDia ? 'rgba(46,125,50,0.4)' : 'rgba(229,168,35,0.4)'}`,
          }}>
            {isAlDia
              ? <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M5 13l4 4L19 7"/></svg>
              : <span style={{ fontFamily:'var(--f-serif)', fontSize:28, fontWeight:600, lineHeight:1 }}>{pendingCount}</span>}
          </div>
          <div>
            <div style={{ fontSize:11, fontWeight:700, letterSpacing:'0.14em', textTransform:'uppercase', color:'var(--ink-3)' }}>
              Tu estado global
            </div>
            <div style={{
              fontFamily:'var(--f-serif)', fontWeight:500,
              fontSize:38, lineHeight:1.05, letterSpacing:'-0.035em',
              color: isAlDia ? 'var(--ok)' : 'var(--an-granate-ink)',
              marginTop:3,
            }}>
              {isAlDia ? 'Al día' : (pendingCount === 1 ? '1 cuota por cubrir' : `${pendingCount} cuotas por cubrir`)}
            </div>
            <div style={{ fontSize:13, color:'var(--ink-2)', marginTop:4 }}>
              {currentLevel
                ? <>Cursando <strong style={{ color:'var(--ink)' }}>{currentLevel.name}</strong> · {paidCount} conceptos cubiertos · {upcomingCount} próximo{upcomingCount!==1?'s':''}</>
                : 'Revisa cada nivel para ver tu progreso financiero.'}
            </div>
          </div>
          <div style={{ display:'flex', flexDirection:'column', gap:8, alignItems:'flex-end' }}>
            <div style={{ fontSize:10, fontWeight:700, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--ink-3)' }}>
              Recorrido completo
            </div>
            <div style={{ display:'flex', gap:3 }}>

const SCRIPT_URL_SV = 'https://script.google.com/macros/s/AKfycbx8O8dxCNhHQQLdRFd4vqOY_yIzE0KUG7ljk7vkieHf9hKWeund_WC0ZpuKU-Toj8sYHQ/exec';

const LEVEL_LABEL = {
  b1:'Básico I', b2:'Básico II',
  i1:'Intermedio I', i2:'Intermedio II',
  a1:'Avanzado I', a2:'Avanzado II',
};
const DIAS_LABEL = { LM:'Lun/Mié', KJ:'Mar/Jue', LJ:'Lun/Jue', SA:'Sáb' };

// Hook: lee usuario de session, llama getGrupoInfo, devuelve { grupoInfo, codGrupo, grupo, loading }
function useGroupFromSession() {
  const [grupoInfo, setGrupoInfo] = React.useState(null);
  const [loading, setLoading]     = React.useState(true);
  const codGrupo = React.useMemo(() => {
    const usr = JSON.parse(sessionStorage.getItem('an_usuario') || 'null');
    return usr?.grupo || usr?.grupos?.[0] || '';
  }, []);

  React.useEffect(() => {
    if (!codGrupo) { setLoading(false); return; }
    fetch(`${SCRIPT_URL_SV}?fn=getGrupoInfo&cod_grupo=${encodeURIComponent(codGrupo)}`)
      .then(r => r.json())
      .then(d => { if (d.ok) setGrupoInfo(d); })
      .finally(() => setLoading(false));
  }, [codGrupo]);

  // Construye el objeto que espera buildGroupSchedule
  const grupo = React.useMemo(() => {
    if (!grupoInfo || !codGrupo) return null;
    const partes   = codGrupo.split('-');
    const diasCode = (partes[1] || 'LM').replace(/\d/g, '').toUpperCase();
    return {
      code:         codGrupo,
      levelId:      grupoInfo.levelId || 'b1',
      scheduleDays: DIAS_LABEL[diasCode] || 'Lun/Mié',
      startDate:    grupoInfo.startDate,
      teacher:      grupoInfo.teacherName || '',
    };
  }, [grupoInfo, codGrupo]);

  return { grupoInfo, grupo, codGrupo, loading };
}

const TODAY = new Date();
TODAY.setHours(0,0,0,0);

function useScheduleState(grupoInfo, grupo) {
  // Generamos schedule a partir del grupo real (suspensiones aún no implementadas → [])
  const schedule = React.useMemo(() => {
    if (!grupoInfo || !grupo?.startDate) return [];
    return buildGroupSchedule(grupoInfo.levelId || 'b1', grupo, []);
  }, [grupoInfo, grupo]);
  // Marcar done/next/future basándonos en HOY
  return React.useMemo(() => schedule.map(s => {
    const st = (() => {
      if (s.status === 'suspended' || s.status === 'rescheduled') {
        // Si ya pasó la fecha nueva => done; si no, upcoming
        if (s.status === 'rescheduled' && s.date < TODAY) return 'done-rescheduled';
        return s.status;
      }
      if (s.date < TODAY) return 'done';
      // mismo día
      if (s.date.toDateString() === TODAY.toDateString()) return 'today';
      return 'upcoming';
    })();
    return { ...s, computedStatus: st };
  }), [schedule]);
}

              </div>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ display:'flex', gap:6, alignItems:'baseline', flexWrap:'wrap' }}>
                  <span style={{ fontFamily:'var(--f-mono)', fontSize:10, color:'var(--ink-3)' }}>{item.code}</span>
                  <span style={{ fontWeight:600, fontSize:13, color:'var(--ink)', lineHeight:1.25 }}>{item.title}</span>
                </div>
                <div style={{ fontSize:11, color:'var(--ink-3)', marginTop:3, lineHeight:1.4 }}>
                  {item.desc}
                </div>
                <div style={{ fontSize:10, color:'var(--ink-3)', marginTop:4, fontWeight:600, letterSpacing:'0.06em' }}>
                  {item.required ? 'REQUERIDO' : 'RECOMENDADO'} · ~{item.minutes} min
                </div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────
// MATERIALES — sílabus completo, pestañas Actuales/Futuras/Completadas
// ─────────────────────────────────────────────────────────────────────────
function MaterialesView({ initialLesson = null } = {}) {
  const { grupoInfo, grupo, loading } = useGroupFromSession();
  const schedule = useScheduleState(grupoInfo, grupo);
  if (loading) return <SyllabusLoadingState />;
  if (!grupoInfo || !grupo) return <SyllabusLoadingState message="No se encontró el grupo del estudiante." />;
  const [tab, setTab] = React.useState('calendario'); // calendario | futuras | completadas | todas
  const [open, setOpen] = React.useState(initialLesson);

  // If opened with a lesson, jump to "todas" tab so the row is in view
  React.useEffect(() => {
    if (initialLesson) {
      setTab('todas');
      // scroll the detail into view after next paint
      setTimeout(() => {
        const el = document.getElementById(`lesson-row-${initialLesson}`);
        if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }, 50);
    }
  }, [initialLesson]);

  const filter = (s) => {
    if (tab === 'todas') return true;
    if (tab === 'futuras') return s.computedStatus === 'upcoming';
    if (tab === 'completadas') return s.computedStatus === 'done' || s.computedStatus === 'done-rescheduled';
    return true;
  };

  const filtered = schedule.filter(filter);

  return (
    <div>
      <PageHeader
        kicker="Sílabus oficial del nivel"
        title={<>Materiales · <em>Básico I</em></>}
        sub="Interchange Intro (5ª ed.) · 32 lecciones · A1 — todo el material del nivel en un solo lugar"
        right={
          <div style={{ display:'flex', gap:6, alignItems:'center' }}>
            <Chip tone="navy">INA 2519</Chip>
            <Chip tone="gold">A1 · MCER</Chip>
          </div>
        }
      />

      {/* Banner prioridad INA */}
      <PriorityBanner />

      {/* Resumen del nivel */}
      <div className="card" style={{ padding:'20px 24px', marginBottom:18 }}>
        <div style={{ display:'grid', gridTemplateColumns:'2fr 1fr 1fr 1fr', gap:20, alignItems:'center' }}>
          <div>
            <div style={{ fontSize:10, fontWeight:700, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--ink-3)' }}>
              Objetivo general
            </div>
            <div style={{ fontSize:12, color:'var(--ink-2)', marginTop:4, lineHeight:1.5 }}>
              {SYLLABUS_BY_LEVEL.b1.objective}
            </div>
          </div>
          <div>
            <div style={{ fontSize:10, fontWeight:700, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--ink-3)' }}>Libro</div>
            <div style={{ fontFamily:'var(--f-serif)', fontSize:16, fontWeight:500, color:'var(--an-navy-ink)', marginTop:3, lineHeight:1.2 }}>
              Interchange Intro
            </div>
            <div style={{ fontSize:11, color:'var(--ink-3)' }}>Cambridge · 5ª ed.</div>
          </div>
          <div>
            <div style={{ fontSize:10, fontWeight:700, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--ink-3)' }}>Duración</div>
            <div style={{ fontFamily:'var(--f-serif)', fontSize:16, fontWeight:500, color:'var(--an-navy-ink)', marginTop:3 }}>
              128 h
            </div>
            <div style={{ fontSize:11, color:'var(--ink-3)' }}>96 módulo + 32 I CAN</div>
          </div>
          <div>
            <div style={{ fontSize:10, fontWeight:700, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--ink-3)' }}>Plataforma</div>
            <div style={{ fontFamily:'var(--f-serif)', fontSize:16, fontWeight:500, color:'var(--an-navy-ink)', marginTop:3 }}>
              Zoom
            </div>
            <div style={{ fontSize:11, color:'var(--ink-3)' }}>Contingencia: Meet</div>
          </div>
        </div>
      </div>

      {/* Tabs */}
      <div className="tabs" style={{ marginBottom:14 }}>
        {[
          ['calendario', 'Calendario', schedule.length],
          ['futuras', 'Futuras', schedule.filter(s => s.computedStatus==='upcoming').length],
          ['completadas', 'Completadas', schedule.filter(s => s.computedStatus==='done' || s.computedStatus==='done-rescheduled').length],
          ['todas', 'Todas las 32', 32],
        ].map(([k,l,n]) => (
          <button key={k} className={`tab ${tab===k?'active':''}`} onClick={() => setTab(k)}>
            {l} <span style={{ opacity:0.5, marginLeft:6, fontSize:11, fontFamily:'var(--f-mono)' }}>{n}</span>
          </button>
        ))}
      </div>

      {tab === 'calendario' ? (
        <InlineCalendar schedule={schedule} onOpenLesson={(n) => { setOpen(n); setTab('todas'); setTimeout(() => { const el = document.getElementById(`lesson-row-${n}`); if (el) el.scrollIntoView({ block:'center', behavior:'smooth' }); }, 60); }} />
      ) : (
        <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
          {filtered.map(s => <LessonRow key={s.n} lesson={s} isOpen={open===s.n} onToggle={() => setOpen(v => v===s.n ? null : s.n)} />)}
          {filtered.length === 0 && (
            <div className="card" style={{ padding:40, textAlign:'center', color:'var(--ink-3)', borderStyle:'dashed' }}>
              No hay lecciones en esta categoría.
            </div>
