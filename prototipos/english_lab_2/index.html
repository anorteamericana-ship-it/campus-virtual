<body class="l2-standalone">
<div id="lab2-root"><p class="l2-boot">Cargando el laboratorio…</p></div>
<noscript><p class="l2-boot">El laboratorio necesita JavaScript activado.</p></noscript>
<!-- Prototipo aislado: no carga campus.html, no usa sesión real y no llama al backend. -->
<script src="../../vendor/react.js"></script>
<script src="../../vendor/react-dom.js"></script>
<script src="lab2_content.js"></script>
<script src="lab2_core.js"></script>
<script src="lab2_steps.js"></script>
<script src="lab2_app.js"></script>
<script>
(function () {
  var el = document.getElementById('lab2-root');
  if (!window.React || !window.ReactDOM || !window.LAB2 || !window.LAB2.mount) {
    el.innerHTML = '<p class="l2-boot">No se pudo cargar el laboratorio. Revisá tu conexión y recargá la página.</p>';
    return;
  }
  window.LAB2.mount(el, { preview: true, usuario: null });
})();
</script>
</body>
</html>
