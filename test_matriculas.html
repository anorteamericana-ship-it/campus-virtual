<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Setup: stubs + fetch mock (runs before the real modules) -->
<script type="text/babel" data-presets="react">
window.APPS_SCRIPT_URL = 'https://example.invalid/exec';
window.getSesion = () => ({ rol: 'admin', nombre: 'Test Admin' });

// minimal primitives the view needs
window.Icon = ({ name, size = 16 }) => <span style={{ fontSize: size }}>•</span>;
window.PageHeader = ({ kicker, title, sub }) => (
  <div style={{ marginBottom: 20 }}>
    <div style={{ fontSize: 11, color: '#888', textTransform: 'uppercase' }}>{kicker}</div>
    <h1 style={{ margin: '4px 0' }}>{title}</h1>
    <div style={{ color: '#666' }}>{sub}</div>
  </div>
);

const CONAPE_DETALLE = {
  NOMBRE: 'SALAZAR CHACON SANTIAGO', CEDULA: '1-1801-0123', TIPO_ID: 'Cédula Nacional',
  CORREO: 'santiago@example.com', WHATSAPP: '88881234', TELEFONO: '88881234',
  PROGRAMA: 'INA', MODALIDAD: 'INTENSIVO', GRUPO_TENTATIVO: 'B1-LM18-C3-0726',
  FINANCIAMIENTO: 'CONAPE', BECA: '', CONAPE_EQUIPO: 'PREMIUM', CONAPE_TOEIC: true,
  ASESOR_REF: 'Fiorella Salazar', NOTAS: 'Interesado en intensivo',
};

// Mock backend so we can click real buttons with real data
const realFetch = window.fetch.bind(window);
window.fetch = async (url, opts) => {
  const u = String(url);
  const json = (obj) => ({ ok: true, json: async () => obj });
  if (u.includes('fn=getProspectos')) {
    return json({ ok: true,
      prospectos: [
        { CEDULA: '1-1801-0123', NOMBRE: 'SALAZAR CHACON SANTIAGO', GRUPO_TENTATIVO: 'B1-LM18-C3-0726', PROGRAMA: 'INA', ESTADO: 'PENDIENTE_CONAPE', FINANCIAMIENTO: 'CONAPE', ASESOR_REF: 'Fiorella Salazar', TIMESTAMP: '2026-05-30' },
        { CEDULA: '1-0720-0456', NOMBRE: 'RODRIGUEZ MORA ANA', GRUPO_TENTATIVO: 'B1-LM94-B3-0626', PROGRAMA: 'REGULAR', ESTADO: 'PENDIENTE_PAGO', FINANCIAMIENTO: 'PROPIO', ASESOR_REF: 'Roger Cruz', TIMESTAMP: '2026-05-31' },
      ],
      resumen: {
        activos_por_nivel: { B1: 12, B2: 8, I1: 5, I2: 3 }, total_activos: 28,
        total_prospectos_no_activos: 9, tasa_conversion: 75,
        grupos_abiertos: [
          { codigo: 'B1-LM18-C3-0726', fecha_inicio: '2026-09-14', capacidad: 20, dias: 'LM', hora_ini: '6pm', hora_fin: '9pm', programa: 'INA', modalidad: 'INTENSIVO', docente: 'RACHELLE', activos: 0, reservas: 5, cupo_disponible: 15 },
          { codigo: 'B1-LM94-B3-0626', fecha_inicio: '2026-06-20', capacidad: 20, dias: 'KJ', hora_ini: '6pm', hora_fin: '9pm', programa: 'REGULAR', modalidad: 'REGULAR', docente: 'JOHN', activos: 0, reservas: 17, cupo_disponible: 3 },
          { codigo: 'I1-S08-A1-0526', fecha_inicio: '2026-05-10', capacidad: 15, dias: 'S', hora_ini: '8am', hora_fin: '12pm', programa: 'REGULAR', modalidad: 'SABATINO', docente: 'MARIA', activos: 0, reservas: 15, cupo_disponible: 0 },
        ],
      },
    });
  }
  if (u.includes('fn=getProspectoDetalle')) return json({ ok: true, prospecto: Object.assign({}, CONAPE_DETALLE, {
    // HOSTILE: backend returns an object where the UI expects a string.
    DIRECCION: { provincia: 'San José', detalle: 'Av 2' },
    NOTAS: [ { fecha: '2026-05-01', texto: 'Llamar' }, { fecha: '2026-05-03', texto: 'Envió docs' } ],
  }) });
  if (u.includes('fn=generarProformaProspecto')) return json({ ok: true, url_programa: 'https://example.com/p.pdf', url_equipo: 'https://example.com/e.pdf' });
  if (u.includes('fn=actualizarEstadoConapeProspecto')) return json({ ok: true, novedad: 'aprobado_sin_desembolso', ultima_consulta: '2026-06-04 10:00', nombre_ws: 'SALAZAR CHACON SANTIAGO' });
  if (u.includes('fn=getGruposDisponibles')) return json({ ok: true, grupos: [] });
  return realFetch(url, opts);
};
console.log('[TEST] stubs + fetch mock ready');
</script>
