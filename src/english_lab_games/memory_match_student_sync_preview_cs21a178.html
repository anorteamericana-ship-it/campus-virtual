<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QA · Estudiante Memory Match CS21A178</title>
  <link rel="stylesheet" href="../../styles/tokens.css">
  <link id="english-lab-memory-match-cs21a174" rel="stylesheet" href="../../styles/english_lab_memory_match_cs21a173.css?v=CS21A178">
  <style>
    body{margin:0;background:#EAF0F7;padding:18px;box-sizing:border-box;font-family:system-ui,sans-serif}
    #qa-banner{max-width:980px;margin:0 auto 12px;padding:10px 12px;border:1px solid #B7D5FF;border-radius:12px;background:#EEF4FF;color:#073B7A;font-size:12px;font-weight:800}
  </style>
</head>
<body>
  <div id="qa-banner">QA sintético CS21A178 · La vista usa el componente real del estudiante y un backend simulado.</div>
  <div id="root"></div>

  <script src="../../vendor/react.js"></script>
  <script src="../../vendor/react-dom.js"></script>
  <script src="../../vendor/babel.js"></script>
  <script>
    window.APPS_SCRIPT_URL = location.origin + '/mock-exec';
    window.getSessionToken = function(){ return 'qa-session'; };
    window.__QA_BACKEND_CALLS__ = [];
    window.__QA_NATIVE_FETCH__ = window.fetch.bind(window);
    window.__QA_ROOM_PACKAGE__ = null;

    function qaPlayerId(){
      return new URLSearchParams(location.search).get('player') || 'QA-P1';
    }
    function qaState(playerId){
      const now = Date.now();
      const pkg = JSON.parse(JSON.stringify(window.__QA_ROOM_PACKAGE__));
      pkg.server_now = now;
      pkg.received_at_ms = now;
      pkg.room = {...pkg.room,room_code:'LAB-178',game_id:'MEMORY_MATCH',mode:'INDIVIDUAL'};
      pkg.state = {...pkg.state,phase:'OPEN',started_at:now,ends_at:now+45000,active_player_id:'QA-P1',active_team_id:''};
      pkg.players = [
        {player_id:'QA-P1',cod_estudiante:'QA-P1',name:'Ana QA'},
        {player_id:'QA-P2',cod_estudiante:'QA-P2',name:'Carlos QA'}
      ];
      pkg.player = pkg.players.find(player => player.player_id === playerId);
      pkg.turn_state = {
        version:'CS21A176',participation_policy:'RANDOM_PLAYER',player_order:['QA-P1','QA-P2'],
        player_cursor:0,team_order:[],team_cursor:0,team_player_orders:{},team_player_cursors:{},
        active_player_id:'QA-P1',active_team_id:'',turn_number:1,
        turn_started_at:new Date(now).toISOString(),turn_ends_at:new Date(now+45000).toISOString(),
        last_player_id:'',last_team_id:'',reason:'ROUND_STARTED'
      };
      pkg.shared_state = {version:'CS21A176',board_version:1,matched_pair_ids:[],completed:false,last_action_key:''};
      return {
        ok:true,memory_match:true,
        room:{room_code:'LAB-178',game_id:'MEMORY_MATCH',game_label:'Memory Match',status:'LIVE',round_status:'OPEN',current_index:1,question_count:1,mode:'INDIVIDUAL',unit:'U01',nivel:'B1'},
        player:pkg.player,room_package:pkg,stats:{players:2,answers_current:0}
      };
    }

    window.fetch = async function(input, init){
      const url = new URL(String(input), location.href);
      if(url.pathname !== '/mock-exec') return window.__QA_NATIVE_FETCH__(input, init);
      const body = JSON.parse(String(init && init.body || '{}'));
      const endpoint = url.searchParams.get('fn') || body.fn || '';
      const playerId = String(body.player_id || body.cod_estudiante || qaPlayerId());
      window.__QA_BACKEND_CALLS__.push({endpoint: endpoint, player_id: playerId});
      if(endpoint === 'englishLabLiveJoinRoom'){
        return new Response(JSON.stringify({
          ok:true,
          room:{room_code:'LAB-178',game_label:'Memory Match',status:'LIVE'},
          player:{player_id:playerId,cod_estudiante:playerId,name:playerId==='QA-P1'?'Ana QA':'Carlos QA'},
          question:{index:1,prompt:'LEGACY NO DEBE MOSTRARSE',options:['A','B']}
        }),{status:200,headers:{'content-type':'application/json'}});
      }
      if(endpoint === 'englishLabMemoryMatchGetPlayerState'){
        return new Response(JSON.stringify(qaState(playerId)),{status:200,headers:{'content-type':'application/json'}});
      }
      if(endpoint === 'englishLabMemoryMatchSubmitPair'){
        return new Response(JSON.stringify({ok:true,accepted:true,correct:false,message:'Intento QA'}),{status:200,headers:{'content-type':'application/json'}});
      }
      return new Response(JSON.stringify({ok:false,error:'Endpoint QA no simulado: '+endpoint}),{status:400,headers:{'content-type':'application/json'}});
    };
  </script>
  <script src="./english_lab_runtime_cs21a173.js?v=CS21A173"></script>
  <script src="./english_lab_turn_engine_cs21a176.js?v=CS21A176"></script>
  <script type="text/babel" src="./memory_match_engine_cs21a173.jsx?v=CS21A174"></script>
  <script src="./english_lab_live_sync_guard_cs21a177.js?v=CS21A178"></script>
  <script type="text/babel" src="./english_lab_live_memory_match_adapter_cs21a174.jsx?v=CS21A178"></script>
  <script type="text/babel" src="../english_lab_live.jsx?v=F98.4Z6CS21A178"></script>
  <script type="text/babel">
    (async function start(){
      window.__QA_ROOM_PACKAGE__ = await window.__QA_NATIVE_FETCH__('../../assets/english_lab/qa/memory_match_room_cs21a173.json',{cache:'no-store'}).then(response=>response.json());
      const playerId = qaPlayerId();
      const usuario = {codigo:playerId,nombre:playerId==='QA-P1'?'Ana QA':'Carlos QA'};
      localStorage.removeItem('elive_player_LAB-178');
      localStorage.setItem('elive_last_room','LAB-178');
      ReactDOM.createRoot(document.getElementById('root')).render(<EnglishLabLiveStudentView usuario={usuario}/>);
    })().catch(error=>{
      document.getElementById('root').textContent='ERROR QA: '+error.message;
    });
  </script>
</body>
</html>
