<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CS21A205 · English LAB shell preview</title>
  <link rel="stylesheet" href="../../styles/tokens.css">
  <link id="el205-style" rel="stylesheet" href="../../styles/english_lab_unified_shell_cs21a205.css?v=CS21A205">
  <script src="../../vendor/react.js"></script>
  <script src="../../vendor/react-dom.js"></script>
  <script src="../../vendor/babel.js"></script>
</head>
<body style="margin:0;padding:24px;background:#f4f7fb"><div id="root"></div>
<script type="text/babel">
  function MockPanel({name,cls=''}){return <div className={cls} data-mock={name} style={{padding:24,border:'1px solid #d9e1ea',borderRadius:18,background:'#fff'}}><strong>{name}</strong></div>}
  function MemoryTeacher(){return <div data-mock="Memory Match"><div><button>Memory Match</button><button>Vocabulary Sprint</button><button>Word Match</button></div><div className="card">Banco pedagógico</div><MockPanel name="Memory control"/></div>}
  function SentenceTeacher(){return <><div className="elso183-shell" data-mock="Sentence Order"><MockPanel name="Sentence control"/></div><div data-mock="Legacy duplicate">legacy duplicate</div></>}
  SentenceTeacher.__cs21a183SentenceWrapped=true;
  SentenceTeacher.__cs21a183Base=MemoryTeacher;
  function LegacyStudent(){return <div data-mock="Legacy student"><div className="ws200-gateway">gateway viejo</div><MockPanel name="Ingreso por código"/></div>}
  function TeacherQuiz(){return <MockPanel name="Quiz Time"/>}
  function StudentQuiz(){return <MockPanel name="Quiz Time student"/>}
  function TeacherWordSearch(){return <MockPanel name="Word Search"/>}
  function StudentWordSearch(){return <MockPanel name="Word Search student"/>}
  function HangmanTeacherView(){return <MockPanel name="Hangman"/>}
  window.EnglishLabQuizTimeGatewayCS21A198={LegacyTeacher:SentenceTeacher,LegacyStudent,TeacherQuiz,StudentQuiz};
  window.EnglishLabWordSearchGatewayCS21A200={LegacyTeacher:SentenceTeacher,LegacyStudent,TeacherWordSearch,StudentWordSearch};
  window.EnglishLabHangmanCS21A191={HangmanTeacherView,install(){return true;}};
  window.EnglishLabLiveTeacherView=SentenceTeacher;
  window.EnglishLabLiveStudentView=LegacyStudent;
</script>
<script type="text/babel" src="english_lab_unified_shell_cs21a205.jsx?v=CS21A205"></script>
<script type="text/babel">
  const role=new URLSearchParams(location.search).get('role')==='student'?'student':'teacher';
  const View=role==='student'?window.EnglishLabLiveStudentView:window.EnglishLabLiveTeacherView;
  ReactDOM.createRoot(document.getElementById('root')).render(<View usuario={{nombre:'QA',codigo:'QA-1'}} role={role}/>);
</script>
</body>
</html>
