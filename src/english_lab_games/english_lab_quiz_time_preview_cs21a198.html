<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CS21A198 · Quiz Time Preview</title>
  <link rel="stylesheet" href="../../styles/english_lab_quiz_time_cs21a198.css?v=CS21A198" />
  <style>
    body{margin:0;background:#e9eff6;font-family:Inter,system-ui,sans-serif}.preview-wrap{max-width:1440px;margin:0 auto;padding:22px}.preview-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}.preview-tools button{padding:8px 12px;border:1px solid #ccd8e7;border-radius:10px;background:white;font-weight:800;cursor:pointer}.preview-note{font-size:12px;color:#52677f}.preview-phone{max-width:390px;margin:0 auto}
  </style>
</head>
<body>
  <div class="preview-wrap">
    <div class="preview-tools"><button id="openBtn">OPEN</button><button id="revealBtn">REVEAL</button><button id="desktopBtn">1440px</button><button id="mobileBtn">390px</button><span class="preview-note">Preview sintético · no usa respuestas oficiales ni backend.</span></div>
    <div id="frame"><div id="root"></div></div>
  </div>
  <script src="../../vendor/react.js"></script>
  <script src="../../vendor/react-dom.js"></script>
  <script src="../../vendor/babel.js"></script>
  <script src="english_lab_quiz_curriculum_contract_cs21a198.js?v=CS21A198"></script>
  <script src="english_lab_quiz_engine_cs21a198.js?v=CS21A198"></script>
  <script type="text/babel" src="english_lab_quiz_time_live_cs21a198.jsx?v=CS21A198"></script>
  <script type="text/babel">
    const root=ReactDOM.createRoot(document.getElementById('root'));
    let phase='OPEN';
    let mobile=false;
    function response(){
      const now=Date.now();
      return {
        ok:true,quiz_time:true,answer_count:2,
        room:{room_code:'LAB-QUIZ',status:'LIVE'},
        player:{cod_estudiante:'QA-STU-007',nombre:'Naty'},
        can_answer:phase==='OPEN',
        leaderboard:[
          {rank:1,cod_estudiante:'QA-STU-007',nombre:'Naty',points:3,correct:3},
          {rank:2,cod_estudiante:'QA-STU-008',nombre:'Chu',points:2,correct:2},
        ],
        quiz_state:{
          version:'CS21A198',room_code:'LAB-QUIZ',phase,state_revision:8,question_index:4,question_total:10,
          question:{question_id:'QT-PREVIEW-4',source_item_id:'GRAM-B1-U01-002',level_id:'B1',unit_id:'B1-U01',area_id:'GRAM',template_id:'GRAM_01',item_type:'MCQ',prompt_es:'Elegí la opción que completa correctamente una presentación.',stem:'Complete the introduction: “___ name is Ana.”',options:[{id:'A',label:'My'},{id:'B',label:'Your'},{id:'C',label:'His'},{id:'D',label:'Her'}],difficulty_1_10:1,position:4,total:10},
          reveal:phase==='REVEAL'?{visible:true,correct_option:'A',explanation_es:'Usamos “my” para hablar de nuestro propio nombre.',closes_at:new Date(now+7000).toISOString()}:{visible:false},
          turn_state:{participation_policy:'EVERYONE',turn_number:4,turn_started_at:new Date(now-3000).toISOString(),turn_ends_at:new Date(now+15000).toISOString()},
          answered_player_ids:[],
        },
        curriculum:{unit_name:"What's your name?",unit_objective_es:'Presentarse, saludar y compartir información personal básica en inglés.'}
      };
    }
    function render(){document.getElementById('frame').className=mobile?'preview-phone':'';root.render(<EnglishLabQuizTimeCS21A198.QuizStage response={response()} readOnly={false} busy={false} localSelected="" onAnswer={()=>{}}/>);}
    document.getElementById('openBtn').onclick=()=>{phase='OPEN';render();};
    document.getElementById('revealBtn').onclick=()=>{phase='REVEAL';render();};
    document.getElementById('desktopBtn').onclick=()=>{mobile=false;render();};
    document.getElementById('mobileBtn').onclick=()=>{mobile=true;render();};
    setTimeout(render,300);
  </script>
</body>
</html>
