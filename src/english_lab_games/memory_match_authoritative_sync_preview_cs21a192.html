<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QA · Memory Match Authoritative Sync CS21A192</title>
  <link rel="stylesheet" href="../../styles/tokens.css">
  <link rel="stylesheet" href="../../styles/english_lab_memory_match_cs21a173.css?v=CS21A192">
  <link rel="stylesheet" href="../../styles/english_lab_memory_match_classic_sync_cs21a189.css?v=CS21A192">
  <style>
    body{margin:0;padding:18px;background:#eaf0f7;font-family:system-ui,sans-serif;color:#001e47}
    #root{max-width:760px;margin:0 auto}.qa-parent{margin-bottom:10px;padding:9px 12px;border:1px solid #b7d5ff;border-radius:12px;background:#fff;font:700 12px/1.4 ui-monospace,monospace}
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="../../vendor/react.js"></script>
  <script src="../../vendor/react-dom.js"></script>
  <script src="../../vendor/babel.js"></script>
  <script src="../english_lab_ux_cs21a181.js?v=CS21A192"></script>
  <script src="./english_lab_runtime_cs21a173.js?v=CS21A192"></script>
  <script src="./english_lab_turn_engine_cs21a176.js?v=CS21A176"></script>
  <script src="./english_lab_live_sync_guard_cs21a177.js?v=CS21A192"></script>
  <script type="text/babel" src="./memory_match_engine_cs21a173.jsx?v=CS21A188"></script>
  <script type="text/babel" src="./memory_match_shared_discovery_cs21a188.jsx?v=CS21A188"></script>
  <script type="text/babel" src="./memory_match_classic_sync_cs21a189.jsx?v=CS21A192"></script>
  <script type="text/babel" src="./english_lab_live_memory_match_adapter_cs21a174.jsx?v=CS21A188"></script>
  <script type="text/babel" src="./english_lab_live_memory_match_classic_sync_adapter_cs21a189.jsx?v=CS21A189"></script>
  <script type="text/babel" src="./english_lab_live_memory_match_authoritative_sync_adapter_cs21a192.jsx?v=CS21A192"></script>
  <script type="text/babel">
    const params=new URLSearchParams(location.search);
    const viewer=params.get('viewer')||'P1';
    const PLAYERS=[
      {player_id:'P1',cod_estudiante:'P1',name:'Chu',team_id:'NO_TEAM'},
      {player_id:'P2',cod_estudiante:'P2',name:'Naty',team_id:'NO_TEAM'},
    ];
    const CARDS=[
      {card_id:'P1-L',pair_id:'PAIR-1',face_type:'TEXT',label:'teacher'},
      {card_id:'P2-L',pair_id:'PAIR-2',face_type:'TEXT',label:'student'},
      {card_id:'P1-R',pair_id:'PAIR-1',face_type:'TEXT',label:'profesor/a'},
      {card_id:'P2-R',pair_id:'PAIR-2',face_type:'TEXT',label:'estudiante'},
    ];
    const now=Date.now();
    const turnEnd=now+20000;
    function initialState(){
      const player=PLAYERS.find(item=>item.player_id===viewer)||null;
      const turn={version:'CS21A176',participation_policy:'ROUND_ROBIN',player_order:['P1','P2'],player_cursor:0,team_order:[],team_cursor:0,team_player_orders:{},team_player_cursors:{},active_player_id:'P1',active_team_id:'',turn_number:1,turn_started_at:new Date(now).toISOString(),turn_ends_at:new Date(turnEnd).toISOString(),last_player_id:'',last_team_id:'',reason:'ROUND_STARTED'};
      const shared={version:'CS21A192',state_revision:1,board_version:1,claimed_pairs:{},matched_pair_ids:[],active_attempt:null,completed:false};
      const room={room_id:'ROOM-192',room_code:'LAB-192',game_code:'MEMORY_MATCH',game_id:'MEMORY_MATCH',game_label:'Memory Match',status:'LIVE',round_status:'OPEN',mode:'INDIVIDUAL',unit:'U01',nivel:'B1'};
      const pkg={version:'CS21A192',sync_version:'CS21A192-MM-CONSISTENCY-1',state_revision:1,server_now:new Date(now).toISOString(),server_now_ms:now,room:{room_code:'LAB-192',game_id:'MEMORY_MATCH',mode:'INDIVIDUAL',level_id:'B1'},round:{round_id:'LAB-192-R1',index:1,title:'Memory Match · U01',cards:CARDS},rules:{round_duration_ms:20000,auto_start_delay_ms:0,reveal_duration_ms:2200,team_size:1},state:{phase:'OPEN',started_at:turn.turn_started_at,ends_at:turn.turn_ends_at,active_player_id:'P1',active_team_id:''},players:PLAYERS,teams:[],player,turn_state:turn,shared_state:shared};
      return {ok:true,sync_version:'CS21A192-MM-CONSISTENCY-1',state_revision:1,server_now:new Date(now).toISOString(),server_now_ms:now,turn_remaining_ms:20000,memory_match:true,room,player,room_package:pkg,turn_state:turn,shared_state:shared,stats:{players:2,answers_current:0},leaderboard:[{rank:1,cod_estudiante:'P1',nombre:'Chu',points:0},{rank:2,cod_estudiante:'P2',nombre:'Naty',points:0}],team_leaderboard:[]};
    }
    async function postLive(fn,payload,timeoutMs=35000){
      const controller=typeof AbortController!=='undefined'?new AbortController():null;
      const timer=controller?setTimeout(()=>controller.abort(),timeoutMs):null;
      try{
        const response=await fetch(`/__cs21a192_live?fn=${encodeURIComponent(fn)}`,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,...payload}),signal:controller?controller.signal:undefined});
        const data=await response.json();
        if(!response.ok||!data||data.ok===false)throw new Error(data&&data.mensaje||data&&data.error||`HTTP ${response.status}`);
        return data;
      }catch(error){
        if(error&&error.name==='AbortError')throw new Error(`La lectura excedio ${timeoutMs} ms.`);
        throw error;
      }finally{if(timer)clearTimeout(timer);}
    }
    function App(){
      const [state,setState]=React.useState(initialState);
      const Adapter=window.MemoryMatchLiveRoundCS21A174;
      const sync=window.EnglishLabMemoryMatchAuthoritativeSyncCS21A192;
      const revision=sync.revisionOf(state);
      React.useEffect(()=>{
        window.__QA_PARENT_STATE__=state;
        window.__QA_REVISION_HISTORY__=window.__QA_REVISION_HISTORY__||[];
        const last=window.__QA_REVISION_HISTORY__[window.__QA_REVISION_HISTORY__.length-1];
        if(!last||last.stateRevision!==revision.stateRevision||last.turnNumber!==revision.turnNumber||last.boardVersion!==revision.boardVersion)window.__QA_REVISION_HISTORY__.push(revision);
      },[state,revision.stateRevision,revision.turnNumber,revision.boardVersion]);
      return <>
        <div className="qa-parent" data-parent-revision={revision.stateRevision} data-parent-turn={revision.turnNumber} data-parent-board={revision.boardVersion}>parent r{revision.stateRevision} · turn {revision.turnNumber} · board {revision.boardVersion} · {viewer}</div>
        <Adapter state={state} postLive={postLive} readOnly={viewer==='teacher'} onStateChange={setState}/>
      </>;
    }
    (async()=>{
      for(let index=0;index<240&&!window.EnglishLabMemoryMatchAuthoritativeSyncCS21A192;index+=1)await new Promise(resolve=>setTimeout(resolve,25));
      if(!window.EnglishLabMemoryMatchAuthoritativeSyncCS21A192)throw new Error('No cargó CS21A192.');
      ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    })().catch(error=>{document.getElementById('root').textContent='ERROR QA: '+error.message;});
  </script>
</body>
</html>
