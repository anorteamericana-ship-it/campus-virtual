<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Progress Check 01 · Básico I · Academia Norteamericana</title>
<style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#193958;background:#f3f7fc}*{box-sizing:border-box}
body{margin:0}.wrap{max-width:1050px;margin:auto;padding:19px}.hero{background:#063c7a;color:white;border-radius:15px;padding:23px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.hero h1{margin:4px 0;font-size:clamp(24px,4vw,32px)}.hero p{font-size:13px;opacity:.85;margin:5px 0}.pill{background:#f4c53e;color:#57400a;padding:11px;border-radius:11px;font-size:12px;font-weight:800;align-self:flex-start}
.note{background:#eff4fa;color:#55708d;border:1px solid #dde7f1;padding:9px 12px;border-radius:9px;margin:9px 0;font-size:11px;line-height:1.4}
.tabs{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}.tabs button{background:white;border:1px solid #cfdae6;color:#25476d;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}.tabs button[aria-selected=true]{background:#f4c53e;border-color:#dca828}
.track{background:#dce6ef;border-radius:99px;height:8px;overflow:hidden;margin-bottom:14px}.fill{height:100%;width:0;background:#e8b52d}
.card{background:white;border:1px solid #dce5f0;border-radius:14px;padding:22px;box-shadow:0 9px 27px #17395b09}.card h2{margin:0 0 8px;font-size:22px}.help{font-size:13px;color:#64748b;line-height:1.55}
.question{background:#fafcff;border:1px solid #dde6ef;padding:14px 16px;border-radius:12px;margin:13px 0}
.question strong{display:block;font-size:14px;margin-bottom:12px;line-height:1.55}.question label{display:flex;align-items:center;gap:10px;border:1px solid #d3deeb;background:white;border-radius:9px;padding:10px 12px;margin:7px 0;cursor:pointer;font-size:13px}
.question label:has(input:checked){background:#e8f3ff;border-color:#2470b5}.question input[type=radio]{accent-color:#0d5aa9}
.question input[type=text]{width:100%;max-width:560px;padding:12px;border-radius:9px;border:1px solid #bccbdd;font-size:15px}
.foot{display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:17px 0}.foot>div{display:flex;flex-wrap:wrap;gap:8px}
button.action{border:none;background:#073b78;color:white;border-radius:9px;padding:12px 15px;font-weight:800;cursor:pointer}.action.secondary{background:#fff;color:#073b78;border:1px solid #b7cadf}.action:disabled{opacity:.4;cursor:default}
.progress{font-size:12px;color:#4d6583;font-weight:700}.drawing{background:#ebf4fa;padding:13px;border:1px solid #d6e6f3;border-radius:12px}.drawing img{display:block;width:100%;height:auto;max-width:680px;margin:auto;border-radius:9px}.f111-audio{margin:8px 0 18px;padding:15px;border:1px solid #bdd4eb;background:#eff7ff;border-radius:12px}.f111-audio strong{display:block;color:#164e87;margin-bottom:7px}.f111-audio audio{width:100%;max-width:500px;margin:8px 0}.f111-audio-note{font-size:11px;color:#59708b;margin:7px 0 0}.f111-audio{padding:12px 14px}.done{background:#e7f5e7;border:1px solid #b4d6ba;color:#256036;padding:12px;border-radius:10px;margin-bottom:12px;font-size:13px}
@media(max-width:620px){.wrap{padding:8px}.card{padding:14px}.hero{padding:17px}}
</style></head>
<body><main class="wrap">
<header class="hero"><div><small>ACADEMIA NORTEAMERICANA · PROGRESS CHECK</small><h1>Quiz 1 · Básico I</h1><p>Unidades 1–2 · Lección 4 · Grupo Diego 0826</p></div><span class="pill">25 preguntas</span></header>
<div class="note" id="note" role="status">Vista previa docente · Podés probar el quiz. Las respuestas no se envían.</div>
<nav class="tabs" id="tabs" role="tablist"></nav><div class="track"><div class="fill" id="fill"></div></div>
<section id="page" class="card" aria-live="polite"></section>
<footer class="foot"><span class="progress" id="progress"></span><div>
<button type="button" class="action secondary" id="prev">Anterior</button>
<button type="button" class="action secondary" id="save">Guardar</button>
<button type="button" class="action" id="next">Siguiente sección</button>
<button type="button" class="action" id="submit">Finalizar vista previa</button>
</div></footer>

</main>
<script>
(function(){
'use strict';
var sections=[
{id:'A',title:'Listening',help:'Listen to the conversations. Check the correct answers.',items:[
['A1',"The boy’s first name is _____.",['Z-A-C-K-A-R-Y','Z-A-C-H-A-R-Y','Z-A-C-H-E-R-Y']],
['A2',"Sue’s phone number is _____.",['718-555-8781','718-555-8881','718-555-8871']],
['A3',"The _____ is in Brendon’s bag.",['tablet','cell phone','camera']],
['A4',"The man’s wallet is _____.",['under his desk','in his pocket','in his book bag']]]},
{id:'B',title:'Possessive adjectives',help:'Complete the conversation with my, your, his or her.',items:[
['B1','Jake: Rico, this is a new student. _____ name is Sandra Kinsley.',['my','your','his','her']],
['B2','Jake: Sandra is in _____ English class.',['my','your','his','her']],
['B3',"Rico: Nice to meet you. What’s _____ last name again?",['my','your','his','her']]]},
{id:'C',title:'Complete the conversations',help:'Write the missing words; contractions and their full forms are reviewed by the teacher.',items:[
['C1','A: Excuse me. _____ you Ms. Brown?',null],['C2','B: No, _____ not.',null],
['C3','B: _____ over there. My name is Nicole Parker.',null],['C4',"A: Oh, I’m sorry. Well, _____ nice to meet you.",null]]},
{id:'D',title:'Correct responses',help:'Check the correct response.',items:[
['D1','Good-bye. Have a great weekend.',["I’m just fine. Thank you.","It’s nice to meet you.","Thanks. You, too."]],
['D2','See you later.',["I’m OK. Thank you.","OK. Bye-bye.","I’m just fine. How are you?"]],
['D3','Hi. How are you?',['Pretty good, thanks.','Good night.','Nice to meet you, too.']],
['D4','Good evening, Beth.',['Hello. How are you, Mr. Smith?','Great. How about you, Mr. Smith?','Good night. See you tomorrow, Mr. Smith.']]]},
{id:'E',title:'Correct words',help:'Circle the correct words. Two responses per conversation, six total.',items:[
['E1a','1 · A: What are (_____) ?', ['it','this','these']],
['E1b','1 · B: (_____) headphones.', ['This','They’re','It’s']],
['E2a','2 · A: (_____) your sunglasses?', ['Is this','This is','Are these']],
['E2b','2 · B: No, (_____) not.', ['is','it’s','they’re']],
['E3a','3 · A: Is (_____) a tablet?', ['the','this','they']],
['E3b',"3 · B: No, it isn’t. It’s (_____) laptop.", ['this','a','an']]]},
{id:'F',title:'Prepositions of place',help:'Use the correct prepositions: in front of, next to, on, under. Observá la imagen.',items:[
['F1',"1 · A: Where are the keys? B: They’re _____ the backpack.",['in front of','next to','on','under']],
['F2',"2 · A: Is the cell phone behind the backpack? B: No, it’s not. It’s _____ the backpack.",['in front of','next to','on','under']],
['F3',"3 · A: Where is the newspaper? B: It’s _____ the backpack.",['in front of','next to','on','under']],
['F4',"4 · A: Are the books _____ the cell phone? B: Yes, they are.",['in front of','next to','on','under']]]}
];
var total=sections.reduce(function(n,s){return n+s.items.length},0);
if(total!==25)throw new Error('Bank integrity: expected 25 responses');
var storage='F111_B1_PC01_DIGITAL_PREVIEW_20261022';
var liveMode=(new URLSearchParams(location.search)).get('live')==='1';
var saved={};if(!liveMode){try{saved=JSON.parse(sessionStorage.getItem(storage)||'{}')}catch(_){saved={}}}
var answers=saved.answers||{},sent=!!saved.sent,active=0;

var byId=function(s){return document.getElementById(s)};
var node=function(t,txt,cl){var x=document.createElement(t);if(txt!==null&&txt!==undefined)x.textContent=txt;if(cl)x.className=cl;return x};
var persist=function(){if(!liveMode)sessionStorage.setItem(storage,JSON.stringify({answers:answers,sent:sent}))};
var filled=function(){return Object.keys(answers).filter(function(k){return String(answers[k]||'').trim()}).length};
sections.forEach(function(s,i){var tab=node('button',s.id+' · '+s.items.length);tab.type='button';tab.setAttribute('role','tab');tab.addEventListener('click',function(){active=i;render()});byId('tabs').append(tab)});
function diagram(){
var box=node('div',null,'drawing');
var img=node('img');
img.src='../media/qz32/b1_pc01_original_photo.png?v=20261022-approved';
img.alt='Fotografía original: mochila roja con llaves encima; teléfono junto a la mochila; periódico debajo; dos libros sobre la mesa.';
img.width=555;img.height=375;img.loading='eager';
box.append(img);
return box;
}
function listening(){
var box=node('div',null,'f111-audio');
var label=node('strong','♪ Listening');
var player=node('audio');
player.controls=true;player.preload='metadata';player.id='b1Pc01Player';
player.src='../media/qz32/b1_pc01_listening_track01.mp3?v=20261022-wq1';
player.setAttribute('aria-label','Listening del Quiz 1 de Básico I');
var status=node('p','', 'f111-audio-note');
player.addEventListener('error',function(){
 status.textContent='El audio no se pudo reproducir. Recargá la página o avisá a tu profesor.';
});
box.append(label,player,status);
return box;
}
function status(){var n=filled();byId('progress').textContent=n+' de '+total+' respuestas · '+Math.round(n/total*100)+' %';byId('fill').style.width=Math.round(n/total*100)+'%'}
function render(){
var s=sections[active],page=byId('page');page.replaceChildren();
page.append(node('h2',s.id+' · '+s.title+' · '+s.items.length+' puntos'),node('p',s.help,'help'));
if(sent)page.append(node('p',liveMode?'Quiz entregado · Pendiente de revisión docente.':'Vista previa finalizada.','done'));
if(s.id==='A')page.append(listening());
if(s.id==='F')page.append(diagram());
s.items.forEach(function(q){var card=node('div',null,'question');card.append(node('strong',q[0]+' · '+q[1]));
if(q[2]===null){var t=node('input');t.type='text';t.value=answers[q[0]]||'';t.placeholder='Type your answer';t.autocomplete='off';t.disabled=sent;t.setAttribute('aria-label',q[1]);t.addEventListener('input',function(){answers[q[0]]=t.value;persist();status()});card.append(t)}
else q[2].forEach(function(v){var label=node('label'),radio=node('input');radio.type='radio';radio.name=q[0];radio.value=v;radio.checked=answers[q[0]]===v;radio.disabled=sent;radio.addEventListener('change',function(){answers[q[0]]=v;persist();status()});label.append(radio,node('span',v));card.append(label)});
page.append(card)});
Array.from(byId('tabs').children).forEach(function(x,i){x.setAttribute('aria-selected',String(i===active))});
byId('prev').disabled=active===0;byId('next').hidden=active===sections.length-1;
byId('submit').hidden=active!==sections.length-1||sent;byId('save').disabled=sent;status();
}

byId('prev').onclick=function(){if(active>0){active--;render();window.scrollTo(0,0)}};
byId('next').onclick=function(){if(active<sections.length-1){active++;render();window.scrollTo(0,0)}};
byId('save').onclick=function(){persist();byId('note').textContent='Respuestas guardadas en esta vista previa.'};
byId('submit').onclick=function(){var missing=total-filled();if(!confirm('Finalizar vista previa'+(missing?' con '+missing+' preguntas sin responder':'')+'?'))return;sent=true;persist();render();byId('note').textContent='Vista previa finalizada · Sin envío real.'};
render();
if(liveMode){
 var group=String((new URLSearchParams(location.search)).get('grupo')||'').toUpperCase();
 var context={cod_grupo:group,nivel:'B1',leccion:4},sessionToken='',apiBase='';
 var liveBusy=false,liveUncertain=false,dirty=false,lastSaved='',saveTimer=null;
 var statusEl=byId('note'),saveBtn=byId('save'),submitBtn=byId('submit');
 var verifyBtn=node('button','Verificar entrega','action secondary');verifyBtn.type='button';verifyBtn.hidden=true;
 submitBtn.after(verifyBtn);
 function liveShow(message){statusEl.textContent=message;}
 function liveLock(){
  saveBtn.disabled=liveBusy||sent||liveUncertain;
  submitBtn.disabled=liveBusy||sent||liveUncertain||filled()===0;
  verifyBtn.hidden=!liveUncertain;
  var els=byId('page').querySelectorAll('input');
  els.forEach(function(el){el.disabled=sent||liveUncertain||liveBusy});
 }
 async function call(fn,body){
  if(!apiBase||!sessionToken)throw Error('Sesión no disponible.');
  var res=await fetch(apiBase+'?fn='+encodeURIComponent(fn),{
   method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
   body:JSON.stringify(Object.assign({fn:fn,token:sessionToken},body||{}))
  });
  var data;try{data=await res.json()}catch(_){throw Error('No se recibió confirmación.')}
  if(!res.ok||!data||data.ok!==true)throw Error((data&&(data.error||data.mensaje))||'Operación no disponible.');
  return data;
 }
 async function saveLive(){
  if(liveBusy||sent||liveUncertain||!dirty)return;
  liveBusy=true;liveLock();
  var snapshot=JSON.stringify(answers);
  try{
   var result=await call('qzProgressSaveDraft',Object.assign({},context,{respuestas:Object.assign({},answers)}));
   if(result.estado==='ENTREGADO'||result.estado==='REVISADO'){sent=true;render();liveShow('Quiz ya entregado.');}
   else if(snapshot===JSON.stringify(answers)){dirty=false;lastSaved=snapshot;liveShow('Avance guardado.')}
   else{dirty=true;liveShow('Hay respuestas nuevas por guardar.')}
  }catch(e){dirty=true;liveShow('No se pudo guardar: '+e.message);}
  finally{liveBusy=false;liveLock();}
 }
 async function checkSubmission(){
  if(liveBusy)return;
  liveBusy=true;liveLock();
  try{
   var state=await call('qzProgressMyAttempt',context);
   if(state.estado==='ENTREGADO'||state.estado==='REVISADO'){
    sent=true;dirty=false;liveUncertain=false;render();
    liveShow(state.estado==='REVISADO'?'Revisado · Nota '+state.nota+'/100 · '+(state.comentario_docente||''):'Entrega confirmada. El docente revisará tus respuestas.');
   }else{liveShow('Entrega sin confirmar. Consultá a tu docente antes de reintentar.')}
  }catch(e){liveShow('No se pudo verificar la entrega. Consultá a tu docente.')}
  finally{liveBusy=false;liveLock();}
 }
 function validSession(){
  try{
   if(window.parent===window||window.parent.location.origin!==location.origin)throw Error();
   // API del Quiz B1 separada del login estable del Campus.
   apiBase=String(window.parent.F111_QZ_API_URL||window.parent.APPS_SCRIPT_URL||'');
   sessionToken=String(window.parent.getSessionToken?window.parent.getSessionToken():'');
  }catch(_){apiBase='';sessionToken='';}
  return !!apiBase&&!!sessionToken&&group==='B1-KJ18-C3-0826';
 }
 async function startLive(){
  byId('save').textContent='Guardar avance';byId('submit').textContent='Entregar quiz';
  document.querySelector('.pill').textContent='Evaluación de clase';
  if(!validSession()){liveShow('Abrí el quiz desde Mi Campus con tu sesión de estudiante.');saveBtn.disabled=true;submitBtn.disabled=true;return}
  liveBusy=true;liveLock();liveShow('Comprobando disponibilidad del quiz…');
  try{
   var q=await call('qzProgressGet',context);
   if(q.quiz_id!=='IC5_B1_WQ01'||q.peso_oficial!==0||q.nivel!=='B1'||q.leccion!==4)
    throw Error('El quiz no coincide con tu grupo.');
   var allowed={};(q.secciones||[]).forEach(function(sec){
    var ids=sec.items&&sec.items.length>1?sec.items:[null];
    ids.forEach(function(item){allowed[sec.id+(item===null?'':item)]=true});
   });
   var expected=[];sections.forEach(function(sec){sec.items.forEach(function(item){expected.push(item[0])})});
   if(expected.length!==25||Object.keys(allowed).length!==25||expected.some(function(x){return !allowed[x]}))
    throw Error('Las 25 preguntas no coinciden con el banco académico.');
   var prior=await call('qzProgressMyAttempt',context);
   answers=prior.respuestas&&typeof prior.respuestas==='object'?prior.respuestas:{};
   sent=prior.estado==='ENTREGADO'||prior.estado==='REVISADO';
   lastSaved=JSON.stringify(answers);dirty=false;render();
   liveShow(sent?(prior.estado==='REVISADO'?'Revisado · Nota '+prior.nota+'/100 · '+(prior.comentario_docente||''):'Ya entregaste este quiz. Pendiente de revisión.'):'Quiz habilitado por tu profesor. Respondé y guardá tu avance.');
  }catch(e){sent=true;render();liveShow('Quiz no disponible: '+e.message);}
  finally{liveBusy=false;liveLock();}
 }
 // Mantener los datos solo en memoria; en live nunca escribir a sessionStorage.
 byId('page').addEventListener('input',function(){if(sent)return;dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(saveLive,1300);});
 byId('page').addEventListener('change',function(){if(sent)return;dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(saveLive,900);});
 // El input de respuestas se actualiza antes del evento que llega a page.
 saveBtn.onclick=function(){dirty=true;clearTimeout(saveTimer);saveLive()};
 submitBtn.onclick=async function(){
  if(liveBusy||sent||liveUncertain||filled()===0)return;
  clearTimeout(saveTimer);
  if(!confirm('¿Entregar el Quiz 1 ahora? Luego no podrás modificar las respuestas.'))return;
  liveBusy=true;liveLock();liveShow('Entregando…');
  try{
   var r=await call('qzProgressSubmit',Object.assign({},context,{respuestas:Object.assign({},answers)}));
   if(r.estado==='ENTREGADO'||r.estado==='REVISADO'){sent=true;dirty=false;render();liveShow('Quiz entregado. Pendiente de revisión docente.');}
   else throw Error('Sin confirmación.');
  }catch(e){liveUncertain=true;liveShow('No se confirmó la entrega. Utilizá «Verificar entrega» antes de reintentar.');}
  finally{liveBusy=false;liveLock();}
 };
 verifyBtn.onclick=checkSubmission;
 startLive();
}

})();
</script></body></html>
