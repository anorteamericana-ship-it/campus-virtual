<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exámenes · F98.4M · Academia Norteamericana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/tokens.css?v=F98.4M">
<style>
  html,body{margin:0;min-height:100%;background:var(--bg,#f5f0e7)}
  #root{min-height:100vh}
  .exam-boot{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;font-family:Poppins,system-ui,sans-serif;color:#001E47}
  .exam-boot-card{width:min(620px,100%);padding:30px 32px;border-radius:18px;background:#fff;border:1px solid #E2D8C8;box-shadow:0 18px 60px rgba(0,0,0,.10);text-align:center}
  .exam-boot-k{display:inline-flex;padding:5px 12px;border-radius:999px;background:#E7F1FA;color:#0C4F86;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}
  .exam-boot-card h2{margin:0 0 8px;font-size:25px;letter-spacing:-.03em}
  .exam-boot-card p{margin:0;color:#5A6472;font-size:13.5px;line-height:1.55}
  .exam-boot-spinner{width:28px;height:28px;margin:18px auto 0;border:3px solid #DCE7F3;border-top-color:#003B7A;border-radius:50%;animation:examspin .8s linear infinite}
  @keyframes examspin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root">
  <div class="exam-boot" role="status" aria-live="polite">
    <div class="exam-boot-card">
      <div class="exam-boot-k">Aplicación en línea</div>
      <h2>Preparando el sistema de exámenes…</h2>
      <p>Se está cargando el módulo oficial desde el Campus.</p>
      <div class="exam-boot-spinner" aria-hidden="true"></div>
    </div>
  </div>
</div>
<script>
(function(){
  'use strict';
  var BUILD='F98.4M';
  var root=document.getElementById('root');
  var failed=false;
  window.__EXAMENES_BUILD__=BUILD;

  function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
  function fail(detail){
    if(failed||window.__EXAMENES_BOOT_OK__)return;
    failed=true;
    root.innerHTML='<div class="exam-boot"><div class="exam-boot-card">'
      +'<div class="exam-boot-k" style="background:#F7E8E9;color:#7A1E2C">Error de carga</div>'
      +'<h2>No se pudo iniciar el examen</h2>'
      +'<p>El módulo dejó de cargar antes de abrir la aplicación. Recargá esta sección. Si continúa, la versión publicada de GitHub no coincide con F98.4M.</p>'
      +(detail?'<div style="margin:15px auto;padding:10px 12px;max-width:540px;border-radius:10px;background:#F8F6F1;color:#594F46;font:11.5px/1.45 JetBrains Mono,monospace;text-align:left;word-break:break-word">'+esc(detail)+'</div>':'')
      +'<button type="button" onclick="location.reload()" style="margin-top:16px;background:#001E47;color:#fff;border:0;padding:11px 22px;border-radius:10px;font-weight:700;cursor:pointer">Volver a cargar</button>'
      +'</div></div>';
  }

  window.addEventListener('error',function(e){
    var d=e&&e.message?e.message:(e&&e.target&&e.target.src?'No cargó: '+e.target.src:'Error durante el arranque.');
    fail(d);
  },true);
  window.addEventListener('unhandledrejection',function(e){
    var r=e&&e.reason;fail(r&&r.message?r.message:String(r||'Promesa rechazada durante el arranque.'));
  });

  async function boot(){
    try{
      var host=null;
      try{host=(window.parent&&window.parent!==window)?window.parent:null;}catch(_){host=null;}
      var ReactRef=(host&&host.React)||window.React;
      var ReactDOMRef=(host&&host.ReactDOM)||window.ReactDOM;
      var BabelRef=(host&&host.Babel)||window.Babel;
      if(!ReactRef||!ReactDOMRef||!BabelRef||typeof BabelRef.transform!=='function'){
        throw new Error('El Campus padre no proporcionó React, ReactDOM o Babel.');
      }
      window.React=ReactRef;
      window.ReactDOM=ReactDOMRef;
      window.Babel=BabelRef;

      var url='../src/examenes_bundle.jsx?v='+encodeURIComponent(BUILD);
      var res=await fetch(url,{cache:'no-store',credentials:'same-origin'});
      if(!res.ok)throw new Error('No se pudo descargar '+url+' (HTTP '+res.status+').');
      var source=await res.text();
      if(!source||source.length<1000)throw new Error('El paquete de exámenes llegó vacío o incompleto.');
      var transformed=BabelRef.transform(source,{presets:['react'],sourceType:'script',filename:'examenes_bundle_'+BUILD+'.jsx'}).code;
      var run=new Function(transformed+'\n//# sourceURL=examenes_bundle_'+BUILD+'.js');
      run();
      setTimeout(function(){if(!window.__EXAMENES_BOOT_OK__)fail('El paquete se ejecutó, pero React no confirmó el montaje de '+BUILD+'.');},3500);
    }catch(err){fail(err&&err.message?err.message:String(err));}
  }

  setTimeout(function(){if(!window.__EXAMENES_BOOT_OK__)fail('Tiempo de arranque excedido (15 segundos).');},15000);
  boot();
})();
</script>
</body>
</html>
