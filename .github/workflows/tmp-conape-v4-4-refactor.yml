name: TEMP CONAPE V4.4 scheduled mirror refactor

on:
  push:
    branches:
      - feature/conape-auto-sync-mirror-v4-4
    paths:
      - '.github/workflows/tmp-conape-v4-4-refactor.yml'
      - 'scripts/tmp_conape_v4_4_refactor.py'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/conape-auto-sync-mirror-v4-4
          fetch-depth: 0
      - name: Apply deterministic refactor
        run: |
          python3 scripts/tmp_conape_v4_4_refactor.py
          git checkout HEAD -- .github/workflows/qa-conape-live-c3-6.yml
          git checkout HEAD -- .github/workflows/tmp-conape-v4-4-refactor.yml
          git checkout HEAD -- scripts/tmp_conape_v4_4_refactor.py
      - name: Verify candidate
        run: |
          node --check services/conape-bridge/server_v2.mjs
          node --check src/conape_bridge_client_c3_6.js
          git diff --check
          ! grep -F 'conapeMirrorApplySnapshotV44' services/conape-bridge/server_v2.mjs
          python3 - <<'PY'
          from pathlib import Path
          src = Path('services/conape-bridge/server_v2.mjs').read_text(encoding='utf-8')
          good = r"update(`${ts}\n${nonce}\n${payload_json}`, 'utf8')"
          bad = r"update(`${ts}\\n${nonce}\\n${payload_json}`, 'utf8')"
          assert good in src, 'HMAC canonical newline escapes missing'
          assert bad not in src, 'HMAC canonical contains literal backslash-n'
          assert "action:'read_mirror'" in src
          assert "action:'apply_snapshot'" in src
          assert "'/v1/prospects/refresh'" in src
          PY
      - name: Commit auxiliary result
        run: |
          git config user.name 'anorteamericana-ship-it'
          git config user.email 'anorteamericana@gmail.com'
          git switch -c automation/conape-v44-scheduled-result
          git add services/conape-bridge/server_v2.mjs src/conape_bridge_client_c3_6.js src/ventas_dashboard.jsx ventas.html
          git commit -m 'feat(conape): schedule mirror sync and add manual refresh'
          git push --force origin HEAD:automation/conape-v44-scheduled-result
