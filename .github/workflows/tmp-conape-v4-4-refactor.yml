name: TEMP CONAPE V4.4 scheduled mirror refactor

on:
  push:
    branches:
      - feature/conape-auto-sync-mirror-v4-4
    paths:
      - '.github/workflows/tmp-conape-v4-4-refactor.yml'
      - 'scripts/tmp_conape_v4_4_refactor.py'
      - 'scripts/tmp_fix_conape_v4_4_refactor.py'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/conape-auto-sync-mirror-v4-4
          fetch-depth: 0
      - name: Apply deterministic refactor
        run: |
          python3 scripts/tmp_fix_conape_v4_4_refactor.py
          python3 scripts/tmp_conape_v4_4_refactor.py
          rm -f scripts/tmp_fix_conape_v4_4_refactor.py
      - name: Verify candidate
        run: |
          node --check services/conape-bridge/server_v2.mjs
          node --check src/conape_bridge_client_c3_6.js
          git diff --check
          ! grep -F 'conapeMirrorApplySnapshotV44' services/conape-bridge/server_v2.mjs
          grep -F "update(\`${ts}\\n${nonce}\\n${payload_json}\`, 'utf8')" services/conape-bridge/server_v2.mjs
      - name: Commit candidate
        run: |
          git config user.name 'anorteamericana-ship-it'
          git config user.email 'anorteamericana@gmail.com'
          git add -A
          git commit -m 'feat(conape): schedule mirror sync and add manual refresh'
          git push origin HEAD:feature/conape-auto-sync-mirror-v4-4
