name: F111 E3 · sync safe bundle in feature branch
on:
  push:
    branches:
      - hotfix/f111-e3-public-demo-answer-clean-20261017
    paths:
      - scripts/rebuild_exam_bundle_f111_e3.mjs
      - .github/workflows/f111-e3-sync-exam-bundle.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild-and-commit:
    if: github.ref == 'refs/heads/hotfix/f111-e3-public-demo-answer-clean-20261017'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact target branch and regenerate effective bundle
        run: |
          test "$(git branch --show-current)" = "hotfix/f111-e3-public-demo-answer-clean-20261017"
          node scripts/rebuild_exam_bundle_f111_e3.mjs
          git diff --check
      - name: Commit synchronized bundle (never to main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/examenes_bundle.jsx
          if git diff --cached --quiet; then echo "No bundle changes"; exit 0; fi
          git commit -m "F111 E3 · sync generated bundle after demo answer cleanup"
          git push origin HEAD:refs/heads/hotfix/f111-e3-public-demo-answer-clean-20261017
