name: Bootstrap SEC004 Matriculas Preview Readonly CS21A198B

on:
  push:
    branches:
      - fix/sec004-matriculas-preview-readonly-cs21a198b
    paths:
      - 'scripts/bootstrap_patch_sec004_matriculas_preview_readonly_cs21a198b.mjs'
      - '.github/workflows/bootstrap-sec004-matriculas-preview-readonly-cs21a198b.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify exact base ancestry
        run: git merge-base --is-ancestor 3dbee801de4e6e28bbe14ce7bf2a8e5c9422a0e8 HEAD
      - name: Apply exact patch
        run: node scripts/bootstrap_patch_sec004_matriculas_preview_readonly_cs21a198b.mjs
      - name: Run CS21A198B guard
        run: node scripts/qa_sec004_matriculas_preview_readonly_cs21a198b.mjs
      - name: Regress CS21A198
        run: node scripts/qa_sec004_session_demo_isolation_cs21a198.mjs
      - name: Regress CS21A197
        run: node scripts/qa_lazy_loader_safe_user_errors_cs21a197.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Remove bootstrap artifacts and push verified candidate
        run: |
          rm scripts/bootstrap_patch_sec004_matriculas_preview_readonly_cs21a198b.mjs
          rm .github/workflows/bootstrap-sec004-matriculas-preview-readonly-cs21a198b.yml
          git add -A
          git commit -m 'CS21A198B · make Matriculas preview read-only'
          git push origin HEAD:fix/sec004-matriculas-preview-readonly-cs21a198b
