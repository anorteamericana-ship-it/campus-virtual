name: QA Examenes Admin Safe Errors CS21A210BC
on:
  push:
    branches: [fix/examenes-admin-safe-errors-cs21a210bc]
  pull_request:
    paths:
      - 'src/examenes_modes.jsx'
      - 'src/examenes_bundle.jsx'
      - 'scripts/qa_examenes_admin_safe_errors_cs21a210bc.mjs'
      - 'scripts/qa_examenes_admin_effective_boundary_cs21a210bb.mjs'
      - '.github/workflows/qa-examenes-admin-safe-errors-cs21a210bc.yml'
permissions:
  contents: read
jobs:
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: npm install --no-save @babel/parser@7.28.4
      - name: Parse JSX
        run: node -e "const fs=require('fs'),p=require('@babel/parser');for(const f of ['src/examenes_modes.jsx','src/examenes_bundle.jsx'])p.parse(fs.readFileSync(f,'utf8'),{sourceType:'script',plugins:['jsx']});"
      - name: Verify BC exact reconstruction
        run: node scripts/qa_examenes_admin_safe_errors_cs21a210bc.mjs --f111-d1-scoped
      - name: Regress BB effective admin ownership
        run: node scripts/qa_examenes_admin_effective_boundary_cs21a210bb.mjs
      - name: Regress BA teacher boundary
        run: node scripts/qa_examenes_teacher_safe_errors_cs21a210ba.mjs
      - name: Regress AY StudentMode
        run: node scripts/qa_examenes_student_safe_errors_cs21a210ay.mjs
      - name: E4 V3 no-new-findings against pinned main
        run: node scripts/qa_f111_d1_v3_baseline_e4.mjs
      - name: Diff hygiene
        run: git diff --check de49c25fa3de9f6a606a3d8d48832ebc296971cc HEAD -- src/examenes_modes.jsx src/examenes_app.jsx src/examenes_appcss.jsx src/examenes_bundle.jsx scripts/qa_f111* scripts/qa_examenes_admin_safe_errors_cs21a210bc.mjs
