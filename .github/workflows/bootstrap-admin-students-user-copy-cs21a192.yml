name: Bootstrap Admin Students User Copy CS21A192

on:
  push:
    branches:
      - fix/admin-students-user-copy-cs21a192
    paths:
      - 'scripts/bootstrap_patch_admin_students_user_copy_cs21a192.mjs'
      - '.github/workflows/bootstrap-admin-students-user-copy-cs21a192.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify exact base ancestry
        run: git merge-base --is-ancestor 72edf804366b8a184b94b397f365b40b9c19ea5e HEAD
      - name: Apply exact copy patch
        run: node scripts/bootstrap_patch_admin_students_user_copy_cs21a192.mjs
      - name: Run CS21A192 guard
        run: node scripts/qa_admin_students_user_copy_cs21a192.mjs
      - name: Regress CS21A191
        run: node scripts/qa_admin_students_safe_errors_cs21a191.mjs
      - name: Regress CS21A190
        run: node scripts/qa_admin_conape_user_copy_cs21a190.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Remove bootstrap artifacts and push verified candidate
        run: |
          rm scripts/bootstrap_patch_admin_students_user_copy_cs21a192.mjs
          rm .github/workflows/bootstrap-admin-students-user-copy-cs21a192.yml
          git add -A
          git commit -m 'CS21A192 · clean admin students user copy'
          git push origin HEAD:fix/admin-students-user-copy-cs21a192
