name: CS21A95 academic payment reversal

on:
  push:
    paths:
      - '.github/workflows/cs21a95_reversal_academic.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path=Path('src/admin_students_status_fresh_cs21a42.jsx')
          text=path.read_text(encoding='utf-8')
          old=text
          text=text.replace('// F98.4-Z6-CS21A92 · Estado fresco CS21A42 preservado + reversión auditada de pagos para Superadmin.','// F98.4-Z6-CS21A95 · Estado fresco preservado + reversión financiera y restauración académica para Superadmin.')
          text=text.replace("const REV_BUILD='F98.4-Z6-CS21A92';","const REV_BUILD='F98.4-Z6-CS21A95';")
          anchor="function rubroLabel(v){const x=clean(v).toUpperCase();return({MATRICULA:'Matrícula',CUOTA:'Cuota',CERTIFICADO:'Certificado',PROGRAMA_COMPLETO:'Programa completo',TITULO:'Programa completo',TOEIC:'TOEIC',OTRO:'Otro cargo',CAMBIO_GRUPO:'Cambio de grupo'})[x]||x||'Rubro'}"
          addition=anchor+"\nfunction academicLine(a){if(!a?.ok)return'Expediente académico no verificable';const levels=(a.niveles||[]).map(x=>`${x.nivel} ${x.estatus}${x.nota!=null?` ${x.nota}`:''}`).join(' · ');return `${levels||'Sin niveles'}${a.grupo_actual?` · Grupo ${a.grupo_actual}`:''}`}"
          if anchor not in text: raise SystemExit('rubroLabel anchor missing')
          text=text.replace(anchor,addition,1)
          old_confirm="const rubros=(op.rubros||[]).map((r,i)=>`• ${rubroLabel(r.tipo)}: ${cash(r.monto)}${op.recibos?.[i]?` · Rec. ${op.recibos[i]}`:''}`).join('\\n');\n   const ok=window.confirm(`REVERTIR PAGO COMPLETO\\n\\nEstudiante: ${codigo}\\nOperación: ${op.operacion_id}\\nComprobante: ${op.documento}\\nTotal: ${cash(op.monto_total)}\\nRecibos: ${(op.recibos||[]).join(', ')}\\n\\n${rubros}\\n\\nEsta acción retirará todos los rubros de esta operación y devolverá el saldo al comprobante bancario.\\n\\n¿Confirmar reversión?`);"
          new_confirm="const rubros=(op.rubros||[]).map((r,i)=>`• ${rubroLabel(r.tipo)}: ${cash(r.monto)}${op.recibos?.[i]?` · Rec. ${op.recibos[i]}`:''}`).join('\\n');\n   const academic=academicLine(op.academico);\n   const ok=window.confirm(`REVERTIR PAGO Y RESTAURAR EXPEDIENTE\\n\\nEstudiante: ${codigo}\\nOperación: ${op.operacion_id}\\nComprobante: ${op.documento}\\nTotal: ${cash(op.monto_total)}\\nRecibos: ${(op.recibos||[]).join(', ')}\\n\\n${rubros}\\n\\nEXPEDIENTE QUE SE CONSERVARÁ:\\n${academic}\\n\\nEsta acción retirará todos los rubros, devolverá el saldo al comprobante bancario y restaurará exactamente ESTATUS y el grupo académico.\\n\\n¿Confirmar reversión integral?`);"
          if old_confirm not in text: raise SystemExit('confirmation block missing')
          text=text.replace(old_confirm,new_confirm,1)
          text=text.replace('<h3 style={{margin:\'4px 0 2px\'}}>↶ Revertir pago</h3><div style={{fontSize:11,opacity:.9}}>Se revierte la operación completa; nunca un recibo aislado.</div>','<h3 style={{margin:\'4px 0 2px\'}}>↶ Revertir pago y restaurar expediente</h3><div style={{fontSize:11,opacity:.9}}>Se revierte la operación completa y se conserva la trayectoria académica exacta.</div>',1)
          old_card="<div style={{marginTop:5,fontSize:9,color:'#756D65'}}>{(item.rubros||[]).map(r=>`${rubroLabel(r.tipo)} ${cash(r.monto)}`).join(' · ')}</div>"
          new_card=old_card+"<div style={{marginTop:5,fontSize:9,fontWeight:850,color:'#1F5E38'}}>{academicLine(item.academico)}</div>"
          if old_card not in text: raise SystemExit('card block missing')
          text=text.replace(old_card,new_card,1)
          text=text.replace("{busy?'Revirtiendo operación…':'↶ Confirmar reversión'}","{busy?'Revirtiendo y restaurando…':'↶ Confirmar reversión integral'}",1)
          text=text.replace("{busy?'Consultando…':'↶ Revertir pago'}","{busy?'Consultando…':'↶ Revertir pago y expediente'}",1)
          old_toast="setToast(`Pago revertido · ${cash(d.monto_revertido)} · recibos ${(d.recibos||[]).join(', ')}`);"
          new_toast="setToast(`Pago y expediente restaurados · ${d.academico?.nivel_actual||'nivel actual'} ${d.academico?.estatus_actual||''} · ${cash(d.monto_revertido)}`);"
          if old_toast not in text: raise SystemExit('toast block missing')
          text=text.replace(old_toast,new_toast,1)
          if text==old: raise SystemExit('no frontend changes')
          path.write_text(text,encoding='utf-8')

          campus=Path('campus.html')
          html=campus.read_text(encoding='utf-8')
          old_html=html
          html=html.replace('src/admin_students_status_fresh_cs21a42.jsx?v=F98.4Z6CS21A94','src/admin_students_status_fresh_cs21a42.jsx?v=F98.4Z6CS21A95')
          if html==old_html: raise SystemExit('campus cache version anchor missing')
          campus.write_text(html,encoding='utf-8')

          assert "REV_BUILD='F98.4-Z6-CS21A95'" in text
          assert 'REVERTIR PAGO Y RESTAURAR EXPEDIENTE' in text
          assert 'F98.4Z6CS21A95' in html
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/admin_students_status_fresh_cs21a42.jsx campus.html
          git commit -m 'CS21A95 restaura expediente académico al revertir pagos'
          git push
