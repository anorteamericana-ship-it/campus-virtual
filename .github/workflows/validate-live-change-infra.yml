name: validate-live-change-infra

on:
  pull_request:
    paths:
      - 'scripts/prepare_apps_script_candidate.ps1'
      - 'scripts/release_apps_script.ps1'
      - 'config/apps-script-production.json'
      - '00_DOCUMENTACION/PRODUCTION_STATE.md'
      - '00_DOCUMENTACION/LIVE_CHANGE_RUNBOOK.md'
      - 'AGENTS.md'
      - '.github/workflows/validate-live-change-infra.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell runners
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'scripts/prepare_apps_script_candidate.ps1',
            'scripts/release_apps_script.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file :: $($_.Message) at $($_.Extent.StartLineNumber):$($_.Extent.StartColumnNumber)" }
              throw "PowerShell parse failed: $file"
            }
            Write-Host "PASS parse: $file"
          }

      - name: Validate production JSON
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg = Get-Content 'config/apps-script-production.json' -Raw | ConvertFrom-Json
          if ($cfg.environment -ne 'production') { throw 'environment must be production' }
          if ([string]::IsNullOrWhiteSpace([string]$cfg.scriptId)) { throw 'scriptId missing' }
          if ([string]::IsNullOrWhiteSpace([string]$cfg.deploymentId)) { throw 'deploymentId missing' }
          if ([int]$cfg.deployedVersion -lt 1) { throw 'deployedVersion invalid' }
          if ($cfg.lastVerifiedBy -ne 'authenticated-clasp-runtime') { throw 'runtime verification marker missing' }
          Write-Host "PASS production config @$( [int]$cfg.deployedVersion )"

      - name: Guard secrets and release safety switches
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'config/apps-script-production.json',
            '00_DOCUMENTACION/PRODUCTION_STATE.md',
            '00_DOCUMENTACION/LIVE_CHANGE_RUNBOOK.md',
            'scripts/prepare_apps_script_candidate.ps1',
            'scripts/release_apps_script.ps1'
          )
          $text = ($paths | ForEach-Object { Get-Content $_ -Raw }) -join "`n"
          $secretPatterns = @(
            'AIza[0-9A-Za-z_-]{20,}',
            'ghp_[0-9A-Za-z]{20,}',
            'github_pat_[0-9A-Za-z_]{20,}',
            'sk-[0-9A-Za-z_-]{20,}'
          )
          foreach ($pattern in $secretPatterns) {
            if ($text -match $pattern) { throw "possible secret pattern detected: $pattern" }
          }
          $release = Get-Content 'scripts/release_apps_script.ps1' -Raw
          foreach ($required in @('-ConfirmProduction','MaxChangedFiles','AllowManifestChange','rollback','HEAD_ORIGINAL','list-deployments')) {
            if (-not $release.Contains($required)) { throw "release safety token missing: $required" }
          }
          Write-Host 'PASS secret scan + release safety tokens'
