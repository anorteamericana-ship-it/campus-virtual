name: CS21A211 Final QA Package

on:
  push:
    branches: [fix/cs21a211-memory-match-10s-3s]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cs21a211-final-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-qa-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Freeze product runtime at final CS211 source head
        run: |
          set -euo pipefail
          PRODUCT_HEAD=e15df1a6c3a40278e2b72e8c87c4125022206c86
          git merge-base --is-ancestor "$PRODUCT_HEAD" HEAD
          git diff --name-only "$PRODUCT_HEAD"...HEAD | tee /tmp/post-product-delta.txt
          python3 - <<'PY'
          from pathlib import Path
          allowed={
            'scripts/qa_cs21a200_word_search_live_integration.mjs',
            '.github/workflows/qa-cs21a211-memory-match-fast-turn.yml',
            '.github/workflows/qa-cs21a211-final-package.yml',
          }
          changed={x.strip() for x in Path('/tmp/post-product-delta.txt').read_text().splitlines() if x.strip()}
          unexpected=changed-allowed
          if unexpected:
              raise SystemExit('Delta inesperado después del producto CS211: '+', '.join(sorted(unexpected)))
          print('Runtime product head congelado:', 'e15df1a6c3a40278e2b72e8c87c4125022206c86')
          PY
          git diff --exit-code "$PRODUCT_HEAD"...HEAD -- src/ styles/ apps_script_patches/ apps_script_unified/

      - name: Source truth and Memory Match contracts
        run: |
          set -euo pipefail
          node scripts/qa_cs21a202_source_truth.mjs
          node scripts/qa_cs21a203_live_sync.mjs
          node scripts/qa_cs21a203_custom_pair_start_guard.mjs
          node scripts/qa_cs21a211_memory_match_fast_turn_backend.mjs
          node scripts/qa_cs21a204_network_budget_model.mjs

      - name: Static regression all five games
        run: |
          set -u
          mkdir -p qa-output/cs211-final-static-logs
          failed=0
          for script in \
            scripts/test_english_lab_sentence_order_cs21a183.mjs \
            scripts/test_english_lab_curriculum_guard_cs21a183.mjs \
            scripts/test_english_lab_hangman_engine_cs21a191.mjs \
            scripts/test_english_lab_hangman_contract_cs21a191.mjs \
            scripts/qa_cs21a198_quiz_curriculum_core.mjs \
            scripts/qa_cs21a198_quiz_live_integration.mjs \
            scripts/qa_cs21a198_quiz_backend_contract.mjs \
            scripts/qa_cs21a204_quiz_live_compatibility.mjs \
            scripts/qa_cs21a199_word_search.mjs \
            scripts/qa_cs21a200_word_search_backend_contract.mjs \
            scripts/qa_cs21a200_word_search_live_integration.mjs \
            scripts/qa_cs21a205_english_lab_shell.mjs \
            scripts/qa_cs21a207_english_lab_navigation.mjs \
            scripts/qa_cs21a208_english_lab_legacy_routes.mjs
          do
            name="$(basename "$script" .mjs)"
            if node "$script" >"qa-output/cs211-final-static-logs/${name}.log" 2>&1; then
              cat "qa-output/cs211-final-static-logs/${name}.log"
            else
              cat "qa-output/cs211-final-static-logs/${name}.log"
              echo "FAIL: $script" | tee -a qa-output/cs211-final-static-logs/FAILURES.txt
              failed=1
            fi
          done
          test "$failed" -eq 0

      - name: Assemble one complete CS211 QA backend
        run: |
          set -euo pipefail
          node scripts/assemble_apps_script_cs21a211_unified.mjs
          cp apps_script_patches/99_CS21A211_ENGLISH_LAB_UNIFIED_COMPLETO.gs /tmp/cs211-backend.js
          node --check /tmp/cs211-backend.js
          grep -q 'CS21A211-MM-10S-3S-1' /tmp/cs211-backend.js
          grep -q 'CS21A201-CURRICULUM-SOURCE-1' /tmp/cs211-backend.js
          grep -q 'CS21A200-WORD-SEARCH-LIVE-1' /tmp/cs211-backend.js
          grep -q 'CS21A198-QUIZ-TIME-B1U01-2' /tmp/cs211-backend.js

      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Start source QA server
        run: |
          python3 -m http.server 4212 --bind 127.0.0.1 >/tmp/cs211-source.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4212/src/english_lab_games/english_lab_unified_shell_preview_cs21a205.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/cs211-source.log
          exit 1

      - name: Browser regression all five games
        env:
          QA_BASE_URL: http://127.0.0.1:4212
        run: |
          set -u
          mkdir -p qa-output/cs211-final-browser-logs
          failed=0
          for script in \
            scripts/test_english_lab_unified_shell_browser_cs21a205.mjs \
            scripts/test_english_lab_canonical_loader_browser_cs21a205.mjs \
            scripts/test_memory_match_conflict_reconciliation_browser_cs21a196.mjs \
            scripts/test_memory_match_fast_turn_browser_cs21a211.mjs \
            scripts/test_memory_match_lobby_start_rejoin_browser_cs21a203.mjs \
            scripts/test_english_lab_hangman_package_browser_cs21a191.mjs \
            scripts/qa_cs21a204_quiz_word_search_browser_smoke.mjs \
            scripts/test_english_lab_sentence_order_browser_cs21a209.mjs \
            scripts/test_english_lab_quiz_time_browser_cs21a210.mjs
          do
            name="$(basename "$script" .mjs)"
            if node "$script" >"qa-output/cs211-final-browser-logs/${name}.log" 2>&1; then
              cat "qa-output/cs211-final-browser-logs/${name}.log"
            else
              cat "qa-output/cs211-final-browser-logs/${name}.log"
              echo "FAIL: $script" | tee -a qa-output/cs211-final-browser-logs/FAILURES.txt
              failed=1
            fi
          done
          test "$failed" -eq 0

      - name: Build exact CS211 QA package
        run: |
          set -euo pipefail
          pkg=/tmp/CAMPUS_QA_ENGLISH_LAB_FINAL_CS211
          zipfile=/tmp/CAMPUS_QA_ENGLISH_LAB_FINAL_CS211.zip
          qa_exec='https://script.google.com/macros/s/AKfycbzzsmmHVRGlgltcUJf7Yi9R0z__vsu58Hw9Gq9rNn5pYVrgY5iZ0-xEEL-8wqL4uPVbaw/exec'
          product_head='e15df1a6c3a40278e2b72e8c87c4125022206c86'
          package_head="$(git rev-parse HEAD)"
          rm -rf "$pkg" "$zipfile" "$zipfile.sha256"
          mkdir -p "$pkg"
          rsync -a --exclude '.git' --exclude '.github' --exclude 'node_modules' --exclude 'qa-output' ./ "$pkg/"
          mkdir -p "$pkg/BACKEND_QA" "$pkg/EVIDENCIA_AUTOMATICA"
          cp apps_script_patches/99_CS21A211_ENGLISH_LAB_UNIFIED_COMPLETO.gs "$pkg/BACKEND_QA/99_CS21A211_ENGLISH_LAB_UNIFIED_COMPLETO.gs"
          cp -r qa-output/. "$pkg/EVIDENCIA_AUTOMATICA/" 2>/dev/null || true

          cat > "$pkg/qa-bootstrap-final.js" <<EOF
          (function(){
            var url='${qa_exec}';
            window.__CAMPUS_RUNTIME_CONFIG__={environment:'qa',appsScriptUrl:url};
            try{Object.defineProperty(window,'APPS_SCRIPT_URL',{configurable:true,enumerable:true,get:function(){return url;},set:function(){return url;}});}catch(_){window.APPS_SCRIPT_URL=url;}
            window.__CAMPUS_FINAL_QA__={productHead:'${product_head}',packageHead:'${package_head}',backend:'CS21A211'};
            try{localStorage.setItem('AN_QA_APPS_SCRIPT_URL',url);}catch(_){}
          })();
          EOF

          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/CAMPUS_QA_ENGLISH_LAB_FINAL_CS211')
          marker='<script src="src/runtime_config.js'
          boot='<script src="qa-bootstrap-final.js?v=ENGLISH_LAB_FINAL_CS211"></script>\n'
          matched=[]
          for p in root.glob('*.html'):
              s=p.read_text(encoding='utf-8')
              if marker not in s: continue
              if 'qa-bootstrap-final.js' not in s:
                  s=s.replace(marker,boot+marker,1)
                  p.write_text(s,encoding='utf-8')
              matched.append(p.name)
          required={'campus.html','login.html','inscripcion.html','ventas.html'}
          if not required.issubset(set(matched)):
              raise SystemExit('Entradas QA incompletas: '+', '.join(sorted(required-set(matched))))
          for name in required:
              s=(root/name).read_text(encoding='utf-8')
              assert s.index('qa-bootstrap-final.js') < s.index('src/runtime_config.js')
          print('Entradas QA:', ', '.join(sorted(matched)))
          PY

          cat > "$pkg/qa-setup.html" <<EOF
          <!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English LAB · QA FINAL CS211</title><style>body{font-family:system-ui;background:#eef4fb;color:#052c59;padding:28px}.c{max-width:840px;margin:auto;background:#fff;padding:28px;border-radius:22px}.ok{background:#e9f8ef;padding:12px;border-radius:12px}.w{background:#fff5df;padding:12px;border-radius:12px}.m{font-family:monospace;font-size:12px;word-break:break-all;background:#f6f8fb;padding:12px;border-radius:12px}a{display:inline-block;margin-top:16px;padding:12px 16px;background:#052c59;color:#fff;text-decoration:none;border-radius:12px;font-weight:800}</style></head><body><main class="c"><h1>English LAB · QA FINAL CS211</h1><p class="ok"><b>Memory Match:</b> 10 s para seleccionar · 3 s mismatch · sin espera artificial del primer ACK.</p><p class="w"><b>Antes del test:</b> actualizar UNA VEZ el mismo deployment QA al backend CS21A211 incluido. No crear otra URL.</p><div class="m">PRODUCT_HEAD=${product_head}<br>PACKAGE_HEAD=${package_head}<br>BACKEND=CS21A211<br>ENVIRONMENT=qa<br>QA_EXEC=${qa_exec}</div><a href="login.html?clear=1">Abrir Login QA</a></main></body></html>
          EOF

          cat > "$pkg/ABRIR_CAMPUS_QA_FINAL_CS211.cmd" <<'EOF'
          @echo off
          cd /d "%~dp0"
          echo CAMPUS QA FINAL CS211 - SOLO QA - Memory Match 10s/3s
          start "" http://127.0.0.1:4219/qa-setup.html
          where py >nul 2>nul && py -m http.server 4219 --bind 127.0.0.1 && exit /b
          python -m http.server 4219 --bind 127.0.0.1
          EOF

          cat > "$pkg/VERSION.txt" <<EOF
          VERSION=ENGLISH_LAB_FINAL_QA_CS211
          STATUS=FINAL_HUMAN_QA_CANDIDATE
          BUILD_DATE=2026-08-12
          SOURCE_PRODUCT_HEAD_SHA=${product_head}
          SOURCE_PACKAGE_HEAD_SHA=${package_head}
          BACKEND_VERSION=CS21A211
          APPS_SCRIPT_CHANGE=YES_QA_REQUIRED
          QA_ENVIRONMENT=qa
          QA_EXEC=${qa_exec}
          INCLUDED_GAMES=MEMORY_MATCH|SENTENCE_ORDER|HANGMAN|QUIZ_TIME|WORD_SEARCH
          MEMORY_MATCH_TURN_SELECTION_MS=10000
          MEMORY_MATCH_MISMATCH_REVEAL_MS=3000
          MEMORY_MATCH_FIRST_CARD_EXTENDS_TURN=NO
          MEMORY_MATCH_SECOND_SUBMIT_WAITS_FIRST_ACK=NO
          MEMORY_MATCH_THIRD_CARD_GUARD=PASS_AUTOMATED_PENDING_HUMAN_20_TURNS
          CS210_QUIZ_TIME_DOUBLE_SUBMIT=MITIGATED_CLIENT_SIDE
          QUIZ_BACKEND_IDEMPOTENCY=PENDING_ISSUE_80
          ATTEMPT_ID=PENDING_ISSUE_80
          FINAL_HUMAN_QA=PENDING_PROFE_NATY_CHU
          LOAD_TEST_15_20_25=DEFERRED_NON_BLOCKING
          PRODUCTION_ACTION=DO_NOT_MODIFY
          MERGE_ACTION=DO_NOT_MERGE_WITHOUT_EXPLICIT_AUTHORIZATION
          EOF

          cat > "$pkg/ACTUALIZAR_BACKEND_QA_CS211.txt" <<'EOF'
          BACKEND QA CS211 - UNA SOLA ACTUALIZACION
          1. Abrir el proyecto Apps Script QA actual.
          2. Ubicar el archivo completo de English LAB que hoy contiene CS21A201.
             Históricamente ese archivo se conserva con nombre 99_CS21A183_SENTENCE_ORDER_COMPLETO.gs.
          3. NO crear otro archivo completo y NO pegar 99W por separado.
          4. Reemplazar TODO el contenido por BACKEND_QA/99_CS21A211_ENGLISH_LAB_UNIFIED_COMPLETO.gs.
          5. Guardar.
          6. Implementar > Administrar implementaciones > editar la implementación QA ACTUAL.
          7. Elegir Nueva versión; descripción opcional/vacía.
          8. Implementar conservando exactamente el mismo ID /exec QA.
          9. NO modificar producción y NO crear otra implementación.
          Verificador opcional: verificarMemoryMatchFastTurnCS21A211
          Esperado: ok=true, turn_selection_ms=10000, mismatch_reveal_ms=3000.
          EOF

          cat > "$pkg/LEEME_PRIMERO_FINAL_CS211.txt" <<'EOF'
          CAMPUS QA FINAL CS211
          - SOLO QA. NO PRODUCCION. NO MERGE.
          - Primero actualizar UNA VEZ backend QA a CS21A211 con el archivo completo incluido.
          - Luego ejecutar ABRIR_CAMPUS_QA_FINAL_CS211.cmd.
          - Human QA: Profe + Naty + Chu, Memory Match 20 turnos consecutivos.
          - 10 s máximo para dos cartas; primera no extiende; segunda no espera primer ACK.
          - Mismatch: 3 s visibles y siguiente jugador inmediatamente.
          - Match: mismo jugador, 10 s nuevos inmediatamente.
          - Tercera carta siempre bloqueada durante mutación/conflicto/reveal.
          - Después smoke de los otros cuatro juegos y 390 px.
          - Carga 15/20/25 diferida/no bloqueante.
          EOF

          (cd "$pkg" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd /tmp && zip -qr "$zipfile" "$(basename "$pkg")")
          sha256sum "$zipfile" > "$zipfile.sha256"

      - name: Inspect exact package
        run: |
          set -euo pipefail
          pkg=/tmp/CAMPUS_QA_ENGLISH_LAB_FINAL_CS211
          node "$pkg/scripts/qa_cs21a202_source_truth.mjs"
          grep -q 'BACKEND_VERSION=CS21A211' "$pkg/VERSION.txt"
          grep -q 'APPS_SCRIPT_CHANGE=YES_QA_REQUIRED' "$pkg/VERSION.txt"
          grep -q 'MEMORY_MATCH_TURN_SELECTION_MS=10000' "$pkg/VERSION.txt"
          grep -q 'MEMORY_MATCH_MISMATCH_REVEAL_MS=3000' "$pkg/VERSION.txt"
          grep -q 'MEMORY_MATCH_SECOND_SUBMIT_WAITS_FIRST_ACK=NO' "$pkg/VERSION.txt"
          grep -q 'CS21A211-MM-10S-3S-1' "$pkg/BACKEND_QA/99_CS21A211_ENGLISH_LAB_UNIFIED_COMPLETO.gs"
          sha256sum -c <(sed 's#  \./#  /tmp/CAMPUS_QA_ENGLISH_LAB_FINAL_CS211/#' "$pkg/SHA256SUMS.txt")

      - name: Start packaged candidate
        run: |
          python3 -m http.server 4221 --bind 127.0.0.1 --directory /tmp/CAMPUS_QA_ENGLISH_LAB_FINAL_CS211 >/tmp/cs211-package.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4221/qa-setup.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/cs211-package.log; exit 1

      - name: Packaged login remains QA CS211
        env:
          QA_FINAL_URL: https://script.google.com/macros/s/AKfycbzzsmmHVRGlgltcUJf7Yi9R0z__vsu58Hw9Gq9rNn5pYVrgY5iZ0-xEEL-8wqL4uPVbaw/exec
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.goto('http://127.0.0.1:4221/login.html?clear=1',{waitUntil:'domcontentloaded'});
            const cfg=await page.evaluate(()=>({url:window.APPS_SCRIPT_URL||'',runtime:window.CAMPUS_RUNTIME_CONFIG||null,marker:window.__CAMPUS_FINAL_QA__||null}));
            if(cfg.url!==process.env.QA_FINAL_URL||cfg.runtime?.environment!=='qa'||cfg.runtime?.valid!==true||cfg.runtime?.isProduction!==false||cfg.marker?.backend!=='CS21A211') throw new Error(JSON.stringify(cfg));
            console.log(JSON.stringify({ok:true,qa:true,backend:'CS21A211'},null,2));
          }finally{await browser.close();}
          NODE

      - name: Exact packaged frontend smoke
        env:
          QA_BASE_URL: http://127.0.0.1:4221
        run: |
          node scripts/test_english_lab_unified_shell_browser_cs21a205.mjs
          node scripts/test_memory_match_fast_turn_browser_cs21a211.mjs
          node scripts/test_english_lab_sentence_order_browser_cs21a209.mjs
          node scripts/test_english_lab_quiz_time_browser_cs21a210.mjs

      - name: Upload final candidate
        uses: actions/upload-artifact@v4
        with:
          name: CAMPUS_QA_ENGLISH_LAB_FINAL_CS211
          path: |
            /tmp/CAMPUS_QA_ENGLISH_LAB_FINAL_CS211.zip
            /tmp/CAMPUS_QA_ENGLISH_LAB_FINAL_CS211.zip.sha256
            /tmp/CAMPUS_QA_ENGLISH_LAB_FINAL_CS211/BACKEND_QA/99_CS21A211_ENGLISH_LAB_UNIFIED_COMPLETO.gs
          if-no-files-found: error
          retention-days: 30

      - name: Upload automatic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CS21A211_FINAL_QA_EVIDENCE
          path: qa-output/
          if-no-files-found: warn
          retention-days: 30
