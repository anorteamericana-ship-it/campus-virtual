name: Bootstrap Admin Master Safe Errors CS21A195

on:
  push:
    branches:
      - fix/admin-master-safe-errors-cs21a195
    paths:
      - 'scripts/bootstrap_patch_admin_master_safe_errors_cs21a195.mjs'
      - '.github/workflows/bootstrap-admin-master-safe-errors-cs21a195.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify exact base ancestry
        run: git merge-base --is-ancestor ee1e0a831ccc8f72a434f2208391e576705b9f79 HEAD
      - name: Apply exact Panel Maestro patch
        run: node scripts/bootstrap_patch_admin_master_safe_errors_cs21a195.mjs
      - name: Run CS21A195 guard
        run: node scripts/qa_admin_master_safe_errors_cs21a195.mjs
      - name: Regress CS21A194
        run: node scripts/qa_admin_supervision_safe_errors_cs21a194.mjs
      - name: Regress CS21A193
        run: node scripts/qa_admin_private_conape_docs_cs21a193.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Remove bootstrap artifacts and push verified candidate
        run: |
          rm scripts/bootstrap_patch_admin_master_safe_errors_cs21a195.mjs
          rm .github/workflows/bootstrap-admin-master-safe-errors-cs21a195.yml
          git add -A
          git commit -m 'CS21A195 · safe Panel Maestro errors'
          git push origin HEAD:fix/admin-master-safe-errors-cs21a195
