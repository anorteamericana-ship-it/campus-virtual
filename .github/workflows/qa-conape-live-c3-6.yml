name: QA CONAPE Live C3.6

on:
  pull_request:
    paths:
      - 'ventas.html'
      - 'src/ventas_dashboard.jsx'
      - 'src/ventas_conape_reclutar_c3_3.jsx'
      - 'src/ventas_conape_reclutar_row_c3_5.jsx'
      - 'src/ventas_sortable_table_cs21a20.jsx'
      - 'src/conape_bridge_client_c3_6.js'
      - 'src/conape_bridge_config_c3_6.js'
      - 'src/conape_session_ui_c3_7.js'
      - 'src/conape_compare_ui_c3_7_1.js'
      - 'services/conape-bridge/**'
      - 'scripts/qa_conape_live_c3_6.mjs'
      - 'scripts/qa_conape_bridge_v2.mjs'
      - '.github/workflows/qa-conape-live-c3-6.yml'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical source truth · V4.4
        run: |
          grep -F "const VERSION = 'V4.4.0';" services/conape-bridge/server_v2.mjs
          test ! -e services/conape-bridge/build_runtime_v4_4.mjs
          test ! -e services/conape-bridge/server_runtime.mjs
          ! grep -E 'build_runtime_v4_4|server_runtime\.mjs|mv .*server_v2\.mjs' services/conape-bridge/Dockerfile
          grep -F 'COPY server_v2.mjs ./' services/conape-bridge/Dockerfile
          grep -F 'RUN node --check server_v2.mjs' services/conape-bridge/Dockerfile
          grep -F 'CMD ["node", "server_v2.mjs"]' services/conape-bridge/Dockerfile
      - name: Scheduled mirror + manual refresh contract
        run: |
          grep -F 'CONAPE_MIRROR_SERVICE_URL' services/conape-bridge/server_v2.mjs
          grep -F 'CONAPE_MIRROR_HMAC_SECRET' services/conape-bridge/server_v2.mjs
          grep -F '1_800_000' services/conape-bridge/server_v2.mjs
          grep -F "url.pathname === '/v1/prospects/refresh'" services/conape-bridge/server_v2.mjs
          grep -F "action:'read_mirror'" services/conape-bridge/server_v2.mjs
          grep -F "action:'apply_snapshot'" services/conape-bridge/server_v2.mjs
          ! grep -F 'conapeMirrorApplySnapshotV44' services/conape-bridge/server_v2.mjs
          grep -F 'async function refreshMirror' src/conape_bridge_client_c3_6.js
          grep -F 'const fresh = await refreshMirror(lastSalesAsesor);' src/conape_bridge_client_c3_6.js
          grep -F 'Actualizar CONAPE' src/ventas_dashboard.jsx
          grep -F '30 * 60 * 1000' src/ventas_dashboard.jsx
          grep -F 'setDash(baseDash);' src/ventas_dashboard.jsx
      - name: HMAC canonical bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('services/conape-bridge/server_v2.mjs').read_text(encoding='utf-8')
          good = r"update(`${ts}\n${nonce}\n${payload_json}`, 'utf8')"
          bad = r"update(`${ts}\\n${nonce}\\n${payload_json}`, 'utf8')"
          assert good in src
          assert bad not in src
          PY
      - name: Node syntax · bridge legacy
        run: node --check services/conape-bridge/server.mjs
      - name: Node syntax · bridge V4.4 canonical
        run: node --check services/conape-bridge/server_v2.mjs
      - name: Node syntax · CONAPE bridge client V4.4
        run: node --check src/conape_bridge_client_c3_6.js
      - name: Node syntax · CONAPE session UI
        run: node --check src/conape_session_ui_c3_7.js
      - name: Node syntax · CONAPE comparison UI
        run: node --check src/conape_compare_ui_c3_7_1.js
      - name: Node syntax · QA legacy
        run: node --check scripts/qa_conape_live_c3_6.mjs
      - name: Node syntax · QA V2
        run: node --check scripts/qa_conape_bridge_v2.mjs
      - name: Bridge preserved-contract gate
        run: node scripts/qa_conape_bridge_v2.mjs
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
