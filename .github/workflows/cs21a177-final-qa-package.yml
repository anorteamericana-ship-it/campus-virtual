name: CS21A177 build student sync QA package

on:
  pull_request:
    paths:
      - 'campus.html'
      - 'login.html'
      - 'ventas.html'
      - 'inscripcion.html'
      - 'src/**'
      - 'styles/**'
      - 'vendor/**'
      - 'assets/**'
      - 'modulos/**'
      - 'scripts/build_qa_staging_frontend_cs21a148.mjs'
      - 'scripts/audit_qa_staging_frontend_cs21a148.mjs'
      - '.github/workflows/cs21a177-final-qa-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and audit isolated frontend
        run: |
          set -euo pipefail
          node --check scripts/build_qa_staging_frontend_cs21a148.mjs
          node --check scripts/audit_qa_staging_frontend_cs21a148.mjs
          node scripts/build_qa_staging_frontend_cs21a148.mjs
          node scripts/audit_qa_staging_frontend_cs21a148.mjs

      - name: Assemble clean CS21A177 package
        shell: bash
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          package='dist/CAMPUS_QA_CS21A177_SYNC_ESTUDIANTE'
          rm -rf "$package"
          mkdir -p "$package"
          cp -a dist/qa-staging/. "$package/"
          rm -f "$package/.nojekyll"

          python3 - <<'PY'
          from pathlib import Path
          package = Path('dist/CAMPUS_QA_CS21A177_SYNC_ESTUDIANTE')
          old_launcher = package / 'INICIAR_QA_STAGING.cmd'
          new_launcher = package / 'ABRIR_CAMPUS_QA_CS21A177.cmd'
          launcher = old_launcher.read_text(encoding='utf-8-sig')
          launcher = launcher.replace('127.0.0.1:4173', '127.0.0.1:4175')
          launcher = launcher.replace('node serve.mjs', 'set PORT=4175\r\nnode serve.mjs')
          new_launcher.write_text(launcher, encoding='utf-8-sig', newline='')
          old_launcher.unlink()

          server = package / 'serve.mjs'
          server_text = server.read_text(encoding='utf-8')
          server_text = server_text.replace("process.env.PORT || 4173", "process.env.PORT || 4175")
          server_text = server_text.replace("process.env.PORT || '4173'", "process.env.PORT || '4175'")
          server.write_text(server_text, encoding='utf-8')
          PY

          cat > "$package/LEEME_PRIMERO_CS21A177.txt" <<'EOF'
          CAMPUS QA CS21A177 · SINCRONIZACION DEL ESTUDIANTE
          ==================================================

          OBJETIVO HISTORICO
          - Verificar que el estudiante asciende al estado especializado Memory Match.
          - Verificar que las lecturas Live se coordinan y no mezclan transporte directo.
          - Este workflow puede correr sobre versiones acumuladas posteriores; no exige
            que el adaptador conserve literalmente VERSION=CS21A177.

          BACKEND QA
          - Este corte histórico NO instala Apps Script por sí mismo.
          - No use producción.

          ABRIR EL FRONTEND
          1. Extraiga TODO este ZIP en una carpeta nueva.
          2. Ejecute ABRIR_CAMPUS_QA_CS21A177.cmd.
          3. Mantenga abierta la ventana negra.
          4. Debe abrirse http://127.0.0.1:4175/qa-setup.html
          5. Pegue manualmente la URL /exec de la implementación Apps Script QA.

          CONTRATO QUE SE CONSERVA
          - Detección Memory Match por bandera, código o etiqueta.
          - Endpoint especializado de estado del jugador.
          - Guard de sincronización sin acceso directo a Sheets.
          - Adaptador Live sin fetch directo ni URL de deployment incrustada.
          - Versiones posteriores pueden mejorar polling, lifecycle y reglas del juego.
          EOF

          cat > "$package/VERSION.txt" <<EOF
          VERSION=CS21A177-HISTORICAL-CONTRACT
          PURPOSE=Memory Match student detection and synchronized Live adapter contract
          SOURCE_BRANCH=${SOURCE_BRANCH}
          SOURCE_HEAD_SHA=${SOURCE_HEAD_SHA}
          TEST_MERGE_SHA=${GITHUB_SHA}
          QA_PORT=4175
          APPS_SCRIPT_CHANGE=NO
          PRODUCTION_TOUCHED=NO
          EOF

          cat > "$package/EVIDENCIA_CI.txt" <<'EOF'
          VALIDACIONES AUTOMATICAS REQUERIDAS
          - Detección Memory Match por bandera, código o etiqueta.
          - Ingreso usa estado especializado del estudiante.
          - Adaptador expone API canónica EnglishLabMemoryMatchLiveCS21A174.
          - Guard de sincronización presente.
          - Sin transporte directo ni IDs de Apps Script incrustados.
          - Frontend staging construido y auditado.
          - Paquete servido en puerto 4175.

          Las versiones acumuladas posteriores se validan además en su Release Candidate actual.
          EOF

          (
            cd "$package"
            find . -type f ! -name 'SHA256SUMS.txt' -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Audit downloaded-package contract
        shell: bash
        run: |
          set -euo pipefail
          package='dist/CAMPUS_QA_CS21A177_SYNC_ESTUDIANTE'
          adapter="$package/src/english_lab_games/english_lab_live_memory_match_adapter_cs21a174.jsx"
          guard="$package/src/english_lab_games/english_lab_live_sync_guard_cs21a177.js"
          test -f "$package/ABRIR_CAMPUS_QA_CS21A177.cmd"
          test ! -e "$package/INICIAR_QA_STAGING.cmd"
          test -f "$package/LEEME_PRIMERO_CS21A177.txt"
          test -f "$package/VERSION.txt"
          test -f "$package/SHA256SUMS.txt"
          test -f "$guard"
          test -f "$adapter"
          grep -q '127.0.0.1:4175/qa-setup.html' "$package/ABRIR_CAMPUS_QA_CS21A177.cmd"
          grep -q 'set PORT=4175' "$package/ABRIR_CAMPUS_QA_CS21A177.cmd"
          grep -q 'VERSION=CS21A177-HISTORICAL-CONTRACT' "$package/VERSION.txt"
          grep -q 'global.EnglishLabMemoryMatchLiveCS21A174 = api' "$adapter"
          grep -q 'englishLabMemoryMatchGetPlayerState' "$adapter"
          grep -q 'englishLabMemoryMatchGetRoomControl' "$adapter"
          grep -q 'packageFromLiveState' "$adapter"
          grep -q 'pollingRef.current' "$adapter"
          grep -q 'ensureSyncGuard' "$adapter"
          grep -q 'global.EnglishLabLiveSyncCS21A177 = api' "$guard"
          ! grep -E -q 'AKfycb|script\.google\.com/macros' "$adapter" "$guard" "$package/LEEME_PRIMERO_CS21A177.txt" "$package/VERSION.txt"
          ! grep -q './.nojekyll' "$package/SHA256SUMS.txt"
          (
            cd "$package"
            sha256sum --check SHA256SUMS.txt
          )

      - name: Smoke package on port 4175
        shell: bash
        run: |
          set -euo pipefail
          package='dist/CAMPUS_QA_CS21A177_SYNC_ESTUDIANTE'
          PORT=4175 node "$package/serve.mjs" > /tmp/campus-cs21a177.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4175/qa-setup.html >/dev/null; then
              curl --fail --silent http://127.0.0.1:4175/src/english_lab_games/english_lab_live_sync_guard_cs21a177.js >/dev/null
              curl --fail --silent http://127.0.0.1:4175/src/english_lab_games/english_lab_live_memory_match_adapter_cs21a174.jsx >/dev/null
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/campus-cs21a177.log
          exit 1

      - name: Upload CS21A177 QA package
        uses: actions/upload-artifact@v4
        with:
          name: CAMPUS_QA_CS21A177_SYNC_ESTUDIANTE
          path: dist/CAMPUS_QA_CS21A177_SYNC_ESTUDIANTE
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
