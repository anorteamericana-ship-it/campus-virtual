name: TEMP CONAPE V4.3.0 friendly Home

on:
  push:
    branches:
      - fix/conape-list-friendly-home-v4-3-0

permissions:
  contents: write

jobs:
  patch-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/conape-list-friendly-home-v4-3-0
          fetch-depth: 0
      - name: Patch isolated list source
        shell: python
        run: |
          from pathlib import Path

          server_path = Path('services/conape-bridge/server_v2.mjs')
          qa_path = Path('scripts/qa_conape_bridge_v2.mjs')
          server = server_path.read_text(encoding='utf-8')
          qa = qa_path.read_text(encoding='utf-8')

          if "const VERSION = 'V4.2.9';" in server:
              server = server.replace("const VERSION = 'V4.2.9';", "const VERSION = 'V4.3.0';", 1)
          elif "const VERSION = 'V4.3.0';" not in server:
              raise SystemExit('STOP: unexpected VERSION baseline')

          marker = "async function resetProspectListReport(p, sessionId) {"
          helper = """function prospectListResetUrl(sessionId) {
            const u = new URL(CONAPE_FRIENDLY_HOME);
            const cleanSession = digits(sessionId);
            u.searchParams.set('session', cleanSession);
            u.searchParams.set('clear', 'RR');
            return u.href;
          }

          """
          if 'function prospectListResetUrl(sessionId)' not in server:
              if marker not in server:
                  raise SystemExit('STOP: resetProspectListReport marker missing')
              server = server.replace(marker, helper + marker, 1)

          start = server.index(marker)
          end = server.index('function categoryStatus', start)
          before = server[:start]
          block = server[start:end]
          after = server[end:]
          old_count = block.count('confirmationResetUrl(sessionId)')
          if old_count not in (0, 4):
              raise SystemExit(f'STOP: expected 4 legacy list resets, found {old_count}')
          block = block.replace('confirmationResetUrl(sessionId)', 'prospectListResetUrl(sessionId)')
          server = before + block + after

          if block.count('confirmationResetUrl(sessionId)') != 0:
              raise SystemExit('STOP: legacy confirmation reset remains inside list block')
          if block.count('prospectListResetUrl(sessionId)') != 4:
              raise SystemExit('STOP: expected 4 friendly list resets')
          if "u.searchParams.set('clear', 'RR')" not in server:
              raise SystemExit('STOP: friendly RR missing')
          # Recruit confirmation contract must remain intact outside the list block.
          if 'function confirmationResetUrl(sessionId)' not in server or ':::RIR:' not in server:
              raise SystemExit('STOP: recruit confirmation reset changed unexpectedly')

          old_check = "['prospects/list limpia RIR y prioriza CSV -> Rows=All -> paginado', /confirmationResetUrl/.test(server) && /resetProspectListReport/.test(server) && /downloadProspectCsv/.test(server) && /setProspectRowsAll/.test(server) && /readPagedProspects/.test(server) && server.includes(\"method = 'CSV_DOWNLOAD';\") && server.includes(\"method = 'HTML_ROWS_ALL';\") && server.includes(\"pages = await readPagedProspects(p, rowsByCedula);\") && server.includes(\"method = 'HTML_PAGED';\")],"
          new_check = "['prospects/list permanece en Friendly Home, limpia RR y prioriza CSV -> Rows=All -> paginado', /function prospectListResetUrl\\(sessionId\\)/.test(listBlock) && /new URL\\(CONAPE_FRIENDLY_HOME\\)/.test(listBlock) && /searchParams\\.set\\('session', cleanSession\\)/.test(listBlock) && /searchParams\\.set\\('clear', 'RR'\\)/.test(listBlock) && /resetProspectListReport/.test(listBlock) && listBlock.includes('prospectListResetUrl(sessionId)') && !listBlock.includes('confirmationResetUrl(sessionId)') && /downloadProspectCsv/.test(server) && /setProspectRowsAll/.test(server) && /readPagedProspects/.test(server) && server.includes(\"method = 'CSV_DOWNLOAD';\") && server.includes(\"method = 'HTML_ROWS_ALL';\") && server.includes(\"pages = await readPagedProspects(p, rowsByCedula);\") && server.includes(\"method = 'HTML_PAGED';\")],"
          if old_check in qa:
              qa = qa.replace(old_check, new_check, 1)
          elif new_check not in qa:
              raise SystemExit('STOP: list QA contract baseline not found')
          qa = qa.replace('CONAPE Bridge V4.2.8 QA PASS', 'CONAPE Bridge V4.3.0 QA PASS')

          server_path.write_text(server, encoding='utf-8')
          qa_path.write_text(qa, encoding='utf-8')
      - name: Syntax
        run: node --check services/conape-bridge/server_v2.mjs
      - name: CONAPE QA
        run: node scripts/qa_conape_bridge_v2.mjs
      - name: Scope guard
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'scripts/qa_conape_bridge_v2.mjs\nservices/conape-bridge/server_v2.mjs'
      - name: Commit product patch
        run: |
          if git diff --quiet; then
            echo 'No product changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/conape-bridge/server_v2.mjs scripts/qa_conape_bridge_v2.mjs
          git commit -m 'CONAPE V4.3.0 · restaurar lista Friendly Home'
          git push origin HEAD:fix/conape-list-friendly-home-v4-3-0
