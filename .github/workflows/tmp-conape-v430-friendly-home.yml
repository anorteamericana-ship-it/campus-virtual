name: TEMP CONAPE V4.3.1 sales table

on:
  push:
    branches:
      - fix/conape-list-friendly-home-v4-3-0

permissions:
  contents: write

jobs:
  patch-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/conape-list-friendly-home-v4-3-0
          fetch-depth: 0
      - name: Apply product patch
        run: |
          python scripts/tmp_patch_v431.py
          python scripts/tmp_fix_v431_qa.py
      - name: Bridge syntax
        run: node --check services/conape-bridge/server_v2.mjs
      - name: Client syntax
        run: node --check src/conape_bridge_client_c3_6.js
      - name: Bridge contract QA
        run: node scripts/qa_conape_bridge_v2.mjs
      - name: Frontend contract QA
        shell: python
        run: |
          from pathlib import Path
          data=Path('src/ventas_data.jsx').read_text(encoding='utf-8')
          dash=Path('src/ventas_dashboard.jsx').read_text(encoding='utf-8')
          table=Path('src/ventas_sortable_table_cs21a20.jsx').read_text(encoding='utf-8')
          html=Path('ventas.html').read_text(encoding='utf-8')
          checks=[
            ('mapea etapas CONAPE', all(x in data for x in ['CONAPE_ANALISIS','CONAPE_BPM','CONAPE_APROBADO','CONAPE_FORMALIZADO','CONAPE_DESEMBOLSO'])),
            ('no regresa etapa', 'candidateRank >= currentRank' in data),
            ('protege matriculado', 'matriculado ? current' in data),
            ('dashboard refresca en segundo plano', 'setDash(baseDash);' in dash and 'bridge.salesStatuses(scopeAsesor)' in dash),
            ('tabla prioriza etapa mapeada', 'p?.etapa_conape_ui||p?.etapa' in table),
            ('cache bust aplicado', all(v in html for v in ['ventas_data.jsx?v=V4.3.1','ventas_sortable_table_cs21a20.jsx?v=V4.3.1','conape_bridge_client_c3_6.js?v=V3.2.0','ventas_dashboard.jsx?v=V4.3.1'])),
          ]
          for name,ok in checks: print(('PASS: ' if ok else 'FAIL: ')+name)
          if not all(ok for _,ok in checks): raise SystemExit(1)
      - name: Diff hygiene
        run: git diff --check
      - name: Scope guard
        shell: python
        run: |
          import subprocess
          actual=set(filter(None, subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()))
          expected={
            'scripts/qa_conape_bridge_v2.mjs',
            'services/conape-bridge/server_v2.mjs',
            'src/conape_bridge_client_c3_6.js',
            'src/ventas_dashboard.jsx',
            'src/ventas_data.jsx',
            'src/ventas_sortable_table_cs21a20.jsx',
            'ventas.html',
          }
          print('\n'.join(sorted(actual)))
          if actual != expected:
            raise SystemExit(f'STOP: unexpected scope: {sorted(actual ^ expected)}')
      - name: Commit product patch
        run: |
          if git diff --quiet; then
            echo 'No product changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/conape-bridge/server_v2.mjs scripts/qa_conape_bridge_v2.mjs src/conape_bridge_client_c3_6.js src/ventas_data.jsx src/ventas_dashboard.jsx src/ventas_sortable_table_cs21a20.jsx ventas.html
          git commit -m 'CONAPE V4.3.1 · actualizar etapas en tabla Ventas'
          git push origin HEAD:fix/conape-list-friendly-home-v4-3-0
