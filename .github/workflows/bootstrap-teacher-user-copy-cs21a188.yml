name: Bootstrap Teacher User Copy CS21A188

on:
  push:
    branches:
      - fix/teacher-user-copy-cs21a188
    paths:
      - '.github/workflows/bootstrap-teacher-user-copy-cs21a188.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Verify exact base ancestry
        run: git merge-base --is-ancestor 80f1c2bfef693d6dbf81376d6aab5d14c113f4eb HEAD
      - name: Apply exact copy patch
        run: node scripts/bootstrap_patch_teacher_user_copy_cs21a188.mjs
      - name: Run CS21A188 guard
        run: node scripts/qa_teacher_user_copy_cs21a188.mjs
      - name: Regress CS21A187
        run: node scripts/qa_teacher_action_safe_errors_cs21a187.mjs
      - name: Regress CS21A186
        run: node scripts/qa_teacher_session_safe_errors_cs21a186.mjs
      - name: Diff hygiene
        run: git diff --check 80f1c2bfef693d6dbf81376d6aab5d14c113f4eb...HEAD -- . ':(exclude)00_DOCUMENTACION/**'
      - name: Remove bootstrap artifacts and push verified candidate
        run: |
          git rm .github/workflows/bootstrap-teacher-user-copy-cs21a188.yml scripts/bootstrap_patch_teacher_user_copy_cs21a188.mjs
          git add -A
          git commit -m "CS21A188 · clean teacher user-facing copy"
          git push origin HEAD:fix/teacher-user-copy-cs21a188
