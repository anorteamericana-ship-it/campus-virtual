name: QA SEC002 Admin Certificate Private Source

on:
  pull_request:
    paths:
      - 'src/admin_students.jsx'
      - 'scripts/qa_sec002_admin_certificate_private_source_20260830.mjs'
      - '.github/workflows/qa-sec002-admin-certificate-private-source-20260830.yml'
  push:
    branches:
      - security/sec002-admin-certificate-private-source-20260830

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Admin certificate private source guard
        run: node scripts/qa_sec002_admin_certificate_private_source_20260830.mjs
      - name: Regress SEC002 admin academic docs
        run: node scripts/qa_sec002_admin_private_academic_docs_cs21a193.mjs
      - name: Regress admin copy
        run: node scripts/qa_admin_students_user_copy_cs21a192.mjs
      - name: Regress admin safe errors
        run: node scripts/qa_admin_students_safe_errors_cs21a191.mjs
      - name: Diff hygiene
        run: git diff --check
