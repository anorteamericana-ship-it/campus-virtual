        run: node scripts/qa_sec002_identity_legacy_evidence_cs21a195.mjs
      - name: Regress CS21A194
        run: node scripts/qa_sec002_legacy_certificate_tree_contract_cs21a194.mjs
      - name: Regress CS21A193
        run: node scripts/qa_sec002_admin_academic_pdf_delivery_cs21a193.mjs
