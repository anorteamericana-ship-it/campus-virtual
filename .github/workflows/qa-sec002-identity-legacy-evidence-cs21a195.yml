    paths:
      - 'security/sec002_identity_legacy_contract_cs21a174.json'
      - 'scripts/qa_sec002_identity_legacy_evidence_cs21a195.mjs'
      - '.github/workflows/qa-sec002-identity-legacy-evidence-cs21a195.yml'
  pull_request:
