name: QA SEC004 Matriculas Preview Readonly CS21A198B

on:
  pull_request:
    paths:
      - 'src/matriculas.jsx'
      - 'scripts/qa_sec004_matriculas_preview_readonly_cs21a198b.mjs'
      - '.github/workflows/qa-sec004-matriculas-preview-readonly-cs21a198b.yml'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run CS21A198B guard
        run: node scripts/qa_sec004_matriculas_preview_readonly_cs21a198b.mjs
      - name: Regress CS21A198
        run: node scripts/qa_sec004_session_demo_isolation_cs21a198.mjs
      - name: Regress CS21A197
        run: node scripts/qa_lazy_loader_safe_user_errors_cs21a197.mjs
      - name: Diff hygiene against stacked base
        run: git diff --check origin/fix/sec004-real-session-demo-isolation-cs21a198...HEAD -- ':!00_DOCUMENTACION/**'
