name: CS21A174 apply canonical Live frontend

on:
  push:
    branches:
      - feature/cs21a174-memory-match-live-backend-2
    paths:
      - 'scripts/apply_cs21a174_live_frontend.mjs'
      - 'scripts/test_english_lab_memory_match_live_cs21a174.mjs'
      - '.github/workflows/cs21a174-apply-live-frontend.yml'

permissions:
  contents: write

jobs:
  apply-live-frontend:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/cs21a174-memory-match-live-backend-2
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact canonical transformations
        run: |
          node scripts/apply_cs21a174_live_frontend.mjs
          sed -i 's/[[:space:]]\+$//' src/app.jsx src/english_lab_live.jsx src/english_lab_games/memory_match_engine_cs21a173.jsx src/english_lab_games/english_lab_live_memory_match_adapter_cs21a174.jsx

      - name: Validate transformed contracts
        run: |
          node scripts/test_english_lab_memory_match_cs21a173.mjs
          node scripts/test_english_lab_memory_match_live_cs21a174.mjs
          git diff --check
          grep -q "english_lab_memory_match_adapter_cs21a174" src/app.jsx
          grep -q "englishLabMemoryMatchCreateRoom" src/english_lab_live.jsx
          grep -q "MemoryMatchLiveRoundCS21A174" src/english_lab_live.jsx

      - name: Commit transformed canonical files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/app.jsx src/english_lab_live.jsx src/english_lab_games/memory_match_engine_cs21a173.jsx src/english_lab_games/english_lab_live_memory_match_adapter_cs21a174.jsx; then
            echo "No hay cambios por aplicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.jsx src/english_lab_live.jsx src/english_lab_games/memory_match_engine_cs21a173.jsx src/english_lab_games/english_lab_live_memory_match_adapter_cs21a174.jsx
          git commit -m "CS21A174 integra Memory Match en English LAB Live"
          git push origin HEAD:feature/cs21a174-memory-match-live-backend-2
