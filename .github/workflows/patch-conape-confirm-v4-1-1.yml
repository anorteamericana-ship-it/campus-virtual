name: Patch CONAPE confirmation V4.1.1
on:
  push:
    branches:
      - fix/conape-confirm-by-existence-v4-1-1
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/conape-confirm-by-existence-v4-1-1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact confirmation fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          server_path = Path('services/conape-bridge/server_v2.mjs')
          qa_path = Path('scripts/qa_conape_bridge_v2.mjs')
          server = server_path.read_text(encoding='utf-8')
          qa = qa_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          server = replace_once(server, "const VERSION = 'V4.1.0';", "const VERSION = 'V4.1.1';", 'version')
          server = replace_once(server, "return { found:true, estado, registro:norm(estado) === 'REGISTRO' };", "return { found:true, estado };", 'confirm found')
          server = replace_once(server, "return { found:false, estado:'', registro:false };", "return { found:false, estado:'' };", 'confirm not found')
          server = replace_once(server, ".catch(() => ({ found:false, estado:'', registro:false }));", ".catch(() => ({ found:false, estado:'' }));", 'confirm catch')

          old_helper = """async function readEstadoAfterCreate(p, sessionId, cedula) {
            const confirmation = await confirmInHome(p, sessionId, cedula);
            return confirmation.registro ? confirmation.estado : '';
          }

          """
          server = replace_once(server, old_helper, '', 'remove readEstadoAfterCreate')

          old_submit = """    const estado = await readEstadoAfterCreate(p, meta.sessionId, auth.cedula);
              if (estado) return { ok:true, confirmed:true, code:'CREATED', estado_conape_raw:estado };
          """
          new_submit = """    const confirmation = await confirmInHome(p, meta.sessionId, auth.cedula);
              if (confirmation.found) return { ok:true, confirmed:true, code:'CREATED', confirmation_found:true, confirmation_estado:upper(confirmation.estado), estado_conape_raw:confirmation.estado };
          """
          server = replace_once(server, old_submit, new_submit, 'submit confirmation')

          server = replace_once(server, "    if (confirmation.registro) {", "    if (confirmation.found) {", 'execute confirmation gate')
          old_execute_return = "      return { ok:true, confirmed:true, code:'CREATED', stage:'CONFIRMED', estado_conape_raw:confirmation.estado, comparison, timing:{ ...timing, total:Date.now()-started } };"
          new_execute_return = "      return { ok:true, confirmed:true, code:'CREATED', stage:'CONFIRMED', confirmation_found:true, confirmation_estado:upper(confirmation.estado), estado_conape_raw:confirmation.estado, comparison, timing:{ ...timing, total:Date.now()-started } };"
          server = replace_once(server, old_execute_return, new_execute_return, 'execute response')
          server = replace_once(server, "CREATE fue enviado, pero la lista no confirmó Estado REGISTRO. No repita el envío.", "CREATE fue enviado, pero la cédula no apareció en la lista de CONAPE. No repita el envío.", 'uncertain message')
          server = replace_once(server, "confirmation_found:!!confirmation?.found, confirmation_registro:!!confirmation?.registro, pii:false,", "confirmation_found:!!confirmation?.found, confirmation_estado:upper(confirmation?.estado || ''), pii:false,", 'telemetry confirmation')

          anchor = "const listTelemetryMatches = server.match(/event:'conape_list_dump'/g) || [];\n"
          insert = anchor + "const confirmStart = server.indexOf('async function confirmInHome');\nconst confirmEnd = server.indexOf('async function readProspectListPage', confirmStart);\nconst confirmBlock = confirmStart >= 0 && confirmEnd > confirmStart ? server.slice(confirmStart, confirmEnd) : '';\n"
          qa = replace_once(qa, anchor, insert, 'qa confirmation block')
          old_check = "  ['resultado ambiguo verifica tabla Home antes de decidir', /readEstadoAfterCreate/.test(server) && /if \\(estado\\) return \\{ ok:true, confirmed:true, code:'CREATED'/.test(server)],"
          new_checks = "  ['confirmación CREATE depende de existencia y no de estado concreto', /return \\{ found:true, estado \\}/.test(confirmBlock) && /if \\(confirmation\\.found\\)/.test(server) && !/\\bREGISTRO\\b/.test(confirmBlock) && !/confirmation\\.registro|confirmation_registro/.test(server)],\n  ['telemetría de confirmación reporta existencia y estado informativo', /confirmation_found/.test(server) && /confirmation_estado:upper\\(confirmation\\?\\.estado \\|\\| ''\\)/.test(server) && !/confirmation_registro/.test(server)],"
          qa = replace_once(qa, old_check, new_checks, 'qa confirmation assertions')
          qa = replace_once(qa, "console.log(`CONAPE Bridge V4.1 QA PASS · ${checks.length}/${checks.length}`);", "console.log(`CONAPE Bridge V4.1.1 QA PASS · ${checks.length}/${checks.length}`);", 'qa label')

          if "'REGISTRO'" in server:
              raise SystemExit("hardcoded REGISTRO state remains in server_v2.mjs")
          if 'confirmation_registro' in server or 'confirmation.registro' in server:
              raise SystemExit('legacy confirmation registro flag remains')

          server_path.write_text(server, encoding='utf-8')
          qa_path.write_text(qa, encoding='utf-8')
          PY
          node --check services/conape-bridge/server_v2.mjs
          node --check scripts/qa_conape_bridge_v2.mjs
          node scripts/qa_conape_bridge_v2.mjs
      - name: Commit clean diff
        shell: bash
        run: |
          git rm .github/workflows/patch-conape-confirm-v4-1-1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/conape-bridge/server_v2.mjs scripts/qa_conape_bridge_v2.mjs
          git commit -m "fix: confirmar CREATE por existencia en Home"
          git push origin HEAD:fix/conape-confirm-by-existence-v4-1-1
