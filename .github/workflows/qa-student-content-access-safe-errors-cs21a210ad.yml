name: QA Student Content Access Safe Errors CS21A210AD

on:
  push:
    branches:
      - fix/student-content-access-safe-errors-cs21a210ad
    paths:
      - 'src/student_content_access_cs21a125.jsx'
  pull_request:
    paths:
      - 'src/student_content_access_cs21a125.jsx'
      - 'scripts/qa_student_content_access_safe_errors_cs21a210ad.mjs'
      - '.github/workflows/qa-student-content-access-safe-errors-cs21a210ad.yml'
      - '00_DOCUMENTACION/STUDENT_CONTENT_ACCESS_SAFE_ERRORS_CS21A210AD_2026-08-31.md'

jobs:
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install JSX parser
        run: npm install --no-save --ignore-scripts @babel/parser@7.28.4
      - name: Parse modified JSX
        run: |
          node <<'NODE'
          const fs=require('fs');
          const parser=require('@babel/parser');
          parser.parse(fs.readFileSync('src/student_content_access_cs21a125.jsx','utf8'),{sourceType:'script',plugins:['jsx','optionalChaining','nullishCoalescingOperator']});
          console.log('CS21A210AD JSX parse: PASS');
          NODE
      - name: Verify CS21A210AD semantics
        run: node scripts/qa_student_content_access_safe_errors_cs21a210ad.mjs
      - name: Regress student academic contract
        shell: bash
        run: |
          grep -Fq "['CA','APR','CNV']" src/student_content_access_cs21a125.jsx
          grep -Fq 'LEVELS.slice(0,i+1)' src/student_content_access_cs21a125.jsx
          grep -Fq '__AN_STUDENT_PLANEAMIENTO_PDFS_CS21A129__' src/student_content_access_cs21a125.jsx
          grep -Fq 'student_planeamiento_pdf_catalog_cs21a129.js' src/student_menu_academic_guard_cs21a120.js
          grep -Fq 'student_content_access_cs21a125.jsx' src/student_menu_academic_guard_cs21a120.js
      - name: Regress CS21A210AB TOEIC payment boundary
        run: node scripts/qa_aplicar_pago_toeic_safe_errors_cs21a210ab.mjs
      - name: Diff hygiene
        run: git diff --check
