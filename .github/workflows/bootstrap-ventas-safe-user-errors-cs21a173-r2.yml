name: Bootstrap Ventas Safe User Errors CS21A173 R2

on:
  push:
    branches:
      - 'feature/ventas-safe-user-errors-cs21a173'
    paths:
      - '.github/workflows/bootstrap-ventas-safe-user-errors-cs21a173-r2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact revision
        run: python scripts/apply_ventas_safe_user_errors_cs21a173_r2.py
      - name: Verify source revision
        run: |
          grep -F "failed to fetch" src/ventas_drawer.jsx
          grep -F "if (!grupos.some(g => g.codigo === value)) onChange('');" src/ventas_drawer.jsx
          git diff --check
      - name: Remove revision bootstrap and commit
        shell: bash
        run: |
          rm .github/workflows/bootstrap-ventas-safe-user-errors-cs21a173-r2.yml
          rm scripts/apply_ventas_safe_user_errors_cs21a173_r2.py
          git config user.name "anorteamericana-ship-it"
          git config user.email "anorteamericana@gmail.com"
          git add src/ventas_drawer.jsx .github/workflows/bootstrap-ventas-safe-user-errors-cs21a173-r2.yml scripts/apply_ventas_safe_user_errors_cs21a173_r2.py
          git commit -m "CS21A173 · fail closed stale group selection and browser errors"
          git push origin HEAD:feature/ventas-safe-user-errors-cs21a173
