name: SEC002 student private cert migrate one-shot

on:
  push:
    branches:
      - fix/sec002-private-document-foundation
    paths:
      - .github/workflows/sec002_student_cert_migrate_once.yml

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sec002-private-document-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch certificate consumer only
        run: python scripts/apply_sec002_student_private_cert_patch.py
      - name: Verify SEC-002 certificate migration
        run: |
          node scripts/qa_sec002_private_certificate_delta_portable.mjs
          node scripts/qa_sec002_student_private_cert.mjs
          git diff --check
      - name: Commit verified migration
        shell: bash
        run: |
          if git diff --quiet -- src/student_modules.jsx; then
            echo 'No source change produced' >&2
            exit 1
          fi
          git config user.name 'anorteamericana-ship-it'
          git config user.email 'anorteamericana@gmail.com'
          git add src/student_modules.jsx
          git commit -m 'fix: entrega certificado estudiante por canal privado SEC-002'
          git push origin HEAD:fix/sec002-private-document-foundation
