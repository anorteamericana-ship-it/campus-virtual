name: Bootstrap Admin Supervision Safe Errors CS21A194

on:
  push:
    branches:
      - fix/admin-supervision-safe-errors-cs21a194
    paths:
      - 'scripts/bootstrap_patch_admin_supervision_safe_errors_cs21a194.mjs'
      - '.github/workflows/bootstrap-admin-supervision-safe-errors-cs21a194.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify exact base ancestry
        run: git merge-base --is-ancestor e4cb929501395809deebd2679765cfbe9b99078f HEAD
      - name: Apply exact supervision patch
        run: node scripts/bootstrap_patch_admin_supervision_safe_errors_cs21a194.mjs
      - name: Run CS21A194 guard
        run: node scripts/qa_admin_supervision_safe_errors_cs21a194.mjs
      - name: Regress CS21A193
        run: node scripts/qa_admin_private_conape_docs_cs21a193.mjs
      - name: Regress CS21A192
        run: node scripts/qa_admin_students_user_copy_cs21a192.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Remove bootstrap artifacts and push verified candidate
        run: |
          rm scripts/bootstrap_patch_admin_supervision_safe_errors_cs21a194.mjs
          rm .github/workflows/bootstrap-admin-supervision-safe-errors-cs21a194.yml
          git add -A
          git commit -m 'CS21A194 · safe admin supervision errors'
          git push origin HEAD:fix/admin-supervision-safe-errors-cs21a194
