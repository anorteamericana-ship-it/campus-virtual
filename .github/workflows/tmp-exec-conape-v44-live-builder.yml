name: TEMP Execute CONAPE V4.4 LIVE Builder

on:
  push:
    branches:
      - feature/conape-v44-live-appsscript
    paths:
      - '.github/workflows/tmp-exec-conape-v44-live-builder.yml'

permissions:
  contents: read

jobs:
  execute-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLASP_AUTH_JSON: ${{ secrets.CLASP_AUTH_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
      CLASP_TOKEN: ${{ secrets.CLASP_TOKEN }}
      GOOGLE_CLASP_AUTH: ${{ secrets.GOOGLE_CLASP_AUTH }}
      GOOGLE_CLASPRC_JSON: ${{ secrets.GOOGLE_CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/conape-v44-live-appsscript
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install clasp
        run: npm install --global @google/clasp@3.3.0
      - name: Select existing clasp credential without exposing it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          selected=''
          for key in CLASP_AUTH_JSON CLASPRC_JSON CLASP_CREDENTIALS CLASP_TOKEN GOOGLE_CLASP_AUTH GOOGLE_CLASPRC_JSON; do
            value="${!key:-}"
            if [ -n "$value" ]; then
              selected="$key"
              printf '%s' "$value" > "$HOME/.clasprc.json"
              chmod 600 "$HOME/.clasprc.json"
              break
            fi
          done
          if [ -z "$selected" ]; then
            echo 'STOP: no repository secret with a supported clasp credential name is configured.'
            exit 78
          fi
          echo "Credential slot found: $selected"
          echo 'Credential value intentionally not printed.'
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME+'/.clasprc.json','utf8')); console.log('clasprc JSON parse: PASS')"
      - name: Execute read-only same-Script-ID candidate builder
        shell: pwsh
        run: ./scripts/build_conape_v44_live_candidate.ps1
      - name: Locate evidence
        if: always()
        shell: bash
        run: |
          find . -maxdepth 3 -type f \( -name 'BUILD_SUMMARY.txt' -o -name 'candidate_manifest.json' -o -name 'deployments.txt' \) -print || true
      - name: Upload candidate evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: conape-v44-live-builder-evidence-${{ github.run_number }}
          path: |
            CONAPE_V44_LIVE_CANDIDATE_*/EVIDENCE/
            CONAPE_V44_LIVE_CANDIDATE_*/CANDIDATE_SAME_SCRIPT_ID/
          if-no-files-found: error
          retention-days: 7
