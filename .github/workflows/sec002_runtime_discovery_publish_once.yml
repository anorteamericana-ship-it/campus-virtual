name: SEC002 runtime discovery publish one-shot

on:
  push:
    branches:
      - fix/sec002-private-document-foundation
    paths:
      - .github/workflows/sec002_runtime_discovery_publish_once.yml

permissions:
  contents: write

jobs:
  discover-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_STAGING_APPS_SCRIPT_URL: ${{ secrets.QA_STAGING_APPS_SCRIPT_URL }}
      QA_STUDENT_USER: ${{ secrets.QA_STUDENT_USER }}
      QA_STUDENT_PASS: ${{ secrets.QA_STUDENT_PASS }}
      QA_TEACHER_USER: ${{ secrets.QA_TEACHER_USER }}
      QA_TEACHER_PASS: ${{ secrets.QA_TEACHER_PASS }}
      QA_SUPERADMIN_USER: ${{ secrets.QA_SUPERADMIN_USER }}
      QA_SUPERADMIN_PASS: ${{ secrets.QA_SUPERADMIN_PASS }}
      QA_STUDENT_CODE: ${{ secrets.QA_STUDENT_CODE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sec002-private-document-foundation
          fetch-depth: 0
      - name: Refuse incomplete secret set
        shell: bash
        run: |
          required=(QA_STAGING_APPS_SCRIPT_URL QA_STUDENT_USER QA_STUDENT_PASS QA_TEACHER_USER QA_TEACHER_PASS QA_SUPERADMIN_USER QA_SUPERADMIN_PASS QA_STUDENT_CODE)
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then echo "Falta el secreto $key"; exit 1; fi
          done
      - name: Syntax
        run: node --check scripts/qa_sec002_runtime_discovery.mjs
      - name: Run authenticated read-only discovery
        id: discovery
        shell: bash
        run: |
          set +e
          node scripts/qa_sec002_runtime_discovery.mjs
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          test -f qa-output-sec002-runtime/runtime-discovery.json
      - name: Secret leakage guard and publish sanitized evidence
        shell: bash
        run: |
          src=qa-output-sec002-runtime/runtime-discovery.json
          dst=qa/sec002_runtime_discovery_latest.json
          for key in QA_STAGING_APPS_SCRIPT_URL QA_STUDENT_USER QA_STUDENT_PASS QA_TEACHER_USER QA_TEACHER_PASS QA_SUPERADMIN_USER QA_SUPERADMIN_PASS QA_STUDENT_CODE; do
            value="${!key}"
            if [ -n "$value" ] && grep -Fq -- "$value" "$src"; then
              echo "BLOQUEADO: la evidencia contiene el valor de $key"
              exit 1
            fi
          done
          cp "$src" "$dst"
          node -e "const r=require('./$dst'); if(!r.version||!r.fixture_summary||!Array.isArray(r.checks)) process.exit(1); console.log('PASS sanitized evidence schema')"
          git config user.name 'anorteamericana-ship-it'
          git config user.email 'anorteamericana@gmail.com'
          git add "$dst"
          if git diff --cached --quiet; then
            echo 'Evidencia sin cambios; no se crea commit.'
          else
            git commit -m 'SEC002 registra discovery runtime autenticada sanitizada'
            git push origin HEAD:fix/sec002-private-document-foundation
          fi
      - name: Preserve discovery verdict
        if: always()
        shell: bash
        run: |
          rc='${{ steps.discovery.outputs.rc }}'
          if [ -n "$rc" ] && [ "$rc" != "0" ]; then
            echo "Discovery detectó fallos de contrato: rc=$rc"
            exit "$rc"
          fi
