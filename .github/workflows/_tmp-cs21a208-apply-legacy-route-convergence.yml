name: TEMP CS21A208 Apply Legacy Route Convergence

on:
  push:
    branches:
      - fix/cs21a208-english-lab-legacy-route-convergence

permissions:
  contents: write

jobs:
  apply-app-route-convergence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/cs21a208-english-lab-legacy-route-convergence
          fetch-depth: 0
      - name: Apply deterministic route transform
        run: node scripts/_tmp_apply_cs21a208_legacy_route_convergence.mjs
      - name: Guard exact product scope
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = 'src/app.jsx'
      - name: Commit transformed app routes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.jsx
          git commit -m 'CS21A208 converge rutas legacy de English LAB al Live'
          git push origin HEAD:fix/cs21a208-english-lab-legacy-route-convergence
