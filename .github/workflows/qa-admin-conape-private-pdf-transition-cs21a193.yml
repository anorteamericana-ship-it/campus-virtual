name: QA Admin CONAPE Private PDF Transition CS21A193

on:
  pull_request:
    paths:
      - 'src/admin_students.jsx'
      - 'scripts/qa_admin_conape_private_pdf_transition_cs21a193.mjs'
      - '.github/workflows/qa-admin-conape-private-pdf-transition-cs21a193.yml'
  push:
    branches:
      - security/admin-conape-private-pdf-delivery-cs21a193

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CS21A193 private PDF transition guard
        run: node scripts/qa_admin_conape_private_pdf_transition_cs21a193.mjs
      - name: Regress CS21A192 copy
        run: node scripts/qa_admin_students_user_copy_cs21a192.mjs
      - name: Regress CS21A191 safe errors
        run: node scripts/qa_admin_students_safe_errors_cs21a191.mjs
      - name: Diff hygiene
        run: git diff --check -- . ':!00_DOCUMENTACION/**'
