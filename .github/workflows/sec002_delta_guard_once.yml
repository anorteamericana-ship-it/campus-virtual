name: SEC-002 private certificate delta verifier

on:
  push:
    branches:
      - fix/sec002-private-document-foundation
    paths:
      - .github/workflows/sec002_delta_guard_once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SEC-002 branch
        uses: actions/checkout@v4
        with:
          ref: fix/sec002-private-document-foundation
          fetch-depth: 0

      - name: Verify exact main ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 67108928e953fbf044dbcd916dc34a5dd5f1e570 HEAD

      - name: Run portable delta guard
        run: node scripts/qa_sec002_private_certificate_delta_portable.mjs

      - name: Diff hygiene for non-patch SEC-002 additions
        run: |
          set -euo pipefail
          git diff --check 67108928e953fbf044dbcd916dc34a5dd5f1e570...HEAD -- \
            scripts/qa_sec002_private_certificate_delta_portable.mjs \
            00_DOCUMENTACION/SEC002_BACKEND_DELTA_PORT_2026-08-16.md
