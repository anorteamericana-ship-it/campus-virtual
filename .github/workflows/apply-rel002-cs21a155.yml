name: APPLY REL002 CS21A155 TEMP

on:
  pull_request:
    paths:
      - 'scripts/_apply_rel002_cs21a155.mjs'
      - '.github/workflows/apply-rel002-cs21a155.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-exact-delta:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply exact preimages
        run: node scripts/_apply_rel002_cs21a155.mjs
      - name: Validate exact functional diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --numstat -- src/ventas_data.jsx | awk '{print $1}')" = "3"
          test "$(git diff --numstat -- src/ventas_data.jsx | awk '{print $2}')" = "2"
          test "$(git diff --numstat -- src/ventas_dashboard.jsx | awk '{print $1}')" = "2"
          test "$(git diff --numstat -- src/ventas_dashboard.jsx | awk '{print $2}')" = "2"
      - name: Commit functional delta and remove bootstrap
        shell: bash
        run: |
          rm scripts/_apply_rel002_cs21a155.mjs
          rm .github/workflows/apply-rel002-cs21a155.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ventas_data.jsx src/ventas_dashboard.jsx scripts/_apply_rel002_cs21a155.mjs .github/workflows/apply-rel002-cs21a155.yml
          git commit -m "CS21A155 · REL-002 token y scope sobre main actual"
          git push origin HEAD:${{ github.head_ref }}
