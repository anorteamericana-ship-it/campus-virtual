name: Bootstrap SEC002 Admin Academic Docs Bytes CS21A193

on:
  push:
    branches:
      - security/sec002-admin-academic-docs-bytes-cs21a193
    paths:
      - 'scripts/bootstrap_patch_sec002_admin_academic_docs_bytes_cs21a193.mjs'
      - '.github/workflows/bootstrap-sec002-admin-academic-docs-bytes-cs21a193.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify exact base ancestry
        run: git merge-base --is-ancestor 30b5be3cb04cff8eacf8a644b4ab72af077e5d7a HEAD
      - name: Apply exact byte-first patch
        run: node scripts/bootstrap_patch_sec002_admin_academic_docs_bytes_cs21a193.mjs
      - name: Run CS21A193 guard
        run: node scripts/qa_sec002_admin_academic_docs_bytes_cs21a193.mjs
      - name: Regress CS21A192
        run: node scripts/qa_admin_students_user_copy_cs21a192.mjs
      - name: Regress CS21A191
        run: node scripts/qa_admin_students_safe_errors_cs21a191.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Remove bootstrap artifacts and push verified candidate
        run: |
          rm scripts/bootstrap_patch_sec002_admin_academic_docs_bytes_cs21a193.mjs
          rm .github/workflows/bootstrap-sec002-admin-academic-docs-bytes-cs21a193.yml
          git add -A
          git commit -m 'CS21A193 · prefer authenticated bytes for admin academic PDFs'
          git push origin HEAD:security/sec002-admin-academic-docs-bytes-cs21a193
