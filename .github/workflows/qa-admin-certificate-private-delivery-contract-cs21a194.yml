name: QA Admin Certificate Private Delivery Contract CS21A194

on:
  pull_request:
    paths:
      - 'src/admin_students.jsx'
      - 'security/admin_certificate_private_delivery_contract_v1.json'
      - 'scripts/qa_admin_certificate_private_delivery_contract_cs21a194.mjs'
      - '.github/workflows/qa-admin-certificate-private-delivery-contract-cs21a194.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-certificate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run CS21A194 contract guard
        run: node scripts/qa_admin_certificate_private_delivery_contract_cs21a194.mjs
      - name: Regress CS21A193 private transfer docs
        run: node scripts/qa_admin_transfer_doc_private_delivery_cs21a193.mjs
      - name: Regress CS21A192 user copy
        run: node scripts/qa_admin_students_user_copy_cs21a192.mjs
      - name: Diff hygiene
        run: git diff --check HEAD^ HEAD || git diff --check
