name: Bootstrap Merge SEC002 Identity CS21A177

on:
  push:
    branches:
      - 'integration/matriculas-ventas-security-cs21a177'
    paths:
      - '.github/workflows/bootstrap-merge-sec002-identity-cs21a177.yml'

permissions:
  contents: write

jobs:
  merge-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "anorteamericana-ship-it"
          git config user.email "anorteamericana@gmail.com"
      - name: Fetch exact sibling and global base
        run: |
          git fetch origin security/sec002-identity-legacy-contract-cs21a174
          git fetch origin integration/release-probe-ventas-b1-cs21a169
          test "$(git rev-parse FETCH_HEAD)" != ""
          test "$(git rev-parse origin/security/sec002-identity-legacy-contract-cs21a174)" = "9de64d4030e4ab219eee7654041511c8bd43216e"
          test "$(git rev-parse origin/integration/release-probe-ventas-b1-cs21a169)" = "858be40ed7f40fa321b22b818087e28115fdf334"
      - name: Merge CS21A174 exactly
        run: git merge --no-ff origin/security/sec002-identity-legacy-contract-cs21a174 -m "CS21A177 · integrate CS21A174 identity legacy contract"
      - name: Run CS21A173
        run: node scripts/qa_ventas_safe_user_errors_cs21a173.mjs
      - name: Run CS21A174
        run: node scripts/qa_sec002_identity_legacy_contract_cs21a174.mjs
      - name: Run CS21A175
        run: node scripts/qa_sec002_proforma_whatsapp_cs21a175.mjs
      - name: Run CS21A176
        run: node scripts/qa_matriculas_admin_readonly_safe_errors_cs21a176.mjs
      - name: Run Sales integration
        run: node scripts/qa_ventas_integration_cs21a166.mjs
      - name: Run SEC002 Ventas private delivery
        run: node scripts/qa_sec002_ventas_private_delivery_cs21a159.mjs
      - name: Run CS21A177 integrated assertions
        run: node scripts/qa_matriculas_ventas_security_cs21a177.mjs
      - name: Source diff hygiene vs global base
        run: git diff --check origin/integration/release-probe-ventas-b1-cs21a169...HEAD -- . ':(exclude)00_DOCUMENTACION/**'
      - name: Remove bootstrap and push verified candidate
        run: |
          rm .github/workflows/bootstrap-merge-sec002-identity-cs21a177.yml
          git add .github/workflows/bootstrap-merge-sec002-identity-cs21a177.yml
          git commit -m "CS21A177 · verified integrated Ventas Matrículas candidate"
          git push
