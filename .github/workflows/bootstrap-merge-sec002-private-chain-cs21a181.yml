name: Bootstrap Merge SEC002 Private Chain CS21A181

# Rerun marker: signed enrollment route assertion aligned to canonical source.
on:
  push:
    branches:
      - integration/sec002-private-student-admin-chain-cs21a181
    paths:
      - '.github/workflows/bootstrap-merge-sec002-private-chain-cs21a181.yml'

permissions:
  contents: write

jobs:
  merge-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Fetch exact private-chain source
        run: |
          git fetch origin security/sec002-student-signed-enrollment-cs21a162
          test "$(git rev-parse origin/security/sec002-student-signed-enrollment-cs21a162)" = "1f149d2613eb3e0950ccd7969c87a9011a53f7bc"
          git merge-base --is-ancestor 0a316ca7cf2a62a12e8a3540570527e367a8e37e HEAD
      - name: Merge CS21A160-162 exactly
        run: git merge --no-ff --no-edit 1f149d2613eb3e0950ccd7969c87a9011a53f7bc
      - name: Regress SEC002 Ventas private delivery
        run: node scripts/qa_sec002_ventas_private_delivery_cs21a159.mjs
      - name: Regress CS21A160 certificate
        run: node scripts/qa_sec002_student_certificate_cs21a160.mjs
      - name: Regress CS21A161 payment receipt
        run: node scripts/qa_sec002_payment_receipt_cs21a161.mjs
      - name: Regress CS21A162 signed enrollment
        run: node scripts/qa_sec002_student_signed_enrollment_cs21a162.mjs
      - name: Regress CS21A180 P1 source/tooling
        run: node scripts/qa_security_p1_source_tooling_cs21a180.mjs
      - name: Run CS21A181 cross assertions
        run: node scripts/qa_sec002_private_student_admin_chain_cs21a181.mjs
      - name: Diff hygiene vs CS21A180
        run: git diff --check 0a316ca7cf2a62a12e8a3540570527e367a8e37e...HEAD -- . ':(exclude)00_DOCUMENTACION/**'
      - name: Remove bootstrap and push verified candidate
        run: |
          git rm .github/workflows/bootstrap-merge-sec002-private-chain-cs21a181.yml
          git add -A
          git commit -m "CS21A181 · verified private student/admin document chain"
          git push origin HEAD:integration/sec002-private-student-admin-chain-cs21a181
