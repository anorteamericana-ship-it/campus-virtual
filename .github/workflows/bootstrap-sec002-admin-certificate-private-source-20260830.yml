name: Bootstrap SEC002 Admin Certificate Private Source

on:
  push:
    branches:
      - security/sec002-admin-certificate-private-source-20260830
    paths:
      - 'scripts/bootstrap_patch_sec002_admin_certificate_private_source_20260830.mjs'
      - '.github/workflows/bootstrap-sec002-admin-certificate-private-source-20260830.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify exact base ancestry
        run: git merge-base --is-ancestor 77cb5c9741cb648be960a2aed19e574320d0d0e4 HEAD
      - name: Apply exact admin certificate private patch
        run: node scripts/bootstrap_patch_sec002_admin_certificate_private_source_20260830.mjs
      - name: Run private certificate source guard
        run: node scripts/qa_sec002_admin_certificate_private_source_20260830.mjs
      - name: Regress admin private academic docs
        run: node scripts/qa_sec002_admin_private_academic_docs_cs21a193.mjs
      - name: Regress admin copy
        run: node scripts/qa_admin_students_user_copy_cs21a192.mjs
      - name: Regress admin safe errors
        run: node scripts/qa_admin_students_safe_errors_cs21a191.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Remove bootstrap artifacts and push verified candidate
        run: |
          rm scripts/bootstrap_patch_sec002_admin_certificate_private_source_20260830.mjs
          rm .github/workflows/bootstrap-sec002-admin-certificate-private-source-20260830.yml
          git add -A
          git commit -m 'SEC002 admin cert · private source migration'
          git push origin HEAD:security/sec002-admin-certificate-private-source-20260830
