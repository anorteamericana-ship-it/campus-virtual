name: Bootstrap SEC002 Admin Certificate Private Rebase CS21A197R

on:
  push:
    branches:
      - security/sec002-admin-certificate-private-rebase-cs21a197r
    paths:
      - 'scripts/bootstrap_patch_sec002_admin_certificate_private_rebase_cs21a197r.mjs'
      - '.github/workflows/bootstrap-sec002-admin-certificate-private-rebase-cs21a197r.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify exact canonical base ancestry
        run: git merge-base --is-ancestor 95ea46b0a32fb844f480052b0f24fd12b846874a HEAD
      - name: Syntax check patcher
        run: node --check scripts/bootstrap_patch_sec002_admin_certificate_private_rebase_cs21a197r.mjs
      - name: Apply exact certificate reconciliation
        run: node scripts/bootstrap_patch_sec002_admin_certificate_private_rebase_cs21a197r.mjs
      - name: Run CS21A197R guard
        run: node scripts/qa_sec002_admin_certificate_private_rebase_cs21a197r.mjs
      - name: Regress certificate ACL evidence CS21A194R
        run: node scripts/qa_sec002_certificate_tree_rebase_cs21a194.mjs
      - name: Regress identity evidence CS21A195R
        run: node scripts/qa_sec002_identity_evidence_rebase_cs21a195.mjs
      - name: Regress proforma ACL evidence CS21A196R
        run: node scripts/qa_sec002_proforma_acl_rebase_cs21a196.mjs
      - name: Regress private academic docs CS21A193
        run: node scripts/qa_sec002_admin_academic_docs_private_cs21a193.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Remove bootstrap artifacts and push verified candidate
        run: |
          rm scripts/bootstrap_patch_sec002_admin_certificate_private_rebase_cs21a197r.mjs
          rm .github/workflows/bootstrap-sec002-admin-certificate-private-rebase-cs21a197r.yml
          git add -A
          git commit -m 'CS21A197R · rebase private admin certificate consumer'
          git push origin HEAD:security/sec002-admin-certificate-private-rebase-cs21a197r
