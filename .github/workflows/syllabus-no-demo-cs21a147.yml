name: Syllabus no demo CS21A147

on:
  pull_request:
    paths:
      - 'src/syllabus.jsx'
      - 'scripts/test_syllabus_no_demo_cs21a147.mjs'
      - '.github/workflows/syllabus-no-demo-cs21a147.yml'
  push:
    branches:
      - 'cleanup/cs21a147-syllabus-demo'
    paths:
      - 'src/syllabus.jsx'
      - 'scripts/test_syllabus_no_demo_cs21a147.mjs'
      - '.github/workflows/syllabus-no-demo-cs21a147.yml'

permissions:
  contents: read

jobs:
  syllabus-no-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify canonical syllabus
        run: node scripts/test_syllabus_no_demo_cs21a147.mjs
