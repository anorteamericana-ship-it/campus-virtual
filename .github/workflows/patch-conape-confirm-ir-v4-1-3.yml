name: Patch CONAPE confirmation IR V4.1.3
on:
  push:
    branches:
      - fix/conape-confirm-ir-v4-1-3
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/conape-confirm-ir-v4-1-3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 scripts/_patch_conape_confirm_ir_v4_1_3.py
      - name: Validate
        run: |
          node --check services/conape-bridge/server_v2.mjs
          node scripts/qa_conape_bridge_v2.mjs
      - name: Commit clean diff
        run: |
          rm -f scripts/_patch_conape_confirm_ir_v4_1_3.py .github/workflows/patch-conape-confirm-ir-v4-1-3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/conape-bridge/server_v2.mjs scripts/qa_conape_bridge_v2.mjs scripts/_patch_conape_confirm_ir_v4_1_3.py .github/workflows/patch-conape-confirm-ir-v4-1-3.yml
          git commit -m "fix: limpiar filtros IR antes de confirmar CREATE"
          git push origin HEAD:fix/conape-confirm-ir-v4-1-3