name: Patch CONAPE confirmation IR V4.1.3
on:
  push:
    branches:
      - fix/conape-confirm-ir-v4-1-3
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/conape-confirm-ir-v4-1-3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 scripts/_patch_conape_confirm_ir_v4_1_3.py
      - name: Harden reset and fix QA assertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          server_path = Path('services/conape-bridge/server_v2.mjs')
          server = server_path.read_text()
          old = """        await reset.click({ timeout:5_000 });
        await waitForApexDynamicAction(p);
        await sleep(120);
        ir_reset_method = 'ACTIONS_RESET';
"""
          new = """        await reset.click({ timeout:5_000 });
        await waitForApexDynamicAction(p);
        await sleep(120);
        if ((await countIrFilters(p)) === 0) ir_reset_method = 'ACTIONS_RESET';
"""
          if old not in server:
              raise SystemExit('STOP: reset baseline no coincide')
          server = server.replace(old, new, 1)
          server_path.write_text(server)

          qa_path = Path('scripts/qa_conape_bridge_v2.mjs')
          qa = qa_path.read_text()
          qa = qa.replace("/return \\{ found:true, estado \\}/.test(confirmBlock)", "/if \\(fast\\.found\\) return \\{ found:true/.test(confirmBlock)")
          qa = qa.replace("/resetInteractiveReport/.test(confirmBlock)", "/resetInteractiveReport/.test(server)")
          qa = qa.replace("/ACTIONS_RESET/.test(confirmBlock)", "/ACTIONS_RESET/.test(server)")
          qa = qa.replace("/CHIP_CLOSE/.test(confirmBlock)", "/CHIP_CLOSE/.test(server)")
          qa_path.write_text(qa)
          PY
      - name: Validate
        run: |
          node --check services/conape-bridge/server_v2.mjs
          node scripts/qa_conape_bridge_v2.mjs
      - name: Commit clean diff
        run: |
          rm -f scripts/_patch_conape_confirm_ir_v4_1_3.py .github/workflows/patch-conape-confirm-ir-v4-1-3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/conape-bridge/server_v2.mjs scripts/qa_conape_bridge_v2.mjs scripts/_patch_conape_confirm_ir_v4_1_3.py .github/workflows/patch-conape-confirm-ir-v4-1-3.yml
          git commit -m "fix: limpiar filtros IR antes de confirmar CREATE"
          git push origin HEAD:fix/conape-confirm-ir-v4-1-3