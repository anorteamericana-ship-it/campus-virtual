name: SEC001 auth adapter one-shot

on:
  push:
    branches:
      - fix/sec001-auth-policy-foundation
    paths:
      - .github/workflows/sec001_auth_adapter_once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sec001-auth-policy-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run SEC-001 source guards
        run: |
          node scripts/qa_sec001_password_policy.mjs
          node scripts/qa_sec001_auth0_poc_contract.mjs
          node scripts/qa_sec001_auth_provider_adapter.mjs
          cp src/auth_provider_sec001.jsx /tmp/auth_provider_sec001.js
          node --check /tmp/auth_provider_sec001.js
          git diff --check HEAD~1 HEAD
