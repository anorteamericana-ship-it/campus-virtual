name: TEMP Run CONAPE V4.1.5

on:
  push:
    branches:
      - fix/conape-form-mode-v4-1-5

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/conape-form-mode-v4-1-5
          fetch-depth: 0
      - name: Run embedded patch once
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "const VERSION = 'V4.1.5';" services/conape-bridge/server_v2.mjs; then
            echo "V4.1.5 already applied"
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import re
          src = Path('.github/workflows/temp-apply-conape-v4-1-5.yml').read_text().splitlines()
          out = []
          capture = False
          for line in src:
              if line.strip() == "python - <<'PY'":
                  capture = True
                  continue
              if capture and line.strip() == 'PY':
                  break
              if capture:
                  out.append(line[10:] if line.startswith('          ') else line)
          text = '\n'.join(out) + '\n'
          text = re.sub(r"\ncheck_anchor = .*?\nqa = qa\.replace\(check_anchor, extra_checks, 1\)\n", "\n", text, flags=re.S)
          Path('/tmp/apply.py').write_text(text)
          PY
          python /tmp/apply.py
          python - <<'PY'
          from pathlib import Path
          qa_path = Path('scripts/qa_conape_bridge_v2.mjs')
          qa = qa_path.read_text()
          marker = "  ['health identifica runtime y commit Railway',"
          if marker not in qa:
              raise SystemExit('QA insertion marker missing')
          extras = """  ['modo formulario distingue CREATE/UPDATE/UNKNOWN por botones visibles', server.includes(\"CREAR NUEVO PROSPECTO\") && server.includes(\"APLICAR CAMBIOS\") && server.includes(\"const mode = hasCreate ? 'CREATE' : (hasUpdate ? 'UPDATE' : 'UNKNOWN');\")],
  ['UPDATE corta en LOOKUP antes de fill y CREATE', server.includes(\"new AppError('ALREADY_RECRUITED'\") && server.includes(\"409, 'LOOKUP'\") && executeBlock.indexOf('enforceRecruitFormMode') >= 0 && executeBlock.indexOf('enforceRecruitFormMode') < executeBlock.indexOf('fillContacts') && executeBlock.indexOf('enforceRecruitFormMode') < executeBlock.indexOf('clickCreateOnce')],
  ['UNKNOWN falla cerrado sin CREATE', server.includes(\"new AppError('FORM_MODE_UNKNOWN'\") && server.includes(\"error.form_mode = 'UNKNOWN'\")],
  ['post-CREATE confirma primero por modo UPDATE y deja Home de fallback', server.includes('async function confirmAfterCreate') && server.includes(\"confirmation_method:'FORM_MODE_UPDATE'\") && server.includes(\"confirmation_method:'HOME_FALLBACK'\") && executeBlock.includes('confirmAfterCreate(auth.cedula, meta.sessionId)')],
  ['telemetría segura incluye form_mode y readonly por campo', ['form_mode','form_readonly_fields','confirmation_method','confirmation_form_mode','confirmation_readonly_fields'].every(v => server.includes(v)) && server.includes('readonly:field?.readonly === true')],
"""
          qa = qa.replace(marker, extras + marker, 1)
          qa_path.write_text(qa)
          PY
          node --check services/conape-bridge/server_v2.mjs
          node --check scripts/qa_conape_bridge_v2.mjs
          node scripts/qa_conape_bridge_v2.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/conape-bridge/server_v2.mjs scripts/qa_conape_bridge_v2.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'CONAPE V4.1.5 · modo CREATE UPDATE'
          git push origin HEAD:fix/conape-form-mode-v4-1-5
