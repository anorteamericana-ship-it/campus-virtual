name: SEC001 minimum 6 one-shot

on:
  push:
    branches:
      - fix/sec001-auth-policy-foundation
    paths:
      - .github/workflows/sec001_min6_once.yml

permissions:
  contents: write

jobs:
  update-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sec001-auth-policy-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply product decision minimum 6
        shell: python
        run: |
          from pathlib import Path
          import json

          p = Path('src/inscripcion.jsx')
          s = p.read_text(encoding='utf-8')
          replacements = {
              "clean(form.clave).length < 15": "clean(form.clave).length < 6",
              "clave mínima de 15 caracteres": "clave mínima de 6 caracteres",
              "Usá al menos 15 caracteres. Podés usar una frase fácil de recordar.": "Usá al menos 6 caracteres. Podés usar una frase fácil de recordar.",
              "minLength={15}": "minLength={6}",
              "La clave debe tener al menos 15 caracteres.": "La clave debe tener al menos 6 caracteres.",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected source pattern: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          p = Path('scripts/qa_sec001_password_policy.mjs')
          s = p.read_text(encoding='utf-8')
          script_replacements = {
              "Math.max(...numericLengthChecks) < 15": "Math.max(...numericLengthChecks) < 6",
              "minimum remains below 15": "minimum remains below 6",
              "Number(directMin[1]) < 15": "Number(directMin[1]) < 6",
              "minimum length of at least 15": "minimum length of at least 6",
              "minimum length >= 15": "minimum length >= 6",
          }
          for old, new in script_replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected QA pattern: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          p = Path('security/sec001_auth_contract.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['version'] = max(int(data.get('version', 0)), 5)
          data['password_policy']['minimum_length_single_factor'] = 6
          data['password_policy']['standards_exception'] = 'Product decision 2026-08-17: 6-character minimum is below current NIST SP 800-63B guidance; compensate with managed verifier, common-password blocking, abuse controls, and staff MFA.'
          ev = data.get('evidence_required_to_close', [])
          data['evidence_required_to_close'] = [
              x.replace('15-character length-only password policy', '6-character product password policy')
              for x in ev
          ]
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          p = Path('00_DOCUMENTACION/SEC001_AUTH_VERIFIER_ADR_2026-08-16.md')
          s = p.read_text(encoding='utf-8')
          adr_replacements = {
              'mínimo 15 caracteres;': 'mínimo 6 caracteres (decisión de producto del 2026-08-17);',
              'strength `Low` con longitud 15;': 'strength `Low` con longitud 6;',
              'passphrase >=15': 'passphrase >=6',
              'policy >=15': 'policy >=6',
          }
          for old, new in adr_replacements.items():
              if old in s:
                  s = s.replace(old, new)
          marker = '## Política de contraseña objetivo\n'
          amendment = ('## Enmienda de política · 2026-08-17\n\n'
                       'Por decisión explícita de producto, el mínimo del Campus se fija en **6 caracteres**. '
                       'Esto se documenta como una excepción consciente respecto de la guía NIST vigente para contraseñas centralmente verificadas. '
                       'La compensación obligatoria del diseño es: verificador administrado, bloqueo de contraseñas comunes, protección contra intentos repetidos/enumeração y MFA para personal. '
                       'No se añaden reglas arbitrarias de composición.\n\n')
          if amendment not in s and marker in s:
              s = s.replace(marker, amendment + marker, 1)
          p.write_text(s, encoding='utf-8')

          decision = Path('00_DOCUMENTACION/SEC001_PASSWORD_POLICY_DECISION_2026-08-17.md')
          decision.write_text('''# SEC-001 · Decisión de producto sobre longitud de contraseña\n\n**Fecha:** 2026-08-17  \n**Estado:** `DECISIÓN DE PRODUCTO · SOURCE ONLY · NO DEPLOY`\n\n## Decisión\n\nEl mínimo de contraseña visible del Campus se fija en **6 caracteres** y el máximo de UI permanece en **128**.\n\nNo se exigirán combinaciones arbitrarias de mayúsculas, números o símbolos. Se permiten frases, pegado y gestores de contraseñas.\n\n## Riesgo aceptado y compensaciones obligatorias\n\nEl mínimo de 6 caracteres es más débil que la guía NIST vigente para contraseñas centralmente verificadas. Por tanto, esta decisión solo es aceptable dentro del diseño SEC-001 si se mantienen como requisitos de cierre:\n\n- verificación de contraseña fuera de Sheets/Apps Script mediante IdP/verificador administrado;\n- bloqueo de contraseñas comunes/comprometidas;\n- rate limiting y protección contra enumeración/intentos repetidos;\n- MFA para personal;\n- eliminación de contraseñas legibles y fallbacks `CODIGO` / `an####`;\n- recovery que nunca revele la contraseña anterior.\n\n## No cambia\n\nEsta decisión no autoriza producción, no instala Apps Script, no migra cuentas reales y no modifica Memory Match, English LAB ni Speak LAB.\n''', encoding='utf-8')
      - name: Verify policy guard
        run: |
          node scripts/qa_sec001_password_policy.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('security/sec001_auth_contract.json').read_text())
          assert d['password_policy']['minimum_length_single_factor'] == 6
          s=Path('src/inscripcion.jsx').read_text()
          assert 'minLength={6}' in s
          assert 'length < 6' in s
          assert '15 caracteres' not in s
          print('SEC-001 MIN6 CONTRACT: PASS')
          PY
          git diff --check
      - name: Commit policy decision
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/inscripcion.jsx scripts/qa_sec001_password_policy.mjs security/sec001_auth_contract.json 00_DOCUMENTACION/SEC001_AUTH_VERIFIER_ADR_2026-08-16.md 00_DOCUMENTACION/SEC001_PASSWORD_POLICY_DECISION_2026-08-17.md
          git diff --cached --quiet && exit 0
          git commit -m 'SEC-001: ajusta mínimo de contraseña a 6'
          git push origin HEAD:fix/sec001-auth-policy-foundation
