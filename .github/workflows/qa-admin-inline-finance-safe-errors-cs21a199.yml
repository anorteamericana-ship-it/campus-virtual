name: QA Admin Inline Finance Safe Errors CS21A199

on:
  pull_request:
    paths:
      - 'src/admin_students_inline_payment_cs21a36.jsx'
      - 'scripts/qa_admin_inline_finance_safe_errors_cs21a199.mjs'
      - '.github/workflows/qa-admin-inline-finance-safe-errors-cs21a199.yml'

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CS21A199 inline finance safe errors
        run: node scripts/qa_admin_inline_finance_safe_errors_cs21a199.mjs
      - name: Regress CS21A198 admin integration
        run: node scripts/qa_admin_secondary_surfaces_cs21a198.mjs
      - name: Regress canonical master dashboard
        run: node scripts/qa_admin_master_dashboard_safe_errors_cs21a196.mjs
      - name: Diff hygiene
        run: git diff --check origin/${{ github.base_ref }}...HEAD -- . ':!00_DOCUMENTACION/**'
