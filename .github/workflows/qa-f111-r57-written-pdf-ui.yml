name: F111 R57 Written PDF UI Gate
on:
  pull_request:
    paths:
      - 'src/examenes_modes.jsx'
      - 'src/examenes_bundle.jsx'
      - 'modulos/examenes.html'
      - 'src/app.jsx'
      - 'scripts/qa_f111_r57_written_pdf_ui_boundary.mjs'
      - '.github/workflows/qa-f111-r57-written-pdf-ui.yml'
permissions:
  contents: read
jobs:
  written-pdf-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify server-gated official written PDF actions in effective bundle
        run: node scripts/qa_f111_r57_written_pdf_ui_boundary.mjs
