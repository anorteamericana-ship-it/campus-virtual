name: QA Teacher Action Safe Errors CS21A187

on:
  pull_request:
    paths:
      - 'src/teacher_views.jsx'
      - 'scripts/qa_teacher_action_safe_errors_cs21a187.mjs'
      - '.github/workflows/qa-teacher-action-safe-errors-cs21a187.yml'
      - '00_DOCUMENTACION/TEACHER_ACTION_SAFE_ERRORS_CS21A187_2026-08-29.md'

permissions:
  contents: read

jobs:
  teacher-action-safe-errors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run CS21A187 guard
        run: node scripts/qa_teacher_action_safe_errors_cs21a187.mjs
      - name: Regress CS21A186 teacher session safe errors
        run: node scripts/qa_teacher_session_safe_errors_cs21a186.mjs
      - name: Regress CS21A185 teacher material access
        run: node scripts/qa_teacher_material_access_cs21a185.mjs
      - name: Diff hygiene
        run: git diff --check "origin/fix/teacher-session-safe-errors-cs21a186...HEAD" -- . ':(exclude)00_DOCUMENTACION/**'
