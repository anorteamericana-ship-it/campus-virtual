name: SEC002 reconciler V3 one-shot

on:
  push:
    branches:
      - fix/sec002-private-document-foundation
    paths:
      - .github/workflows/sec002_reconciler_v2_once.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/sec002_reconciler_v2_once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sec002-private-document-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        shell: powershell
        run: |
          node --check scripts/apply_sec002_modular_exact.mjs
          node --check scripts/qa_sec002_modular_installer.mjs
          node --check scripts/qa_sec002_modular_rebaser_synthetic.mjs
      - name: Guard
        shell: powershell
        run: node scripts/qa_sec002_modular_installer.mjs
      - name: Exact rebaser regression
        shell: powershell
        run: node scripts/qa_sec002_modular_rebaser_synthetic.mjs
      - name: Special resolver static contract
        shell: powershell
        run: |
          $src = Get-Content -Raw scripts/apply_sec002_modular_exact.mjs
          if (($src | Select-String -Pattern "reason: 'post_" -AllMatches).Matches.Count -ne 3) { throw 'expected exactly three special POST resolutions' }
          if ($src -notmatch '_an4406_rolesPorEndpoint_') { throw 'missing POST role target' }
          if ($src -notmatch '_an4406_validarPropiedadPost_') { throw 'missing POST ownership target' }
          if ($src -notmatch 'post_payment_ownership_after_docs_extra_overlap') { throw 'missing payment overlap resolution' }
          if ($src -notmatch "getProspectoDetalle' \|\| fn === 'subirDocumentoExtra' \|\| fn === 'descargarDocumentoExtraPrivado'") { throw 'missing docs_extra expanded anchor' }
          if ($src -notmatch 'payment_post_ownership_invariant_failed') { throw 'missing payment invariant' }
          if ($src -notmatch 'EXACT_HUNKS=') { throw 'missing exact count output' }
          if ($src -notmatch 'SPECIAL_POST_LAYER_HUNKS=') { throw 'missing special count output' }
          Write-Host 'PASS reconciler V3 static contract'
