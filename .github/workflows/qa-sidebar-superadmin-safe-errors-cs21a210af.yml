name: QA Sidebar Superadmin Safe Errors CS21A210AF

on:
  push:
    branches:
      - fix/sidebar-superadmin-safe-errors-cs21a210af
    paths:
      - 'src/sidebar.jsx'
      - 'scripts/qa_sidebar_superadmin_safe_errors_cs21a210af.mjs'
      - '.github/workflows/qa-sidebar-superadmin-safe-errors-cs21a210af.yml'
      - '00_DOCUMENTACION/SIDEBAR_SUPERADMIN_SAFE_ERRORS_CS21A210AF_2026-08-31.md'
  pull_request:
    paths:
      - 'src/sidebar.jsx'
      - 'scripts/qa_sidebar_superadmin_safe_errors_cs21a210af.mjs'
      - '.github/workflows/qa-sidebar-superadmin-safe-errors-cs21a210af.yml'
      - '00_DOCUMENTACION/SIDEBAR_SUPERADMIN_SAFE_ERRORS_CS21A210AF_2026-08-31.md'

jobs:
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install JSX parser
        run: npm install --no-save --ignore-scripts @babel/parser@7.28.4
      - name: Parse sidebar JSX
        run: |
          node <<'NODE'
          const fs=require('fs');
          const parser=require('@babel/parser');
          parser.parse(fs.readFileSync('src/sidebar.jsx','utf8'),{sourceType:'script',plugins:['jsx','optionalChaining','nullishCoalescingOperator']});
          console.log('CS21A210AF JSX parse: PASS');
          NODE
      - name: Verify CS21A210AF semantics
        run: node scripts/qa_sidebar_superadmin_safe_errors_cs21a210af.mjs
      - name: Regress CS21A210AD student content boundary
        run: node scripts/qa_student_content_access_safe_errors_cs21a210ad.mjs
      - name: Regress CS21A210AB TOEIC payment boundary
        run: node scripts/qa_aplicar_pago_toeic_safe_errors_cs21a210ab.mjs
      - name: Regress CS21A210Z Free Prospect Portal
        run: node scripts/qa_free_prospect_portal_safe_errors_cs21a210z.mjs
      - name: Diff hygiene
        run: git diff --check
