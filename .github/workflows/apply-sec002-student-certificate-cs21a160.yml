name: APPLY SEC002 Student Certificate CS21A160 TEMP

on:
  push:
    branches:
      - security/sec002-student-certificate-private-cs21a160

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'CS21A160 applied') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/sec002-student-certificate-private-cs21a160
          fetch-depth: 0
      - name: Apply exact private-certificate source port
        run: node scripts/run_sec002_student_certificate_cs21a160.mjs
      - name: Validate exact source scope
        run: |
          git diff --check
          test "$(git diff --name-only)" = "src/student_modules.jsx"
          ! grep -q "href={row.url}" src/student_modules.jsx
          grep -q "descargarMiCertificadoPrivado" src/student_modules.jsx
          grep -q "URL.createObjectURL(archivo.blob)" src/student_modules.jsx
          grep -q "bytes.length > 2 \* 1024 \* 1024" src/student_modules.jsx
      - name: Commit source and remove bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/.apply_sec002_student_certificate_cs21a160.fixed.mjs
          git add src/student_modules.jsx
          git rm scripts/apply_sec002_student_certificate_cs21a160.mjs scripts/run_sec002_student_certificate_cs21a160.mjs .github/workflows/apply-sec002-student-certificate-cs21a160.yml
          git commit -m "CS21A160 applied · private student certificate source"
          git push origin HEAD:security/sec002-student-certificate-private-cs21a160
