name: SEC002 repair smoke URI encoding one-shot

on:
  push:
    branches:
      - fix/sec002-private-document-foundation
    paths:
      - .github/workflows/sec002_fix_smoke_uri_once.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/sec002_fix_smoke_uri_once.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sec002-private-document-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore clean UTF-8 files and apply only intended smoke fix
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { spawnSync } = require('child_process');
          const base = 'ba03be0eef482bf87fbe655de7febf9f15e8b604';
          const psPath = 'scripts/install_apps_script_qa_sec002_modular.ps1';
          const guardPath = 'scripts/qa_sec002_modular_installer.mjs';
          function fromGit(p) {
            const r = spawnSync('git', ['show', `${base}:${p}`], { encoding: null });
            if (r.status !== 0) throw new Error(`git show failed for ${p}: ${String(r.stderr)}`);
            return r.stdout.toString('utf8');
          }
          function count(s, needle) { return s.split(needle).length - 1; }
          let ps = fromGit(psPath);
          const oldUri = '$uri = "$QaExecUrl?fn=$([Uri]::EscapeDataString($fn))"';
          const newUri = '$uri = "${QaExecUrl}?fn=$([Uri]::EscapeDataString($fn))"';
          if (count(ps, oldUri) !== 1 || count(ps, newUri) !== 0) throw new Error('clean-base URI precondition failed');
          ps = ps.replace(oldUri, newUri);
          let guard = fromGit(guardPath);
          const anchor = "check('smokes all four private routes', ['descargarMiCertificadoPrivado','descargarDocumentoExtraPrivado','descargarComprobantePagoPrivado','descargarMatriculaFirmadaPrivada'].every(x=>ps.includes(x)));";
          const guardLine = "check('smoke URI braces QA exec variable before query string', ps.includes('${QaExecUrl}?fn=$([Uri]::EscapeDataString($fn))') && !ps.includes('$QaExecUrl?fn='));";
          if (count(guard, anchor) !== 1 || guard.includes('smoke URI braces QA exec variable before query string')) throw new Error('clean-base guard precondition failed');
          guard = guard.replace(anchor, `${anchor}\n${guardLine}`);
          fs.writeFileSync(psPath, ps, 'utf8');
          fs.writeFileSync(guardPath, guard, 'utf8');
          for (const p of [psPath, guardPath]) {
            const b = fs.readFileSync(p);
            if (b.length >= 3 && b[0] === 0xef && b[1] === 0xbb && b[2] === 0xbf) throw new Error(`${p} has UTF-8 BOM`);
            const s = b.toString('utf8');
            if (s.includes('Â·') || s.includes('Ã³') || s.includes('producciÃ³n')) throw new Error(`${p} contains mojibake`);
          }
          if (!ps.includes("Write-Step '1/11 · Obtener rama SEC-002 y ejecutar guards'")) throw new Error('middle-dot preservation failed');
          if (!ps.includes('funci[oó]n post no reconocida')) throw new Error('accent preservation failed');
          console.log('PASS clean UTF-8 restore + exact URI fix + guard');
          NODE
      - name: Windows PowerShell 5.1 parser
        shell: powershell
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/install_apps_script_qa_sec002_modular.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Host; throw "PowerShell parser errors=$($errors.Count)" }
          Write-Host 'PASS Windows PowerShell 5.1 parser'
      - name: SEC002 installer guard
        shell: powershell
        run: node scripts/qa_sec002_modular_installer.mjs
      - name: Exact diff scope
        shell: bash
        run: |
          git diff --check
          files=$(git diff --name-only | sort)
          expected=$(printf '%s\n' scripts/install_apps_script_qa_sec002_modular.ps1 scripts/qa_sec002_modular_installer.mjs | sort)
          test "$files" = "$expected"
          git diff -- scripts/install_apps_script_qa_sec002_modular.ps1 scripts/qa_sec002_modular_installer.mjs
      - name: Commit repaired files
        shell: bash
        run: |
          git config user.name 'anorteamericana-ship-it'
          git config user.email 'anorteamericana@gmail.com'
          git add scripts/install_apps_script_qa_sec002_modular.ps1 scripts/qa_sec002_modular_installer.mjs
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "2"
          git commit -m 'SEC002 corrige URI smoke sin degradar UTF-8'
          git push origin HEAD:fix/sec002-private-document-foundation
