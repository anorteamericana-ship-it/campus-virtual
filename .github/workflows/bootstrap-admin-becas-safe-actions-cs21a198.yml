name: Bootstrap Admin Becas Safe Actions CS21A198

on:
  push:
    branches:
      - fix/admin-becas-safe-actions-cs21a198
    paths:
      - 'scripts/bootstrap_patch_admin_becas_safe_actions_cs21a198.mjs'
      - '.github/workflows/bootstrap-admin-becas-safe-actions-cs21a198.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify exact base ancestry
        run: git merge-base --is-ancestor e105cda7f87f3f64c9add01b6808877f21c68495 HEAD
      - name: Apply exact Becas patch
        run: node scripts/bootstrap_patch_admin_becas_safe_actions_cs21a198.mjs
      - name: Run CS21A198 guard
        run: node scripts/qa_admin_becas_safe_actions_cs21a198.mjs
      - name: Regress CS21A197
        run: node scripts/qa_admin_aperturas_safe_errors_cs21a197.mjs
      - name: Regress CS21A196
        run: node scripts/qa_admin_suspensiones_safe_actions_cs21a196.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Remove bootstrap artifacts and push verified candidate
        run: |
          rm scripts/bootstrap_patch_admin_becas_safe_actions_cs21a198.mjs
          rm .github/workflows/bootstrap-admin-becas-safe-actions-cs21a198.yml
          git add -A
          git commit -m 'CS21A198 · safe admin Becas actions'
          git push origin HEAD:fix/admin-becas-safe-actions-cs21a198
