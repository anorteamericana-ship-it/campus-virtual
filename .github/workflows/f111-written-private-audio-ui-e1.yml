name: F111 Written Private MP3 Player E1
on:
  pull_request:
    paths:
      - 'src/examenes_app.jsx'
      - 'src/examenes_render.jsx'
      - 'src/examenes_modes.jsx'
      - 'src/examenes_bundle.jsx'
      - 'scripts/sync_f111_written_private_audio_bundle.mjs'
      - 'scripts/qa_f111_written_private_audio_ui_e1.mjs'
      - '.github/workflows/f111-written-private-audio-ui-e1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-written-audio-student:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle and protected source parity
        run: node scripts/sync_f111_written_private_audio_bundle.mjs --check
      - name: E1 private audio transport and blob lifecycle
        run: node scripts/qa_f111_written_private_audio_ui_e1.mjs
      - name: Protect existing student written flows
        run: |
          node scripts/qa_f111_written_b_audio_guard_e1.mjs
          node scripts/qa_f111_written_save_race_e1.mjs
          node scripts/qa_f111_written_receipt_e1.mjs
          node scripts/qa_f111_student_written_history_e1.mjs
