name: SEC002 modular diagnostics V2 one-shot

on:
  push:
    branches:
      - fix/sec002-private-document-foundation
    paths:
      - .github/workflows/sec002_diag_v2_once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sec002-private-document-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node syntax
        shell: powershell
        run: node --check scripts/diagnose_sec002_modular_qa.mjs
      - name: Read-only 24-hunk all-file synthetic diagnostic
        shell: powershell
        run: |
          $apps = Join-Path $env:RUNNER_TEMP 'sec002_diag_v2_apps'
          New-Item -ItemType Directory -Force -Path $apps | Out-Null
          @('01_Router.js','14_Notas_Cierre_Certificados.js','20_Inscripcion_Ventas_Matricula.js','21_Pagos_Banco_CONAPE.js','30_Admin_Auditoria_Reportes.js','31_Legacy_Pendiente_Clasificar.js','96_English_LAB_Memory_Match_Live_CS21A174.js') | ForEach-Object {
            Set-Content -LiteralPath (Join-Path $apps $_) -Value "// synthetic $_`nfunction baseline_$([IO.Path]::GetFileNameWithoutExtension($_).Replace('-','_'))(){}" -Encoding UTF8
          }
          $before = Get-ChildItem $apps -File | Get-FileHash -Algorithm SHA256 | Sort-Object Path | ForEach-Object { "$($_.Path)|$($_.Hash)" }
          $report = Join-Path $env:RUNNER_TEMP 'sec002_diag_v2_report.json'
          node scripts/diagnose_sec002_modular_qa.mjs --apps-dir $apps --repo-root $PWD --report $report
          if ($LASTEXITCODE -ne 0) { throw 'diagnostic script failed' }
          $json = Get-Content -Raw $report | ConvertFrom-Json
          if ($json.mode -ne 'SEC002_MODULAR_DIAGNOSTIC_READONLY_V2_ALL_SERVER_FILES') { throw 'unexpected mode' }
          if ($json.diagnosed_hunks -ne 24) { throw "expected 24 hunks, got $($json.diagnosed_hunks)" }
          if ($json.source_file_count -ne 7) { throw "expected 7 source files, got $($json.source_file_count)" }
          $forbidden = @($json.source_files | Where-Object { $_.forbidden_target })
          if ($forbidden.Count -ne 1) { throw "expected one forbidden marker file" }
          $after = Get-ChildItem $apps -File | Get-FileHash -Algorithm SHA256 | Sort-Object Path | ForEach-Object { "$($_.Path)|$($_.Hash)" }
          if (Compare-Object $before $after) { throw 'diagnostic mutated source files' }
          Write-Host 'PASS V2 diagnostic scans all server files, flags forbidden targets, and stays read-only'
