name: SEC002 Windows strict Count one-shot

on:
  push:
    branches:
      - fix/sec002-private-document-foundation
    paths:
      - scripts/install_apps_script_qa_sec002.ps1
      - scripts/qa_sec002_powershell_installer.mjs
      - .github/workflows/sec002_windows_strict_count_once.yml

permissions:
  contents: read

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static installer regression guard
        shell: powershell
        run: node scripts/qa_sec002_powershell_installer.mjs

      - name: Parse installer with Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install_apps_script_qa_sec002.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if (@($errors).Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "PowerShell parser found $(@($errors).Count) error(s)."
          }
          Write-Host 'PASS Windows PowerShell parser'

      - name: Reproduce strict-mode single-result Count cases
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $patchCandidates = @('only-one')
          $patchCandidates = @($patchCandidates | Where-Object { $_ })
          if ($patchCandidates.Count -ne 1) { throw 'patchCandidates was not kept as an array' }

          $tmp = Join-Path $env:RUNNER_TEMP 'sec002-count-test'
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $tmp 'Code.js') -Value 'function x(){}' -Encoding UTF8
          $matches = @(Get-ChildItem -LiteralPath $tmp -File | Where-Object { $_.Name -eq 'Code.js' })
          if ($matches.Count -ne 1) { throw 'Code match was not kept as an array' }

          Set-Content -LiteralPath (Join-Path $tmp 'one.patch') -Value '@@ one hunk' -Encoding UTF8
          $hunks = @(Select-String -LiteralPath (Join-Path $tmp 'one.patch') -Pattern '^@@ ' -AllMatches).Count
          if ($hunks -ne 1) { throw 'Select-String hunk count failed' }

          function One-Diff { [pscustomobject]@{ path='x'; before='a'; after='b' } }
          $unexpectedLocal = @(One-Diff)
          $unexpectedRemote = @(One-Diff)
          if ($unexpectedLocal.Count -ne 1 -or $unexpectedRemote.Count -ne 1) {
            throw 'diff result was not kept as an array'
          }

          Write-Host 'PASS strict-mode single-result Count regression cases'
