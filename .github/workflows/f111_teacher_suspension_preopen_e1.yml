name: F111 Teacher Suspension Preopen E1
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/vista_docente.jsx'
      - 'scripts/qa_f111_suspension_preopen_e1.mjs'
      - '.github/workflows/f111_teacher_suspension_preopen_e1.yml'
  push:
    branches: [main]
    paths:
      - 'src/vista_docente.jsx'
      - 'scripts/qa_f111_suspension_preopen_e1.mjs'
      - '.github/workflows/f111_teacher_suspension_preopen_e1.yml'
  workflow_dispatch:
jobs:
  teacher-suspension:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify suspension policy and pre-open UI contract
        run: node scripts/qa_f111_suspension_preopen_e1.mjs
      - name: Parse teacher JSX (no execution)
        run: |
          npm install --no-save --ignore-scripts @babel/parser@7.28.4
          node -e "require('@babel/parser').parse(require('fs').readFileSync('src/vista_docente.jsx','utf8'),{sourceType:'script',plugins:['jsx','optionalChaining','nullishCoalescingOperator']});console.log('PASS vista_docente.jsx JSX')"
