name: QA Admin Private Academic Docs CS21A193

on:
  pull_request:
    paths:
      - 'src/admin_students.jsx'
      - 'security/sec002_admin_academic_docs_cs21a193.json'
      - 'scripts/qa_admin_private_academic_docs_cs21a193.mjs'
      - '.github/workflows/qa-admin-private-academic-docs-cs21a193.yml'

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard private academic document delivery
        run: node scripts/qa_admin_private_academic_docs_cs21a193.mjs
      - name: Regress CS21A192
        run: node scripts/qa_admin_students_user_copy_cs21a192.mjs
      - name: Regress CS21A191
        run: node scripts/qa_admin_students_safe_errors_cs21a191.mjs
      - name: Diff hygiene
        run: git diff --check origin/${{ github.base_ref }}...HEAD -- . ':!00_DOCUMENTACION/**'
