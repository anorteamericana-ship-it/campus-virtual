name: CS21A192 REV2 Memory Match Authoritative Sync QA

on:
  pull_request:
    paths:
      - 'apps_script_patches/english_lab_access_cs21a144.gs'
      - 'apps_script_patches/english_lab_access_cached_read_cs21a170.gs'
      - 'apps_script_patches/english_lab_access_financial_priority_cs21a171.gs'
      - 'apps_script_patches/96_English_LAB_CS21A171_AUTOINSTALABLE.gs'
      - 'apps_script_patches/english_lab_memory_match_live_cs21a174.gs'
      - 'apps_script_patches/english_lab_memory_match_hotfix_cs21a175.gs'
      - 'apps_script_patches/97_ACTUALIZACION_QA.gs'
      - 'apps_script_patches/98_ACTUALIZACION_QA_CS21A181.gs'
      - 'apps_script_patches/99K_MEMORY_MATCH_CLASSIC_SYNC_QA_CS21A189.gs'
      - 'apps_script_patches/99O_MEMORY_MATCH_CONSISTENCY_QA_CS21A192.gs'
      - 'apps_script_patches/99_CS21A183_SENTENCE_ORDER_COMPLETO.gs'
      - 'scripts/assemble_apps_script_cs21a183_complete.mjs'
      - 'src/english_lab_live.jsx'
      - 'src/english_lab_ux_cs21a181.js'
      - 'src/english_lab_live_authoritative_sync_guard_cs21a192.js'
      - 'src/english_lab_games/memory_match_classic_sync_cs21a189.jsx'
      - 'src/english_lab_games/english_lab_live_memory_match_authoritative_sync_adapter_cs21a192.jsx'
      - 'src/english_lab_games/memory_match_authoritative_sync_preview_cs21a192.html'
      - 'styles/english_lab_memory_match_cs21a173.css'
      - 'scripts/test_memory_match_sync_consistency_cs21a192.mjs'
      - 'scripts/test_apps_script_cumulative_verifier_cs21a192.mjs'
      - 'scripts/test_memory_match_authoritative_sync_browser_cs21a192.mjs'
      - 'scripts/memory_match_cs21a192_browser_fixture.mjs'
      - 'scripts/test_memory_match_first_reveal_deadline_browser_cs21a192.mjs'
      - 'scripts/test_memory_match_poll_recovery_browser_cs21a192.mjs'
      - 'scripts/test_memory_match_terminal_poll_stop_browser_cs21a192.mjs'
      - 'scripts/english_lab_memory_match_load_harness_cs21a192.mjs'
      - 'scripts/test_memory_match_classic_sync_browser_cs21a189.mjs'
      - 'scripts/test_memory_match_timeout_style_browser_cs21a190.mjs'
      - 'scripts/test_english_lab_closed_room_cs21a185.mjs'
      - 'scripts/test_english_lab_hangman_package_browser_cs21a191.mjs'
      - 'scripts/patch_qa_package_cs21a192.mjs'
      - '00_DOCUMENTACION/ENGLISH_LAB_MEMORY_MATCH_SYNC_CS21A192.md'
      - '.github/workflows/cs21a192-memory-match-authoritative-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authoritative-sync-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TEST_MERGE_SHA: ${{ github.sha }}
      SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assemble the single complete Apps Script QA file
        run: |
          set -euo pipefail
          node scripts/assemble_apps_script_cs21a183_complete.mjs
          complete='apps_script_patches/99_CS21A183_SENTENCE_ORDER_COMPLETO.gs'
          grep -q 'CS21A183-CS21A192 · APPS SCRIPT QA COMPLETO' "$complete"
          grep -q 'BLOQUE 15/15: 99O_MEMORY_MATCH_CONSISTENCY_QA_CS21A192.gs' "$complete"
          grep -q "CS21A192_MM_SYNC_VERSION = 'CS21A192-MM-CONSISTENCY-2'" "$complete"
          grep -q 'monotonic_state_revision:true' "$complete"
          grep -q 'teacher_student_same_snapshot_path:true' "$complete"
          grep -q 'cs21a190_transient_cleanup_markers_preserved:true' "$complete"
          grep -q 'timeout_event_cache_invalidated:true' "$complete"
          grep -q 'mismatch_reveal_ms:CS21A192_MM_MISMATCH_REVEAL_MS' "$complete"
          grep -q '_cs21a192ExpectedStateConflict_(normalized, pkg, turnState)' "$complete"
          grep -q 'hangman_router_untouched:true' "$complete"

      - name: Validate new CS21A192 backend consistency contract
        run: node scripts/test_memory_match_sync_consistency_cs21a192.mjs

      - name: Execute the real accumulated Apps Script verifier chain
        run: node scripts/test_apps_script_cumulative_verifier_cs21a192.mjs

      - name: Validate CS21A192 single-poll load budget
        run: node scripts/english_lab_memory_match_load_harness_cs21a192.mjs

      - name: Run accumulated English LAB regressions
        run: |
          set -euo pipefail
          node scripts/test_memory_match_timeout_style_cs21a190.mjs
          node scripts/test_memory_match_classic_sync_cs21a189.mjs
          node scripts/test_english_lab_product_lifecycle_cs21a187.mjs
          node scripts/test_english_lab_closed_room_cs21a185.mjs
          node scripts/test_english_lab_turn_engine_cs21a176.mjs
          node scripts/test_english_lab_live_sync_cs21a177.mjs
          node scripts/test_english_lab_live_loader_cs21a178.mjs
          node scripts/test_english_lab_hangman_engine_cs21a191.mjs
          node scripts/test_english_lab_hangman_contract_cs21a191.mjs
          node scripts/test_english_lab_hangman_browser_cs21a191.mjs
          node scripts/english_lab_load_harness_cs21a183.mjs --self-test
          node scripts/audit_delivery_surface.mjs
          node scripts/audit_component_ownership_cs21a151.mjs

      - name: Build and audit isolated QA staging base
        run: |
          set -euo pipefail
          node scripts/build_qa_staging_frontend_cs21a148.mjs
          node scripts/audit_qa_staging_frontend_cs21a148.mjs

      - name: Build accumulated CS21A183 Apollo QA base
        run: |
          set -euo pipefail
          node scripts/build_qa_package_cs21a183_apollo_qa.mjs
          node scripts/build_qa_package_cs21a183_apollo_qa.mjs --verify

      - name: Apply accumulated package layers CS21A187 through CS21A190
        run: |
          set -euo pipefail
          node scripts/patch_qa_package_cs21a187.mjs
          node scripts/patch_qa_package_cs21a189.mjs
          node scripts/patch_qa_package_cs21a190.mjs

      - name: Build and finalize the exact CS21A191 package base
        run: |
          set -euo pipefail
          node scripts/patch_qa_package_cs21a191.mjs
          node scripts/finalize_qa_package_cs21a191.mjs
          node scripts/patch_qa_package_cs21a191.mjs --verify

      - name: Clone CS21A191 and patch the isolated CS21A192 package
        run: |
          set -euo pipefail
          node scripts/patch_qa_package_cs21a192.mjs
          node scripts/patch_qa_package_cs21a192.mjs --verify

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start exact CS21A192 package server
        shell: bash
        run: |
          set -euo pipefail
          package='dist/CAMPUS_QA_CS21A192_CANDIDATO_MEMORY_MATCH_SYNC_REV2'
          PORT=4192 node "$package/serve.mjs" > cs21a192-package-server.log 2>&1 &
          echo $! > cs21a192-package-server.pid
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4192/qa-setup.html >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat cs21a192-package-server.log
          exit 1

      - name: Smoke the served package and cache epochs
        run: |
          set -euo pipefail
          base='http://127.0.0.1:4192'
          curl -fsS "$base/campus.html" -o /tmp/campus192.html
          curl -fsS "$base/src/app.jsx" -o /tmp/app192.jsx
          curl -fsS "$base/src/runtime_config.js" -o /tmp/runtime192.js
          curl -fsS "$base/src/english_lab_live.jsx" -o /tmp/live192.jsx
          curl -fsS "$base/src/english_lab_ux_cs21a181.js" -o /tmp/ux192.js
          curl -fsS "$base/src/english_lab_live_classic_sync_guard_cs21a189.js" -o /tmp/classic-guard192.js
          curl -fsS "$base/src/english_lab_live_authoritative_sync_guard_cs21a192.js" -o /tmp/sync-guard192.js
          curl -fsS "$base/src/english_lab_games/english_lab_live_memory_match_authoritative_sync_adapter_cs21a192.jsx" -o /tmp/adapter192.jsx
          curl -fsS "$base/styles/english_lab_memory_match_cs21a173.css" -o /tmp/memory192.css
          curl -fsS "$base/apps_script_patches/99K_MEMORY_MATCH_CLASSIC_SYNC_QA_CS21A189.gs" -o /tmp/classic-backend192.gs
          curl -fsS "$base/BACKEND_QA/99O_MEMORY_MATCH_CONSISTENCY_QA_CS21A192.gs" -o /tmp/internal192.gs
          curl -fsS "$base/BACKEND_QA/99_CS21A183_SENTENCE_ORDER_COMPLETO.gs" -o /tmp/complete192.gs
          curl -fsS "$base/VERSION.txt" -o /tmp/version192.txt
          grep -q 'english_lab_live_authoritative_sync_guard_cs21a192.js?v=F98.4Z6CS21A192R2' /tmp/campus192.html
          grep -q 'english_lab_memory_match_cs21a173.css?v=CS21A192R2' /tmp/campus192.html
          grep -q 'src/runtime_config.js?v=F98.4Z6CS21A192R2' /tmp/campus192.html
          grep -q 'src/app.jsx?v=F98.4Z6CS21A192R2' /tmp/campus192.html
          grep -q 'english_lab_live.jsx?v=F98.4Z6CS21A192R2' /tmp/app192.jsx
          grep -q 'english_lab_ux_cs21a181.js?v=F98.4Z6CS21A192R2' /tmp/runtime192.js
          grep -q 'memory_match_classic_sync_cs21a189.jsx?v=CS21A192R2' /tmp/classic-guard192.js
          grep -q 'EnglishLabMemoryMatchAuthoritativeSyncCS21A192' /tmp/live192.jsx
          grep -q 'silent_poll' /tmp/ux192.js
          grep -q 'english_lab_live_memory_match_authoritative_sync_adapter_cs21a192.jsx?v=CS21A192R2' /tmp/sync-guard192.js
          grep -q 'data-authoritative-sync="true"' /tmp/adapter192.jsx
          grep -q 'const POLL_TIMEOUT_MS=8000;' /tmp/adapter192.jsx
          grep -q 'expected_state_revision:currentRevision.stateRevision' /tmp/adapter192.jsx
          grep -q 'expected_turn_number:currentRevision.turnNumber' /tmp/adapter192.jsx
          grep -q 'if(!disposed&&!isTerminalState(stateRef.current)){' /tmp/adapter192.jsx
          grep -q "data-live-terminal={isTerminalState(state)?'true':'false'}" /tmp/adapter192.jsx
          grep -q 'box-sizing:border-box' /tmp/memory192.css
          grep -q 'min-width:0' /tmp/memory192.css
          grep -q '_cs21a192ExpectedStateConflict_(normalized, pkg, turnState)' /tmp/classic-backend192.gs
          grep -q 'CS21A192-MM-CONSISTENCY-2' /tmp/internal192.gs
          grep -q 'cs21a190_transient_cleanup_markers_preserved:true' /tmp/internal192.gs
          grep -q 'var CS21A192_MM_MAX_POLL_MS = 2200;' /tmp/internal192.gs
          grep -q 'var CS21A192_MM_TESTED_LATENCY_MS = 2500;' /tmp/internal192.gs
          grep -q 'var CS21A192_MM_REVEAL_MARGIN_MS = 1300;' /tmp/internal192.gs
          grep -q 'expected_state_revision_guard:true' /tmp/internal192.gs
          grep -q 'timeout_event_cache_invalidated:true' /tmp/internal192.gs
          grep -q 'BLOQUE 15/15: 99O_MEMORY_MATCH_CONSISTENCY_QA_CS21A192.gs' /tmp/complete192.gs
          grep -q 'mismatch_reveal_ms:CS21A192_MM_MISMATCH_REVEAL_MS' /tmp/complete192.gs
          grep -q '_cs21a192ExpectedStateConflict_(normalized, pkg, turnState)' /tmp/complete192.gs
          grep -q 'VERSION=CS21A192' /tmp/version192.txt
          grep -q 'PACKAGE_REVISION=2' /tmp/version192.txt
          grep -q 'PACKAGE_BASE=CS21A191_FINALIZED' /tmp/version192.txt
          grep -q 'QA_PORT=4192' /tmp/version192.txt
          grep -q 'MEMORY_MATCH_READ_CACHE_MS=0' /tmp/version192.txt
          grep -q 'MEMORY_MATCH_RECENT_STATE_CACHE=DISABLED' /tmp/version192.txt
          grep -q 'MEMORY_MATCH_MISMATCH_REVEAL_MS=6000' /tmp/version192.txt
          grep -q 'MEMORY_MATCH_POLL_TIMEOUT_MS=8000' /tmp/version192.txt
          grep -q 'MEMORY_MATCH_EXPECTED_STATE_GUARD=true' /tmp/version192.txt
          grep -q 'MEMORY_MATCH_FIRST_REVEAL_DEADLINE=AUTHORITATIVE' /tmp/version192.txt
          grep -q 'MEMORY_MATCH_TERMINAL_POLL_STOP=true' /tmp/version192.txt
          grep -q 'MEMORY_MATCH_LOAD_MODEL_MAX_PLAYERS=25' /tmp/version192.txt
          grep -q 'MEMORY_MATCH_AUTHENTICATED_QA_STATUS=PENDING' /tmp/version192.txt

      - name: Test three authoritative panels, latency and out-of-order responses
        env:
          QA_BASE_URL: http://127.0.0.1:4192
        run: node scripts/test_memory_match_authoritative_sync_browser_cs21a192.mjs

      - name: Test CS21A192 deadline, poll recovery and terminal liveness
        env:
          QA_BASE_URL: http://127.0.0.1:4192
        run: |
          set -euo pipefail
          node scripts/test_memory_match_first_reveal_deadline_browser_cs21a192.mjs
          node scripts/test_memory_match_poll_recovery_browser_cs21a192.mjs
          node scripts/test_memory_match_terminal_poll_stop_browser_cs21a192.mjs

      - name: Run packaged browser regressions
        env:
          QA_BASE_URL: http://127.0.0.1:4192
        run: |
          set -euo pipefail
          node scripts/test_memory_match_classic_sync_browser_cs21a189.mjs
          node scripts/test_memory_match_timeout_style_browser_cs21a190.mjs
          node scripts/test_english_lab_hangman_package_browser_cs21a191.mjs
          node scripts/test_english_lab_student_browser_cs21a178.mjs

      - name: Capture packaged CS21A192 at desktop and mobile viewports
        env:
          QA_BASE_URL: http://127.0.0.1:4192
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {chromium} from 'playwright';
          const base=process.env.QA_BASE_URL;
          const output=path.resolve('qa-output/cs21a192-authoritative-sync');
          fs.mkdirSync(output,{recursive:true});
          const browser=await chromium.launch({headless:true});
          const results=[];
          try{
            for(const item of [
              {name:'desktop-1440x900',viewer:'teacher',viewport:{width:1440,height:900}},
              {name:'mobile-390x844',viewer:'P1',viewport:{width:390,height:844}},
            ]){
              const context=await browser.newContext({viewport:item.viewport});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',error=>errors.push(error.message));
              await page.route('**/__cs21a192_live?*',route=>route.fulfill({status:200,contentType:'application/json;charset=utf-8',body:'{"ok":true}'}));
              await page.goto(`${base}/src/english_lab_games/memory_match_authoritative_sync_preview_cs21a192.html?viewer=${item.viewer}`,{waitUntil:'domcontentloaded'});
              await page.locator('[data-authoritative-sync="true"]').waitFor({state:'visible',timeout:15000});
              const layout=await page.evaluate(()=>(
                {
                  viewport:window.innerWidth,
                  documentWidth:document.documentElement.scrollWidth,
                  cards:document.querySelectorAll('.elmm-card').length,
                  revision:document.querySelector('[data-authoritative-sync]')?.getAttribute('data-state-revision'),
                }
              ));
              assert.equal(layout.cards,4,`${item.name}: faltan cartas.`);
              assert.equal(layout.revision,'1',`${item.name}: revisión inicial inesperada.`);
              assert.ok(layout.documentWidth<=layout.viewport+2,`${item.name}: desborde horizontal ${JSON.stringify(layout)}`);
              assert.deepEqual(errors,[],`${item.name}: errores ${errors.join(' | ')}`);
              await page.screenshot({path:path.join(output,`${item.name}.png`),fullPage:true});
              results.push({...item,layout,noHorizontalOverflow:true});
              await context.close();
            }
          }finally{await browser.close();}
          fs.writeFileSync(path.join(output,'viewport-result.json'),JSON.stringify({ok:true,results},null,2)+'\n');
          console.log(JSON.stringify({ok:true,results},null,2));
          NODE

      - name: Reverify package manifest after browser tests
        run: node scripts/patch_qa_package_cs21a192.mjs --verify

      - name: Zip and hash the exact candidate
        run: |
          set -euo pipefail
          cd dist
          zip -X -q -r CAMPUS_QA_CS21A192_CANDIDATO_MEMORY_MATCH_SYNC_REV2.zip CAMPUS_QA_CS21A192_CANDIDATO_MEMORY_MATCH_SYNC_REV2
          sha256sum CAMPUS_QA_CS21A192_CANDIDATO_MEMORY_MATCH_SYNC_REV2.zip > CAMPUS_QA_CS21A192_CANDIDATO_MEMORY_MATCH_SYNC_REV2.zip.sha256
          sha256sum -c CAMPUS_QA_CS21A192_CANDIDATO_MEMORY_MATCH_SYNC_REV2.zip.sha256

      - name: Upload directly usable CS21A192 package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CAMPUS_QA_CS21A192_CANDIDATO_MEMORY_MATCH_SYNC_REV2
          path: dist/CAMPUS_QA_CS21A192_CANDIDATO_MEMORY_MATCH_SYNC_REV2/
          if-no-files-found: error
          retention-days: 30

      - name: Upload CS21A192 zip, hash and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CS21A192_REV2_MEMORY_MATCH_AUTHORITATIVE_SYNC_EVIDENCE
          path: |
            dist/CAMPUS_QA_CS21A192_CANDIDATO_MEMORY_MATCH_SYNC_REV2.zip
            dist/CAMPUS_QA_CS21A192_CANDIDATO_MEMORY_MATCH_SYNC_REV2.zip.sha256
            qa-output/cs21a192-authoritative-sync/
            qa-output/cs21a192-load-budget/
            qa-output/cs21a190-timeout-style/
            qa-output/cs21a189-classic-sync/
            qa-output/cs21a191-hangman/
            qa-output/cs21a178-student-sync/
            cs21a192-package-server.log
          if-no-files-found: warn
          retention-days: 30
