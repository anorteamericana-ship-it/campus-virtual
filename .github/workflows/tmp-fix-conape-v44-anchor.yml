name: TEMP fix CONAPE V4.4 removed-disbursement anchor

on:
  push:
    branches:
      - feature/conape-v44-live-appsscript
    paths:
      - '.github/workflows/tmp-fix-conape-v44-anchor.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/conape-v44-live-appsscript
          fetch-depth: 0
      - name: Correct removed-disbursement source row
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/conape_v44_live_mirror_core.js')
          s=p.read_text(encoding='utf-8')
          old="out.push(_conapeMirrorV44Movement_(ced, 'DESEMBOLSO_REMOVIDO', n));"
          new="out.push(_conapeMirrorV44Movement_(ced, 'DESEMBOLSO_REMOVIDO', o));"
          if s.count(old) != 1:
              raise SystemExit(f'expected one exact anchor, got {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8',newline='\n')
          PY
          node --check scripts/conape_v44_live_mirror_core.js
          node scripts/qa_conape_v44_live_mirror_core.mjs
          git diff --check
      - name: Commit core only
        run: |
          git config user.name 'anorteamericana-ship-it'
          git config user.email 'anorteamericana@gmail.com'
          git add scripts/conape_v44_live_mirror_core.js
          git commit -m 'fix(conape): anchor removed disbursement to prior snapshot'
          git push origin HEAD:feature/conape-v44-live-appsscript
