name: TEMP fix CONAPE V4.4 body payload builder only

on:
  push:
    branches:
      - feature/conape-v44-live-appsscript
    paths:
      - '.github/workflows/tmp-fix-conape-v44-body-data-builder-only.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/conape-v44-live-appsscript
          fetch-depth: 0
      - name: Patch builder and JS QA only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/build_conape_v44_live_candidate.ps1')
          s = p.read_text(encoding='utf-8')

          old = "if($dispatchInfo.Params.Count -lt 1){Stop-Run '_cs21a93Dispatch_ has no request parameter'}"
          new = "if($dispatchInfo.Params.Count -lt 2){Stop-Run '_cs21a93Dispatch_ must expose auth and body parameters'}"
          if s.count(old) != 1:
              raise SystemExit(f'dispatch param guard count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = "$requestParam=$dispatchInfo.Params[0]\n$readAction='agentConapeMirrorReadV44'"
          new = "$requestParam=$dispatchInfo.Params[0]\n$bodyParam=$dispatchInfo.Params[1]\n$readAction='agentConapeMirrorReadV44'"
          if s.count(old) != 1:
              raise SystemExit(f'body param insertion anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = "\"if (__conapeV44Action === '$readAction') return agentConapeMirrorReadV44($requestParam.data || {});\",\n  \"if (__conapeV44Action === '$applyAction') return agentConapeMirrorApplySnapshotV44Service($requestParam.data || {});\""
          new = "\"if (__conapeV44Action === '$readAction') return agentConapeMirrorReadV44(($bodyParam && $bodyParam.data) || {});\",\n  \"if (__conapeV44Action === '$applyAction') return agentConapeMirrorApplySnapshotV44Service(($bodyParam && $bodyParam.data) || {});\""
          if s.count(old) != 1:
              raise SystemExit(f'payload route replacement count={s.count(old)}')
          s = s.replace(old, new, 1)

          if '$requestParam.data' in s:
              raise SystemExit('requestParam.data still present')
          if '$bodyParam.data' not in s:
              raise SystemExit('bodyParam.data missing')
          p.write_text(s, encoding='utf-8', newline='\n')

          q = Path('scripts/qa_conape_v44_live_mirror_core.mjs')
          y = q.read_text(encoding='utf-8')
          marker = "console.log('CONAPE V4.4 LIVE MIRROR CORE QA PASS');"
          block = "const builderSrc = fs.readFileSync('scripts/build_conape_v44_live_candidate.ps1', 'utf8');\nassert(builderSrc.includes('$bodyParam=$dispatchInfo.Params[1]'), 'builder no enlaza segundo parámetro body del dispatcher');\nassert(builderSrc.includes('$bodyParam.data'), 'builder no enruta data desde body');\nassert(!builderSrc.includes('$requestParam.data'), 'builder no puede enrutar data desde auth/requestParam');\n\n" + marker
          if y.count(marker) != 1:
              raise SystemExit(f'qa marker count={y.count(marker)}')
          y = y.replace(marker, block, 1)
          q.write_text(y, encoding='utf-8', newline='\n')
          PY

          pwsh -NoLogo -NoProfile -Command '$e=$null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "scripts/build_conape_v44_live_candidate.ps1"),[ref]$null,[ref]$e); if($e.Count){$e|Format-List; exit 1}'
          node scripts/qa_conape_v44_live_mirror_core.mjs
          git diff --check
      - name: Commit builder and JS QA only
        run: |
          git config user.name 'anorteamericana-ship-it'
          git config user.email 'anorteamericana@gmail.com'
          git add scripts/build_conape_v44_live_candidate.ps1 scripts/qa_conape_v44_live_mirror_core.mjs
          git commit -m 'fix(conape): route service payload from verified body'
          git push origin HEAD:feature/conape-v44-live-appsscript
