name: QA Admin Private CONAPE Docs CS21A193

on:
  push:
    branches:
      - security/admin-private-conape-doc-delivery-cs21a193
  pull_request:
    paths:
      - 'src/admin_students.jsx'
      - 'scripts/qa_admin_private_conape_docs_cs21a193.mjs'
      - '.github/workflows/qa-admin-private-conape-docs-cs21a193.yml'

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CS21A193 private document delivery
        run: node scripts/qa_admin_private_conape_docs_cs21a193.mjs
      - name: Regress CS21A192 copy boundary
        run: node scripts/qa_admin_students_user_copy_cs21a192.mjs
      - name: Regress CS21A191 safe errors
        run: node scripts/qa_admin_students_safe_errors_cs21a191.mjs
      - name: Diff hygiene
        run: git diff --check HEAD^
