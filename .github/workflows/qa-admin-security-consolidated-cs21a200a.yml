name: QA Admin Security Consolidated CS21A200A

on:
  push:
    branches:
      - integration/admin-security-consolidated-cs21a200a
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source commits remain readable
        run: |
          for sha in \
            cf92c89cc0521634c6ab672f3bcc4fc77afe24ab \
            147bac6ef6a790621bd333f8527dcc5dacac9f2a \
            07988ed9227514ad8ae63599bd662e937f6fcb4e \
            806c9fabc5b0e16a4faa7fc51af29be10f8bf3ee; do
            git cat-file -e "$sha^{commit}"
          done
      - name: Run original unique-delta guards
        run: |
          git show cf92c89cc0521634c6ab672f3bcc4fc77afe24ab:scripts/qa_admin_master_dashboard_safe_errors_cs21a196.mjs > /tmp/guard175.mjs
          node /tmp/guard175.mjs
          git show 07988ed9227514ad8ae63599bd662e937f6fcb4e:scripts/qa_admin_secondary_surfaces_cs21a198.mjs > /tmp/guard177.mjs
          node /tmp/guard177.mjs
          git show 806c9fabc5b0e16a4faa7fc51af29be10f8bf3ee:scripts/qa_admin_inline_finance_safe_errors_cs21a199.mjs > /tmp/guard178.mjs
          node /tmp/guard178.mjs
      - name: Run Panel Maestro CONAPE R2 guards
        run: |
          for guard in \
            qa_admin_master_conape_safe_errors_cs21a194r2.mjs \
            qa_admin_master_conape_refresh_truth_cs21a195r2.mjs \
            qa_admin_master_conape_user_copy_cs21a196r2.mjs \
            qa_admin_master_conape_action_safe_errors_cs21a197r2.mjs \
            qa_admin_master_conape_effective_copy_cs21a198r2.mjs; do
            git show 147bac6ef6a790621bd333f8527dcc5dacac9f2a:scripts/$guard > /tmp/$guard
            node /tmp/$guard
          done
      - name: Regress SEC002 and Admin Students base
        run: |
          node scripts/qa_sec002_admin_academic_pdf_delivery_cs21a193.mjs
          node scripts/qa_sec002_legacy_certificate_tree_contract_cs21a194.mjs
          node scripts/qa_sec002_identity_legacy_evidence_cs21a195.mjs
          node scripts/qa_sec002_proforma_public_acl_contract_cs21a196.mjs
          node scripts/qa_admin_students_user_copy_cs21a192.mjs
          node scripts/qa_admin_students_safe_errors_cs21a191.mjs
      - name: Run CS21A200A cross guard
        run: node scripts/qa_admin_security_consolidated_cs21a200a.mjs
      - name: Diff hygiene
        run: git diff --check 5a49384572ee69e680da8db8dd88d160f817f1b5...HEAD -- . ':!00_DOCUMENTACION/**'
