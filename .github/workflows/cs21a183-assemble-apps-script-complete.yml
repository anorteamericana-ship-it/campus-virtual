name: CS21A183 assemble complete Apps Script

on:
  push:
    branches:
      - feat/cs21a183-sentence-order-live
    paths:
      - 'scripts/assemble_apps_script_cs21a183_complete.mjs'
      - 'apps_script_patches/99_ACTUALIZACION_QA_CS21A183.gs'
      - 'apps_script_patches/99B_VALIDACION_CURRICULAR_CS21A183.gs'
      - 'apps_script_patches/99C_FIX_FUENTE_APOLLO_QA_CS21A183.gs'
      - 'apps_script_patches/99D_FIX_MEMORY_MATCH_START_QA_CS21A183.gs'
      - 'apps_script_patches/99E_FIX_MEMORY_MATCH_PAIR_METADATA_QA_CS21A183.gs'
      - 'apps_script_patches/99F_FIX_MEMORY_MATCH_CLOSED_ROOM_QA_CS21A185.gs'
      - 'apps_script_patches/99G_FIX_MEMORY_MATCH_RULES_QA_CS21A186.gs'
      - 'apps_script_patches/99H_FIX_ENGLISH_LAB_LIFECYCLE_QA_CS21A187.gs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cs21a183-sentence-order-live
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build single complete Apps Script file
        run: node scripts/assemble_apps_script_cs21a183_complete.mjs
      - name: Commit exact combined file
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps_script_patches/99_CS21A183_SENTENCE_ORDER_COMPLETO.gs
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'CS21A187 actualiza Apps Script QA completo 99-99H'
          git push origin HEAD:feat/cs21a183-sentence-order-live
