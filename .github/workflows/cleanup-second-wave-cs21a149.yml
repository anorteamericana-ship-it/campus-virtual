name: Cleanup second wave CS21A149

on:
  pull_request:
    paths:
      - 'src/MATRIC~3.JSX'
      - 'src/PANEL_~1.JSX'
      - 'src/inscripcion_v1.jsx'
      - 'styles/ADMIN_~2.CSS'
      - 'styles/login_v1.css'
      - 'src/matriculas_calendario.jsx'
      - 'src/panel_admin_supervision.jsx'
      - 'src/inscripcion.jsx'
      - 'styles/admin_master_dashboard.css'
      - 'styles/login.css'
      - 'campus.html'
      - 'login.html'
      - 'inscripcion.html'
      - 'scripts/audit_cleanup_candidates_cs21a149.mjs'
      - '.github/workflows/cleanup-second-wave-cs21a149.yml'
  push:
    branches:
      - 'audit/cs21a149-second-cleanup'

permissions:
  contents: read

jobs:
  audit-second-wave:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify second cleanup wave
        run: node scripts/audit_cleanup_candidates_cs21a149.mjs

      - name: Re-run delivery surface audit
        run: node scripts/audit_delivery_surface.mjs

      - name: Re-run first cleanup audit
        run: node scripts/audit_cleanup_candidates_cs21a145.mjs
