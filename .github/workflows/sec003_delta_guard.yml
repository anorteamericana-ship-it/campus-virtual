name: SEC-003 backend delta guard

on:
  push:
    branches:
      - fix/sec003-english-lab-live-auth
    paths:
      - .github/workflows/sec003_delta_guard.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SEC-003 branch
        uses: actions/checkout@v4
        with:
          ref: fix/sec003-english-lab-live-auth
          fetch-depth: 0

      - name: Verify PR85 ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 49eb9fb8b9286d7de238ba46a0fcf9d07d7d7d8d HEAD

      - name: Validate portable backend delta
        run: node scripts/qa_sec003_backend_delta_portable.mjs

      - name: Validate frontend guard
        run: node scripts/qa_sec003_english_lab_live_frontend.mjs

      - name: Validate repository diff hygiene
        run: |
          set -euo pipefail
          git diff --check 49eb9fb8b9286d7de238ba46a0fcf9d07d7d7d8d...HEAD
