name: TEMP CONAPE V4.2 QA patch

on:
  push:
    branches:
      - fix/conape-v4-2-simple-action
    paths:
      - .github/workflows/temp-conape-v4-2-qa.yml
      - scripts/temp_patch_conape_v42_qa.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/conape-v4-2-simple-action
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply QA patch
        run: python scripts/temp_patch_conape_v42_qa.py
      - name: Validate bridge contract
        run: |
          node --check services/conape-bridge/server_v2.mjs
          node --check scripts/qa_conape_bridge_v2.mjs
          node scripts/qa_conape_bridge_v2.mjs
      - name: Commit and remove temporary patch files
        run: |
          git config user.name "anorteamericana-ship-it"
          git config user.email "anorteamericana@gmail.com"
          git add services/conape-bridge/server_v2.mjs src/ventas_conape_reclutar_row_c3_5.jsx scripts/qa_conape_bridge_v2.mjs
          git rm .github/workflows/temp-conape-v4-2-qa.yml scripts/temp_patch_conape_v42_qa.py
          git commit -m "CONAPE V4.2 · alinear contrato QA y acción final"
          git push origin HEAD:fix/conape-v4-2-simple-action
