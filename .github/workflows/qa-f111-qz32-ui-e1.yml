name: F111 QZ32 Frontend E1 QA
on:
  push:
    branches:
      - feat/f111-qz32-vista-estudiante-qa-20261016
  pull_request:
    paths:
      - 'modulos/quiz_progress.html'
      - 'modulos/quiz_progress_docente.html'
      - 'src/vista_docente.jsx'
      - 'scripts/qa_f111_qz32_ui_e1.mjs'
      - '.github/workflows/qa-f111-qz32-ui-e1.yml'
permissions:
  contents: read
jobs:
  qz-ui-e1:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: QA E1 quiz student/teacher source and safety
        run: node scripts/qa_f111_qz32_ui_e1.mjs
      - name: Install Chromium for QA previews only
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render 32 student + 32 teacher quiz previews offline
        env:
          F111_QZ_BROWSER: '1'
        run: node scripts/qa_f111_qz32_ui_e1.mjs
      - name: Screenshots of QA preview (not live Campus)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f111-qz32-preview
          path: qa-capturas/QZ32_*.png
          if-no-files-found: warn
          retention-days: 7
