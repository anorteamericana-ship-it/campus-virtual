name: F111 R30 · superadmin QZ24 preview entry (synthetic)
on:
  pull_request:
    paths:
      - 'modulos/examenes.html'
      - 'src/f111_qz24_superadmin_preview.js'
      - 'scripts/qa_f111_qz24_superadmin_preview_e1.mjs'
      - '.github/workflows/qa-f111-qz24-superadmin-preview.yml'
  push:
    branches: [main]
    paths:
      - 'modulos/examenes.html'
      - 'src/f111_qz24_superadmin_preview.js'
      - 'scripts/qa_f111_qz24_superadmin_preview_e1.mjs'
      - '.github/workflows/qa-f111-qz24-superadmin-preview.yml'
permissions:
  contents: read
jobs:
  qz24-admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check DOM script and static contract
        run: |
          node --check src/f111_qz24_superadmin_preview.js
          node scripts/qa_f111_qz24_superadmin_preview_e1.mjs
      - name: Install browser for synthetic admin E1
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real browser rendering, mocked private server
        run: F111_BROWSER=1 node scripts/qa_f111_qz24_superadmin_preview_e1.mjs
      - name: Validate diff
        run: git diff --check HEAD~1 HEAD
