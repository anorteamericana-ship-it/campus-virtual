name: Bootstrap Student Portal Safe Errors CS21A200I

on:
  push:
    branches:
      - fix/student-portal-safe-errors-cs21a200i
    paths:
      - 'scripts/bootstrap_patch_student_portal_safe_errors_cs21a200i.mjs'
      - '.github/workflows/bootstrap-student-portal-safe-errors-cs21a200i.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify exact base ancestry
        run: git merge-base --is-ancestor fe2c882416fad86a6c096ecb2b18668d013fe810 HEAD
      - name: Apply exact patch
        run: node scripts/bootstrap_patch_student_portal_safe_errors_cs21a200i.mjs
      - name: Run CS21A200I guard
        run: node scripts/qa_student_portal_safe_errors_cs21a200i.mjs
      - name: Regress CS21A200H
        run: node scripts/qa_lazy_loader_safe_errors_cs21a200h.mjs
      - name: Regress CS21A200G
        run: node scripts/qa_student_academic_menu_safe_errors_cs21a200g.mjs
      - name: Regress CS21A200F
        run: node scripts/qa_sec006_additional_resources_access_cs21a200f.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Remove bootstrap artifacts and push verified candidate
        run: |
          rm scripts/bootstrap_patch_student_portal_safe_errors_cs21a200i.mjs
          rm .github/workflows/bootstrap-student-portal-safe-errors-cs21a200i.yml
          git add -A
          git commit -m 'CS21A200I · safe student portal errors'
          git push origin HEAD:fix/student-portal-safe-errors-cs21a200i
