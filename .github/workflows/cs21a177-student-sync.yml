name: CS21A177 validate Memory Match student sync

on:
  pull_request:
    paths:
      - 'src/english_lab_games/english_lab_live_memory_match_adapter_cs21a174.jsx'
      - 'src/english_lab_live.jsx'
      - 'src/app.jsx'
      - 'apps_script_patches/97_ACTUALIZACION_QA.gs'
      - 'scripts/test_english_lab_student_sync_cs21a177.mjs'
      - 'scripts/build_qa_staging_frontend_cs21a148.mjs'
      - 'scripts/audit_qa_staging_frontend_cs21a148.mjs'
      - '.github/workflows/cs21a177-student-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-student-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install parser only
        run: npm install --no-save --ignore-scripts @babel/parser@7.28.4

      - name: Validate student detection and transport
        run: node scripts/test_english_lab_student_sync_cs21a177.mjs

      - name: Re-run Memory Match contracts
        run: |
          node scripts/test_english_lab_memory_match_live_cs21a174.mjs
          node scripts/test_english_lab_turn_engine_cs21a176.mjs
          node scripts/test_english_lab_update_qa_cs21a176.mjs

      - name: Build and audit isolated QA frontend
        run: |
          node scripts/build_qa_staging_frontend_cs21a148.mjs
          node scripts/audit_qa_staging_frontend_cs21a148.mjs

      - name: Verify CS21A177 reaches the QA artifact
        shell: bash
        run: |
          set -euo pipefail
          grep -q "const VERSION = 'CS21A177'" dist/qa-staging/src/english_lab_games/english_lab_live_memory_match_adapter_cs21a174.jsx
          grep -q "roomGameLabel(room) === GAME_LABEL" dist/qa-staging/src/english_lab_games/english_lab_live_memory_match_adapter_cs21a174.jsx
          grep -q "inFlightReads.get(key)" dist/qa-staging/src/english_lab_games/english_lab_live_memory_match_adapter_cs21a174.jsx
