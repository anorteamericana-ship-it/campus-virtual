name: QA SEC002 Admin Academic PDF Delivery CS21A193

on:
  push:
    branches:
      - security/admin-private-academic-pdf-delivery-cs21a193
    paths:
      - 'src/admin_students.jsx'
      - 'security/sec002_admin_academic_pdf_delivery_cs21a193.json'
      - 'scripts/qa_sec002_admin_academic_pdf_delivery_cs21a193.mjs'
      - '.github/workflows/qa-sec002-admin-academic-pdf-delivery-cs21a193.yml'
  pull_request:
    paths:
      - 'src/admin_students.jsx'
      - 'security/sec002_admin_academic_pdf_delivery_cs21a193.json'
      - 'scripts/qa_sec002_admin_academic_pdf_delivery_cs21a193.mjs'
      - '.github/workflows/qa-sec002-admin-academic-pdf-delivery-cs21a193.yml'

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard CS21A193
        run: node scripts/qa_sec002_admin_academic_pdf_delivery_cs21a193.mjs
      - name: Regress CS21A192
        run: node scripts/qa_admin_students_user_copy_cs21a192.mjs
      - name: Regress CS21A191
        run: node scripts/qa_admin_students_safe_errors_cs21a191.mjs
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD -- ':!00_DOCUMENTACION/**'
