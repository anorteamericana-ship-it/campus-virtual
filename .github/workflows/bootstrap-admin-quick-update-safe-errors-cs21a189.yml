name: Bootstrap Admin Quick Update Safe Errors CS21A189

on:
  push:
    branches:
      - fix/admin-quick-update-safe-errors-cs21a189
    paths:
      - '.github/workflows/bootstrap-admin-quick-update-safe-errors-cs21a189.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Verify exact base ancestry
        run: git merge-base --is-ancestor d2d20c0344ef9fa02cc6fa3337847f33c24893a7 HEAD
      - name: Apply exact patch
        run: node scripts/bootstrap_patch_admin_quick_update_safe_errors_cs21a189_v2.mjs
      - name: Run CS21A189 guard
        run: node scripts/qa_admin_quick_update_safe_errors_cs21a189.mjs
      - name: Regress CS21A188
        run: node scripts/qa_teacher_user_copy_cs21a188.mjs
      - name: Regress CS21A187
        run: node scripts/qa_teacher_action_safe_errors_cs21a187.mjs
      - name: Diff hygiene
        run: git diff --check d2d20c0344ef9fa02cc6fa3337847f33c24893a7...HEAD -- . ':(exclude)00_DOCUMENTACION/**'
      - name: Remove bootstrap artifacts and push verified candidate
        run: |
          git rm .github/workflows/bootstrap-admin-quick-update-safe-errors-cs21a189.yml scripts/bootstrap_patch_admin_quick_update_safe_errors_cs21a189.mjs scripts/bootstrap_patch_admin_quick_update_safe_errors_cs21a189_v2.mjs
          git add -A
          git commit -m "CS21A189 · safe admin quick-update errors"
          git push origin HEAD:fix/admin-quick-update-safe-errors-cs21a189
