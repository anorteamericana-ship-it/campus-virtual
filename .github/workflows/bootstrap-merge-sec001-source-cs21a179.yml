name: Bootstrap Merge SEC001 Source CS21A179

on:
  push:
    branches:
      - 'integration/security-source-candidate-cs21a179'
    paths:
      - '.github/workflows/bootstrap-merge-sec001-source-cs21a179.yml'

permissions:
  contents: write

jobs:
  merge-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "anorteamericana-ship-it"
          git config user.email "anorteamericana@gmail.com"
      - name: Fetch exact SEC001 branches and base
        run: |
          git fetch origin security/sec001-password-min6-cs21a164
          git fetch origin security/sec001-oidc-neutral-foundation-cs21a165
          git fetch origin integration/matriculas-ventas-security-cs21a177
          test "$(git rev-parse origin/security/sec001-password-min6-cs21a164)" = "45f59b05d63aeb3da1fa1c1dab0df4265e1a750f"
          test "$(git rev-parse origin/security/sec001-oidc-neutral-foundation-cs21a165)" = "532321239d0a260103aa1443c90732e2009200e4"
          test "$(git rev-parse origin/integration/matriculas-ventas-security-cs21a177)" = "db3e2bfe0cfcfe67d27e7bbcaf6d03c813f42882"
      - name: Merge CS21A164 exactly
        run: git merge --no-ff origin/security/sec001-password-min6-cs21a164 -m "CS21A179 · integrate SEC001 password min6"
      - name: Merge CS21A165 exactly
        run: git merge --no-ff origin/security/sec001-oidc-neutral-foundation-cs21a165 -m "CS21A179 · integrate inert neutral OIDC foundation"
      - name: Run SEC001 password guard
        run: node scripts/qa_sec001_password_min6_cs21a164.mjs
      - name: Run SEC001 OIDC guard
        run: node scripts/qa_sec001_oidc_neutral_cs21a165.mjs
      - name: Run CS21A177 integrated guard
        run: node scripts/qa_matriculas_ventas_security_cs21a177.mjs
      - name: Run CS21A179 cross assertions
        run: node scripts/qa_security_source_candidate_cs21a179.mjs
      - name: Source diff hygiene vs CS21A177
        run: git diff --check origin/integration/matriculas-ventas-security-cs21a177...HEAD -- . ':(exclude)00_DOCUMENTACION/**'
      - name: Remove bootstrap and push verified candidate
        run: |
          rm .github/workflows/bootstrap-merge-sec001-source-cs21a179.yml
          git add .github/workflows/bootstrap-merge-sec001-source-cs21a179.yml
          git commit -m "CS21A179 · verified integrated security source candidate"
          git push
