name: TEMP CONAPE V4.2.1 phone APEX hotfix

on:
  push:
    branches:
      - fix/conape-apex-phone-v4-2-1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/conape-apex-phone-v4-2-1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch canonical bridge only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/conape-bridge/server_v2.mjs')
          s = path.read_text(encoding='utf-8')
          s = s.replace("const VERSION = 'V4.2.0';", "const VERSION = 'V4.2.1';", 1)

          start = s.index('async function writeContactField(p, id, value) {')
          end = s.index('\nasync function fillContacts(p, plan) {', start)
          new_write = r'''async function writeContactField(p, id, value) {
            const target = txt(value);
            const targetNorm = normalizeContactField(id, target);
            const locator = p.locator(`#${id}`).first();
            const editability = await readFieldEditability(p, id);
            let method = id === 'P2_PRS_CELULAR' ? 'KEYBOARD' : 'FILL';
            let attempted = false;
            let readback = await readContactFieldState(p, id);

            if (!editability.editable) {
              return {
                field:id, attempted:false, verified:false, method:'SKIP', skipped_reason:'READONLY',
                target_len:target.length, readback_len:String(readback.domValue || '').length,
                match:false, apex_readable:readback.apexReadable === true, editable:false,
              };
            }

            try {
              if (!(await locator.count())) throw new Error('FIELD_NOT_FOUND');
              attempted = true;
              if (id === 'P2_PRS_CELULAR') {
                await locator.click({ timeout:5_000 });
                await locator.press('Control+A', { timeout:5_000 });
                await locator.press('Delete', { timeout:5_000 });
                await locator.type(target, { delay:30, timeout:5_000 });
                await locator.press('Tab', { timeout:5_000 });
              } else {
                await locator.fill('', { timeout:5_000 });
                await locator.fill(target, { timeout:5_000 });
                await locator.blur({ timeout:5_000 });
              }
              await waitForApexDynamicAction(p);
              readback = await readContactFieldState(p, id);
            } catch {}

            let match = readback.apexReadable === true
              && normalizeContactField(id, readback.domValue) === targetNorm
              && normalizeContactField(id, readback.apexValue) === targetNorm;
            if (!match) {
              method = 'APEX_SETVALUE_CHANGE';
              const apexSet = await p.evaluate(({ fieldId, fieldValue }) => {
                try {
                  const item = window.apex?.item?.(fieldId);
                  if (!item || typeof item.setValue !== 'function') return false;
                  // Omitir pSuppressChangeEvent mantiene su default=false y dispara change.
                  item.setValue(fieldValue);
                  return true;
                } catch { return false; }
              }, { fieldId:id, fieldValue:target }).catch(() => false);
              if (apexSet) {
                attempted = true;
                await waitForApexDynamicAction(p);
                readback = await readContactFieldState(p, id);
                match = readback.apexReadable === true
                  && normalizeContactField(id, readback.domValue) === targetNorm
                  && normalizeContactField(id, readback.apexValue) === targetNorm;
              }
            }

            const result = {
              field:id, attempted, verified:match, method, target_len:target.length,
              readback_len:String(readback.domValue || '').length, match,
              apex_readable:readback.apexReadable === true, editable:true,
            };
            if (!match) {
              const error = new AppError('CONTACT_WRITE_FAILED', 'CONAPE no confirmó la escritura del contacto en APEX.', 422, 'FILL');
              error.fill_telemetry = {
                attempted_fields:attempted ? [id] : [], verified_fields:[], methods:[method], skipped_fields:[],
                field_apex_readable:{ [id]:readback.apexReadable === true },
                fill_target_len:result.target_len, fill_readback_len:result.readback_len, fill_match:false,
              };
              throw error;
            }
            return result;
          }
          '''
          s = s[:start] + new_write + s[end:]

          start = s.index('async function assertPreCreateFields(p) {')
          end = s.index('\nasync function collectPageItemIds(p) {', start)
          new_gate = r'''async function assertPreCreateFields(p) {
            const required = ['P2_PRS_CEDULA','P2_PRS_APELLIDO_1','P2_PRS_APELLIDO_2','P2_PRS_NOMBRE','P2_PRS_CELULAR','P2_PRS_EMAIL'];
            const gate = await p.evaluate(ids => {
              const missing = [];
              const unreadable = [];
              for (const id of ids) {
                try {
                  const item = window.apex?.item?.(id);
                  if (!item || typeof item.getValue !== 'function') {
                    unreadable.push(id);
                    continue;
                  }
                  if (!String(item.getValue() ?? '').trim()) missing.push(id);
                } catch {
                  unreadable.push(id);
                }
              }
              return { missing, unreadable };
            }, required).catch(() => ({ missing:required.slice(), unreadable:required.slice() }));

            const phoneMissing = gate.missing.includes('P2_PRS_CELULAR');
            const phoneUnreadable = gate.unreadable.includes('P2_PRS_CELULAR');
            if (phoneMissing || phoneUnreadable) {
              const error = new AppError('CONTACT_WRITE_FAILED', 'CONAPE no confirmó el teléfono en el estado interno de APEX.', 422, 'FILL');
              error.empty_field_ids = phoneMissing ? ['P2_PRS_CELULAR'] : [];
              error.fill_telemetry = {
                attempted_fields:[], verified_fields:[], methods:['PRECLICK_APEX_GATE'], skipped_fields:[],
                field_apex_readable:{ P2_PRS_CELULAR:!phoneUnreadable },
                fill_target_len:null, fill_readback_len:null, fill_match:false,
              };
              throw error;
            }

            const missing = [...new Set([...gate.missing, ...gate.unreadable])];
            if (missing.length) {
              const error = new AppError('FORM_INCOMPLETE_BEFORE_CREATE', 'El formulario quedó incompleto en APEX antes de la acción final.', 422, 'BEFORE_CREATE');
              error.empty_field_ids = missing;
              throw error;
            }
            return [];
          }
          '''
          s = s[:start] + new_gate + s[end:]

          start = s.index('async function collectPreActionTelemetry(p) {')
          end = s.index('\nasync function clickFinalAction(p, formMode) {', start)
          new_telemetry = r'''async function collectPreActionTelemetry(p) {
            return p.evaluate(() => {
              const safe = value => /^[A-Za-z][A-Za-z0-9_:\-.]{0,79}$/.test(String(value || '')) ? String(value) : '';
              const controls = Array.from(document.querySelectorAll('input[id^="P2_PRS_"],select[id^="P2_PRS_"],textarea[id^="P2_PRS_"]'));
              const precreate_apex_values = {};
              const precreate_dom_values = {};
              const field_editable = {};
              const apex_readable = {};
              for (const el of controls) {
                const id = safe(el.id);
                if (!id) continue;
                const ariaReadonly = String(el.getAttribute('aria-readonly') || '').toLowerCase() === 'true';
                const ariaDisabled = String(el.getAttribute('aria-disabled') || '').toLowerCase() === 'true';
                const readonly = el.readOnly === true || el.hasAttribute('readonly') || ariaReadonly;
                const disabled = el.disabled === true || ariaDisabled;
                field_editable[id] = !readonly && !disabled;
                precreate_dom_values[id] = String(el.value ?? '').trim() !== '';
                let apexValue = '';
                let readable = false;
                try {
                  const item = window.apex?.item?.(id);
                  if (item && typeof item.getValue === 'function') {
                    readable = true;
                    apexValue = String(item.getValue() ?? '');
                  }
                } catch {}
                apex_readable[id] = readable;
                precreate_apex_values[id] = apexValue.trim() !== '';
              }
              return { precreate_apex_values, precreate_dom_values, field_editable, apex_readable };
            }).catch(() => ({ precreate_apex_values:{}, precreate_dom_values:{}, field_editable:{}, apex_readable:{} }));
          }
          '''
          s = s[:start] + new_telemetry + s[end:]

          old_click = """async function clickFinalAction(p, formMode) {\n  await assertPreCreateFields(p);\n  const page_item_ids = await collectPageItemIds(p);\n  const before = await readFormState(p);\n  const preaction = await collectPreActionTelemetry(p);"""
          new_click = """async function clickFinalAction(p, formMode) {\n  const preaction = await collectPreActionTelemetry(p);\n  try {\n    await assertPreCreateFields(p);\n  } catch (error) {\n    error.preaction_telemetry = preaction;\n    throw error;\n  }\n  const page_item_ids = await collectPageItemIds(p);\n  const before = await readFormState(p);"""
          if old_click not in s:
              raise SystemExit('clickFinalAction anchor not found')
          s = s.replace(old_click, new_click, 1)

          s = s.replace("let preActionTelemetry = { precreate_apex_values:{}, precreate_dom_values:{}, field_editable:{} };", "let preActionTelemetry = { precreate_apex_values:{}, precreate_dom_values:{}, field_editable:{}, apex_readable:{} };", 1)
          s = s.replace("field_editable:created.field_editable || {},\n    };", "field_editable:created.field_editable || {},\n      apex_readable:created.apex_readable || {},\n    };", 1)
          s = s.replace("if (error?.fill_telemetry) fillTelemetry = error.fill_telemetry;", "if (error?.fill_telemetry) fillTelemetry = error.fill_telemetry;\n    if (error?.preaction_telemetry) preActionTelemetry = error.preaction_telemetry;", 1)
          s = s.replace("precreate_apex_values:preActionTelemetry.precreate_apex_values || {}, precreate_dom_values:preActionTelemetry.precreate_dom_values || {}, field_editable:preActionTelemetry.field_editable || {},", "precreate_apex_values:preActionTelemetry.precreate_apex_values || {}, precreate_dom_values:preActionTelemetry.precreate_dom_values || {}, apex_readable:preActionTelemetry.apex_readable || {}, field_editable:preActionTelemetry.field_editable || {},", 1)

          path.write_text(s, encoding='utf-8')
          PY
      - name: Validate hotfix contract
        shell: bash
        run: |
          node --check services/conape-bridge/server_v2.mjs
          node scripts/qa_conape_bridge_v2.mjs
          python - <<'PY'
          from pathlib import Path
          s = Path('services/conape-bridge/server_v2.mjs').read_text(encoding='utf-8')
          checks = {
            'version': "const VERSION = 'V4.2.1';" in s,
            'keyboard_phone': "locator.press('Control+A'" in s and "locator.press('Delete'" in s and "locator.type(target, { delay:30" in s and "locator.press('Tab'" in s,
            'strict_apex_match': "readback.apexReadable === true" in s and "normalizeContactField(id, readback.apexValue) === targetNorm" in s,
            'change_fallback': "item.setValue(fieldValue);" in s and "pSuppressChangeEvent" in s,
            'apex_gate': "window.apex?.item?.(id)" in s and "phoneMissing" in s and "phoneUnreadable" in s and "PRECLICK_APEX_GATE" in s,
            'preaction_booleans': "apex_readable" in s and "precreate_apex_values" in s and "precreate_dom_values" in s,
            'no_confirmation_change': "async function confirmAfterCreate" in s and "confirmation_method:'FORM_MODE_UPDATE'" in s and "confirmation_method:'HOME_FALLBACK'" in s,
          }
          failed = [k for k,v in checks.items() if not v]
          if failed:
              raise SystemExit('hotfix checks failed: ' + ', '.join(failed))
          print('CONAPE V4.2.1 hotfix assertions PASS')
          PY
      - name: Commit canonical file and remove temporary workflow
        shell: bash
        run: |
          git config user.name "anorteamericana-ship-it"
          git config user.email "anorteamericana@gmail.com"
          git add services/conape-bridge/server_v2.mjs
          git rm .github/workflows/temp-conape-v421-hotfix.yml
          git commit -m "CONAPE V4.2.1 · fijar teléfono en estado APEX"
          git push origin HEAD:fix/conape-apex-phone-v4-2-1
