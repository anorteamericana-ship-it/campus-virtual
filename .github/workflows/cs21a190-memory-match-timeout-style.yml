name: CS21A190 Memory Match timeout and style sync

on:
  pull_request:
    paths:
      - 'apps_script_patches/99L_FIX_MEMORY_MATCH_TIMEOUT_CLEANUP_QA_CS21A190.gs'
      - 'apps_script_patches/99_CS21A183_SENTENCE_ORDER_COMPLETO.gs'
      - 'src/english_lab_live_timeout_style_guard_cs21a190.js'
      - 'src/english_lab_games/memory_match_style_guard_preview_cs21a190.html'
      - 'src/english_lab_games/memory_match_classic_sync_preview_cs21a189.html'
      - 'styles/english_lab_memory_match_cs21a173.css'
      - 'styles/english_lab_memory_match_classic_sync_cs21a189.css'
      - 'scripts/assemble_apps_script_cs21a183_complete.mjs'
      - 'scripts/test_memory_match_timeout_style_cs21a190.mjs'
      - 'scripts/test_memory_match_timeout_style_browser_cs21a190.mjs'
      - 'scripts/patch_qa_package_cs21a190.mjs'
      - '.github/workflows/cs21a190-memory-match-timeout-style.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timeout-style-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify timeout and style contract
        run: |
          set -euo pipefail
          node scripts/test_memory_match_timeout_style_cs21a190.mjs
          node scripts/assemble_apps_script_cs21a183_complete.mjs
          grep -Eq 'CS21A183-CS21A19(0|1) · APPS SCRIPT QA COMPLETO' apps_script_patches/99_CS21A183_SENTENCE_ORDER_COMPLETO.gs
          grep -q '99L TIMEOUT CLEANUP' apps_script_patches/99_CS21A183_SENTENCE_ORDER_COMPLETO.gs
          grep -q "CS21A190_MM_TIMEOUT_CLEANUP_VERSION = 'CS21A190-MM-TIMEOUT-CLEANUP-1'" apps_script_patches/99_CS21A183_SENTENCE_ORDER_COMPLETO.gs
          grep -q 'timeout_clears_first_reveal:true' apps_script_patches/99_CS21A183_SENTENCE_ORDER_COMPLETO.gs
          grep -q 'stale_snapshot_sanitized:true' apps_script_patches/99_CS21A183_SENTENCE_ORDER_COMPLETO.gs

      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start browser server
        shell: bash
        run: |
          python3 -m http.server 4179 --bind 127.0.0.1 > cs21a190-server.log 2>&1 &
          echo $! > cs21a190-server.pid
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4179/src/english_lab_games/memory_match_style_guard_preview_cs21a190.html >/dev/null && exit 0
            sleep 0.5
          done
          cat cs21a190-server.log
          exit 1

      - name: Verify timeout cleanup and canonical styles in browser
        env:
          QA_BASE_URL: http://127.0.0.1:4179
        run: |
          set -euo pipefail
          node scripts/test_memory_match_timeout_style_browser_cs21a190.mjs

      - name: Upload CS21A190 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CS21A190_MEMORY_MATCH_TIMEOUT_STYLE_EVIDENCE
          path: |
            qa-output/cs21a190-timeout-style/
            cs21a190-server.log
          if-no-files-found: warn
          retention-days: 30
