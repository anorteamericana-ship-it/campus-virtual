name: Bootstrap Teacher Session Safe Errors CS21A186

on:
  push:
    branches:
      - fix/teacher-session-safe-errors-cs21a186
    paths:
      - '.github/workflows/bootstrap-teacher-session-safe-errors-cs21a186.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Verify exact base ancestry
        run: git merge-base --is-ancestor d89797cd9c7613098896b62cd2ccd31cd028b7ee HEAD
      - name: Apply exact patch
        run: node scripts/bootstrap_patch_teacher_session_safe_errors_cs21a186.mjs
      - name: Run CS21A186 guard
        run: node scripts/qa_teacher_session_safe_errors_cs21a186.mjs
      - name: Regress CS21A185
        run: node scripts/qa_teacher_material_access_cs21a185.mjs
      - name: Regress CS21A184
        run: node scripts/qa_sec002_teacher_profile_source_cs21a184.mjs
      - name: Diff hygiene
        run: git diff --check d89797cd9c7613098896b62cd2ccd31cd028b7ee...HEAD -- . ':(exclude)00_DOCUMENTACION/**'
      - name: Remove bootstrap artifacts and push verified candidate
        run: |
          git rm .github/workflows/bootstrap-teacher-session-safe-errors-cs21a186.yml scripts/bootstrap_patch_teacher_session_safe_errors_cs21a186.mjs
          git add -A
          git commit -m "CS21A186 · safe teacher session and attendance errors"
          git push origin HEAD:fix/teacher-session-safe-errors-cs21a186
