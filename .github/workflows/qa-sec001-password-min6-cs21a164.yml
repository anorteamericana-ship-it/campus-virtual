name: QA SEC001 Password Min6 CS21A164

on:
  pull_request:
    paths:
      - 'src/inscripcion.jsx'
      - 'scripts/qa_sec001_password_min6_cs21a164.mjs'
      - '00_DOCUMENTACION/SEC001_PASSWORD_MIN6_CS21A164_2026-08-29.md'
      - '.github/workflows/qa-sec001-password-min6-cs21a164.yml'
  push:
    branches:
      - security/sec001-password-min6-cs21a164

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run SEC001 password source guard
        run: node scripts/qa_sec001_password_min6_cs21a164.mjs
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD -- . ':(exclude)00_DOCUMENTACION/**'
