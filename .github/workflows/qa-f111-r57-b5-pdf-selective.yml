name: F111 R57 B5 PDF Selective Gate
on:
  pull_request:
    paths:
      - src/app.jsx
      - src/solicitudes_unificadas.jsx
      - src/examenes_modes.jsx
      - src/examenes_bundle.jsx
      - modulos/examenes.html
      - scripts/qa_f111_r57_b5_pdf_selective_gate.mjs
      - .github/workflows/qa-f111-r57-b5-pdf-selective.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selective-b5-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check R57 B5 requests plus written PDF, protect LIVE main finances
        run: node scripts/qa_f111_r57_b5_pdf_selective_gate.mjs
