name: F111 Official LIVE Origin Read-only Audit

on:
  pull_request:
    paths:
      - 'src/i18n_pilot_f111.js'
      - 'src/student_dashboard.jsx'
      - 'src/student_menu_academic_cs21a120.jsx'
      - 'src/student_experience.jsx'
      - 'src/syllabus_views.jsx'
      - 'src/student_modules.jsx'
      - 'src/solicitudes_unificadas.jsx'
      - 'scripts/qa_f111_live_origin_readonly.mjs'
      - '.github/workflows/f111-live-origin-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'campus.html'
      - 'src/app.jsx'
      - 'src/i18n_pilot_f111.js'
      - 'src/student_dashboard.jsx'
      - 'src/student_menu_academic_cs21a120.jsx'
      - 'src/student_experience.jsx'
      - 'src/syllabus_views.jsx'
      - 'src/student_modules.jsx'
      - 'src/solicitudes_unificadas.jsx'
      - 'src/admin_attendance_roster.jsx'
      - 'scripts/qa_f111_live_origin_readonly.mjs'
      - '.github/workflows/f111-live-origin-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-origin-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar contrato de auditoría sin red
        run: node scripts/qa_f111_live_origin_readonly.mjs --selftest
      - name: Consultar solamente archivos públicos del dominio oficial
        run: node scripts/qa_f111_live_origin_readonly.mjs
