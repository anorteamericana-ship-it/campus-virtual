name: Audit Raw User Error Surface V3 After AT CS21A210AU

on:
  push:
    branches:
      - audit/raw-user-error-surface-v3-after-at-cs21a210au
    paths:
      - '.github/workflows/audit-raw-user-error-surface-v3-after-at-cs21a210au.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan current raw visible-error sinks V3 and persist exact report
        run: node scripts/audit_raw_user_error_surface_v3_cs21a210s.mjs | tee 00_DOCUMENTACION/RAW_USER_ERROR_SURFACE_V3_AFTER_AT_CS21A210AU_REPORT.txt
      - name: Persist audit report on audit branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 00_DOCUMENTACION/RAW_USER_ERROR_SURFACE_V3_AFTER_AT_CS21A210AU_REPORT.txt
          git commit -m 'CS21A210AU persist V3 inventory after AT'
          git push
      - name: Regress CS21A210AT app boundary
        run: node scripts/qa_app_shared_safe_errors_cs21a210at.mjs
      - name: Regress CS21A210AS BCR wiring
        run: node scripts/qa_importador_bcr_wiring_cs21a210as.mjs
      - name: Regress CS21A210AP I CAN boundary
        run: node scripts/qa_ican_safe_errors_cs21a210ap.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Mark audit incomplete while raw sinks remain
        run: node scripts/audit_raw_user_error_surface_v3_cs21a210s.mjs --fail-on-findings
