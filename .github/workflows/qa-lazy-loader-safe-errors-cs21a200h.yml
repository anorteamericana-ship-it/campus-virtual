name: QA Lazy Loader Safe Errors CS21A200H

on:
  push:
    branches:
      - fix/lazy-loader-safe-errors-cs21a200h
  pull_request:
    paths:
      - 'src/lazy_loader.jsx'
      - 'scripts/qa_lazy_loader_safe_errors_cs21a200h.mjs'
      - '.github/workflows/qa-lazy-loader-safe-errors-cs21a200h.yml'

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run CS21A200H guard
        run: node scripts/qa_lazy_loader_safe_errors_cs21a200h.mjs
      - name: Regress CS21A200G
        run: node scripts/qa_student_academic_menu_safe_errors_cs21a200g.mjs
      - name: Regress CS21A200F
        run: node scripts/qa_sec006_additional_resources_access_cs21a200f.mjs
      - name: Regress CS21A200A
        run: node scripts/qa_admin_security_consolidated_cs21a200a.mjs
      - name: Diff hygiene
        run: git diff --check origin/fix/student-academic-menu-safe-errors-cs21a200g...HEAD -- . ':(exclude)00_DOCUMENTACION/**'
