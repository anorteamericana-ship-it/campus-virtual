name: CS21A202 Historical English LAB Source Recovery

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cs21a202-source-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply CS196 recovery to real src
        run: node scripts/apply_cs21a202_source_recovery.mjs

      - name: Apply CS197 spectator recovery to real src
        run: node scripts/apply_cs21a202_cs197_source_recovery.mjs

      - name: Remove runtime code patch from conflict test
        run: node scripts/apply_cs21a202_test_recovery.mjs

      - name: Audit source-of-truth contract
        run: node scripts/qa_cs21a202_source_truth.mjs

      - name: Verify source markers
        run: |
          set -euo pipefail
          grep -q "CS21A202: un rechazo de dominio con room_package" src/english_lab_live.jsx
          ! grep -q "!res.ok || !data || data.ok === false" src/english_lab_live.jsx
          grep -q "const stateCandidate=candidate.ok===false" src/english_lab_games/english_lab_live_memory_match_authoritative_sync_adapter_cs21a192.jsx
          grep -q "const blocksInteraction=submissionAction!='DISCOVER_CARD'\|const blocksInteraction=submissionAction!=='DISCOVER_CARD'" src/english_lab_games/english_lab_live_memory_match_authoritative_sync_adapter_cs21a192.jsx
          grep -q "mutationBusy={blockingBusy}" src/english_lab_games/english_lab_live_memory_match_authoritative_sync_adapter_cs21a192.jsx
          grep -q "function pollMsForState(state)" src/english_lab_games/english_lab_live_memory_match_authoritative_sync_adapter_cs21a192.jsx
          grep -q "data-live-current-poll-ms={currentPollMs}" src/english_lab_games/english_lab_live_memory_match_authoritative_sync_adapter_cs21a192.jsx
          grep -q "authoritativeBusy" src/english_lab_games/memory_match_classic_sync_cs21a189.jsx
          grep -q "data-spectator-reveal-ms={revealRuleMs}" src/english_lab_games/memory_match_classic_sync_cs21a189.jsx
          grep -Fq 'se cierran en ${revealSeconds}s' src/english_lab_games/memory_match_classic_sync_cs21a189.jsx
          grep -q "transition:transform .20s" styles/english_lab_memory_match_classic_sync_cs21a189.css
          grep -q "CS21A202 fixture: el mismo contrato de reconciliación" src/english_lab_games/memory_match_authoritative_sync_preview_cs21a192.html
          ! grep -q "original.replace(oldTransport,newTransport)" scripts/test_memory_match_conflict_reconciliation_browser_cs21a196.mjs
          git diff --check

      - name: Verify clean checkout packaging preserves the fixes
        run: |
          set -euo pipefail
          pkg=/tmp/cs21a202-clean-package
          rm -rf "$pkg"
          mkdir -p "$pkg"
          rsync -a --exclude '.git' --exclude 'node_modules' ./ "$pkg/"
          grep -q "CS21A202: un rechazo de dominio con room_package" "$pkg/src/english_lab_live.jsx"
          grep -q "const stateCandidate=candidate.ok===false" "$pkg/src/english_lab_games/english_lab_live_memory_match_authoritative_sync_adapter_cs21a192.jsx"
          grep -q "mutationBusy={blockingBusy}" "$pkg/src/english_lab_games/english_lab_live_memory_match_authoritative_sync_adapter_cs21a192.jsx"
          grep -q "data-live-current-poll-ms={currentPollMs}" "$pkg/src/english_lab_games/english_lab_live_memory_match_authoritative_sync_adapter_cs21a192.jsx"
          grep -q "data-spectator-reveal-ms={revealRuleMs}" "$pkg/src/english_lab_games/memory_match_classic_sync_cs21a189.jsx"
          grep -q "transition:transform .20s" "$pkg/styles/english_lab_memory_match_classic_sync_cs21a189.css"
          ! grep -q "original.replace(oldTransport,newTransport)" "$pkg/scripts/test_memory_match_conflict_reconciliation_browser_cs21a196.mjs"

      - name: Commit recovered source and tests if needed
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            src/english_lab_live.jsx
            src/english_lab_games/english_lab_live_memory_match_authoritative_sync_adapter_cs21a192.jsx
            src/english_lab_games/memory_match_classic_sync_cs21a189.jsx
            styles/english_lab_memory_match_classic_sync_cs21a189.css
            src/english_lab_games/memory_match_authoritative_sync_preview_cs21a192.html
            scripts/test_memory_match_conflict_reconciliation_browser_cs21a196.mjs
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Source and tests already recovered."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m "CS21A202 recupera CS196 y CS197 en source-of-truth"
          git push origin HEAD:${{ github.ref_name }}
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: echo "Historical CS21A202 source recovery complete. auto_commit=${{ steps.commit.outputs.changed }}"
