name: F111 i18n Preview Safe E1
on:
  pull_request:
    paths:
      - 'campus.html'
      - 'src/i18n_pilot_f111.js'
      - 'src/sidebar.jsx'
      - 'src/sidebar_active_state_cs21a69.js'
      - 'src/student_dashboard.jsx'
      - 'src/student_experience.jsx'
      - 'scripts/qa_f111_student_profile_tabs_en_e1.mjs'
      - 'src/teacher_cs21a_docs_viewer.jsx'
      - 'src/teacher_profile_cs21a76.jsx'
      - 'scripts/qa_f111_real_teacher_docs_record_e1.mjs'
      - 'scripts/qa_f111_i18n_preview_e1.mjs'
      - '.github/workflows/qa-f111-i18n-preview-e1.yml'
permissions:
  contents: read
jobs:
  preview-safe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript source parse
        run: node --check src/i18n_pilot_f111.js
      - name: Native role-aware preview, stable nav and emergency exit
        run: node scripts/qa_f111_i18n_preview_e1.mjs
      - name: Student profile and tabs bilingual E1 (synthetic)
        run: node scripts/qa_f111_student_profile_tabs_en_e1.mjs
      - name: Real teacher document viewer and professional record regression
        run: node scripts/qa_f111_real_teacher_docs_record_e1.mjs
