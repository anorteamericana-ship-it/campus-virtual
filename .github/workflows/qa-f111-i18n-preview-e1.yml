name: F111 i18n Preview Safe E1
on:
  pull_request:
    paths:
      - 'campus.html'
      - 'src/i18n_pilot_f111.js'
      - 'src/sidebar.jsx'
      - 'src/sidebar_active_state_cs21a69.js'
      - 'src/student_dashboard.jsx'
      - 'styles/academy_identity_card.css'
      - 'scripts/qa_f111_student_hero_language_visual_e1.mjs'
      - 'src/f111_attendance_limit_hotfix.js'
      - 'src/admin_attendance_roster.jsx'
      - 'src/admin_students.jsx'
      - 'src/att77_widgets.jsx'
      - 'src/att77_view_detail.jsx'
      - 'src/teacher_views.jsx'
      - 'src/student_menu_academic_cs21a120.jsx'
      - 'src/student_menu_academic_guard_cs21a120.js'
      - 'src/student_content_access_cs21a125.jsx'
      - 'src/student_tasks_menu_cs21a126.js'
      - 'src/student_experience.jsx'
      - 'src/student_dashboard.jsx'
      - 'src/student_academic_summary_dom_cs21a113.js'
      - 'src/student_portal.jsx'
      - 'scripts/qa_f111_student_demo_english_e1.mjs'
      - 'src/cronograma_grupo.jsx'
      - 'scripts/qa_f111_student_calendar_en_e1.mjs'
      - 'src/app.jsx'
      - 'src/att77_bridge.js'
      - 'styles/f111_attendance_limit.css'
      - 'scripts/qa_f111_roster_mini_i18n_20261104.mjs'
      - 'scripts/qa_f111_attendance_limit_three_roles_e1.mjs'
      - 'src/student_experience.jsx'
      - 'scripts/qa_f111_student_profile_tabs_en_e1.mjs'
      - 'src/teacher_cs21a_docs_viewer.jsx'
      - 'src/teacher_profile_cs21a76.jsx'
      - 'scripts/qa_f111_real_teacher_docs_record_e1.mjs'
      - 'scripts/qa_f111_i18n_preview_e1.mjs'
      - '.github/workflows/qa-f111-i18n-preview-e1.yml'
permissions:
  contents: read
jobs:
  preview-safe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript source parse
        run: |
          node --check src/i18n_pilot_f111.js
          node --check src/f111_attendance_limit_hotfix.js
      - name: Tri-role attendance limits INA 4/2, no data mutations
        run: node scripts/qa_f111_attendance_limit_three_roles_e1.mjs
      - name: Teacher roster mini semaforo and EN/ES source E1
        run: node scripts/qa_f111_roster_mini_i18n_20261104.mjs
      - name: Student demo English default and non-ready modules hidden
        run: node scripts/qa_f111_student_demo_english_e1.mjs
      - name: Native role-aware preview, stable nav and emergency exit
        run: node scripts/qa_f111_i18n_preview_e1.mjs
      - name: Student hero name contrast, ribbon hover and reviewed-material language E1
        run: node scripts/qa_f111_student_hero_language_visual_e1.mjs
      - name: Student profile and tabs bilingual E1 (synthetic)
        run: node scripts/qa_f111_student_profile_tabs_en_e1.mjs
      - name: Student calendar EN/ES, I CAN visibility and teacher/admin safety E1
        run: node scripts/qa_f111_student_calendar_en_e1.mjs
      - name: Real teacher document viewer and professional record regression
        run: node scripts/qa_f111_real_teacher_docs_record_e1.mjs
