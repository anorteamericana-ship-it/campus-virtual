name: CS21A159 apply cleanup reference classification

on:
  pull_request:
    paths:
      - '.github/workflows/cs21a159-apply-cleanup-classification.yml'
      - '.github/patches/cs21a159-cleanup-reference-classification.patch.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-classification:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/cs21a158-manual-review-20260804
          fetch-depth: 0
      - name: Apply exact classification patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/patches/cs21a159-cleanup-reference-classification.patch.b64 > /tmp/cs21a159.patch
          git apply --check /tmp/cs21a159.patch
          git apply /tmp/cs21a159.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit_cleanup_candidates_cs21a145.mjs
          git commit -m 'CS21A159 separa referencias ejecutables y de control'
          git push origin HEAD:integration/cs21a158-manual-review-20260804
