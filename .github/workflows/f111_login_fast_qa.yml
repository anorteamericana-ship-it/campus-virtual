name: F111 Login Fast QA
on:
  pull_request:
    paths:
      - 'login.html'
      - 'src/login.jsx'
      - 'src/data.jsx'
      - 'src/login.compiled.js'
      - 'src/data.login.compiled.js'
      - 'scripts/build_login_fast.cjs'
      - 'tests/qa_f111_login_fast.cjs'
      - 'tests/qa_f111_r10_pr_surface_guard.cjs'
      - '.github/workflows/f111_login_fast_qa.yml'
  workflow_dispatch:
jobs:
  login-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JSX compiled and synthetic role flows
        run: node tests/qa_f111_login_fast.cjs
      - name: Reject unrelated changes to academic or payment modules
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          node tests/qa_f111_r10_pr_surface_guard.cjs "$BASE_SHA"
