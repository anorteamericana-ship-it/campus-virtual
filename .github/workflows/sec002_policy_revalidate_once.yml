name: SEC002 policy revalidate one-shot

on:
  push:
    branches:
      - fix/sec002-private-document-foundation
    paths:
      - .github/workflows/sec002_policy_revalidate_once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sec002-private-document-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Updated bundle policy guard
        run: node scripts/qa_sec002_private_delivery_bundle_manifest.mjs
      - name: PowerShell installer contract
        run: node scripts/qa_sec002_powershell_installer.mjs
      - name: PowerShell syntax parser
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/install_apps_script_qa_sec002.ps1',
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'PASS PowerShell syntax parser'
