name: QA Ventas Asesores Reales CS21A153

on:
  pull_request:
    paths:
      - 'src/ventas_dashboard.jsx'
      - 'scripts/qa_ventas_asesores_reales_cs21a153.mjs'
      - '.github/workflows/qa-ventas-asesores-reales-cs21a153.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-ventas-asesores-reales:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar contrato CS21A153
        run: node scripts/qa_ventas_asesores_reales_cs21a153.mjs
