name: Bootstrap SEC002 Proforma WhatsApp CS21A175

on:
  push:
    branches:
      - 'security/sec002-proforma-whatsapp-no-public-link-cs21a175'
    paths:
      - '.github/workflows/bootstrap-sec002-proforma-whatsapp-cs21a175.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact source patch
        run: python scripts/apply_sec002_proforma_whatsapp_cs21a175.py
      - name: Verify privacy contract
        run: |
          node scripts/qa_sec002_proforma_whatsapp_cs21a175.mjs
          git diff --check
      - name: Remove bootstrap files and commit
        shell: bash
        run: |
          rm .github/workflows/bootstrap-sec002-proforma-whatsapp-cs21a175.yml
          rm scripts/apply_sec002_proforma_whatsapp_cs21a175.py
          git config user.name "anorteamericana-ship-it"
          git config user.email "anorteamericana@gmail.com"
          git add src/ventas_drawer.jsx src/matriculas_admin.jsx .github/workflows/bootstrap-sec002-proforma-whatsapp-cs21a175.yml scripts/apply_sec002_proforma_whatsapp_cs21a175.py
          git commit -m "CS21A175 · stop propagating public proforma links to WhatsApp"
          git push origin HEAD:security/sec002-proforma-whatsapp-no-public-link-cs21a175
