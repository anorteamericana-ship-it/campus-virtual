name: QA Free Prospect Portal Safe Errors CS21A210Z

on:
  push:
    branches:
      - fix/free-prospect-portal-safe-errors-cs21a210z
    paths:
      - 'src/prospect_free_student.jsx'
  pull_request:
    paths:
      - 'src/prospect_free_student.jsx'
      - 'scripts/qa_free_prospect_portal_safe_errors_cs21a210z.mjs'
      - '.github/workflows/qa-free-prospect-portal-safe-errors-cs21a210z.yml'
      - '00_DOCUMENTACION/FREE_PROSPECT_PORTAL_SAFE_ERRORS_CS21A210Z_2026-08-31.md'

jobs:
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify CS21A210Z semantics
        run: node scripts/qa_free_prospect_portal_safe_errors_cs21a210z.mjs
      - name: Regress English LAB source truth
        run: node scripts/qa_cs21a202_source_truth.mjs
      - name: Regress CS21A210X Matriculas
        run: node scripts/qa_matriculas_safe_errors_cs21a210x.mjs
      - name: Regress CS21A210V Solicitudes
        run: node scripts/qa_solicitudes_unificadas_safe_errors_cs21a210v.mjs
      - name: Diff hygiene
        run: git diff --check
