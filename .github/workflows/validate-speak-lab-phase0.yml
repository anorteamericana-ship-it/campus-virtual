name: Validate SPEAK LAB Stack

on:
  pull_request:
    paths:
      - 'prototypes/speak_lab_phase0/**'
      - 'prototypes/speak_lab_phase1/**'
      - 'scripts/validate_speak_lab_phase0.mjs'
      - 'scripts/test_speak_lab_phase0_browser.mjs'
      - 'scripts/validate_speak_lab_phase1_contracts.mjs'
      - '00_DOCUMENTACION/PLAN_MAESTRO_SPEAK_LAB_2026-08-14.md'
      - '00_DOCUMENTACION/SPEAK_LAB_PHASE1_PROVIDER_CONTRACTS_2026-08-14.md'
      - '.github/workflows/validate-speak-lab-phase0.yml'
      - '.github/workflows/validate-speak-lab-phase1-contracts.yml'
  workflow_dispatch:

concurrency:
  group: speak-lab-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-phase1-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Phase 1 contract syntax
        run: |
          node --check prototypes/speak_lab_phase1/contracts.js
          node --check scripts/validate_speak_lab_phase1_contracts.mjs

      - name: Phase 1 contract gate
        run: node scripts/validate_speak_lab_phase1_contracts.mjs

  validate-speak-lab-phase0:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Phase 0 static gate
        run: |
          node --check scripts/test_speak_lab_phase0_browser.mjs
          node scripts/validate_speak_lab_phase0.mjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Phase 0 browser smoke · microphone, playback, retry and 390px
        run: node scripts/test_speak_lab_phase0_browser.mjs

      - name: Publish browser summary
        if: always()
        shell: bash
        run: |
          if [ -f qa-output/speak-lab-phase0/summary.md ]; then
            cat qa-output/speak-lab-phase0/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload SPEAK LAB browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SPEAK_LAB_PHASE0_BROWSER_QA_STACK
          path: qa-output/speak-lab-phase0/
          if-no-files-found: warn
          retention-days: 14
