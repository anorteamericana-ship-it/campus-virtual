name: English LAB Final QA Package

on:
  push:
    branches:
      - release/english-lab-final-qa
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: english-lab-final-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-qa-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final QA branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Freeze product exactly at post-CS210
        run: |
          set -euo pipefail
          PRODUCT_HEAD=6e0c364828d065ce8bc06d920a94c8d895ef8217
          git merge-base --is-ancestor "$PRODUCT_HEAD" HEAD
          git diff --name-only "$PRODUCT_HEAD"...HEAD | tee /tmp/final-package-delta.txt
          python3 - <<'PY'
          from pathlib import Path
          allowed={'.github/workflows/qa-english-lab-final-package.yml'}
          changed={x.strip() for x in Path('/tmp/final-package-delta.txt').read_text().splitlines() if x.strip()}
          if changed != allowed:
              raise SystemExit('Delta final inesperado: '+', '.join(sorted(changed)))
          print('Producto congelado:', '6e0c364828d065ce8bc06d920a94c8d895ef8217')
          PY
          git diff --exit-code "$PRODUCT_HEAD"...HEAD -- ':!.github/workflows/qa-english-lab-final-package.yml'

      - name: Canonical static contracts
        run: |
          set -euo pipefail
          node scripts/qa_cs21a205_english_lab_shell.mjs
          node scripts/qa_cs21a207_english_lab_navigation.mjs
          node scripts/qa_cs21a208_english_lab_legacy_routes.mjs
          node scripts/test_english_lab_sentence_order_cs21a183.mjs
          node scripts/test_english_lab_hangman_engine_cs21a191.mjs
          node scripts/test_english_lab_hangman_contract_cs21a191.mjs
          node scripts/qa_cs21a198_quiz_curriculum_core.mjs
          node scripts/qa_cs21a198_quiz_live_integration.mjs
          node scripts/qa_cs21a198_quiz_backend_contract.mjs
          node scripts/qa_cs21a204_quiz_live_compatibility.mjs
          node scripts/qa_cs21a199_word_search.mjs
          node scripts/qa_cs21a200_word_search_backend_contract.mjs
          node scripts/qa_cs21a200_word_search_live_integration.mjs

      - name: Backend CS201 unchanged and assemblable
        run: |
          set -euo pipefail
          PRODUCT_HEAD=6e0c364828d065ce8bc06d920a94c8d895ef8217
          git diff --exit-code "$PRODUCT_HEAD"...HEAD -- apps_script_patches/
          node scripts/assemble_apps_script_cs21a201_unified.mjs
          cp apps_script_patches/99_CS21A201_ENGLISH_LAB_UNIFIED_COMPLETO.gs /tmp/cs201-final.js
          node --check /tmp/cs201-final.js
          grep -q 'CS21A201-CURRICULUM-SOURCE-1' /tmp/cs201-final.js
          grep -q 'CS21A200-WORD-SEARCH-LIVE-1' /tmp/cs201-final.js
          grep -q 'CS21A198-QUIZ-TIME-B1U01-2' /tmp/cs201-final.js
          grep -q 'CS21A197-MM-SPECTATOR-REVEAL-1' /tmp/cs201-final.js

      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Start source QA server
        run: |
          python3 -m http.server 4218 --bind 127.0.0.1 >/tmp/final-source-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4218/src/english_lab_games/english_lab_unified_shell_preview_cs21a205.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/final-source-http.log
          exit 1

      - name: All five games browser regression
        env:
          QA_BASE_URL: http://127.0.0.1:4218
        run: |
          set -euo pipefail
          node scripts/test_english_lab_unified_shell_browser_cs21a205.mjs
          node scripts/test_english_lab_canonical_loader_browser_cs21a205.mjs
          node scripts/test_memory_match_conflict_reconciliation_browser_cs21a196.mjs
          node scripts/test_memory_match_spectator_reveal_browser_cs21a197.mjs
          node scripts/test_memory_match_lobby_start_rejoin_browser_cs21a203.mjs
          node scripts/test_english_lab_hangman_package_browser_cs21a191.mjs
          node scripts/qa_cs21a204_quiz_word_search_browser_smoke.mjs
          node scripts/test_english_lab_sentence_order_browser_cs21a209.mjs
          node scripts/test_english_lab_quiz_time_browser_cs21a210.mjs

      - name: Build final QA ZIP
        run: |
          set -euo pipefail
          pkg=/tmp/CAMPUS_QA_ENGLISH_LAB_FINAL
          zipfile=/tmp/CAMPUS_QA_ENGLISH_LAB_FINAL.zip
          qa_exec='https://script.google.com/macros/s/AKfycbzzsmmHVRGlgltcUJf7Yi9R0z__vsu58Hw9Gq9rNn5pYVrgY5iZ0-xEEL-8wqL4uPVbaw/exec'
          product_head='6e0c364828d065ce8bc06d920a94c8d895ef8217'
          package_head="$(git rev-parse HEAD)"
          rm -rf "$pkg" "$zipfile" "$zipfile.sha256"
          mkdir -p "$pkg"
          rsync -a --exclude '.git' --exclude '.github' --exclude 'node_modules' --exclude 'qa-output' ./ "$pkg/"
          mkdir -p "$pkg/BACKEND_QA" "$pkg/EVIDENCIA_AUTOMATICA"
          cp apps_script_patches/99_CS21A201_ENGLISH_LAB_UNIFIED_COMPLETO.gs "$pkg/BACKEND_QA/99_CS21A201_ENGLISH_LAB_UNIFIED_COMPLETO.gs"
          test -d qa-output && cp -r qa-output/. "$pkg/EVIDENCIA_AUTOMATICA/" || true

          cat > "$pkg/qa-bootstrap-final.js" <<EOF
          (function(){
            var url='${qa_exec}';
            window.__CAMPUS_RUNTIME_CONFIG__={environment:'qa',appsScriptUrl:url};
            window.__CAMPUS_FINAL_QA__={productHead:'${product_head}',packageHead:'${package_head}',backend:'CS21A201'};
            try{localStorage.setItem('AN_QA_APPS_SCRIPT_URL',url);}catch(_){}
          })();
          EOF

          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/CAMPUS_QA_ENGLISH_LAB_FINAL')
          matched=[]
          for p in root.glob('*.html'):
              s=p.read_text(encoding='utf-8')
              marker='<script src="src/runtime_config.js'
              if marker not in s:
                  continue
              boot='<script src="qa-bootstrap-final.js?v=ENGLISH_LAB_FINAL_QA"></script>\n'
              if 'qa-bootstrap-final.js' not in s:
                  s=s.replace(marker,boot+marker,1)
                  p.write_text(s,encoding='utf-8')
              matched.append(p.name)
          required={'campus.html','login.html','inscripcion.html','ventas.html'}
          if not required.issubset(set(matched)):
              raise SystemExit('Entradas QA incompletas: '+', '.join(sorted(required-set(matched))))
          for name in required:
              s=(root/name).read_text(encoding='utf-8')
              assert s.index('qa-bootstrap-final.js') < s.index('src/runtime_config.js'), name
          print('Entradas QA:', ', '.join(sorted(matched)))
          PY

          cat > "$pkg/qa-setup.html" <<EOF
          <!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English LAB · QA FINAL</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#eef4fb;color:#052c59;padding:28px}.card{max-width:820px;margin:auto;background:#fff;padding:28px;border-radius:22px;box-shadow:0 16px 44px rgba(5,44,89,.12)}h1{margin-top:0}.ok{padding:12px 14px;background:#e9f8ef;border-radius:12px;color:#155d33}.meta{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all;background:#f6f8fb;padding:12px;border-radius:12px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}a{display:inline-block;text-decoration:none;padding:12px 16px;border-radius:12px;background:#052c59;color:#fff;font-weight:800}a.alt{background:#e9eff6;color:#052c59}</style></head><body><main class="card"><h1>English LAB · QA FINAL</h1><p class="ok"><strong>QA preconfigurado.</strong> No pegues ninguna URL y no uses producción.</p><p>Paquete post-CS210 para la prueba final con Profe, Naty y Chu: Memory Match, Sentence Order, Hangman, Quiz Time y Word Search.</p><div class="meta">PRODUCT_HEAD=${product_head}<br>PACKAGE_HEAD=${package_head}<br>BACKEND=CS21A201<br>ENVIRONMENT=qa<br>QA_EXEC=${qa_exec}</div><div class="actions"><a href="login.html?clear=1">Abrir Login QA</a><a class="alt" href="campus.html#english_lab_live">Abrir English LAB</a></div><p style="margin-bottom:0;margin-top:20px;font-size:13px">Para detener el servidor local, cerrá la ventana negra de ABRIR_CAMPUS_QA_FINAL.cmd.</p></main></body></html>
          EOF

          cat > "$pkg/ABRIR_CAMPUS_QA_FINAL.cmd" <<'EOF'
          @echo off
          cd /d "%~dp0"
          echo ============================================================
          echo CAMPUS QA FINAL - ENGLISH LAB
          echo SOLO QA. NO PRODUCCION.
          echo ============================================================
          echo Abriendo http://127.0.0.1:4219/qa-setup.html
          start "" http://127.0.0.1:4219/qa-setup.html
          where py >nul 2>nul && py -m http.server 4219 --bind 127.0.0.1 && exit /b
          python -m http.server 4219 --bind 127.0.0.1
          EOF

          cat > "$pkg/VERSION.txt" <<EOF
          VERSION=ENGLISH_LAB_FINAL_QA
          STATUS=FINAL_HUMAN_QA_CANDIDATE
          BUILD_DATE=2026-08-11
          QA_PORT=4219
          SOURCE_BRANCH=${GITHUB_REF_NAME}
          SOURCE_PRODUCT_HEAD_SHA=${product_head}
          SOURCE_PACKAGE_HEAD_SHA=${package_head}
          BACKEND_VERSION=CS21A201
          APPS_SCRIPT_CHANGE=NO
          QA_ENVIRONMENT=qa
          QA_EXEC=${qa_exec}
          INCLUDED_GAMES=MEMORY_MATCH|SENTENCE_ORDER|HANGMAN|QUIZ_TIME|WORD_SEARCH
          CS209_SENTENCE_ORDER_DOUBLE_SUBMIT=FIXED
          CS210_QUIZ_TIME_DOUBLE_SUBMIT=FIXED
          FINAL_HUMAN_QA=PENDING_PROFE_NATY_CHU
          LOAD_TEST_15_20_25=DEFERRED_NON_BLOCKING
          PRODUCTION_ACTION=DO_NOT_MODIFY
          MERGE_ACTION=DO_NOT_MERGE_WITHOUT_EXPLICIT_AUTHORIZATION
          EOF

          cat > "$pkg/LEEME_PRIMERO_FINAL.txt" <<'EOF'
          CAMPUS QA FINAL - ENGLISH LAB
          ============================================================
          - SOLO QA. NO PRODUCCION. NO MERGE AUTOMATICO.
          - Ejecutar ABRIR_CAMPUS_QA_FINAL.cmd.
          - No requiere pegar /exec: ya apunta al deployment QA verificado.
          - Smoke final: Profe + Naty + Chu.
          - Probar Memory Match, Sentence Order, Hangman, Quiz Time y Word Search.
          - Revisar una sesión estudiante a 390 px.
          - BACKEND_QA contiene CS21A201 solo como referencia: NO instalar ni desplegar.
          - Carga 15/20/25 estudiantes queda diferida y NO bloquea este cierre.
          ============================================================
          EOF

          (
            cd "$pkg"
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
          (cd /tmp && zip -qr "$zipfile" "$(basename "$pkg")")
          sha256sum "$zipfile" > "$zipfile.sha256"

      - name: Inspect final QA ZIP
        run: |
          set -euo pipefail
          pkg=/tmp/CAMPUS_QA_ENGLISH_LAB_FINAL
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/CAMPUS_QA_ENGLISH_LAB_FINAL')
          qa='https://script.google.com/macros/s/AKfycbzzsmmHVRGlgltcUJf7Yi9R0z__vsu58Hw9Gq9rNn5pYVrgY5iZ0-xEEL-8wqL4uPVbaw/exec'
          product='6e0c364828d065ce8bc06d920a94c8d895ef8217'
          version=(root/'VERSION.txt').read_text()
          boot=(root/'qa-bootstrap-final.js').read_text()
          quiz=(root/'src/english_lab_games/english_lab_quiz_time_live_cs21a198.jsx').read_text()
          assert 'VERSION=ENGLISH_LAB_FINAL_QA' in version
          assert f'SOURCE_PRODUCT_HEAD_SHA={product}' in version
          assert 'BACKEND_VERSION=CS21A201' in version
          assert 'APPS_SCRIPT_CHANGE=NO' in version
          assert qa in version and qa in boot
          assert "environment:'qa'" in boot
          assert 'submitQuestionRef' in quiz
          assert (root/'ABRIR_CAMPUS_QA_FINAL.cmd').is_file()
          assert (root/'qa-setup.html').is_file()
          for name in ['login.html','campus.html','inscripcion.html','ventas.html']:
              s=(root/name).read_text()
              assert 'qa-bootstrap-final.js' in s
              assert s.index('qa-bootstrap-final.js') < s.index('src/runtime_config.js')
          backend=(root/'BACKEND_QA/99_CS21A201_ENGLISH_LAB_UNIFIED_COMPLETO.gs').read_text()
          assert 'CS21A201-CURRICULUM-SOURCE-1' in backend
          print('Inspección estructural del paquete: PASS')
          PY
          sha256sum -c <(sed 's#  \./#  /tmp/CAMPUS_QA_ENGLISH_LAB_FINAL/#' "$pkg/SHA256SUMS.txt")

      - name: Start exact package server
        run: |
          pkg=/tmp/CAMPUS_QA_ENGLISH_LAB_FINAL
          python3 -m http.server 4220 --bind 127.0.0.1 --directory "$pkg" >/tmp/final-package-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4220/qa-setup.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/final-package-http.log
          exit 1

      - name: Diagnose packaged login QA config
        env:
          QA_FINAL_URL: https://script.google.com/macros/s/AKfycbzzsmmHVRGlgltcUJf7Yi9R0z__vsu58Hw9Gq9rNn5pYVrgY5iZ0-xEEL-8wqL4uPVbaw/exec
        run: |
          mkdir -p qa-output/final-package-login
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const expected=process.env.QA_FINAL_URL;
          const report={expected,console:[],pageErrors:[],requestFailures:[]};
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage({viewport:{width:390,height:844}});
            page.on('console',msg=>report.console.push({type:msg.type(),text:msg.text()}));
            page.on('pageerror',err=>report.pageErrors.push(String(err?.stack||err)));
            page.on('requestfailed',req=>report.requestFailures.push({url:req.url(),error:req.failure()?.errorText||''}));
            const response=await page.goto('http://127.0.0.1:4220/login.html?clear=1',{waitUntil:'domcontentloaded'});
            report.httpStatus=response?.status()||0;
            report.url=page.url();
            report.cfg=await page.evaluate(()=>({
              appsScriptUrl:window.APPS_SCRIPT_URL||'',
              runtime:window.CAMPUS_RUNTIME_CONFIG||null,
              requested:window.__CAMPUS_RUNTIME_CONFIG__||null,
              marker:window.__CAMPUS_FINAL_QA__||null,
              installed:!!window.__AN_RUNTIME_CONFIG_INSTALLED__
            }));
            report.pass=report.cfg.appsScriptUrl===expected && report.cfg.runtime?.environment==='qa' && report.cfg.runtime?.valid===true && report.cfg.runtime?.isProduction===false && report.cfg.marker?.productHead==='6e0c364828d065ce8bc06d920a94c8d895ef8217';
            await page.screenshot({path:'qa-output/final-package-login/login-390.png',fullPage:true});
          } catch(error) {
            report.error=String(error?.stack||error);
            report.pass=false;
          } finally {
            await browser.close();
          }
          fs.writeFileSync('qa-output/final-package-login/config.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          if(report.pass) fs.writeFileSync('qa-output/final-package-login/PASS','PASS\n');
          NODE

      - name: Exact package browser gate
        env:
          QA_BASE_URL: http://127.0.0.1:4220
        run: |
          set -euo pipefail
          node scripts/test_english_lab_unified_shell_browser_cs21a205.mjs
          node scripts/test_english_lab_sentence_order_browser_cs21a209.mjs
          node scripts/test_english_lab_quiz_time_browser_cs21a210.mjs

      - name: Upload final QA candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CAMPUS_QA_ENGLISH_LAB_FINAL
          path: |
            /tmp/CAMPUS_QA_ENGLISH_LAB_FINAL.zip
            /tmp/CAMPUS_QA_ENGLISH_LAB_FINAL.zip.sha256
          if-no-files-found: warn
          retention-days: 30

      - name: Upload final automatic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ENGLISH_LAB_FINAL_QA_EVIDENCE
          path: qa-output/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce packaged login QA gate
        run: test -f qa-output/final-package-login/PASS
