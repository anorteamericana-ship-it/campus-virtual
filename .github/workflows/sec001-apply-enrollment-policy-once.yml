name: SEC001 apply enrollment password policy once

on:
  push:
    branches:
      - fix/sec001-auth-policy-foundation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/sec001-auth-policy-foundation
          fetch-depth: 0

      - name: Verify branch and exact base ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "fix/sec001-auth-policy-foundation"
          git merge-base --is-ancestor 67108928e953fbf044dbcd916dc34a5dd5f1e570 HEAD

      - name: Apply exact enrollment policy replacements
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/inscripcion.jsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "if(!clean(form.clave) || clean(form.clave).length < 4) missing.push('clave mínima de 4 caracteres');",
                  "if(!clean(form.clave) || clean(form.clave).length < 15) missing.push('clave mínima de 15 caracteres');"
              ),
              (
                  '<Field label="Crea tu contraseña para ingresar al Campus virtual" required hint="La usarás con tu cédula para revisar tu solicitud."><TextInput type="password" value={form.clave} onChange={v=>setForm({clave:v})} autoComplete="new-password" /></Field>',
                  '<Field label="Crea tu contraseña para ingresar al Campus virtual" required hint="Usá al menos 15 caracteres. Podés usar una frase fácil de recordar."><TextInput type="password" value={form.clave} onChange={v=>setForm({clave:v})} minLength={15} maxLength={128} autoComplete="new-password" /></Field>'
              ),
              (
                  "if(!clean(form.nombre) || !clean(form.cedula) || !clean(form.clave)) return 'Faltan nombre, cédula o clave.';",
                  "if(!clean(form.nombre) || !clean(form.cedula) || !clean(form.clave)) return 'Faltan nombre, cédula o clave.';\n    if(clean(form.clave).length < 15) return 'La clave debe tener al menos 15 caracteres.';"
              )
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'FAIL-CLOSED: expected exactly one preimage, got {count}: {old[:90]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Run SEC001 policy gate
        run: node scripts/qa_sec001_password_policy.mjs

      - name: Scope and whitespace checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "src/inscripcion.jsx"
          git diff -- src/inscripcion.jsx

      - name: Commit exact source change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/inscripcion.jsx
          git commit -m "SEC001 enforce enrollment password minimum"
          git push origin HEAD:fix/sec001-auth-policy-foundation
