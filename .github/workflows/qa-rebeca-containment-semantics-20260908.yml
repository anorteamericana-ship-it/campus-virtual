name: QA Rebeca Containment Semantics 20260908
on:
  push:
    branches: [audit/rebeca-containment-semantics-20260908]
  pull_request:
    paths:
      - '00_DOCUMENTACION/REBECA_CONTAINMENT_SEMANTICS_AUDIT_2026-09-08.md'
      - 'scripts/qa_rebeca_containment_semantics_20260908.mjs'
      - '.github/workflows/qa-rebeca-containment-semantics-20260908.yml'
permissions:
  contents: read
jobs:
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax
        run: node --check scripts/qa_rebeca_containment_semantics_20260908.mjs
      - name: Verify containment semantics
        run: node scripts/qa_rebeca_containment_semantics_20260908.mjs
      - name: Preserve #281 provenance stop
        run: grep -Fq 'CURRENT_HANDLER_SOURCE_BLOCKED' 00_DOCUMENTACION/REBECA_ROUTE_PROVENANCE_AUDIT_2026-09-08.md
      - name: Preserve C0 human stop
        run: grep -Fq 'BLOQUEADO_HUMANO' 00_DOCUMENTACION/C0_PROSPECTOS_HEADER_ORDER_2026-09-08.md
      - name: No functional source change
        run: |
          test -z "$(git diff --name-only 6606c5e34dfb58637c47c5c8c20204a0770f535e...HEAD | grep -Ev '^(00_DOCUMENTACION/REBECA_CONTAINMENT_SEMANTICS_AUDIT_2026-09-08.md|scripts/qa_rebeca_containment_semantics_20260908.mjs|\.github/workflows/qa-rebeca-containment-semantics-20260908.yml)$' || true)"
      - name: Diff hygiene
        run: git diff --check 6606c5e34dfb58637c47c5c8c20204a0770f535e...HEAD
