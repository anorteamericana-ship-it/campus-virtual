name: CS21A156 apply canonical refactor

on:
  pull_request:
    paths:
      - '.github/workflows/cs21a156-apply-refactor.yml'
      - '.github/patches/cs21a156.patch.gz.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-refactor:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply exact patch and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/patches/cs21a156.patch.gz.b64 | gzip -d > /tmp/cs21a156.patch
          git apply --check /tmp/cs21a156.patch
          git apply /tmp/cs21a156.patch
          git rm .github/patches/cs21a156.patch.gz.b64
          git rm .github/workflows/cs21a156-apply-refactor.yml
          git rm .github/workflows/cs21a156-source-snapshot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.jsx src/sidebar.jsx src/admin_resources_view_cs21a156.jsx \
            src/admin_resources_cs21a59.jsx src/admin_resources_runtime_cs21a61.jsx \
            src/admin_resources_direct_cs21a74.js src/resources_panel_cs21a65.jsx \
            src/resources_panel_state_cs21a65.js
          git commit -m 'CS21A156 crea ruta canónica de Recursos admin'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
