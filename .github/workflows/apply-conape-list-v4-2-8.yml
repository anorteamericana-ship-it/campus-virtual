name: Apply CONAPE list V4.2.8

on:
  push:
    branches:
      - feature/conape-list-csv-reader
    paths:
      - 'scripts/patch_conape_list_reader_v4_2_8.mjs'
      - '.github/workflows/apply-conape-list-v4-2-8.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply scoped patch
        run: node scripts/patch_conape_list_reader_v4_2_8.mjs
      - name: Syntax
        run: node --check services/conape-bridge/server_v2.mjs
      - name: CONAPE contract QA
        run: node scripts/qa_conape_bridge_v2.mjs
      - name: Commit canonical source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/conape-bridge/server_v2.mjs scripts/qa_conape_bridge_v2.mjs
          git rm scripts/patch_conape_list_reader_v4_2_8.mjs .github/workflows/apply-conape-list-v4-2-8.yml
          git commit -m "CONAPE V4.2.8 · lectura lista CSV con respaldo Rows=All"
          git push origin HEAD:${GITHUB_REF_NAME}
