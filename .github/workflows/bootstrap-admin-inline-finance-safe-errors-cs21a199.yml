name: Bootstrap Admin Inline Finance Safe Errors CS21A199

on:
  push:
    branches:
      - fix/admin-finance-ui-safe-errors-cs21a199
    paths:
      - 'scripts/bootstrap_patch_admin_inline_finance_safe_errors_cs21a199.mjs'
      - '.github/workflows/bootstrap-admin-inline-finance-safe-errors-cs21a199.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify exact base ancestry
        run: git merge-base --is-ancestor 07988ed9227514ad8ae63599bd662e937f6fcb4e HEAD
      - name: Apply exact finance UI patch
        run: node scripts/bootstrap_patch_admin_inline_finance_safe_errors_cs21a199.mjs
      - name: Run CS21A199 guard
        run: node scripts/qa_admin_inline_finance_safe_errors_cs21a199.mjs
      - name: Regress CS21A198 integration
        run: node scripts/qa_admin_secondary_surfaces_cs21a198.mjs
      - name: Regress canonical master dashboard
        run: node scripts/qa_admin_master_dashboard_safe_errors_cs21a196.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Remove bootstrap artifacts and push verified candidate
        run: |
          rm scripts/bootstrap_patch_admin_inline_finance_safe_errors_cs21a199.mjs
          rm .github/workflows/bootstrap-admin-inline-finance-safe-errors-cs21a199.yml
          git add -A
          git commit -m 'CS21A199 · safe inline finance errors'
          git push origin HEAD:fix/admin-finance-ui-safe-errors-cs21a199
