name: APPLY SEC002 Payment Receipt CS21A161 TEMP

on:
  push:
    branches:
      - security/sec002-payment-receipt-private-cs21a161

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'CS21A161 applied') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/sec002-payment-receipt-private-cs21a161
          fetch-depth: 0
      - name: Apply audited historical frontend delta to modern source
        run: |
          git show b85b5c7f72a1f687f9499562b80a01e380c43aa2:scripts/apply_sec002_payment_receipt_frontend.py > /tmp/apply_sec002_payment_receipt_frontend.py
          python /tmp/apply_sec002_payment_receipt_frontend.py
      - name: Validate exact source scope and private contract
        run: |
          git diff --check
          test "$(git diff --name-only | sort | paste -sd ' ' -)" = "src/data.jsx src/solicitudes_pago.jsx"
          ! grep -q "window.open(url, '_blank'\|img src={sol.url_comprobante}\|href={sol.url_comprobante}" src/solicitudes_pago.jsx
          grep -q "descargarComprobantePagoPrivado" src/data.jsx src/solicitudes_pago.jsx
          grep -q "URL.createObjectURL(r.blob)" src/solicitudes_pago.jsx
          grep -q "URL.revokeObjectURL" src/solicitudes_pago.jsx
          grep -q "bytes.length > 5 \* 1024 \* 1024" src/data.jsx
      - name: Commit source and remove bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data.jsx src/solicitudes_pago.jsx
          git rm .github/workflows/apply-sec002-payment-receipt-cs21a161.yml
          git commit -m "CS21A161 applied · private payment receipt source"
          git push origin HEAD:security/sec002-payment-receipt-private-cs21a161
