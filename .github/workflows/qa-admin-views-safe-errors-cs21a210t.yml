name: QA Admin Views Safe Errors CS21A210T

on:
  push:
    branches:
      - fix/admin-views-safe-errors-cs21a210t
    paths:
      - 'src/admin_views.jsx'
  pull_request:
    paths:
      - 'src/admin_views.jsx'
      - 'scripts/qa_admin_views_safe_errors_cs21a210t.mjs'
      - '.github/workflows/qa-admin-views-safe-errors-cs21a210t.yml'
      - '00_DOCUMENTACION/ADMIN_VIEWS_SAFE_ERRORS_CS21A210T_2026-08-31.md'

jobs:
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify CS21A210T semantics
        run: node scripts/qa_admin_views_safe_errors_cs21a210t.mjs
      - name: Regress CS21A210R Auditoria Academica
        run: node scripts/qa_auditoria_academica_safe_errors_cs21a210r.mjs
      - name: Regress CS21A210Q Inscripcion
        run: node scripts/qa_inscripcion_admin_safe_errors_cs21a210q.mjs
      - name: Regress CS21A210P Prematriculas
        run: node scripts/qa_prematriculas_shared_safe_errors_cs21a210p.mjs
      - name: Diff hygiene
        run: git diff --check
