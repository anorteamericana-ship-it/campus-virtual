name: Bootstrap Admin Master CONAPE Safe Errors CS21A194R2

on:
  push:
    branches:
      - fix/admin-master-conape-safe-errors-cs21a194r2
    paths:
      - 'scripts/bootstrap_patch_admin_master_conape_safe_errors_cs21a194r2.mjs'
      - '.github/workflows/bootstrap-admin-master-conape-safe-errors-cs21a194r2.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify exact base ancestry
        run: git merge-base --is-ancestor 65c35c589bb550cc513bae56ee386119c87f196c HEAD
      - name: Apply exact safe-error patch
        run: node scripts/bootstrap_patch_admin_master_conape_safe_errors_cs21a194r2.mjs
      - name: Run CS21A194R2 guard
        run: node scripts/qa_admin_master_conape_safe_errors_cs21a194r2.mjs
      - name: Regress CS21A193
        run: node scripts/qa_admin_academic_private_pdf_cs21a193.mjs
      - name: Regress CS21A192
        run: node scripts/qa_admin_students_user_copy_cs21a192.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Remove bootstrap artifacts and push verified candidate
        run: |
          rm scripts/bootstrap_patch_admin_master_conape_safe_errors_cs21a194r2.mjs
          rm .github/workflows/bootstrap-admin-master-conape-safe-errors-cs21a194r2.yml
          git add -A
          git commit -m 'CS21A194R2 · safe Master CONAPE errors'
          git push origin HEAD:fix/admin-master-conape-safe-errors-cs21a194r2
