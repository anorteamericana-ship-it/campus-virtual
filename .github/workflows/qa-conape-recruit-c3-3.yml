name: QA CONAPE Recruit C3.3

on:
  pull_request:
    paths:
      - 'src/ventas_conape_reclutar_c3_3.jsx'
      - 'ventas.html'
      - 'scripts/conape_portal/discover_recruit_form_c3_3.mjs'
      - 'scripts/conape_portal/run_conape_recruit_discovery_windows.ps1'
      - 'scripts/conape_portal/discover_recruit_submit_contract_c3_3.mjs'
      - 'scripts/conape_portal/run_conape_recruit_submit_discovery_windows.ps1'
      - 'scripts/conape_portal/discover_recruit_client_action_c3_3b.mjs'
      - 'scripts/conape_portal/run_conape_recruit_client_action_c3_3b_windows.ps1'
      - 'scripts/conape_portal/discover_recruit_bound_handlers_c3_3c.mjs'
      - 'scripts/conape_portal/run_conape_recruit_bound_handlers_c3_3c_windows.ps1'
      - 'scripts/conape_portal/recruit_e4_controlled_c3_4.mjs'
      - 'scripts/conape_portal/run_conape_recruit_e4_controlled_windows.ps1'
      - 'scripts/conape_portal/recruit_bridge_contract_c3_5.mjs'
      - 'scripts/qa_conape_recruit_c3_3.mjs'
      - 'scripts/qa_conape_recruit_bridge_c3_5.mjs'
      - '00_DOCUMENTACION/C3_3_CONAPE_RECLUTAMIENTO_DESDE_CAMPUS.md'
      - '00_DOCUMENTACION/C3_5_CONAPE_PRIVATE_BRIDGE_SPEC.md'
      - '.github/workflows/qa-conape-recruit-c3-3.yml'
  push:
    branches:
      - 'feature/conape-reclutamiento-c3-3'
    paths:
      - 'src/ventas_conape_reclutar_c3_3.jsx'
      - 'ventas.html'
      - 'scripts/conape_portal/discover_recruit_form_c3_3.mjs'
      - 'scripts/conape_portal/run_conape_recruit_discovery_windows.ps1'
      - 'scripts/conape_portal/discover_recruit_submit_contract_c3_3.mjs'
      - 'scripts/conape_portal/run_conape_recruit_submit_discovery_windows.ps1'
      - 'scripts/conape_portal/discover_recruit_client_action_c3_3b.mjs'
      - 'scripts/conape_portal/run_conape_recruit_client_action_c3_3b_windows.ps1'
      - 'scripts/conape_portal/discover_recruit_bound_handlers_c3_3c.mjs'
      - 'scripts/conape_portal/run_conape_recruit_bound_handlers_c3_3c_windows.ps1'
      - 'scripts/conape_portal/recruit_e4_controlled_c3_4.mjs'
      - 'scripts/conape_portal/run_conape_recruit_e4_controlled_windows.ps1'
      - 'scripts/conape_portal/recruit_bridge_contract_c3_5.mjs'
      - 'scripts/qa_conape_recruit_c3_3.mjs'
      - 'scripts/qa_conape_recruit_bridge_c3_5.mjs'
      - '00_DOCUMENTACION/C3_3_CONAPE_RECLUTAMIENTO_DESDE_CAMPUS.md'
      - '00_DOCUMENTACION/C3_5_CONAPE_PRIVATE_BRIDGE_SPEC.md'
      - '.github/workflows/qa-conape-recruit-c3-3.yml'

permissions:
  contents: read

jobs:
  contract-and-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax discovery + QA
        run: |
          node --check scripts/conape_portal/discover_recruit_form_c3_3.mjs
          node --check scripts/conape_portal/discover_recruit_submit_contract_c3_3.mjs
          node --check scripts/conape_portal/discover_recruit_client_action_c3_3b.mjs
          node --check scripts/conape_portal/discover_recruit_bound_handlers_c3_3c.mjs
          node --check scripts/conape_portal/recruit_e4_controlled_c3_4.mjs
          node --check scripts/conape_portal/recruit_bridge_contract_c3_5.mjs
          node --check scripts/qa_conape_recruit_c3_3.mjs
          node --check scripts/qa_conape_recruit_bridge_c3_5.mjs
      - name: Syntax PowerShell
        shell: pwsh
        run: |
          $paths = @(
            'scripts/conape_portal/run_conape_recruit_discovery_windows.ps1',
            'scripts/conape_portal/run_conape_recruit_submit_discovery_windows.ps1',
            'scripts/conape_portal/run_conape_recruit_client_action_c3_3b_windows.ps1',
            'scripts/conape_portal/run_conape_recruit_bound_handlers_c3_3c_windows.ps1',
            'scripts/conape_portal/run_conape_recruit_e4_controlled_windows.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path :: $($_.Message)" }
              exit 1
            }
          }
      - name: C3.3/C3.4 contract QA
        run: node scripts/qa_conape_recruit_c3_3.mjs
      - name: C3.5 private bridge contract QA
        run: node scripts/qa_conape_recruit_bridge_c3_5.mjs
      - name: Diff hygiene
        run: git diff --check origin/feature/conape-portal-parser-c3-1...HEAD
