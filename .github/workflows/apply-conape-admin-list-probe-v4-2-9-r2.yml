name: Apply CONAPE admin list probe V4.2.9 R2

on:
  push:
    branches:
      - feature/conape-admin-list-probe-v4-2-9
    paths:
      - '.github/workflows/apply-conape-admin-list-probe-v4-2-9-r2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply scoped patch
        run: node scripts/patch_conape_admin_list_probe_v4_2_9.mjs
      - name: Fix generated QA syntax only
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='scripts/qa_conape_admin_list_probe_v4_2_9.mjs';
          let src=fs.readFileSync(path,'utf8');
          const bad=`must(app.includes("src/conape_bridge_config_c3_6.js?v=V4.2.9")&&app.includes("src/conape_bridge_client_c3_6.js?v=V3.1.0")&&app.indexOf('conape_bridge_client_c3_6.js')<app.indexOf('admin_master_dashboard.jsx'),'Panel Maestro carga config/cliente antes del dashboard');`;
          const good=`must(app.includes("src/conape_bridge_config_c3_6.js?v=V4.2.9")&&app.includes("src/conape_bridge_client_c3_6.js?v=V3.1.0")&&app.indexOf('conape_bridge_client_c3_6.js')<app.indexOf('admin_master_dashboard.jsx'),'Panel Maestro carga config/cliente antes del dashboard');`;
          if(!src.includes(bad)) throw new Error('QA bad-line preimage missing');
          src=src.replace(bad,good.replace("app.indexOf('admin_master_dashboard.jsx')","app.indexOf('admin_master_dashboard.jsx')"));
          // The original generated line is missing one parenthesis before the message argument.
          src=src.replace(")<app.indexOf('admin_master_dashboard.jsx'),'Panel", ")<app.indexOf('admin_master_dashboard.jsx')),'Panel");
          fs.writeFileSync(path,src,'utf8');
          NODE
      - name: Syntax bridge
        run: node --check services/conape-bridge/server_v2.mjs
      - name: Syntax client
        run: node --check src/conape_bridge_client_c3_6.js
      - name: Syntax QA
        run: node --check scripts/qa_conape_admin_list_probe_v4_2_9.mjs
      - name: Bridge contract QA
        run: node scripts/qa_conape_bridge_v2.mjs
      - name: Admin probe contract QA
        run: node scripts/qa_conape_admin_list_probe_v4_2_9.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Commit canonical changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/conape-bridge/server_v2.mjs src/conape_bridge_client_c3_6.js src/app.jsx src/admin_master_dashboard.jsx campus.html scripts/qa_conape_bridge_v2.mjs scripts/qa_conape_admin_list_probe_v4_2_9.mjs .github/workflows/qa-conape-live-c3-6.yml
          git rm scripts/patch_conape_admin_list_probe_v4_2_9.mjs .github/workflows/apply-conape-admin-list-probe-v4-2-9.yml .github/workflows/apply-conape-admin-list-probe-v4-2-9-r2.yml
          git commit -m "CONAPE V4.2.9 · validación admin CSV vs Rows=All"
          git push origin HEAD:${GITHUB_REF_NAME}
