name: TEMP CONAPE V4.4 source truth migration

on:
  push:
    branches:
      - feature/conape-auto-sync-mirror-v4-4

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: feature/conape-auto-sync-mirror-v4-4
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize canonical V4.4 source once
        shell: bash
        run: |
          set -euo pipefail
          node --check services/conape-bridge/server_v2.mjs
          node --check services/conape-bridge/build_runtime_v4_4.mjs
          node services/conape-bridge/build_runtime_v4_4.mjs
          node --check services/conape-bridge/server_runtime.mjs
          grep -F "const VERSION = 'V4.4.0';" services/conape-bridge/server_runtime.mjs
          mv services/conape-bridge/server_runtime.mjs services/conape-bridge/server_v2.mjs
          rm services/conape-bridge/build_runtime_v4_4.mjs

      - name: Make Docker copy-only
        shell: bash
        run: |
          set -euo pipefail
          cat > services/conape-bridge/Dockerfile <<'EOF'
          FROM mcr.microsoft.com/playwright:v1.55.0-noble

          WORKDIR /app
          ENV NODE_ENV=production \
              PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
              PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
              PORT=8080

          COPY package.json ./
          RUN npm install --omit=dev --no-audit --no-fund
          COPY server_v2.mjs ./
          COPY nav_selftest.mjs ./
          RUN node --check server_v2.mjs
          RUN chown -R pwuser:pwuser /app

          USER pwuser
          CMD ["node", "server_v2.mjs"]
          EOF

      - name: Write direct-source V4.4 QA
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/qa_conape_mirror_v4_4.mjs <<'EOF'
          import fs from 'node:fs';

          const read = p => fs.readFileSync(p, 'utf8');
          const must = (condition, label) => {
            if (!condition) {
              console.error(`FAIL · ${label}`);
              process.exitCode = 1;
            } else console.log(`PASS · ${label}`);
          };

          const source = read('services/conape-bridge/server_v2.mjs');
          const runtime = source;
          const client = read('src/conape_bridge_client_c3_6.js');
          const ventas = read('ventas.html');
          const dashboard = read('src/ventas_dashboard.jsx');
          const apps = read('apps-script-patches/conape_reclutamiento_mirror_v4_4.js');
          const docker = read('services/conape-bridge/Dockerfile');

          const salesStart = runtime.indexOf('async function listProspectStatusesForSales(body) {');
          const salesEnd = runtime.indexOf('\n\nfunction categoryStatus', salesStart);
          const sales = runtime.slice(salesStart, salesEnd);
          const applyStart = apps.indexOf('function conapeMirrorApplySnapshotV44(body) {');
          const applyEnd = apps.indexOf('\n\nfunction conapeMirrorReadForSalesV44', applyStart);
          const apply = applyStart >= 0 && applyEnd > applyStart ? apps.slice(applyStart, applyEnd) : '';
          const route = "else if (action === 'prospects_sales_status') result = await listProspectStatusesForSales(body);";

          must(source.includes("const VERSION = 'V4.4.0';"), 'GitHub source canónico V4.4.0');
          must(!fs.existsSync('services/conape-bridge/build_runtime_v4_4.mjs') && !fs.existsSync('services/conape-bridge/server_runtime.mjs'), 'no existe generador ni runtime derivado');
          must(runtime.includes('function createIsolatedConapeSession()') && runtime.includes('listProspectsFromHome(session = ConapeSession)'), 'cada sync puede usar sesión CONAPE aislada');
          must(runtime.includes(route) && !runtime.includes("prospects_sales_status') result = await serial(() => listProspectStatusesForSales(body))"), 'sales-status no usa cola compartida');
          must(sales.includes("list?.method === 'CSV_DOWNLOAD'") && sales.includes('list?.counts_match === true') && sales.includes('rowsCsv === rowsHtmlAll') && sales.includes('rowsCsv > 0') && sales.includes('rowsHtmlAll > 0'), 'gate CSV vs Rows=All y no vacío');
          must(sales.includes("fn:'conapeMirrorApplySnapshotV44'") && sales.indexOf('validSnapshot') < sales.indexOf("fn:'conapeMirrorApplySnapshotV44'"), 'solo persiste después del gate');
          must(sales.includes("event:'conape_mirror_sync_abort'") && sales.includes('counts_match:false'), 'corrida abortada registra conteos sin PII');
          must(apps.includes("'RETIRADO_DE_LISTA'") && apply.includes('if(!valid) return') && apply.indexOf('if(!valid) return') < apply.indexOf('_conapeV44DetectMovements_(oldMap,newMap)'), 'RETIRADO solo puede calcularse tras snapshot válido');
          must(apps.indexOf('_conapeV44AppendMovements_(events,syncId)') < apps.indexOf('_conapeV44WriteMirror_(newMap,stamp)'), 'movimientos se escriben antes del espejo');
          must(apps.includes("getSheetByName('CONAPE_RECLUTAMIENTO')") && apps.includes('CONAPE_MIRROR_V44_HEADERS'), 'espejo exacto CONAPE_RECLUTAMIENTO');
          must(!/LockService|newTrigger|ScriptApp\.newTrigger|debounce/i.test(apps), 'patch del espejo no introduce locks, triggers ni debounce');
          must(client.includes("const fresh = await salesStatuses('');") && client.includes('installImmediatePostRecruitRefresh'), 'post-reclutamiento refresca en el mismo momento');
          must(ventas.includes('conape_bridge_client_c3_6.js?v=V4.4.0'), 'cache bust cliente V4.4');
          must(dashboard.indexOf('setDash(baseDash);') >= 0 && dashboard.indexOf('setDash(baseDash);') < dashboard.indexOf('await bridge.salesStatuses(scopeAsesor)'), 'tabla base se pinta antes de leer CONAPE');
          must(apps.includes("if(row&&_conapeV44Text_(row.ULTIMO_DESEMBOLSO))return;"), 'Ventas corta visibilidad después del primer desembolso');
          must(!docker.includes('build_runtime_v4_4') && !docker.includes('server_runtime.mjs') && !/mv\s+.*server_v2\.mjs/.test(docker) && docker.includes('COPY server_v2.mjs ./') && docker.includes('RUN node --check server_v2.mjs') && docker.includes('CMD ["node", "server_v2.mjs"]'), 'Docker solo copia/verifica y arranca server_v2 canónico');

          if (process.exitCode) process.exit(process.exitCode);
          console.log('PASS · contrato CONAPE mirror V4.4 directo completo');
          EOF

      - name: Replace CONAPE workflow source-truth gate
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/qa-conape-live-c3-6.yml <<'EOF'
          name: QA CONAPE Live C3.6

          on:
            pull_request:
              paths:
                - 'ventas.html'
                - 'src/ventas_conape_reclutar_c3_3.jsx'
                - 'src/ventas_conape_reclutar_row_c3_5.jsx'
                - 'src/ventas_sortable_table_cs21a20.jsx'
                - 'src/conape_bridge_client_c3_6.js'
                - 'src/conape_bridge_config_c3_6.js'
                - 'src/conape_session_ui_c3_7.js'
                - 'src/conape_compare_ui_c3_7_1.js'
                - 'services/conape-bridge/**'
                - 'apps-script-patches/**'
                - 'scripts/qa_conape_live_c3_6.mjs'
                - 'scripts/qa_conape_bridge_v2.mjs'
                - 'scripts/qa_conape_mirror_v4_4.mjs'
                - 'scripts/prepare_conape_mirror_v4_4_prod.mjs'
                - '.github/workflows/qa-conape-live-c3-6.yml'
            workflow_dispatch:

          jobs:
            qa:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                - name: Canonical source truth · V4.4
                  run: |
                    grep -F "const VERSION = 'V4.4.0';" services/conape-bridge/server_v2.mjs
                    test ! -e services/conape-bridge/build_runtime_v4_4.mjs
                    test ! -e services/conape-bridge/server_runtime.mjs
                    ! grep -E 'build_runtime_v4_4|server_runtime\.mjs|mv .*server_v2\.mjs' services/conape-bridge/Dockerfile
                    grep -F 'COPY server_v2.mjs ./' services/conape-bridge/Dockerfile
                    grep -F 'RUN node --check server_v2.mjs' services/conape-bridge/Dockerfile
                    grep -F 'CMD ["node", "server_v2.mjs"]' services/conape-bridge/Dockerfile
                - name: Node syntax · bridge legacy
                  run: node --check services/conape-bridge/server.mjs
                - name: Node syntax · bridge V4.4 canonical
                  run: node --check services/conape-bridge/server_v2.mjs
                - name: Node syntax · Apps Script mirror patch
                  run: node --check apps-script-patches/conape_reclutamiento_mirror_v4_4.js
                - name: Node syntax · V4.4 production release preparer
                  run: node --check scripts/prepare_conape_mirror_v4_4_prod.mjs
                - name: Node syntax · CONAPE session UI
                  run: node --check src/conape_session_ui_c3_7.js
                - name: Node syntax · CONAPE comparison UI
                  run: node --check src/conape_compare_ui_c3_7_1.js
                - name: Node syntax · QA legacy
                  run: node --check scripts/qa_conape_live_c3_6.mjs
                - name: Node syntax · QA V2
                  run: node --check scripts/qa_conape_bridge_v2.mjs
                - name: Node syntax · QA mirror V4.4
                  run: node --check scripts/qa_conape_mirror_v4_4.mjs
                - name: Bridge preserved-contract gate
                  run: node scripts/qa_conape_bridge_v2.mjs
                - name: Mirror V4.4 contract gate
                  run: node scripts/qa_conape_mirror_v4_4.mjs
                - name: Diff hygiene
                  run: git diff --check origin/main...HEAD
          EOF

      - name: Validate direct source before commit
        shell: bash
        run: |
          set -euo pipefail
          node --check services/conape-bridge/server_v2.mjs
          node --check scripts/qa_conape_mirror_v4_4.mjs
          node scripts/qa_conape_bridge_v2.mjs
          node scripts/qa_conape_mirror_v4_4.mjs
          test ! -e services/conape-bridge/build_runtime_v4_4.mjs
          test ! -e services/conape-bridge/server_runtime.mjs
          ! grep -E 'build_runtime_v4_4|server_runtime\.mjs|mv .*server_v2\.mjs' services/conape-bridge/Dockerfile
          git diff --check

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-conape-v44-source-truth-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(conape): make V4.4 server_v2 canonical source'
          git push origin HEAD:feature/conape-auto-sync-mirror-v4-4

      - name: Clean accidental helper branches
        continue-on-error: true
        shell: bash
        run: |
          git push origin --delete tmp-do-not-use || true
          git push origin --delete feature/conape-auto-sync-mirror-v4-4-migration-probe || true
          git push origin --delete feature/conape-auto-sync-mirror-v4-4-workflow-seed || true
          git push origin --delete feature/conape-auto-sync-mirror-v4-4-finalize-source-truth || true
          git push origin --delete feature/conape-auto-sync-mirror-v4-4-source-truth || true
