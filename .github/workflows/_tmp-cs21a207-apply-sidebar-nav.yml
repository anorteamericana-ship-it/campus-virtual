name: TEMP CS21A207 Apply Sidebar Navigation

on:
  push:
    branches:
      - fix/cs21a207-english-lab-canonical-navigation

permissions:
  contents: write

jobs:
  apply-sidebar-nav:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/cs21a207-english-lab-canonical-navigation
          fetch-depth: 0
      - name: Apply deterministic navigation transform
        run: node scripts/_tmp_apply_cs21a207_sidebar_nav.mjs
      - name: Guard exact product scope
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = 'src/sidebar.jsx'
      - name: Commit transformed sidebar
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sidebar.jsx
          git commit -m 'CS21A207 unifica navegación visible de English LAB'
          git push origin HEAD:fix/cs21a207-english-lab-canonical-navigation
