name: CS21A156 source snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/cs21a156-source-snapshot.yml'
      - 'src/app.jsx'
      - 'src/sidebar.jsx'
      - 'src/resources_panel_cs21a65.jsx'
      - 'src/resources_panel_state_cs21a65.js'
      - 'src/admin_resources_cs21a59.jsx'
      - 'src/admin_resources_runtime_cs21a61.jsx'
      - 'src/admin_resources_direct_cs21a74.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: cs21a156-source-snapshot
          path: |
            src/app.jsx
            src/sidebar.jsx
            src/resources_panel_cs21a65.jsx
            src/resources_panel_state_cs21a65.js
            src/admin_resources_cs21a59.jsx
            src/admin_resources_runtime_cs21a61.jsx
            src/admin_resources_direct_cs21a74.js
          retention-days: 2
