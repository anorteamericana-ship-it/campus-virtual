name: Bootstrap SEC004 Admin Preview Readonly CS21A198C

on:
  push:
    branches:
      - fix/sec004-admin-preview-readonly-cs21a198c
    paths:
      - 'scripts/bootstrap_patch_sec004_admin_preview_readonly_cs21a198c.mjs'
      - '.github/workflows/bootstrap-sec004-admin-preview-readonly-cs21a198c.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify exact base ancestry
        run: git merge-base --is-ancestor 357c85f6ca466570291c3c588d84a3a595313390 HEAD
      - name: Apply exact patch
        run: node scripts/bootstrap_patch_sec004_admin_preview_readonly_cs21a198c.mjs
      - name: Run CS21A198C guard
        run: node scripts/qa_sec004_admin_preview_readonly_cs21a198c.mjs
      - name: Regress CS21A198B
        run: node scripts/qa_sec004_matriculas_preview_readonly_cs21a198b.mjs
      - name: Regress CS21A198
        run: node scripts/qa_sec004_session_demo_isolation_cs21a198.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Remove bootstrap artifacts and push verified candidate
        run: |
          rm scripts/bootstrap_patch_sec004_admin_preview_readonly_cs21a198c.mjs
          rm .github/workflows/bootstrap-sec004-admin-preview-readonly-cs21a198c.yml
          git add -A
          git commit -m 'CS21A198C · make Admin preview read-only'
          git push origin HEAD:fix/sec004-admin-preview-readonly-cs21a198c
