name: TEMP CONAPE V4.2 simple action

on:
  push:
    branches:
      - fix/conape-v4-2-simple-action
    paths:
      - .github/workflows/temp-conape-v4-2-simple-action.yml
      - scripts/temp_patch_conape_v42.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/conape-v4-2-simple-action
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python scripts/temp_patch_conape_v42.py
      - name: Syntax bridge
        run: node --check services/conape-bridge/server_v2.mjs
      - name: Commit patched sources
        run: |
          git config user.name "anorteamericana-ship-it"
          git config user.email "anorteamericana@gmail.com"
          git add services/conape-bridge/server_v2.mjs src/ventas_conape_reclutar_row_c3_5.jsx
          git rm .github/workflows/temp-conape-v4-2-simple-action.yml scripts/temp_patch_conape_v42.py
          git commit -m "CONAPE V4.2 · rutina única crear o actualizar"
          git push origin HEAD:fix/conape-v4-2-simple-action
