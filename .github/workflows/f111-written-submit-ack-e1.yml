name: F111 Written Submit ACK E1
on:
  pull_request:
    paths:
      - src/examenes_modes.jsx
      - src/examenes_bundle.jsx
      - scripts/qa_f111_written_submit_ack_e1.mjs
      - .github/workflows/f111-written-submit-ack-e1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  submit-ack:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/qa_f111_written_submit_ack_e1.mjs
