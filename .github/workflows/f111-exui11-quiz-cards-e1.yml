name: F111 EXUI11 Quiz Cards E1
on:
  pull_request:
    paths:
      - 'src/teacher_views.jsx'
      - 'scripts/qa_f111_exui11_quiz_cards_e1.mjs'
      - '.github/workflows/f111-exui11-quiz-cards-e1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cards:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/qa_f111_exui11_quiz_cards_e1.mjs
