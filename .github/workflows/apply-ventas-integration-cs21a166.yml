name: APPLY Ventas Integration CS21A166 TEMP

on:
  push:
    branches:
      - integration/ventas-modern-candidate-cs21a166

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, 'CS21A166 integrated') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/ventas-modern-candidate-cs21a166
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Merge Prospectos UX CS21A151
        run: git merge --no-ff --no-edit origin/feature/prospectos-ux-cleanup-cs21a151
      - name: Merge Ventas demo isolation CS21A152
        run: git merge --no-ff --no-edit origin/feature/ventas-demo-isolation-cs21a152
      - name: Merge real advisors CS21A153
        run: git merge --no-ff --no-edit origin/feature/ventas-asesores-reales-cs21a153
      - name: Validate combined source invariants
        run: |
          git diff --check origin/main...HEAD -- . ':(exclude)00_DOCUMENTACION/**'
          ! grep -q "design_system_05c.css" ventas.html
          grep -q "ventas_runtime_guard_cs21a152.js" ventas.html
          grep -q "getAsesoresActivos" src/ventas_dashboard.jsx
          grep -q "scopeAsesor" src/ventas_dashboard.jsx
          grep -q "getSessionToken" src/ventas_data.jsx
          grep -q "descargarDocumentoExtraPrivado" src/ventas_data.jsx
          grep -q "descargarMatriculaFirmadaPrivada" src/ventas_data.jsx
          ! grep -q "preview_test" src/ventas_data.jsx
          grep -q "tel:" src/ventas_drawer.jsx
          grep -q "wa.me" src/ventas_drawer.jsx
          grep -q "whatsapp || p.telefono" src/ventas_parts.jsx
      - name: Remove bootstrap and push integration branch
        run: |
          git rm .github/workflows/apply-ventas-integration-cs21a166.yml
          git commit -m "CS21A166 integrated · Prospectos/Ventas modern source candidate"
          git push origin HEAD:integration/ventas-modern-candidate-cs21a166
