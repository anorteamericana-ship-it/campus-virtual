name: Bootstrap Admin Master CONAPE Refresh Truth CS21A195R2

on:
  push:
    branches:
      - fix/admin-master-conape-refresh-truth-cs21a195r2
    paths:
      - 'scripts/bootstrap_patch_admin_master_conape_refresh_truth_cs21a195r2.mjs'
      - '.github/workflows/bootstrap-admin-master-conape-refresh-truth-cs21a195r2.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify exact base ancestry
        run: git merge-base --is-ancestor 6005b74db1a9e796e4943338ae3fa4a84fb8a5fd HEAD
      - name: Apply exact truthful-refresh patch
        run: node scripts/bootstrap_patch_admin_master_conape_refresh_truth_cs21a195r2.mjs
      - name: Run CS21A195R2 guard
        run: node scripts/qa_admin_master_conape_refresh_truth_cs21a195r2.mjs
      - name: Regress CS21A194R2
        run: node scripts/qa_admin_master_conape_safe_errors_cs21a194r2.mjs
      - name: Regress CS21A193
        run: node scripts/qa_admin_academic_private_pdf_cs21a193.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Remove bootstrap artifacts and push verified candidate
        run: |
          rm scripts/bootstrap_patch_admin_master_conape_refresh_truth_cs21a195r2.mjs
          rm .github/workflows/bootstrap-admin-master-conape-refresh-truth-cs21a195r2.yml
          git add -A
          git commit -m 'CS21A195R2 · truthful Master CONAPE refresh'
          git push origin HEAD:fix/admin-master-conape-refresh-truth-cs21a195r2
