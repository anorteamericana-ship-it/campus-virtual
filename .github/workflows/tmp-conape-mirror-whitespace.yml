name: TEMP CONAPE Mirror whitespace cleanup

on:
  push:
    branches:
      - feature/conape-mirror-service-v4-4
    paths:
      - '.github/workflows/tmp-conape-mirror-whitespace.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/conape-mirror-service-v4-4
          fetch-depth: 0
      - name: Normalize new service files only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
            Path('services/conape-mirror-service/Code.gs'),
            Path('services/conape-mirror-service/appsscript.json'),
            Path('services/conape-mirror-service/README.md'),
            Path('services/conape-mirror-service/DEPLOYMENT_CHECKLIST.md'),
            Path('scripts/qa_conape_mirror_service_v4_4.mjs'),
          ]
          for p in files:
            s = p.read_text(encoding='utf-8')
            lines = [line.rstrip(' \t') for line in s.splitlines()]
            while lines and lines[-1] == '':
              lines.pop()
            p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git diff --check origin/main...HEAD -- services/conape-mirror-service scripts/qa_conape_mirror_service_v4_4.mjs || true
      - name: Commit if changed
        run: |
          git config user.name 'anorteamericana-ship-it'
          git config user.email 'anorteamericana@gmail.com'
          git add services/conape-mirror-service scripts/qa_conape_mirror_service_v4_4.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(conape): normalize mirror service whitespace'
          git push origin HEAD:feature/conape-mirror-service-v4-4
