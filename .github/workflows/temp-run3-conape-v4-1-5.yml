name: TEMP Run3 CONAPE V4.1.5
on:
  push:
    branches:
      - fix/conape-form-mode-v4-1-5
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/conape-form-mode-v4-1-5
          fetch-depth: 0
      - name: Patch and QA
        run: |
          set -e
          python scripts/temp_apply_conape_v4_1_5.py
          node --check services/conape-bridge/server_v2.mjs
          node --check scripts/qa_conape_bridge_v2.mjs
          node scripts/qa_conape_bridge_v2.mjs
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/conape-bridge/server_v2.mjs scripts/qa_conape_bridge_v2.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'CONAPE V4.1.5 · modo CREATE UPDATE'
          git push origin HEAD:fix/conape-form-mode-v4-1-5
