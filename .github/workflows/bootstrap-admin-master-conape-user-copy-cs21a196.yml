name: Bootstrap Admin Master CONAPE User Copy CS21A196

on:
  push:
    branches:
      - fix/admin-master-conape-user-copy-cs21a196
    paths:
      - 'scripts/bootstrap_patch_admin_master_conape_user_copy_cs21a196.mjs'
      - '.github/workflows/bootstrap-admin-master-conape-user-copy-cs21a196.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify exact base ancestry
        run: git merge-base --is-ancestor 40312a2d7941c8683ae5068b9bc05139a70e1081 HEAD
      - name: Apply exact copy patch
        run: node scripts/bootstrap_patch_admin_master_conape_user_copy_cs21a196.mjs
      - name: Run CS21A196 guard
        run: node scripts/qa_admin_master_conape_user_copy_cs21a196.mjs
      - name: Regress CS21A195
        run: node scripts/qa_admin_master_conape_safe_errors_cs21a195.mjs
      - name: Regress CS21A194
        run: node scripts/qa_sec002_admin_certificate_cs21a194.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Remove bootstrap artifacts and push verified candidate
        run: |
          rm scripts/bootstrap_patch_admin_master_conape_user_copy_cs21a196.mjs
          rm .github/workflows/bootstrap-admin-master-conape-user-copy-cs21a196.yml
          git add -A
          git commit -m 'CS21A196 · clean Panel Maestro CONAPE user copy'
          git push origin HEAD:fix/admin-master-conape-user-copy-cs21a196