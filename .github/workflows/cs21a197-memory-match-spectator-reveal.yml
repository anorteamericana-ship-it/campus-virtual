name: CS21A197 Memory Match Spectator Reveal QA

on:
  pull_request:
    paths:
      - 'apps_script_patches/99S_MEMORY_MATCH_SPECTATOR_REVEAL_QA_CS21A197.gs'
      - 'scripts/assemble_apps_script_cs21a197_complete.mjs'
      - 'scripts/test_apps_script_cumulative_verifier_cs21a197.mjs'
      - 'scripts/test_memory_match_spectator_reveal_browser_cs21a197.mjs'
      - 'scripts/patch_qa_package_cs21a197.mjs'
      - '00_DOCUMENTACION/ENGLISH_LAB_MEMORY_MATCH_SPECTATOR_REVEAL_CS21A197.md'
      - '.github/workflows/cs21a197-memory-match-spectator-reveal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spectator-reveal-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TEST_MERGE_SHA: ${{ github.sha }}
      SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
      CS21A193_BASE_SHA: c1c28bcd72bbccb9373bdd159eccbb4d6a61bdcc
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assemble and verify CS21A197 backend
        run: |
          set -euo pipefail
          node scripts/assemble_apps_script_cs21a197_complete.mjs
          node scripts/test_apps_script_cumulative_verifier_cs21a197.mjs

      - name: Run accumulated non-browser regressions
        run: |
          set -euo pipefail
          node scripts/test_memory_match_conflict_reconciliation_cs21a196.mjs
          node scripts/test_memory_match_sync_consistency_cs21a192.mjs
          node scripts/test_memory_match_timeout_style_cs21a190.mjs
          node scripts/test_memory_match_classic_sync_cs21a189.mjs
          node scripts/test_english_lab_turn_engine_cs21a176.mjs
          node scripts/test_english_lab_live_sync_cs21a177.mjs
          node scripts/test_english_lab_hangman_engine_cs21a191.mjs
          node scripts/test_english_lab_hangman_contract_cs21a191.mjs
          node scripts/english_lab_memory_match_load_harness_cs21a192.mjs

      - name: Reconstruct exact CS21A193 base in isolated worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add /tmp/cs21a193-base "$CS21A193_BASE_SHA"
          cd /tmp/cs21a193-base
          node scripts/assemble_apps_script_cs21a183_complete.mjs
          node scripts/build_qa_staging_frontend_cs21a148.mjs
          node scripts/audit_qa_staging_frontend_cs21a148.mjs
          node scripts/build_qa_package_cs21a183_apollo_qa.mjs
          node scripts/build_qa_package_cs21a183_apollo_qa.mjs --verify
          node scripts/patch_qa_package_cs21a187.mjs
          node scripts/patch_qa_package_cs21a189.mjs
          node scripts/patch_qa_package_cs21a190.mjs
          node scripts/patch_qa_package_cs21a191.mjs
          node scripts/finalize_qa_package_cs21a191.mjs
          node scripts/patch_qa_package_cs21a191.mjs --verify
          node scripts/patch_qa_package_cs21a192.mjs
          node scripts/patch_qa_package_cs21a192.mjs --verify
          node scripts/patch_qa_package_cs21a193.mjs
          node scripts/patch_qa_package_cs21a193.mjs --verify
          mkdir -p "$GITHUB_WORKSPACE/dist"
          rm -rf "$GITHUB_WORKSPACE/dist/CAMPUS_QA_CS21A193_CANDIDATO_ENGLISH_LAB_CARGA_ESTABLE"
          cp -a dist/CAMPUS_QA_CS21A193_CANDIDATO_ENGLISH_LAB_CARGA_ESTABLE "$GITHUB_WORKSPACE/dist/"

      - name: Patch and verify exact CS21A194 base
        run: |
          set -euo pipefail
          node scripts/patch_qa_package_cs21a194.mjs
          node scripts/patch_qa_package_cs21a194.mjs --verify

      - name: Patch and verify exact CS21A195 base
        run: |
          set -euo pipefail
          node scripts/patch_qa_package_cs21a195.mjs
          node scripts/patch_qa_package_cs21a195.mjs --verify

      - name: Patch and finalize exact CS21A196 base
        run: |
          set -euo pipefail
          node scripts/patch_qa_package_cs21a196.mjs
          node scripts/finalize_qa_package_cs21a196.mjs
          node scripts/finalize_qa_package_cs21a196.mjs --verify

      - name: Patch and verify isolated CS21A197 package
        run: |
          set -euo pipefail
          node scripts/patch_qa_package_cs21a197.mjs
          node scripts/patch_qa_package_cs21a197.mjs --verify

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start exact CS21A197 package server
        shell: bash
        run: |
          set -euo pipefail
          package='dist/CAMPUS_QA_CS21A197_CANDIDATO_MEMORY_MATCH_SPECTATOR_REVEAL'
          PORT=4197 node "$package/serve.mjs" > cs21a197-package-server.log 2>&1 &
          echo $! > cs21a197-package-server.pid
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4197/qa-setup.html >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat cs21a197-package-server.log
          exit 1

      - name: Smoke exact CS21A197 package identity
        run: |
          set -euo pipefail
          base='http://127.0.0.1:4197'
          curl -fsS "$base/VERSION.txt" -o /tmp/version197.txt
          curl -fsS "$base/BACKEND_QA/99_CS21A197_MEMORY_MATCH_SPECTATOR_REVEAL_COMPLETO.gs" -o /tmp/backend197.gs
          grep -q 'VERSION=CS21A197' /tmp/version197.txt
          grep -q 'QA_PORT=4197' /tmp/version197.txt
          grep -q 'BACKEND_LAYER=CS21A197-MM-SPECTATOR-REVEAL-1' /tmp/version197.txt
          grep -q "CS21A197_MM_SPECTATOR_REVEAL_VERSION = 'CS21A197-MM-SPECTATOR-REVEAL-1'" /tmp/backend197.gs
          grep -q 'MISMATCH_REVEAL_MS=8500' /tmp/version197.txt

      - name: Prove second card reaches spectators quickly and stays readable
        env:
          QA_BASE_URL: http://127.0.0.1:4197
        run: node scripts/test_memory_match_spectator_reveal_browser_cs21a197.mjs

      - name: Preserve CS21A196 conflict reconciliation
        env:
          QA_BASE_URL: http://127.0.0.1:4197
        run: node scripts/test_memory_match_conflict_reconciliation_browser_cs21a196.mjs

      - name: Run packaged browser regressions
        env:
          QA_BASE_URL: http://127.0.0.1:4197
        run: |
          set -euo pipefail
          node scripts/test_memory_match_latency_safe_browser_cs21a194.mjs
          node scripts/test_memory_match_authoritative_sync_browser_cs21a192.mjs
          node scripts/test_memory_match_first_reveal_deadline_browser_cs21a192.mjs
          node scripts/test_memory_match_poll_recovery_browser_cs21a192.mjs
          node scripts/test_memory_match_terminal_poll_stop_browser_cs21a192.mjs
          node scripts/test_memory_match_classic_sync_browser_cs21a189.mjs
          node scripts/test_memory_match_timeout_style_browser_cs21a190.mjs
          node scripts/test_english_lab_hangman_package_browser_cs21a191.mjs

      - name: Reverify final package manifest
        run: node scripts/patch_qa_package_cs21a197.mjs --verify

      - name: Zip and hash exact candidate
        run: |
          set -euo pipefail
          cd dist
          package='CAMPUS_QA_CS21A197_CANDIDATO_MEMORY_MATCH_SPECTATOR_REVEAL'
          zip -X -q -r "$package.zip" "$package"
          sha256sum "$package.zip" > "$package.zip.sha256"
          sha256sum -c "$package.zip.sha256"

      - name: Upload directly usable CS21A197 folder
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CAMPUS_QA_CS21A197_CANDIDATO_MEMORY_MATCH_SPECTATOR_REVEAL
          path: dist/CAMPUS_QA_CS21A197_CANDIDATO_MEMORY_MATCH_SPECTATOR_REVEAL/
          if-no-files-found: error
          retention-days: 30

      - name: Upload ZIP hash and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CS21A197_MEMORY_MATCH_SPECTATOR_REVEAL_EVIDENCE
          path: |
            dist/CAMPUS_QA_CS21A197_CANDIDATO_MEMORY_MATCH_SPECTATOR_REVEAL.zip
            dist/CAMPUS_QA_CS21A197_CANDIDATO_MEMORY_MATCH_SPECTATOR_REVEAL.zip.sha256
            qa-output/
            cs21a197-package-server.log
          if-no-files-found: warn
          retention-days: 30
