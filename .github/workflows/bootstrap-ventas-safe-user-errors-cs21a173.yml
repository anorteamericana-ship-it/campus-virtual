name: Bootstrap Ventas Safe User Errors CS21A173

on:
  push:
    branches:
      - 'feature/ventas-safe-user-errors-cs21a173'
    paths:
      - '.github/workflows/bootstrap-ventas-safe-user-errors-cs21a173.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact-preimage source patch
        run: python scripts/apply_ventas_safe_user_errors_cs21a173.py
      - name: Verify patched contract
        run: |
          node --check scripts/qa_ventas_safe_user_errors_cs21a173.mjs
          node scripts/qa_ventas_safe_user_errors_cs21a173.mjs
          git diff --check
      - name: Remove bootstrap files and commit exact patch
        shell: bash
        run: |
          rm .github/workflows/bootstrap-ventas-safe-user-errors-cs21a173.yml
          rm scripts/apply_ventas_safe_user_errors_cs21a173.py
          git config user.name "anorteamericana-ship-it"
          git config user.email "anorteamericana@gmail.com"
          git add src/ventas_drawer.jsx src/ventas_dashboard.jsx .github/workflows/bootstrap-ventas-safe-user-errors-cs21a173.yml scripts/apply_ventas_safe_user_errors_cs21a173.py
          git commit -m "CS21A173 · sanitize Sales errors and remove real demo-group fallback"
          git push origin HEAD:feature/ventas-safe-user-errors-cs21a173
