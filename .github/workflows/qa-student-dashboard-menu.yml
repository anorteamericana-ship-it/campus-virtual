name: Student dashboard and menu navigation
on:
  pull_request:
    paths:
      - 'src/app.jsx'
      - 'src/student_menu_academic_cs21a120.jsx'
      - 'src/student_content_access_cs21a125.jsx'
      - 'src/student_tasks_menu_cs21a126.js'
      - 'scripts/qa_student_dashboard_menu.cjs'
      - '.github/workflows/qa-student-dashboard-menu.yml'
  workflow_dispatch:
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node --check scripts/qa_student_dashboard_menu.cjs
      - run: node scripts/qa_student_dashboard_menu.cjs
        env:
          QA_BROWSER_CHANNEL: chromium
