name: QA Admin Master Safe Errors CS21A195

on:
  push:
    branches:
      - fix/admin-master-safe-errors-cs21a195
  pull_request:
    paths:
      - 'src/admin_master_dashboard.jsx'
      - 'scripts/qa_admin_master_safe_errors_cs21a195.mjs'
      - '.github/workflows/qa-admin-master-safe-errors-cs21a195.yml'

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CS21A195 Panel Maestro safe errors
        run: node scripts/qa_admin_master_safe_errors_cs21a195.mjs
      - name: Regress CS21A194 supervision
        run: node scripts/qa_admin_supervision_safe_errors_cs21a194.mjs
      - name: Regress CS21A193 private documents
        run: node scripts/qa_admin_private_conape_docs_cs21a193.mjs
      - name: Diff hygiene
        run: git diff --check HEAD^
