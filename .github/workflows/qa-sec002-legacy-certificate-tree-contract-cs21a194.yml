name: QA SEC002 Legacy Certificate Tree Contract CS21A194

on:
  push:
    branches:
      - security/sec002-legacy-certificate-tree-contract-cs21a194
    paths:
      - 'security/sec002_legacy_certificate_tree_contract_cs21a194.json'
      - 'scripts/qa_sec002_legacy_certificate_tree_contract_cs21a194.mjs'
      - '.github/workflows/qa-sec002-legacy-certificate-tree-contract-cs21a194.yml'
  pull_request:
    paths:
      - 'security/sec002_legacy_certificate_tree_contract_cs21a194.json'
      - 'scripts/qa_sec002_legacy_certificate_tree_contract_cs21a194.mjs'
      - '.github/workflows/qa-sec002-legacy-certificate-tree-contract-cs21a194.yml'

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard CS21A194
        run: node scripts/qa_sec002_legacy_certificate_tree_contract_cs21a194.mjs
      - name: Regress CS21A193
        run: node scripts/qa_sec002_admin_academic_pdf_delivery_cs21a193.mjs
      - name: Regress CS21A192
        run: node scripts/qa_admin_students_user_copy_cs21a192.mjs
      - name: Diff hygiene
        run: git diff --check origin/security/admin-private-academic-pdf-delivery-cs21a193...HEAD -- ':!00_DOCUMENTACION/**'
