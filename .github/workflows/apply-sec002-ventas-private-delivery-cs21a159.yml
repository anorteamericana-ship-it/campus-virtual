name: APPLY SEC002 Ventas Private Delivery CS21A159 TEMP

on:
  push:
    branches:
      - security/sec002-ventas-private-delivery-cs21a159

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'CS21A159 applied') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/sec002-ventas-private-delivery-cs21a159
          fetch-depth: 0
      - name: Apply modern SEC-002 source port
        run: node scripts/run_sec002_ventas_private_delivery_cs21a159.mjs
      - name: Validate exact source scope
        run: |
          git diff --check
          test "$(git diff --name-only | sort | paste -sd ' ' -)" = "src/ventas_data.jsx src/ventas_drawer.jsx"
          ! grep -q "preview_test\|signedDoc.url\|href={doc.url}\|url: base64\|actualizar el backend QA" src/ventas_data.jsx src/ventas_drawer.jsx
          grep -q "descargarDocumentoExtraPrivado" src/ventas_data.jsx src/ventas_drawer.jsx
          grep -q "descargarMatriculaFirmadaPrivada" src/ventas_data.jsx src/ventas_drawer.jsx
          grep -q "URL.createObjectURL(r.blob)" src/ventas_drawer.jsx
      - name: Commit source and remove bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/.apply_sec002_ventas_private_delivery_cs21a159.fixed.mjs
          git add src/ventas_data.jsx src/ventas_drawer.jsx
          git rm scripts/apply_sec002_ventas_private_delivery_cs21a159.mjs scripts/run_sec002_ventas_private_delivery_cs21a159.mjs .github/workflows/apply-sec002-ventas-private-delivery-cs21a159.yml
          git commit -m "CS21A159 applied · SEC-002 Ventas private delivery source"
          git push origin HEAD:security/sec002-ventas-private-delivery-cs21a159
