name: Bootstrap Admin Secondary Surfaces CS21A198

on:
  push:
    branches:
      - integration/admin-secondary-surfaces-cs21a198
    paths:
      - '.github/workflows/bootstrap-admin-secondary-surfaces-cs21a198.yml'

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify canonical base
        run: git merge-base --is-ancestor cf92c89cc0521634c6ab672f3bcc4fc77afe24ab HEAD
      - name: Fetch and verify source heads
        run: |
          git fetch origin fix/admin-supervision-safe-errors-cs21a194 fix/admin-suspensiones-safe-actions-cs21a196 fix/admin-aperturas-safe-errors-cs21a197
          test "$(git rev-parse origin/fix/admin-supervision-safe-errors-cs21a194)" = "ee1e0a831ccc8f72a434f2208391e576705b9f79"
          test "$(git rev-parse origin/fix/admin-suspensiones-safe-actions-cs21a196)" = "c15f21cb3829871a6ccc2ccb826a518f9a55ddf3"
          test "$(git rev-parse origin/fix/admin-aperturas-safe-errors-cs21a197)" = "e105cda7f87f3f64c9add01b6808877f21c68495"
      - name: Apply exact supervision delta from PR 168
        run: |
          git diff e4cb929501395809deebd2679765cfbe9b99078f ee1e0a831ccc8f72a434f2208391e576705b9f79 -- src/panel_admin_supervision.jsx > /tmp/supervision.patch
          test -s /tmp/supervision.patch
          git apply --check /tmp/supervision.patch
          git apply /tmp/supervision.patch
      - name: Apply exact suspensiones delta from PR 170
        run: |
          git diff d19c23db4b3b2f99fcdbbe6a50fd5e7b8e2138bb c15f21cb3829871a6ccc2ccb826a518f9a55ddf3 -- src/panel_suspensiones.jsx > /tmp/suspensiones.patch
          test -s /tmp/suspensiones.patch
          git apply --check /tmp/suspensiones.patch
          git apply /tmp/suspensiones.patch
      - name: Apply exact aperturas delta from PR 171
        run: |
          git diff c15f21cb3829871a6ccc2ccb826a518f9a55ddf3 e105cda7f87f3f64c9add01b6808877f21c68495 -- src/aperturas_admin_cs21a20.jsx > /tmp/aperturas.patch
          test -s /tmp/aperturas.patch
          git apply --check /tmp/aperturas.patch
          git apply /tmp/aperturas.patch
      - name: Run original PR 168 guard
        run: |
          git show ee1e0a831ccc8f72a434f2208391e576705b9f79:scripts/qa_admin_supervision_safe_errors_cs21a194.mjs > /tmp/qa_supervision.mjs
          node /tmp/qa_supervision.mjs
      - name: Run original PR 170 guard
        run: |
          git show c15f21cb3829871a6ccc2ccb826a518f9a55ddf3:scripts/qa_admin_suspensiones_safe_actions_cs21a196.mjs > /tmp/qa_suspensiones.mjs
          node /tmp/qa_suspensiones.mjs
      - name: Run original PR 171 guard
        run: |
          git show e105cda7f87f3f64c9add01b6808877f21c68495:scripts/qa_admin_aperturas_safe_errors_cs21a197.mjs > /tmp/qa_aperturas.mjs
          node /tmp/qa_aperturas.mjs
      - name: Run CS21A198 integrated guard
        run: node scripts/qa_admin_secondary_surfaces_cs21a198.mjs
      - name: Regress canonical CS21A196 dashboard
        run: node scripts/qa_admin_master_dashboard_safe_errors_cs21a196.mjs
      - name: Regress canonical CS21A195 CONAPE copy
        run: node scripts/qa_admin_master_conape_user_copy_cs21a195.mjs
      - name: Regress canonical CS21A194 CONAPE safe errors
        run: node scripts/qa_admin_master_conape_safe_errors_cs21a194.mjs
      - name: Regress canonical CS21A193 private PDFs
        run: node scripts/qa_admin_private_conape_pdf_delivery_cs21a193.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Remove bootstrap and push verified integration
        run: |
          rm .github/workflows/bootstrap-admin-secondary-surfaces-cs21a198.yml
          git add -A
          git commit -m 'CS21A198 · integrate unique admin safety deltas'
          git push origin HEAD:integration/admin-secondary-surfaces-cs21a198
