name: APPLY SEC001 Password Min6 CS21A164 TEMP

on:
  push:
    branches:
      - security/sec001-password-min6-cs21a164

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'CS21A164 applied') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/sec001-password-min6-cs21a164
          fetch-depth: 0
      - name: Apply exact source patch
        run: node scripts/apply_sec001_password_min6_cs21a164.mjs
      - name: Validate exact scope
        run: |
          git diff --check
          test "$(git diff --name-only)" = "src/inscripcion.jsx"
          grep -q "clave mínima de 6 caracteres" src/inscripcion.jsx
          grep -q "minLength={6}" src/inscripcion.jsx
          grep -q "maxLength={128}" src/inscripcion.jsx
          ! grep -q "clave mínima de 4 caracteres" src/inscripcion.jsx
      - name: Commit source and remove bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/inscripcion.jsx
          git rm scripts/apply_sec001_password_min6_cs21a164.mjs .github/workflows/apply-sec001-password-min6-cs21a164.yml
          git commit -m "CS21A164 applied · inscripción password minimum 6"
          git push origin HEAD:security/sec001-password-min6-cs21a164
