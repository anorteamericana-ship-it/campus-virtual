name: Audit Raw User Error Surface V3 After AL CS21A210AM

on:
  push:
    branches:
      - audit/raw-user-error-surface-v3-after-al-cs21a210am
    paths:
      - 'scripts/audit_raw_user_error_surface_v3_cs21a210s.mjs'
      - '.github/workflows/audit-raw-user-error-surface-v3-after-al-cs21a210am.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan current raw visible-error sinks V3 and persist exact report
        run: node scripts/audit_raw_user_error_surface_v3_cs21a210s.mjs | tee 00_DOCUMENTACION/RAW_USER_ERROR_SURFACE_V3_AFTER_AL_CS21A210AM_REPORT.txt
      - name: Persist audit report on audit branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 00_DOCUMENTACION/RAW_USER_ERROR_SURFACE_V3_AFTER_AL_CS21A210AM_REPORT.txt
          git commit -m 'CS21A210AM persist V3 inventory after AL'
          git push
      - name: Regress CS21A210AL Ventas calendar boundary
        run: node scripts/qa_ventas_calendario_safe_errors_cs21a210al.mjs
      - name: Regress CS21A210AJ enrollment calendar boundary
        run: node scripts/qa_matriculas_calendario_safe_errors_cs21a210aj.mjs
      - name: Regress CS21A210AH BCR importer boundary
        run: node scripts/qa_importador_bcr_safe_errors_cs21a210ah.mjs
      - name: Regress CS21A210AF sidebar boundary
        run: node scripts/qa_sidebar_superadmin_safe_errors_cs21a210af.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Mark audit incomplete while raw sinks remain
        run: node scripts/audit_raw_user_error_surface_v3_cs21a210s.mjs --fail-on-findings
