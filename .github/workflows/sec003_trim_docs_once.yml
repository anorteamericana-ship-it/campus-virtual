name: SEC-003 trim docs once

on:
  push:
    branches:
      - fix/sec003-english-lab-live-auth
    paths:
      - .github/workflows/sec003_trim_docs_once.yml

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SEC-003 branch
        uses: actions/checkout@v4
        with:
          ref: fix/sec003-english-lab-live-auth
          fetch-depth: 0

      - name: Trim trailing whitespace only in SEC-003 docs
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('00_DOCUMENTACION/SEC003_BACKEND_DELTA_PORT_2026-08-16.md'),
              Path('00_DOCUMENTACION/SEC003_ENGLISH_LAB_LIVE_AUTH_2026-08-16.md'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              cleaned = '\n'.join(line.rstrip() for line in text.splitlines()) + ('\n' if text.endswith('\n') else '')
              path.write_text(cleaned, encoding='utf-8')
          PY

      - name: Re-run SEC-003 guards
        run: |
          set -euo pipefail
          node scripts/qa_sec003_backend_delta_portable.mjs
          node scripts/qa_sec003_english_lab_live_frontend.mjs
          git diff --check 49eb9fb8b9286d7de238ba46a0fcf9d07d7d7d8d...HEAD
          git diff --check

      - name: Verify only documentation changed
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 00_DOCUMENTACION/SEC003_BACKEND_DELTA_PORT_2026-08-16.md 00_DOCUMENTACION/SEC003_ENGLISH_LAB_LIVE_AUTH_2026-08-16.md | sort)"
          test "$changed" = "$expected"

      - name: Commit documentation hygiene
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 00_DOCUMENTACION/SEC003_BACKEND_DELTA_PORT_2026-08-16.md 00_DOCUMENTACION/SEC003_ENGLISH_LAB_LIVE_AUTH_2026-08-16.md
          git commit -m "docs: normalize SEC-003 markdown whitespace"
          git push origin HEAD:fix/sec003-english-lab-live-auth
