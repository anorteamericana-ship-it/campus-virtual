name: TEMP Order CONAPE V4.1.5
on:
  push:
    branches:
      - fix/conape-form-mode-v4-1-5
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/conape-form-mode-v4-1-5
          fetch-depth: 0
      - name: Move mode gate before identity matcher
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('services/conape-bridge/server_v2.mjs')
          s=p.read_text()
          pairs=[
            ("  assertIdentityMatch(comparison);\n  enforceRecruitFormMode(modeInfo, comparison, plan);", "  enforceRecruitFormMode(modeInfo, comparison, plan);\n  assertIdentityMatch(comparison);", 1),
            ("    assertIdentityMatch(comparison);\n    enforceRecruitFormMode(modeInfo, comparison, plan);", "    enforceRecruitFormMode(modeInfo, comparison, plan);\n    assertIdentityMatch(comparison);", 2),
          ]
          for old,new,want in pairs:
            got=s.count(old)
            if got != want:
              raise SystemExit(f'expected {want} mode/matcher pairs, found {got}')
            s=s.replace(old,new)
          p.write_text(s)
          PY
          node --check services/conape-bridge/server_v2.mjs
          node scripts/qa_conape_bridge_v2.mjs
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/conape-bridge/server_v2.mjs
          git commit -m 'CONAPE V4.1.5 · priorizar modo UPDATE en lookup'
          git push origin HEAD:fix/conape-form-mode-v4-1-5
