name: Bootstrap Admin Aperturas Safe Errors CS21A197

on:
  push:
    branches:
      - fix/admin-aperturas-safe-errors-cs21a197
    paths:
      - 'scripts/bootstrap_patch_admin_aperturas_safe_errors_cs21a197.mjs'
      - '.github/workflows/bootstrap-admin-aperturas-safe-errors-cs21a197.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify exact base ancestry
        run: git merge-base --is-ancestor c15f21cb3829871a6ccc2ccb826a518f9a55ddf3 HEAD
      - name: Apply exact Aperturas patch
        run: node scripts/bootstrap_patch_admin_aperturas_safe_errors_cs21a197.mjs
      - name: Run CS21A197 guard
        run: node scripts/qa_admin_aperturas_safe_errors_cs21a197.mjs
      - name: Regress CS21A196
        run: node scripts/qa_admin_suspensiones_safe_actions_cs21a196.mjs
      - name: Regress CS21A195
        run: node scripts/qa_admin_master_safe_errors_cs21a195.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Remove bootstrap artifacts and push verified candidate
        run: |
          rm scripts/bootstrap_patch_admin_aperturas_safe_errors_cs21a197.mjs
          rm .github/workflows/bootstrap-admin-aperturas-safe-errors-cs21a197.yml
          git add -A
          git commit -m 'CS21A197 · safe admin Aperturas errors'
          git push origin HEAD:fix/admin-aperturas-safe-errors-cs21a197
