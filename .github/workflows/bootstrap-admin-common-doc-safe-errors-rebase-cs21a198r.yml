name: Bootstrap Admin Common Doc Safe Errors Rebase CS21A198R

on:
  push:
    branches:
      - fix/admin-common-doc-safe-errors-rebase-cs21a198r
    paths:
      - 'scripts/bootstrap_patch_admin_common_doc_safe_errors_rebase_cs21a198r.mjs'
      - '.github/workflows/bootstrap-admin-common-doc-safe-errors-rebase-cs21a198r.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify exact base ancestry
        run: git merge-base --is-ancestor 428590a06b3a0244d76703160f84f92085645d51 HEAD
      - name: Syntax check patcher
        run: node --check scripts/bootstrap_patch_admin_common_doc_safe_errors_rebase_cs21a198r.mjs
      - name: Apply exact patch
        run: node scripts/bootstrap_patch_admin_common_doc_safe_errors_rebase_cs21a198r.mjs
      - name: Run CS21A198R guard
        run: node scripts/qa_admin_common_doc_safe_errors_rebase_cs21a198r.mjs
      - name: Regress CS21A197R
        run: node scripts/qa_sec002_admin_certificate_private_rebase_cs21a197r.mjs
      - name: Regress CS21A196R
        run: node scripts/qa_sec002_proforma_acl_rebase_cs21a196.mjs
      - name: Regress CS21A193
        run: node scripts/qa_sec002_admin_academic_docs_private_cs21a193.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Remove bootstrap artifacts and push verified candidate
        run: |
          rm scripts/bootstrap_patch_admin_common_doc_safe_errors_rebase_cs21a198r.mjs
          rm .github/workflows/bootstrap-admin-common-doc-safe-errors-rebase-cs21a198r.yml
          git add -A
          git commit -m 'CS21A198R · rebase safe common document errors'
          git push origin HEAD:fix/admin-common-doc-safe-errors-rebase-cs21a198r
