name: F111 R56 - lista docente CA APR RI
on:
  pull_request:
    paths:
      - 'src/teacher_views.jsx'
      - 'src/app.jsx'
      - 'src/att77_bridge.js'
      - 'tests/qa_f111_r56_teacher_roster_ui.cjs'
      - 'scripts/qa_f111_closed_attendance_ui.mjs'
      - '.github/workflows/qa-f111-r56-teacher-ui.yml'
permissions:
  contents: read
jobs:
  teacher:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tests/qa_f111_r56_teacher_roster_ui.cjs
      - name: Closed attendance editor — new contract only
        run: node scripts/qa_f111_closed_attendance_ui.mjs
