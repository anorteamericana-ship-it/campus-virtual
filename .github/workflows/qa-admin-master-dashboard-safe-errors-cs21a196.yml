      - 'scripts/qa_admin_master_dashboard_safe_errors_cs21a196.mjs'
      - '.github/workflows/qa-admin-master-dashboard-safe-errors-cs21a196.yml'

jobs:
  qa:
    runs-on: ubuntu-latest
