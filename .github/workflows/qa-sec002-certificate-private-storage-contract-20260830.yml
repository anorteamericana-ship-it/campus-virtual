name: QA SEC002 Certificate Private Storage Contract

on:
  pull_request:
    paths:
      - 'security/sec002_certificate_private_storage_contract_20260830.json'
      - 'scripts/qa_sec002_certificate_private_storage_contract_20260830.mjs'
      - '.github/workflows/qa-sec002-certificate-private-storage-contract-20260830.yml'
  push:
    branches:
      - security/sec002-certificate-private-storage-contract-20260830

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Certificate private storage contract guard
        run: node scripts/qa_sec002_certificate_private_storage_contract_20260830.mjs
      - name: Regress Admin common docs safe errors
        run: node scripts/qa_admin_common_doc_safe_errors_20260830.mjs
      - name: Regress Admin certificate private source
        run: node scripts/qa_sec002_admin_certificate_private_source_20260830.mjs
      - name: Regress Admin private academic docs
        run: node scripts/qa_sec002_admin_private_academic_docs_cs21a193.mjs
      - name: Diff hygiene
        run: git diff --check
