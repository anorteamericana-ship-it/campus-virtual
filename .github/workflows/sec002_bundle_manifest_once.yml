name: SEC002 private delivery bundle one-shot

on:
  push:
    branches:
      - fix/sec002-private-document-foundation
    paths:
      - .github/workflows/sec002_bundle_manifest_once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sec002-private-document-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify accumulated SEC-002 source contracts
        run: |
          node scripts/qa_sec002_private_certificate_delta_portable.mjs
          node scripts/qa_sec002_student_private_cert.mjs
          node scripts/qa_sec002_ventas_docs_extra_contract.mjs
          node scripts/qa_sec002_ventas_extra_private_delta.mjs
          node scripts/qa_sec002_ventas_extra_private_frontend.mjs
          node scripts/qa_sec002_payment_receipt_private_delta.mjs
          node scripts/qa_sec002_payment_receipt_frontend.mjs
          node scripts/qa_sec002_private_delivery_bundle_manifest.mjs
          python -m py_compile scripts/build_sec002_private_delivery_bundle.py
          git diff --check HEAD~1 HEAD
