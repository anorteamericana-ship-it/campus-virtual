name: Bootstrap SEC004 Session Demo Isolation CS21A198

on:
  push:
    branches:
      - fix/sec004-real-session-demo-isolation-cs21a198
    paths:
      - 'scripts/bootstrap_patch_sec004_session_demo_isolation_cs21a198.mjs'
      - '.github/workflows/bootstrap-sec004-session-demo-isolation-cs21a198.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify exact base ancestry
        run: git merge-base --is-ancestor 196c5376827a3c70273d7e0bf92ab95b882d9de9 HEAD
      - name: Apply exact patch
        run: node scripts/bootstrap_patch_sec004_session_demo_isolation_cs21a198.mjs
      - name: Run CS21A198 guard
        run: node scripts/qa_sec004_session_demo_isolation_cs21a198.mjs
      - name: Regress CS21A197
        run: node scripts/qa_lazy_loader_safe_user_errors_cs21a197.mjs
      - name: Regress CS21A196
        run: node scripts/qa_admin_master_conape_user_copy_cs21a196.mjs
      - name: Regress SEC004 outer guard
        run: node scripts/qa_sec004_demo_outer_guard_cs21a163.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Remove bootstrap artifacts and push verified candidate
        run: |
          rm scripts/bootstrap_patch_sec004_session_demo_isolation_cs21a198.mjs
          rm .github/workflows/bootstrap-sec004-session-demo-isolation-cs21a198.yml
          git add -A
          git commit -m 'CS21A198 · isolate real sessions from local demo store'
          git push origin HEAD:fix/sec004-real-session-demo-isolation-cs21a198

