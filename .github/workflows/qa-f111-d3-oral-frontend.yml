name: F111 D3 - oral frontend level and rubric guard
on:
  push:
    branches:
      - fix/f111-d3-keylor-oral-rubric-level-bank-20261018
    paths:
      - 'modulos/examen_oral.html'
      - 'scripts/qa_f111_d3_oral_frontend_level_guard.mjs'
      - '.github/workflows/qa-f111-d3-oral-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'modulos/examen_oral.html'
      - 'scripts/qa_f111_d3_oral_frontend_level_guard.mjs'
      - '.github/workflows/qa-f111-d3-oral-frontend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oral_ui_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simular nivel B2 y rúbrica vacía sin navegador
        run: node scripts/qa_f111_d3_oral_frontend_level_guard.mjs
