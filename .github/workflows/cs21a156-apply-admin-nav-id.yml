name: CS21A156 apply admin nav ids

on:
  pull_request:
    paths:
      - '.github/workflows/cs21a156-apply-admin-nav-id.yml'
      - '.github/patches/cs21a156-admin-nav-id.patch.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-admin-nav-ids:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply exact patch and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/patches/cs21a156-admin-nav-id.patch.b64 > /tmp/cs21a156-admin-nav-id.patch
          git apply --check /tmp/cs21a156-admin-nav-id.patch
          git apply /tmp/cs21a156-admin-nav-id.patch
          git rm .github/patches/cs21a156-admin-nav-id.patch.b64
          git rm .github/workflows/cs21a156-apply-admin-nav-id.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sidebar.jsx
          git commit -m 'CS21A156 publica IDs estables en navegación admin'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
