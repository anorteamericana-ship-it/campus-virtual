name: Bootstrap Admin Suspensiones Safe Actions CS21A196

on:
  push:
    branches:
      - fix/admin-suspensiones-safe-actions-cs21a196
    paths:
      - 'scripts/bootstrap_patch_admin_suspensiones_safe_actions_cs21a196.mjs'
      - '.github/workflows/bootstrap-admin-suspensiones-safe-actions-cs21a196.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify exact base ancestry
        run: git merge-base --is-ancestor d19c23db4b3b2f99fcdbbe6a50fd5e7b8e2138bb HEAD
      - name: Apply exact suspensiones patch
        run: node scripts/bootstrap_patch_admin_suspensiones_safe_actions_cs21a196.mjs
      - name: Run CS21A196 guard
        run: node scripts/qa_admin_suspensiones_safe_actions_cs21a196.mjs
      - name: Regress CS21A195
        run: node scripts/qa_admin_master_safe_errors_cs21a195.mjs
      - name: Regress CS21A194
        run: node scripts/qa_admin_supervision_safe_errors_cs21a194.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Remove bootstrap artifacts and push verified candidate
        run: |
          rm scripts/bootstrap_patch_admin_suspensiones_safe_actions_cs21a196.mjs
          rm .github/workflows/bootstrap-admin-suspensiones-safe-actions-cs21a196.yml
          git add -A
          git commit -m 'CS21A196 · safe admin suspension actions'
          git push origin HEAD:fix/admin-suspensiones-safe-actions-cs21a196
