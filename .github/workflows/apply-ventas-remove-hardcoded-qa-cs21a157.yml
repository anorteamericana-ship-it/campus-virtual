name: APPLY Ventas QA Cleanup CS21A157 TEMP

on:
  push:
    branches:
      - feature/ventas-remove-hardcoded-qa-cs21a157

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'CS21A157 applied') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ventas-remove-hardcoded-qa-cs21a157
          fetch-depth: 0
      - name: Apply exact source cleanup
        run: node scripts/apply_ventas_remove_hardcoded_qa_cs21a157.mjs
      - name: Validate exact scope
        run: |
          git diff --check
          test "$(git diff --name-only)" = "src/ventas_drawer.jsx"
          ! grep -q "120180140\|previewMatriculaCR\|cedulaPreviewMatricula\|preview_test:\|CERT_MATRICULA_.*_TEST\|Modo prueba controlado" src/ventas_drawer.jsx
          grep -q "const puedeSubirFirmada = !!codigo;" src/ventas_drawer.jsx
          grep -q "d.whatsapp || d.WHATSAPP || d.telefono" src/ventas_drawer.jsx
      - name: Commit source and remove bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ventas_drawer.jsx
          git rm scripts/apply_ventas_remove_hardcoded_qa_cs21a157.mjs .github/workflows/apply-ventas-remove-hardcoded-qa-cs21a157.yml
          git commit -m "CS21A157 applied · remove hardcoded Ventas QA identity"
          git push origin HEAD:feature/ventas-remove-hardcoded-qa-cs21a157
