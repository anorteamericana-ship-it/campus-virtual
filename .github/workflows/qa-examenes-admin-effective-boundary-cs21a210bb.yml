name: QA Examenes Admin Effective Boundary CS21A210BB
on:
  push:
    branches: [audit/examenes-admin-effective-boundary-cs21a210bb]
  pull_request:
    paths:
      - 'src/examenes_modes.jsx'
      - 'src/examenes_bundle.jsx'
      - 'scripts/qa_examenes_admin_effective_boundary_cs21a210bb.mjs'
      - '.github/workflows/qa-examenes-admin-effective-boundary-cs21a210bb.yml'
permissions:
  contents: read
jobs:
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: npm install --no-save @babel/parser@7.28.4
      - name: Parse JSX
        run: node -e "const fs=require('fs'),p=require('@babel/parser');for(const f of ['src/examenes_modes.jsx','src/examenes_bundle.jsx'])p.parse(fs.readFileSync(f,'utf8'),{sourceType:'script',plugins:['jsx']});"
      - name: Audit effective admin boundary
        run: node scripts/qa_examenes_admin_effective_boundary_cs21a210bb.mjs
      - name: Regress BA teacher boundary
        run: node scripts/qa_examenes_teacher_safe_errors_cs21a210ba.mjs
      - name: Regress AY StudentMode
        run: node scripts/qa_examenes_student_safe_errors_cs21a210ay.mjs
      - name: Verify V3 remains non-regressed
        run: |
          set -o pipefail
          node scripts/audit_raw_user_error_surface_v3_cs21a210s.mjs | tee /tmp/v3-bb.txt
          grep -Fq 'DIRECT_RAW_SINK_FINDINGS=30' /tmp/v3-bb.txt
          grep -Fq 'FILES_WITH_FINDINGS=12' /tmp/v3-bb.txt
      - name: Diff hygiene
        run: git diff --check eb397cff1a72c98c39c28479ee973e2e038e999e
