name: Validate campus responsive frontend

on:
  push:
    branches: [main]
    paths:
      - 'src/student_menu_academic_cs21a120.jsx'
      - 'src/student_menu_academic_guard_cs21a120.js'
      - 'src/student_content_access_cs21a125.jsx'
      - 'src/student_planeamiento_pdf_catalog_cs21a129.js'
      - 'src/student_books_proxy_cs21a126.jsx'
      - 'src/student_tasks_menu_cs21a126.js'
      - 'src/student_calendar_cleanup_cs21a126.js'
      - 'src/program_info_shared_cs21a119.jsx'
      - 'styles/student_menu_academic_cs21a120.css'
      - 'styles/student_content_access_cs21a125.css'
      - 'styles/student_planeamiento_pdfs_cs21a129.css'
      - 'styles/student_books_audios_cs21a126.css'
      - 'styles/student_tasks_menu_cs21a126.css'
      - 'styles/mobile_responsive_global_cs21a121.css'
      - 'campus.html'
      - '.github/workflows/validate-cs21a120.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/student_menu_academic_cs21a120.jsx'
      - 'src/student_menu_academic_guard_cs21a120.js'
      - 'src/student_content_access_cs21a125.jsx'
      - 'src/student_planeamiento_pdf_catalog_cs21a129.js'
      - 'src/student_books_proxy_cs21a126.jsx'
      - 'src/student_tasks_menu_cs21a126.js'
      - 'src/student_calendar_cleanup_cs21a126.js'
      - 'src/program_info_shared_cs21a119.jsx'
      - 'styles/student_menu_academic_cs21a120.css'
      - 'styles/student_content_access_cs21a125.css'
      - 'styles/student_planeamiento_pdfs_cs21a129.css'
      - 'styles/student_books_audios_cs21a126.css'
      - 'styles/student_tasks_menu_cs21a126.css'
      - 'styles/mobile_responsive_global_cs21a121.css'
      - 'campus.html'
      - '00_DOCUMENTACION/QA_CS21A121_TRIGGER.md'
      - '00_DOCUMENTACION/QA_CS21A130_PLANEAMIENTO_ESTUDIANTE.md'
      - '.github/workflows/validate-cs21a120.yml'
  workflow_dispatch:

jobs:
  validate-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install parser
        run: npm install --no-save --ignore-scripts @babel/parser@7.28.4
      - name: Parse JSX files
        run: |
          node <<'NODE'
          const fs = require('fs');
          const parser = require('@babel/parser');
          const files = [
            'src/student_menu_academic_cs21a120.jsx',
            'src/student_content_access_cs21a125.jsx',
            'src/student_books_proxy_cs21a126.jsx',
            'src/program_info_shared_cs21a119.jsx',
          ];
          for (const path of files) {
            const source = fs.readFileSync(path, 'utf8');
            parser.parse(source, {
              sourceType: 'script',
              plugins: ['jsx', 'optionalChaining', 'nullishCoalescingOperator'],
            });
            console.log(`OK: ${path} (${source.split('\n').length} lines)`);
          }
          NODE
      - name: Check JavaScript files
        run: |
          node --check src/student_tasks_menu_cs21a126.js
          node --check src/student_calendar_cleanup_cs21a126.js
          node --check src/student_menu_academic_guard_cs21a120.js
          node --check src/student_planeamiento_pdf_catalog_cs21a129.js
      - name: Verify student academic contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const read = path => fs.readFileSync(path, 'utf8');
          const proxy = read('src/student_books_proxy_cs21a126.jsx');
          const viewer = read('src/book_unit_starts_cs21a60.jsx');
          const tasks = read('src/student_tasks_menu_cs21a126.js');
          const calendar = read('src/student_calendar_cleanup_cs21a126.js');
          const access = read('src/student_content_access_cs21a125.jsx');
          const booksCss = read('styles/student_books_audios_cs21a126.css');
          const lessonCss = read('styles/student_planeamiento_pdfs_cs21a129.css');
          const lessonCatalogSource = read('src/student_planeamiento_pdf_catalog_cs21a129.js');
          const teacherPlanningSource = read('src/teacher_cs21a_planeamiento_grouped.jsx');
          const guard = read('src/student_menu_academic_guard_cs21a120.js');

          function extractObject(source, name) {
            const re = new RegExp(`const\\s+${name}\\s*=\\s*(\\{[\\s\\S]*?\\});`);
            const match = source.match(re);
            if (!match) throw new Error(`No se pudo extraer ${name}.`);
            return Function(`"use strict";return (${match[1]});`)();
          }

          const studentLessons = extractObject(lessonCatalogSource, 'catalog');
          const sourceFolders = extractObject(lessonCatalogSource, 'SOURCE_FOLDERS');
          const teacherLessons = extractObject(teacherPlanningSource, 'LESSON_IDS');
          const levels = ['B1','B2','I1','I2'];
          const expectedSources = {
            B1:'118O9a1OBGCvFGvAdTrn4lGyAVaG8-O44',
            B2:'1IEt6WOF_xSGVHaK8RObzF0mceI1BP2pw',
            I1:'169I-9wE9zZIt0D44CUP3CM4t2-_-OhUx',
            I2:'1Gw-AsqncJ7iPUAL17cQLqkvvgbYgJT3M',
          };
          const studentIds = levels.flatMap(level => studentLessons[level] || []);
          const teacherIds = new Set(levels.flatMap(level => teacherLessons[level] || []));

          const checks = [
            [proxy.includes('data-student-book-types="SB,WB"'), 'El proxy declara únicamente SB y WB.'],
            [!/(?:^|[,\s{])TB\s*:/.test(proxy), 'El proxy estudiantil no publica archivos TB.'],
            [proxy.includes('Abrir PDF') && proxy.includes('Descargar PDF'), 'Los botones PDF de libros están etiquetados explícitamente.'],
            [viewer.includes("studentMode ? ['SB', 'WB']"), 'El visor compartido restringe el modo estudiante a SB/WB.'],
            [tasks.includes("evaluations.insertAdjacentElement('afterend',button)"), 'Tareas se inserta inmediatamente después de Evaluaciones.'],
            [calendar.includes('if(tabs)tabs.remove()'), 'Calendario académico elimina las pestañas heredadas.'],
            [access.includes("['CA','APR','CNV']") && access.includes('LEVELS.slice(0,i+1)'), 'El fallback conserva acceso acumulativo CA/APR/CNV.'],
            [booksCss.includes('min-width:0!important;width:100%!important'), 'El libro abierto cabe completo en móvil.'],
            [access.includes('__AN_STUDENT_PLANEAMIENTO_PDFS_CS21A129__'), 'Planeamiento consume el catálogo de PDFs estudiantil.'],
            [access.includes('data-lesson-count') && access.includes('Abrir PDF') && access.includes('Descargar PDF'), 'Planeamiento ofrece selector, apertura y descarga del PDF.'],
            [lessonCss.includes('grid-template-columns:repeat(16,minmax(0,1fr))'), 'La botonera de escritorio tiene 16 columnas: dos filas para 32 lecciones.'],
            [lessonCss.includes('repeat(8,minmax(0,1fr))') && lessonCss.includes('repeat(4,minmax(0,1fr))'), 'La botonera se adapta en tableta y móvil.'],
            [guard.indexOf('student_planeamiento_pdf_catalog_cs21a129.js') < guard.indexOf('student_content_access_cs21a125.jsx'), 'El catálogo carga antes que la vista estudiantil.'],
            [guard.includes('student_planeamiento_pdf_catalog_cs21a129.js?v=F98.4Z6CS21A130'), 'El guard invalida la caché del catálogo corregido.'],
            [studentIds.length === 128 && new Set(studentIds).size === 128, 'El catálogo estudiantil contiene 128 PDFs únicos.'],
            [studentIds.every(id => !teacherIds.has(id)), 'Ningún PDF estudiantil pertenece al catálogo docente.'],
            [!studentIds.includes('1r3PFPc9WlTwN4AWc1JmaIztvaHcpAB4_'), 'El PDF combinado de I2 no sustituye las 32 lecciones individuales.'],
          ];

          for (const level of levels) {
            checks.push([Array.isArray(studentLessons[level]) && studentLessons[level].length === 32, `${level} publica exactamente 32 PDFs.`]);
            checks.push([new Set(studentLessons[level]).size === 32, `${level} no contiene PDFs duplicados.`]);
            checks.push([sourceFolders[level] === expectedSources[level], `${level} conserva la carpeta estudiantil verificada.`]);
          }

          for (const [ok, message] of checks) {
            if (!ok) throw new Error(message);
            console.log('OK:', message);
          }
          NODE
      - name: Verify published resources
        run: |
          grep -q 'mobile_responsive_global_cs21a121.css?v=F98.4Z6CS21A121' campus.html
          grep -q 'program_info_shared_cs21a119.jsx?v=F98.4Z6CS21A121' campus.html
          grep -q 'student_menu_academic_guard_cs21a120.js?v=F98.4Z6CS21A130' campus.html
          test -f src/student_planeamiento_pdf_catalog_cs21a129.js
          test -f styles/student_planeamiento_pdfs_cs21a129.css
          test -f styles/student_content_access_cs21a125.css
          test -f styles/student_books_audios_cs21a126.css
          test -f styles/student_tasks_menu_cs21a126.css
