name: QA Admin Academic Private PDF CS21A193

on:
  push:
    branches:
      - security/admin-academic-private-pdf-cs21a193
  pull_request:
    paths:
      - 'src/admin_students.jsx'
      - 'scripts/qa_admin_academic_private_pdf_cs21a193.mjs'
      - '.github/workflows/qa-admin-academic-private-pdf-cs21a193.yml'

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run CS21A193 private PDF guard
        run: node scripts/qa_admin_academic_private_pdf_cs21a193.mjs
      - name: Regress CS21A192
        run: node scripts/qa_admin_students_user_copy_cs21a192.mjs
      - name: Regress CS21A191
        run: node scripts/qa_admin_students_safe_errors_cs21a191.mjs
      - name: Diff hygiene
        run: git diff --check
