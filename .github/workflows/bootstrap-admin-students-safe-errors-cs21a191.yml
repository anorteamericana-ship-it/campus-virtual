name: Bootstrap Admin Students Safe Errors CS21A191

on:
  push:
    branches:
      - fix/admin-students-safe-errors-cs21a191
    paths:
      - 'scripts/bootstrap_patch_admin_students_safe_errors_cs21a191.mjs'
      - 'scripts/bootstrap_patch_admin_students_safe_errors_cs21a191_v2.mjs'
      - 'scripts/bootstrap_patch_admin_students_safe_errors_cs21a191_v3.mjs'
      - '.github/workflows/bootstrap-admin-students-safe-errors-cs21a191.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify exact base ancestry
        run: git merge-base --is-ancestor ea4d6d4fc8ecde93e04dc129d1f7c1458188a9bf HEAD
      - name: Apply exact patch
        run: node scripts/bootstrap_patch_admin_students_safe_errors_cs21a191_v3.mjs
      - name: Run CS21A191 guard
        run: node scripts/qa_admin_students_safe_errors_cs21a191.mjs
      - name: Regress CS21A190
        run: node scripts/qa_admin_conape_user_copy_cs21a190.mjs
      - name: Regress CS21A189
        run: node scripts/qa_admin_quick_update_safe_errors_cs21a189.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Remove bootstrap artifacts and push verified candidate
        run: |
          rm scripts/bootstrap_patch_admin_students_safe_errors_cs21a191.mjs
          rm scripts/bootstrap_patch_admin_students_safe_errors_cs21a191_v2.mjs
          rm scripts/bootstrap_patch_admin_students_safe_errors_cs21a191_v3.mjs
          rm .github/workflows/bootstrap-admin-students-safe-errors-cs21a191.yml
          git add -A
          git commit -m 'CS21A191 · safe admin students errors'
          git push origin HEAD:fix/admin-students-safe-errors-cs21a191
