name: Bootstrap Admin Additional Resources Route CS21A200D

on:
  push:
    branches:
      - fix/admin-additional-resources-route-cs21a200d
    paths:
      - 'scripts/bootstrap_patch_admin_additional_resources_route_cs21a200d.mjs'
      - '.github/workflows/bootstrap-admin-additional-resources-route-cs21a200d.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify exact base ancestry
        run: git merge-base --is-ancestor 1f15cf76188a838269bd136d5284d0b7d92f4d6d HEAD
      - name: Apply exact patch
        run: node scripts/bootstrap_patch_admin_additional_resources_route_cs21a200d.mjs
      - name: Run CS21A200D guard
        run: node scripts/qa_admin_additional_resources_route_cs21a200d.mjs
      - name: Regress CS21A200C
        run: node scripts/qa_cronograma_safe_errors_cs21a200c.mjs
      - name: Regress CS21A200B
        run: node scripts/qa_admin_resources_safe_errors_cs21a200b.mjs
      - name: Regress CS21A200A
        run: node scripts/qa_admin_security_consolidated_cs21a200a.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Remove bootstrap artifacts and push verified candidate
        run: |
          rm scripts/bootstrap_patch_admin_additional_resources_route_cs21a200d.mjs
          rm .github/workflows/bootstrap-admin-additional-resources-route-cs21a200d.yml
          git add -A
          git commit -m 'CS21A200D · route admin additional resources correctly'
          git push origin HEAD:fix/admin-additional-resources-route-cs21a200d
