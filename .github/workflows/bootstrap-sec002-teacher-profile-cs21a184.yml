name: Bootstrap SEC002 Teacher Profile CS21A184

on:
  push:
    branches:
      - security/sec002-teacher-profile-source-cs21a184
    paths:
      - '.github/workflows/bootstrap-sec002-teacher-profile-cs21a184.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Verify exact base ancestry
        run: git merge-base --is-ancestor 52fe37c9692b72a604787e6f2608bc662c4cb3c7 HEAD
      - name: Apply exact teacher-profile patch
        run: node scripts/bootstrap_apply_teacher_profile_safe_errors_cs21a184.mjs
      - name: Run CS21A184 guard
        run: node scripts/qa_sec002_teacher_profile_source_cs21a184.mjs
      - name: Regress student private-doc safe errors
        run: node scripts/qa_student_private_doc_safe_errors_cs21a183.mjs
      - name: Regress integrated private chain
        run: node scripts/qa_sec002_private_student_admin_chain_cs21a181.mjs
      - name: Diff hygiene vs CS21A183
        run: git diff --check 52fe37c9692b72a604787e6f2608bc662c4cb3c7...HEAD -- . ':(exclude)00_DOCUMENTACION/**'
      - name: Remove bootstrap artifacts and push verified candidate
        run: |
          git rm .github/workflows/bootstrap-sec002-teacher-profile-cs21a184.yml
          git rm scripts/bootstrap_apply_teacher_profile_safe_errors_cs21a184.mjs
          git add -A
          git commit -m "CS21A184 · safe teacher-profile errors and private-delivery contract"
          git push origin HEAD:security/sec002-teacher-profile-source-cs21a184
