name: SEC001 OIDC helpers one-shot

on:
  push:
    branches:
      - fix/sec001-auth-policy-foundation
    paths:
      - .github/workflows/sec001_oidc_helpers_once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sec001-auth-policy-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run SEC-001 OIDC helper gates
        run: |
          node scripts/qa_sec001_password_policy.mjs
          node scripts/qa_sec001_auth0_poc_contract.mjs
          node scripts/qa_sec001_auth_provider_adapter.mjs
          node scripts/qa_sec001_oidc_bridge_contract.mjs
          node scripts/qa_sec001_identity_mapping.mjs
          node scripts/qa_sec001_oidc_provider_mapping_helpers.mjs
          cp qa/sec001_oidc_provider_mapping_helpers.gs /tmp/sec001_oidc_provider_mapping_helpers.js
          node --check /tmp/sec001_oidc_provider_mapping_helpers.js
          git diff --check HEAD~1 HEAD
