name: Patch CONAPE contact write V4.1.2
on:
  push:
    branches:
      - fix/conape-contact-write-v4-1-2
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/conape-contact-write-v4-1-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact patch and QA
        shell: bash
        run: |
          python3 .github/patch-conape-contact-v4-1-2.py
          node --check services/conape-bridge/server_v2.mjs
          node scripts/qa_conape_bridge_v2.mjs
          rm .github/patch-conape-contact-v4-1-2.py
          rm .github/workflows/patch-conape-contact-v4-1-2.yml
      - name: Commit clean diff
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/conape-bridge/server_v2.mjs scripts/qa_conape_bridge_v2.mjs .github/patch-conape-contact-v4-1-2.py .github/workflows/patch-conape-contact-v4-1-2.yml
          git commit -m 'fix: escribir y verificar contactos APEX antes de CREATE'
          git push origin HEAD:fix/conape-contact-write-v4-1-2
