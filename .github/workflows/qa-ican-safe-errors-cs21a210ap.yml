name: QA Club I CAN Safe Errors CS21A210AP

on:
  push:
    branches:
      - fix/ican-safe-errors-cs21a210ap
    paths:
      - 'src/ican_participation_cs21a122.js'
      - 'scripts/qa_ican_safe_errors_cs21a210ap.mjs'
      - '.github/workflows/qa-ican-safe-errors-cs21a210ap.yml'
      - '00_DOCUMENTACION/ICAN_SAFE_ERRORS_CS21A210AP_2026-08-31.md'
  pull_request:
    paths:
      - 'src/ican_participation_cs21a122.js'
      - 'scripts/qa_ican_safe_errors_cs21a210ap.mjs'
      - '.github/workflows/qa-ican-safe-errors-cs21a210ap.yml'
      - '00_DOCUMENTACION/ICAN_SAFE_ERRORS_CS21A210AP_2026-08-31.md'

permissions:
  contents: read

jobs:
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check CS21A122 JavaScript syntax
        run: |
          node --check src/ican_participation_cs21a122.js
          node --check src/student_demo_level_filter_cs21a110.js
      - name: Verify CS21A210AP semantics and exact reconstruction
        run: node scripts/qa_ican_safe_errors_cs21a210ap.mjs
      - name: Regress historical CS21A122 contract
        run: |
          test -s styles/ican_participation_cs21a122.css
          grep -q "ican_participation_cs21a122.js" src/student_demo_level_filter_cs21a110.js
          grep -q "getICANPortalEstudiante" src/ican_participation_cs21a122.js
      - name: Regress CS21A210AN teacher boundary
        run: node scripts/qa_vista_docente_safe_errors_cs21a210an.mjs
      - name: Regress CS21A210AL Ventas boundary
        run: node scripts/qa_ventas_calendario_safe_errors_cs21a210al.mjs
      - name: Regress CS21A210AJ enrollment calendar boundary
        run: node scripts/qa_matriculas_calendario_safe_errors_cs21a210aj.mjs
      - name: Diff hygiene
        run: git diff --check
