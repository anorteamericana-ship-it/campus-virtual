name: SEC002 docs extra one-shot

on:
  push:
    branches:
      - fix/sec002-private-document-foundation
    paths:
      - .github/workflows/sec002_docs_extra_once.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sec002-private-document-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch docs_extra contract
        run: python scripts/apply_sec002_ventas_docs_extra_patch.py
      - name: Verify contract
        run: |
          node scripts/qa_sec002_ventas_docs_extra_contract.mjs
          git diff --check
      - name: Commit verified source change
        shell: bash
        run: |
          if git diff --quiet -- src/ventas_data.jsx; then
            echo 'No source change produced' >&2
            exit 1
          fi
          git config user.name 'anorteamericana-ship-it'
          git config user.email 'anorteamericana@gmail.com'
          git add src/ventas_data.jsx
          git commit -m 'fix: preserva y normaliza documentos extra de ventas SEC-002'
          git push origin HEAD:fix/sec002-private-document-foundation
