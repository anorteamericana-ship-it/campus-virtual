name: SEC003 apply Live session identity once

on:
  push:
    branches:
      - fix/sec003-english-lab-live-auth

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sec003-english-lab-live-auth
          fetch-depth: 0

      - name: Verify stacked base ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "fix/sec003-english-lab-live-auth"
          git merge-base --is-ancestor 49eb9fb8b9286d7de238ba46a0fcf9d07d7d7d8d HEAD

      - name: Apply exact session identity replacements
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/english_lab_live.jsx')
          text = path.read_text(encoding='utf-8')
          replacements = [
            (
              "    const [playerName,setPlayerName]=React.useState(liveStudentName(u));\n    const [studentCode,setStudentCode]=React.useState(liveStudentCode(u));",
              "    const playerName=liveStudentName(u);\n    const studentCode=liveStudentCode(u);"
            ),
            (
              "      if(!clean(playerName)){ setError('Escribí tu nombre para entrar.'); return; }",
              "      if(!clean(playerName)){ setError('La sesión del Campus no tiene un nombre de estudiante válido.'); return; }\n      if(!clean(studentCode)){ setError('Necesitás ingresar al Campus con una cuenta de estudiante matriculado para entrar a Clase en vivo.'); return; }"
            ),
            (
              "            <label style={{display:'grid',gap:6,fontSize:12,fontWeight:850,color:'#344054'}}>Nombre del jugador\n              <input value={playerName} onChange={e=>setPlayerName(e.target.value)} placeholder=\"Nombre del estudiante\" style={{height:46,border:'1px solid #D0D5DD',borderRadius:13,padding:'0 12px',fontWeight:800}} />\n            </label>\n            <label style={{display:'grid',gap:6,fontSize:12,fontWeight:850,color:'#344054'}}>Código / cédula estudiante <span style={{fontWeight:600,color:'#98A2B3'}}>(opcional para demo)</span>\n              <input value={studentCode} onChange={e=>setStudentCode(e.target.value)} placeholder=\"Se toma de la sesión si existe\" style={{height:42,border:'1px solid #D0D5DD',borderRadius:12,padding:'0 12px',fontWeight:700}} />\n            </label>",
              "            <label style={{display:'grid',gap:6,fontSize:12,fontWeight:850,color:'#344054'}}>Estudiante de la sesión\n              <input value={playerName} readOnly aria-readonly=\"true\" style={{height:46,border:'1px solid #D0D5DD',borderRadius:13,padding:'0 12px',fontWeight:800,background:'#F8FAFC',color:'#475467'}} />\n            </label>\n            <label style={{display:'grid',gap:6,fontSize:12,fontWeight:850,color:'#344054'}}>Código de estudiante <span style={{fontWeight:600,color:'#98A2B3'}}>(tomado de tu sesión del Campus)</span>\n              <input value={studentCode} readOnly aria-readonly=\"true\" style={{height:42,border:'1px solid #D0D5DD',borderRadius:12,padding:'0 12px',fontWeight:700,background:'#F8FAFC',color:'#475467'}} />\n            </label>"
            )
          ]
          for old,new in replacements:
            count=text.count(old)
            if count != 1:
              raise SystemExit(f'FAIL-CLOSED expected exactly one preimage, got {count}: {old[:100]}')
            text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')

      - name: Run SEC003 frontend gate
        run: node scripts/qa_sec003_english_lab_live_frontend.mjs

      - name: Scope checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "src/english_lab_live.jsx"
          ! git diff -- src/english_lab_live.jsx | grep -E '^[+-].*(Memory Match|MEMORY_MATCH|englishLabMemoryMatch)' || { echo 'SEC003 must not touch Memory Match'; exit 1; }
          git diff -- src/english_lab_live.jsx

      - name: Commit exact UI change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/english_lab_live.jsx
          git commit -m "SEC003 bind Live player identity to Campus session"
          git push origin HEAD:fix/sec003-english-lab-live-auth
