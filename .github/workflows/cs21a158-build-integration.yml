name: CS21A169 update manual-review candidate

on:
  pull_request:
    paths:
      - '.github/workflows/cs21a158-build-integration.yml'
      - 'scripts/cs21a169_trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-latest-teacher-resources:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/cs21a158-manual-review-20260804
          fetch-depth: 0
      - name: Merge latest verified teacher resources without workflow mutations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          start="$(git rev-parse HEAD)"
          git fetch origin refactor/cs21a157-docente-recursos-canonicos:refs/remotes/origin/refactor/cs21a157-docente-recursos-canonicos
          git merge --no-ff --no-edit origin/refactor/cs21a157-docente-recursos-canonicos
          git reset --soft "$start"
          git restore --source="$start" --staged --worktree .github/workflows
          if test -f scripts/cs21a169_trigger.txt; then git rm scripts/cs21a169_trigger.txt; fi
          git commit -m 'CS21A169 integra Recursos docente canónicos al candidato QA'
          git push origin HEAD:integration/cs21a158-manual-review-20260804
