name: CS21A158 build manual-review integration

on:
  pull_request:
    paths:
      - '.github/workflows/cs21a158-build-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-integration:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/cs21a158-manual-review-20260804
          fetch-depth: 0
      - name: Merge verified branches in dependency order
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          branches=(
            agent/cs21a143-documentacion-operativa
            audit/cs21a149-second-cleanup
            refactor/cs21a152-retira-visor-libros-sombreado
            cleanup/cs21a153-tombstones-materiales-historicos
            refactor/cs21a154-recursos-adicionales-independiente
            refactor/cs21a155-retira-sidebar-superadmin-inerte
            refactor/cs21a157-docente-recursos-canonicos
            agent/cs21a144-english-lab-al-dia
            agent/cs21a144-amplia-qa-navegacion
            refactor/cs21a151-component-ownership
          )

          for branch in "${branches[@]}"; do
            echo "=== Integrando ${branch} ==="
            git fetch origin "${branch}:refs/remotes/origin/${branch}"
            git merge --no-ff --no-edit "origin/${branch}"
          done

          git rm .github/workflows/cs21a158-build-integration.yml
          git commit -m 'CS21A158 completa rama de revisión integral'
          git push origin HEAD:integration/cs21a158-manual-review-20260804
