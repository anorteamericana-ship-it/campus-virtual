name: Bootstrap Lazy Loader Safe User Errors CS21A197

on:
  push:
    branches:
      - fix/lazy-loader-safe-user-errors-cs21a197
    paths:
      - 'scripts/bootstrap_patch_lazy_loader_safe_user_errors_cs21a197.mjs'
      - 'scripts/qa_lazy_loader_safe_user_errors_cs21a197.mjs'
      - '.github/workflows/bootstrap-lazy-loader-safe-user-errors-cs21a197.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify exact base ancestry
        run: git merge-base --is-ancestor 2f8b24d0f9385c152c43cd652034aa2faea9f143 HEAD
      - name: Apply exact patch
        run: node scripts/bootstrap_patch_lazy_loader_safe_user_errors_cs21a197.mjs
      - name: Run CS21A197 guard
        run: node scripts/qa_lazy_loader_safe_user_errors_cs21a197.mjs
      - name: Regress CS21A196
        run: node scripts/qa_admin_master_conape_user_copy_cs21a196.mjs
      - name: Regress CS21A195
        run: node scripts/qa_admin_master_conape_safe_errors_cs21a195.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Remove bootstrap artifacts and push verified candidate
        run: |
          rm scripts/bootstrap_patch_lazy_loader_safe_user_errors_cs21a197.mjs
          rm .github/workflows/bootstrap-lazy-loader-safe-user-errors-cs21a197.yml
          git add -A
          git commit -m 'CS21A197 · safe lazy-loader user errors'
          git push origin HEAD:fix/lazy-loader-safe-user-errors-cs21a197