name: CS21A94 Panel Maestro cleanup

on:
  push:
    paths:
      - '.github/workflows/cs21a94-panel-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Depurar Panel Maestro y CONAPE
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'No se encontró bloque exacto: {label}')
              if text.count(old) != 1:
                  raise SystemExit(f'Bloque no único ({text.count(old)}): {label}')
              return text.replace(old, new, 1)

          def regex_once(text, pattern, replacement, label, flags=0):
              new_text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'Patrón no encontrado/ambiguo ({count}): {label}')
              return new_text

          # ------------------------------------------------------------------
          # Panel Maestro: eliminar franja informativa, filtros y sus estados.
          # ------------------------------------------------------------------
          p = Path('src/admin_master_dashboard.jsx')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, '// F98.4-Z6-CR · Hotfix auditoría de release', '// F98.4-Z6-CS21A94 · Panel Maestro depurado + CONAPE automático cada 30 minutos', 'cabecera dashboard')
          s = replace_once(s, "const MASTER_PANEL_BUILD = 'F98.4-Z6-CR';", "const MASTER_PANEL_BUILD = 'F98.4-Z6-CS21A94';", 'build dashboard')

          old_use = '''function useMasterData() {
            const [state,setState]=React.useState({loading:true,error:'',data:null});
            const load=React.useCallback((refresh=false)=>{setState(s=>({...s,loading:true,error:''}));masterPost({refresh}).then(d=>{if(!d?.ok)throw new Error(d?.mensaje||d?.error||'No se pudo cargar');setState({loading:false,error:'',data:d});}).catch(e=>setState({loading:false,error:e.message||String(e),data:null}));},[]);
            React.useEffect(()=>load(false),[load]);
            return {...state,refetch:()=>load(true)};
          }'''
          new_use = '''function useMasterData() {
            const [state,setState]=React.useState({loading:true,error:'',data:null});
            const runningRef=React.useRef(false);
            const lastSyncRef=React.useRef(0);
            const load=React.useCallback(async({refresh=false,syncConape=false,silent=false}={})=>{
              if(runningRef.current)return;
              runningRef.current=true;
              if(!silent)setState(current=>({...current,loading:true,error:''}));
              let conapeAutoSync=null;
              try{
                if(syncConape){
                  try{
                    const sync=await masterAction('actualizarPanelConapeAhora');
                    conapeAutoSync={...sync,error:''};
                  }catch(error){
                    conapeAutoSync={ok:false,error:error?.message||String(error),movimientos_registrados:0,nuevos:0};
                  }
                  lastSyncRef.current=Date.now();
                }
                const dashboard=await masterPost({refresh:refresh||syncConape});
                if(!dashboard?.ok)throw new Error(dashboard?.mensaje||dashboard?.error||'No se pudo cargar');
                dashboard.conapeAutoSync=conapeAutoSync||state.data?.conapeAutoSync||null;
                setState({loading:false,error:'',data:dashboard});
              }catch(error){
                setState(current=>({loading:false,error:error?.message||String(error),data:current.data}));
              }finally{
                runningRef.current=false;
              }
            },[]);
            React.useEffect(()=>{
              load({refresh:true,syncConape:true});
              const timer=window.setInterval(()=>load({refresh:true,syncConape:true,silent:true}),30*60*1000);
              const onFocus=()=>{if(Date.now()-lastSyncRef.current>=30*60*1000)load({refresh:true,syncConape:true,silent:true});};
              window.addEventListener('focus',onFocus);
              return()=>{window.clearInterval(timer);window.removeEventListener('focus',onFocus);};
            },[load]);
            return {...state,refetch:()=>load({refresh:true,syncConape:true})};
          }'''
          s = replace_once(s, old_use, new_use, 'useMasterData automático')

          s = regex_once(
              s,
              r'''function MasterAdvisorFilter\(\{ advisors=\[\], selected=\[\], onChange \}\) \{.*?\n\}\n\nfunction MasterDataStatus\(\{ coverage \}\) \{.*?\n\}\n\nfunction MasterResumen''',
              'function MasterResumen',
              'eliminar asesor + cobertura',
              re.S
          )
          s = regex_once(
              s,
              r'''function MasterAcademicFilter\(\{label,value,onChange,options,placeholder='Todos'\}\) \{\n  return .*?\n\}\n''',
              '',
              'eliminar componente de filtros académicos',
              re.S
          )

          admin_prefix = '''function AdminMasterDashboard({onNavigate}) {
            const {data,loading,error,refetch}=useMasterData();
            const [section,setSection]=React.useState('resumen');
            const trackingState=useMasterTracking(section==='seguimiento');
            if(loading&&!data)return <div className="master-loading"><span/><h2>Construyendo Panel Maestro…</h2><p>Agregando datos reales de APOLLO y CAMPUS_OPERATIVO.</p></div>;
            if(error&&!data)return <div className="master-loading master-error"><h2>No se pudo cargar el Panel Maestro</h2><p>{error}</p><button onClick={refetch}>Reintentar</button></div>;
            const yearPool=Array.from(new Set([
              ...Object.keys(data?.sales?.enrollmentsByYear||{}),
              ...(data?.collections?.years||[]),
              ...(data?.exams?.years||[]),
              ...(data?.trends?.years||[])
            ].map(Number).filter(Number.isFinite))).sort((a,b)=>a-b);
            const calendarYear=new Date().getFullYear();
            const selectedYear=yearPool.includes(calendarYear)?calendarYear:(yearPool.length?yearPool[yearPool.length-1]:calendarYear);
            const previousYears=yearPool.filter(value=>value<selectedYear);
            const year=String(selectedYear);
            const compareYear=String(previousYears.length?previousYears[previousYears.length-1]:selectedYear-1);
            const advisors=[];
            const academicFilters={};
            const studentFilters={};
            const trackingFilters={};
            const collectionFilters={};
            const conapeFilters={};
            const teacherFilters={};
            const examFilters={};
            const alertFilters={};
            const exportCurrent=()=>{'''
          s = regex_once(
              s,
              r'''function AdminMasterDashboard\(\{onNavigate\}\) \{.*?  const exportCurrent=\(\)=>\{''',
              admin_prefix,
              'simplificar estados del dashboard',
              re.S
          )

          admin_suffix = '''  const selectedMeta=MASTER_SECTIONS.find(item=>item.id===section)||MASTER_SECTIONS[0];
            const syncMeta=data?.conapeAutoSync||{};
            const syncCount=Math.max(0,Number(syncMeta.movimientos_registrados??syncMeta.nuevos??0)||0);
            const syncFailed=!!syncMeta.error;
            const syncLabel=syncFailed?'CONAPE pendiente':`${syncCount} desembolso${syncCount===1?'':'s'} nuevo${syncCount===1?'':'s'}`;
            const dashboardBusy=loading||trackingState.loading;
            return <div className="master-admin" data-build={MASTER_PANEL_BUILD}>
              <header className="master-header"><div><div className="master-title-line"><h1>Panel Maestro Super Admin</h1><span>Datos reales · CO</span></div><p>Control institucional y analítica integral · actualizado {data.generatedAt||'—'}</p></div><div className="master-actions"><span className={`master-conape-auto-chip ${syncFailed?'warn':'ok'}`} title={syncFailed?syncMeta.error:'CONAPE se consulta al entrar y cada 30 minutos.'}>{syncLabel}</span><button onClick={()=>{refetch();if(section==='seguimiento')trackingState.refetch();}} disabled={dashboardBusy}><span aria-hidden="true">↻</span>{dashboardBusy?'Sincronizando…':'Sincronizar'}</button><button onClick={exportCurrent}><Icon name="download" size={15}/>Exportar CSV</button></div></header>
              {error&&data&&<div className="master-inline-warning">Última actualización incompleta: {error}</div>}
              <nav className="master-section-nav" aria-label="Secciones del Panel Maestro">{MASTER_SECTIONS.map(item=><button key={item.id} className={section===item.id?'active':''} style={{'--section-color':item.color}} onClick={()=>setSection(item.id)}><i/><Icon name={item.icon} size={16}/><span>{item.label}</span></button>)}</nav>
              <main className="master-content"><div className="master-section-heading"><div><span>{selectedMeta.label}</span><h2>{section==='resumen'?'Visión ejecutiva de la academia':section==='ventas'?'Analítica comercial y matrículas':section==='academica'?'Control operativo académico en tiempo real':section==='estudiantes'?'Retención, asistencia y riesgo estudiantil':section==='seguimiento'?'Prioridades operativas, rescate y seguimiento humano por grupo':section==='cobranza'?'Cobros aplicados, cartera activa y morosidad':section==='conape'?'Financiamiento, desembolsos y vinculación institucional':section==='docentes'?'Carga, cumplimiento y salud operativa docente':section==='examenes'?'Aplicación, revisión y rendimiento académico':section==='alertas'?'Centro transversal de alertas y pendientes institucionales':section==='tendencias'?'Evolución multianual de la Academia':selectedMeta.label}</h2></div></div>{section==='resumen'?<MasterResumen data={data} year={year} compareYear={compareYear} advisors={advisors} setSection={setSection}/>:section==='ventas'?<MasterVentas data={data} year={year} compareYear={compareYear} advisors={advisors}/>:section==='academica'?<MasterAcademica data={data} year={year} filters={academicFilters}/>:section==='estudiantes'?<MasterEstudiantes data={data} year={year} filters={studentFilters}/>:section==='seguimiento'?<MasterSeguimiento state={trackingState} filters={trackingFilters} onRefresh={trackingState.refetch} onNavigate={onNavigate}/>:section==='cobranza'?<MasterCobranza data={data} year={year} compareYear={compareYear} filters={collectionFilters} onRefresh={refetch}/>:section==='conape'?<MasterConape data={data} year={year} compareYear={compareYear} filters={conapeFilters}/>:section==='docentes'?<MasterDocentes data={data} year={year} filters={teacherFilters}/>:section==='examenes'?<MasterExamenes data={data} year={year} compareYear={compareYear} filters={examFilters}/>:section==='alertas'?<MasterAlertas data={data} year={year} filters={alertFilters} setSection={setSection}/>:section==='tendencias'?<MasterTendencias data={data} year={year} compareYear={compareYear}/>:<MasterPendingSection section={section}/>}</main>
            </div>;
          }

          window.__ADMIN_MASTER_BUILD__'''
          s = regex_once(
              s,
              r'''  const selectedMeta=MASTER_SECTIONS\.find\(x=>x\.id===section\)\|\|MASTER_SECTIONS\[0\];.*?\n\}\n\nwindow\.__ADMIN_MASTER_BUILD__''',
              admin_suffix,
              'reemplazar shell dashboard',
              re.S
          )
          if 'master-filterbar' in s or 'MasterDataStatus' in s or 'MasterAcademicFilter' in s or 'MasterAdvisorFilter' in s:
              raise SystemExit('Quedó código de filtros/cobertura en dashboard')
          p.write_text(s,encoding='utf-8')

          # ------------------------------------------------------------------
          # CONAPE: una sola alerta, alineada al nivel exacto y deduplicada.
          # ------------------------------------------------------------------
          p = Path('src/admin_master_conape_movements_cs21a25.jsx')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, '// F98.4-Z6-CS21A91 · Panel Maestro CONAPE buscable, ordenable y con nueva segunda plantilla WhatsApp', '// F98.4-Z6-CS21A94 · CONAPE deduplicado, alerta alineada y actualización automática', 'cabecera CONAPE')
          s = replace_once(s, "const BUILD='F98.4-Z6-CS21A91';", "const BUILD='F98.4-Z6-CS21A94';", 'build CONAPE')
          s = s.replace('an-master-conape-cs21a91-styles','an-master-conape-cs21a94-styles')
          s = re.sub(r'^\s*\.master-conape-advance-detail\{.*?\}\n','',s,flags=re.M)
          style_anchor = '    .master-conape-movement-stack{align-items:flex-start}\n'
          style_extra = '''    .master-conape-movement-stack{align-items:flex-start}
              .master-conape-history-item[data-has-alert="true"]{grid-template-columns:minmax(92px,1fr) 72px auto minmax(118px,auto)}
              .master-conape-history-alert{display:flex;align-items:center;justify-content:flex-start;min-width:0}
              .master-conape-history-alert .master-conape-movement-stack{margin:0}
          '''
          s = replace_once(s, style_anchor, style_extra, 'estilo alineación alerta')
          s = replace_once(s, "function movementCategory(row){return row?.advance?'Desembolso adelantado':movementText(row);}", "function movementCategory(row){return row?.appliedInSystem?'Aplicado':'Nuevo desembolso';}", 'categoría única')

          movement_block = '''function MovementBadge({row}){
            const applied=!!row.appliedInSystem;
            const mora=row.moraState==='SI'
              ?['Mora SI','#FDECEC','#A12828','#E8B1B1']
              :row.moraState==='NO'
                ?['Mora NO','#EAF6ED','#246B35','#B8D9C0']
                :null;
            return <div className="master-conape-movement-stack">
              <span className="master-conape-movement-badge" data-applied={applied?'true':'false'} title={applied?'Pago aplicado':'Nuevo desembolso detectado'}>
                {applied?'✓ Aplicado':'Nuevo desembolso'}
              </span>
              {mora&&<span className="master-conape-mora-badge" title={`7-morosidad · ${row.moraYear||row.year||'—'} · periodo ${row.moraPeriod||'—'}`} style={{background:mora[1],color:mora[2],borderColor:mora[3]}}>{mora[0]}</span>}
            </div>;
          }
          function AcademicHistory({items,row}){
            const rows=(Array.isArray(items)?items:[]).slice().sort((a,b)=>(LEVEL_ORDER[String(a?.level||'').toUpperCase()]||99)-(LEVEL_ORDER[String(b?.level||'').toUpperCase()]||99));
            const target=levelId(row);
            const hasExact=rows.some(item=>String(item?.level||'').toUpperCase()===target);
            if(!rows.length)return <div className="master-conape-history-grid"><div className="master-conape-history-item" data-has-alert="true"><span className="master-conape-history-level">{String(levelText(row)).toUpperCase()}</span><span className="master-conape-history-period">—</span><span className="master-conape-history-status">SIN REGISTRO</span><div className="master-conape-history-alert"><MovementBadge row={row}/></div></div></div>;
            return <div className="master-conape-history-grid">{rows.map((h,i)=>{
              const status=String(h.status||'SIN_REGISTRO').toUpperCase(),t=TONE[status]||['#F2F0EC','#69635B','#D8D1C7'],hasNote=String(h.note??'').trim()!=='';
              const exact=String(h?.level||'').toUpperCase()===target;
              return <div key={`${h.sourceRow||i}-${h.matter||''}`} className="master-conape-history-item" data-has-alert={exact?'true':'false'} title={`6-historial · ${h.matter||''} · ${h.periodCode||''} · ${status}${hasNote?' '+h.note:''}`}>
                <span className="master-conape-history-level">{String(h.levelLabel||LEVEL[String(h.level||'').toUpperCase()]||h.matter||'Nivel').toUpperCase()}</span>
                <span className="master-conape-history-period">{h.periodCode||`${h.year||''}${h.period||''}${h.periodType||''}`}</span>
                <span className="master-conape-history-status" style={{background:t[0],color:t[1],borderColor:t[2]}}>{status}{hasNote?` ${h.note}`:''}</span>
                {exact&&<div className="master-conape-history-alert"><MovementBadge row={row}/></div>}
              </div>;
            })}{!hasExact&&<div className="master-conape-history-item" data-has-alert="true"><span className="master-conape-history-level">{String(levelText(row)).toUpperCase()}</span><span className="master-conape-history-period">—</span><span className="master-conape-history-status">NIVEL ENLAZADO</span><div className="master-conape-history-alert"><MovementBadge row={row}/></div></div>}</div>;
          }
          function WaButton'''
          s = regex_once(s, r'''function MovementBadge\(\{row\}\)\{.*?\n\}\nfunction AcademicHistory\(\{items\}\)\{.*?\n\}\nfunction WaButton''', movement_block, 'alerta única dentro historial', re.S)

          row_block = '''function Row({row,index,details,openDetail,financeMap}){
            const code=String(row?.code||'').trim();
            const detail=code&&Object.prototype.hasOwnProperty.call(details,code)?details[code]:String(row.detail||'');
            const finance=financeMap[`${code}|${levelId(row)}`]||financeMap[code]||null;
            const cell={verticalAlign:'middle',minWidth:0};
            return <tr key={row.id||index} className={!row.appliedInSystem&&(!row.linked||row.mora)?'has-alert':''} data-applied={row.appliedInSystem?'true':'false'}>
              <td className="master-conape-code-cell" style={cell}><CodeCell code={code}/></td>
              <td className="master-conape-student-cell" style={cell}><StudentCell row={row} detail={detail} openDetail={openDetail} code={code}/></td>
              <td className="master-conape-history-cell" style={cell}><AcademicHistory items={row.historySummary} row={row}/></td>
              <td className="master-conape-period-cell" style={cell}><PeriodCell row={row}/></td>
              <td className="master-conape-wa-cell" style={cell}><WaButton row={row} finance={finance}/></td>
            </tr>;
          }
          function sortValue'''
          s = regex_once(s, r'''function Row\(\{row,index,details,openDetail,financeMap\}\)\{.*?\n\}\nfunction sortValue''', row_block, 'fila sin columna movimiento', re.S)

          table_block = '''function Table({items,details,openDetail,financeMap,empty,sort,onSort}){
            const headers=[['code','Código'],['student','Estudiante'],['academic','Resumen académico'],['period','Periodo / nivel'],['whatsapp','WhatsApp']];
            return <div className="master-conape-month-table-wrap">
              <table className="master-conape-month-table">
                <colgroup>{[8,24,39,15,14].map((w,i)=><col key={i} style={{width:`${w}%`}}/>)}</colgroup>
                <thead><tr>{headers.map(([id,label])=><th key={id}><SortHeader id={id} label={label} sort={sort} onSort={onSort}/></th>)}</tr></thead>
                <tbody>{items.map((r,i)=><Row key={r.id||i} row={r} index={i} details={details} openDetail={openDetail} financeMap={financeMap}/>)}</tbody>
              </table>
              {!items.length&&<div className="master-conape-empty">{empty}</div>}
            </div>;
          }
          function filterRows'''
          s = regex_once(s, r'''function Table\(\{items,details,openDetail,financeMap,empty,sort,onSort\}\)\{.*?\n\}\nfunction filterRows''', table_block, 'tabla 5 columnas', re.S)
          s = s.replace("    if(filters.movement!=='ALL'&&movementCategory(row)!==filters.movement)return false;\n", '')

          dedupe_helper = '''function dedupeMovementRows(rows){
            const map=new Map();
            (rows||[]).forEach(row=>{
              const key=[String(row?.cedula||row?.code||'').replace(/\\D/g,''),Number(row?.year)||0,Number(row?.month)||0,disbursementNumber(row)||1].join('|');
              const current=map.get(key);
              if(!current||Number(row?.detectedSort||0)>=Number(current?.detectedSort||0)){
                const merged={...current,...row};
                const context=[...(current?.periodMovements||[]),...(row?.periodMovements||[])];
                merged.periodMovements=Array.from(new Map(context.map(item=>[[item.number,item.month,item.year].join('|'),item])).values());
                map.set(key,merged);
              }
            });
            return Array.from(map.values());
          }
          function MasterConapeMovementsTableCS21A94'''
          s = replace_once(s, 'function MasterConapeMovementsTableCS21A70', dedupe_helper, 'insertar deduplicación y renombrar componente')
          s = replace_once(s, '  const all=source.filter(isAcademicDisbursement01);', '  const all=dedupeMovementRows(source.filter(isAcademicDisbursement01));', 'usar deduplicación')
          s = replace_once(s, "  const [movementFilter,setMovementFilter]=React.useState('ALL');\n", '', 'estado filtro movimiento')
          s = replace_once(s, "  const movementOptions=React.useMemo(()=>uniqueSorted(all.map(movementCategory)),[data]);\n", '', 'opciones movimiento')
          s = replace_once(s, "  const filters={query,movement:movementFilter,level:levelFilter,status:statusFilter,period:periodFilter,whatsapp:whatsappFilter};", "  const filters={query,level:levelFilter,status:statusFilter,period:periodFilter,whatsapp:whatsappFilter};", 'objeto filtros')
          s = replace_once(s, '    data,query,movementFilter,levelFilter,statusFilter,periodFilter,whatsappFilter,sort.key,sort.dir', '    data,query,levelFilter,statusFilter,periodFilter,whatsappFilter,sort.key,sort.dir', 'dependencias filtros')
          s = replace_once(s, "    advanced:all.filter(r=>!!r.advance).length\n", '', 'estadística adelantados')
          s = replace_once(s, "  const hasFilters=!!query||movementFilter!=='ALL'||levelFilter!=='ALL'||statusFilter!=='ALL'||periodFilter!=='ALL'||whatsappFilter!=='ALL';", "  const hasFilters=!!query||levelFilter!=='ALL'||statusFilter!=='ALL'||periodFilter!=='ALL'||whatsappFilter!=='ALL';", 'hasFilters')
          s = replace_once(s, "    setMovementFilter('ALL');\n", '', 'clear movimiento')
          s = regex_once(s, r'''\n      <label>\n        <span>Movimiento</span>\n        <select value=\{movementFilter\}.*?\n      </label>''', '', 'control movimiento', re.S)
          s = replace_once(s, '      <div><b>{stats.advanced}</b><span>adelantados</span></div>', '      <div><b>{Math.max(0,Number(data?.conapeAutoSync?.movimientos_registrados??data?.conapeAutoSync?.nuevos??0)||0)}</b><span>nuevos detectados</span></div>', 'KPI nuevos')
          s = replace_once(s, "        <span className={`master-live-chip ${(m.monitor||[]).some(x=>x.handler==='sincronizarCONAPE')?'on':'off'}`}>Monitoreo CONAPE</span>", "        <span className=\"master-live-chip on\">Actualización automática · 30 min</span>", 'chip automático')
          s = replace_once(s, '<h3>Desembolsos académicos 01 · pendientes primero</h3>', '<h3>Desembolsos académicos 01 · pendientes primero</h3>', 'mantener título')
          s = s.replace("          <option value=\"movement:asc\">Movimiento</option>\n", '')
          s = s.replace('window.MasterConapeMovementsTable=MasterConapeMovementsTableCS21A70;', 'window.MasterConapeMovementsTable=MasterConapeMovementsTableCS21A94;')
          if 'Desembolso adelantado' in s or 'movementFilter' in s or '<th key={id}><SortHeader id={id} label={label}' not in s:
              raise SystemExit('Quedó alerta/filtro duplicado en CONAPE')
          p.write_text(s,encoding='utf-8')

          # ------------------------------------------------------------------
          # CSS: eliminar bloques muertos y agregar estado de sincronización.
          # ------------------------------------------------------------------
          p=Path('styles/admin_master_dashboard.css')
          lines=p.read_text(encoding='utf-8').splitlines()
          dead_tokens=('.master-data-status','.master-filterbar','.master-advisor-filter','.master-advisor-menu','.master-academic-filter','.master-student-search')
          lines=[line for line in lines if not any(token in line for token in dead_tokens)]
          if lines:
              lines[0]='/* F98.4-Z6-CS21A94 · Panel Maestro depurado */'
          lines.insert(5,'.master-conape-auto-chip{display:inline-flex;align-items:center;min-height:34px;padding:0 11px;border-radius:999px;font-size:10px;font-weight:850;white-space:nowrap;border:1px solid}.master-conape-auto-chip.ok{color:#216444;background:#e5f3ea;border-color:#c4e2cf}.master-conape-auto-chip.warn{color:#8a302b;background:#f7e8e5;border-color:#e6c2bc}.master-inline-warning{margin:-2px 0 12px;padding:8px 11px;border-radius:9px;background:#fff3d6;border:1px solid #e8c67a;color:#7b5200;font-size:10.5px;font-weight:700}')
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')

          # Cache-busting y carga de la versión corregida.
          p=Path('src/app.jsx');s=p.read_text(encoding='utf-8')
          s=replace_once(s,"src/admin_master_dashboard.jsx?v=F98.4Z6CR","src/admin_master_dashboard.jsx?v=F98.4Z6CS21A94",'lazy dashboard A94')
          p.write_text(s,encoding='utf-8')

          p=Path('campus.html');s=p.read_text(encoding='utf-8')
