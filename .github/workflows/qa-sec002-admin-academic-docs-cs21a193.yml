name: QA SEC002 Admin Academic Docs CS21A193

on:
  push:
    branches:
      - security/admin-private-academic-doc-delivery-cs21a193
  pull_request:
    paths:
      - 'src/admin_students.jsx'
      - 'security/sec002_admin_academic_docs_contract_cs21a193.json'
      - 'scripts/qa_sec002_admin_academic_docs_cs21a193.mjs'
      - '.github/workflows/qa-sec002-admin-academic-docs-cs21a193.yml'

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run CS21A193 guard
        run: node scripts/qa_sec002_admin_academic_docs_cs21a193.mjs
      - name: Regress CS21A192
        run: node scripts/qa_admin_students_user_copy_cs21a192.mjs
      - name: Regress CS21A191
        run: node scripts/qa_admin_students_safe_errors_cs21a191.mjs
      - name: Diff hygiene against stacked base
        run: git diff --check origin/fix/admin-students-user-copy-cs21a192...HEAD -- ':!00_DOCUMENTACION/**'
