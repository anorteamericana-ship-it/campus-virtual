name: F111 teacher roster comment preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/teacher_views.jsx'
      - 'scripts/qa_f111_teacher_roster_comment_preview.mjs'
      - '.github/workflows/qa-f111-teacher-roster-comment-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comment-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Visual source contract F111
        run: |
          node scripts/qa_f111_teacher_roster_comment_preview.mjs
          node scripts/qa_teacher_live_attendance_f100.mjs
      - name: Review diff and hygiene
        run: |
          git diff --check origin/main...HEAD
          git diff --binary origin/main...HEAD --output=F111_COMMENT_PREVIEW_REVIEW.diff
      - uses: actions/upload-artifact@v4
        with:
          name: F111_COMMENT_PREVIEW_REVIEW_diff
          path: F111_COMMENT_PREVIEW_REVIEW.diff
