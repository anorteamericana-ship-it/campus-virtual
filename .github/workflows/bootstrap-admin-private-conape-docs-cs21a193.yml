name: Bootstrap Admin Private CONAPE Docs CS21A193

on:
  push:
    branches:
      - security/admin-private-conape-doc-delivery-cs21a193
    paths:
      - 'scripts/bootstrap_patch_admin_private_conape_docs_cs21a193.mjs'
      - '.github/workflows/bootstrap-admin-private-conape-docs-cs21a193.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify exact base ancestry
        run: git merge-base --is-ancestor 30b5be3cb04cff8eacf8a644b4ab72af077e5d7a HEAD
      - name: Apply exact private document patch
        run: node scripts/bootstrap_patch_admin_private_conape_docs_cs21a193.mjs
      - name: Run CS21A193 guard
        run: node scripts/qa_admin_private_conape_docs_cs21a193.mjs
      - name: Regress CS21A192
        run: node scripts/qa_admin_students_user_copy_cs21a192.mjs
      - name: Regress CS21A191
        run: node scripts/qa_admin_students_safe_errors_cs21a191.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Remove bootstrap artifacts and push verified candidate
        run: |
          rm scripts/bootstrap_patch_admin_private_conape_docs_cs21a193.mjs
          rm .github/workflows/bootstrap-admin-private-conape-docs-cs21a193.yml
          git add -A
          git commit -m 'CS21A193 · private admin CONAPE document delivery'
          git push origin HEAD:security/admin-private-conape-doc-delivery-cs21a193
