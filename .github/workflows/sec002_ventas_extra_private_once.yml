name: SEC002 ventas extra private one-shot
# final upload-auth metadata gate

on:
  push:
    branches:
      - fix/sec002-private-document-foundation
    paths:
      - .github/workflows/sec002_ventas_extra_private_once.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sec002-private-document-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch upload auth and metadata
        run: python scripts/apply_sec002_ventas_extra_upload_auth_patch.py
      - name: Verify SEC-002 guards
        run: |
          node scripts/qa_sec002_private_certificate_delta_portable.mjs
          node scripts/qa_sec002_student_private_cert.mjs
          node scripts/qa_sec002_ventas_docs_extra_contract.mjs
          node scripts/qa_sec002_ventas_extra_private_delta.mjs
          node scripts/qa_sec002_ventas_extra_private_frontend.mjs
          git diff --check
      - name: Commit verified source hardening
        shell: bash
        run: |
          if git diff --quiet -- src/ventas_data.jsx src/ventas_drawer.jsx; then
            echo 'No source change produced' >&2
            exit 1
          fi
          git config user.name 'anorteamericana-ship-it'
          git config user.email 'anorteamericana@gmail.com'
          git add src/ventas_data.jsx src/ventas_drawer.jsx
          git commit -m 'fix: autentica upload y conserva file id docs extra SEC-002'
          git push origin HEAD:fix/sec002-private-document-foundation
