name: APPLY English LAB v2 Main Sync Probe CS21A167 TEMP

on:
  push:
    branches:
      - integration/english-lab-v2-main-sync-probe-cs21a167

permissions:
  contents: write

jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, 'CS21A167 probe passed') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/english-lab-v2-main-sync-probe-cs21a167
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Merge current main
        run: git merge --no-ff --no-edit origin/main
      - name: Confirm only current-main Sales hotfix enters from merge base
        run: |
          git diff --check origin/main...HEAD
          git diff --name-only c09328886287903fbad0833b59b52d4934d8e67c..HEAD | sort > /tmp/main_sync_files.txt
          cat /tmp/main_sync_files.txt
          grep -qx "src/ventas_drawer.jsx" /tmp/main_sync_files.txt
          grep -qx "ventas.html" /tmp/main_sync_files.txt
          test "$(wc -l < /tmp/main_sync_files.txt)" -eq 2
      - name: Run full English LAB v2 core suite
        run: |
          for script in scripts/qa_english_lab_live_v2_*.mjs; do
            echo "=== $script ==="
            node "$script"
          done
          node scripts/qa_cs21a202_source_truth.mjs
      - name: Remove bootstrap and push probe result
        run: |
          git rm .github/workflows/apply-english-lab-v2-main-sync-probe-cs21a167.yml
          git commit -m "CS21A167 probe passed · English LAB v2 compatible with current main"
          git push origin HEAD:integration/english-lab-v2-main-sync-probe-cs21a167
