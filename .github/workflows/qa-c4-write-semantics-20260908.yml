name: QA C4 Write Semantics 20260908
on:
  push:
    branches: [audit/c4-write-semantics-20260908]
  pull_request:
    paths:
      - '00_DOCUMENTACION/C4_WRITE_SEMANTICS_AUDIT_2026-09-08.md'
      - 'scripts/qa_c4_write_semantics_20260908.mjs'
      - '.github/workflows/qa-c4-write-semantics-20260908.yml'
permissions:
  contents: read
jobs:
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax
        run: node --check scripts/qa_c4_write_semantics_20260908.mjs
      - name: Verify C4 write semantics
        run: node scripts/qa_c4_write_semantics_20260908.mjs
      - name: Preserve C3 and rollback markers
        run: |
          grep -Fq 'P2 · E0 · gap de defensa/harness' 00_DOCUMENTACION/C3_IDENTITY_DOMAIN_AUDIT_2026-09-08.md
          grep -Fq 'HISTORICAL_WRITE_HARNESS_NOT_ROLLBACK_SAFE_FOR_BLOCK_C' 00_DOCUMENTACION/C2_C4_ROLLBACK_COVERAGE_2026-09-08.md
      - name: Preserve C0 stop
        run: grep -Fq 'BLOQUEADO_HUMANO' 00_DOCUMENTACION/C0_PROSPECTOS_HEADER_ORDER_2026-09-08.md
      - name: No functional source change
        run: |
          test -z "$(git diff --name-only 24067c41445e5aacee9fe33a230c653efd4cfdf8...HEAD | grep -Ev '^(00_DOCUMENTACION/C4_WRITE_SEMANTICS_AUDIT_2026-09-08.md|scripts/qa_c4_write_semantics_20260908.mjs|\.github/workflows/qa-c4-write-semantics-20260908.yml)$' || true)"
      - name: Diff hygiene
        run: git diff --check 24067c41445e5aacee9fe33a230c653efd4cfdf8...HEAD
