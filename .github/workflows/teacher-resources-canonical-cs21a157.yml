name: CS21A164 apply reusable book component

on:
  pull_request:
    paths:
      - 'scripts/apply_cs21a164_once.py'
      - '.github/workflows/teacher-resources-canonical-cs21a157.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-cs21a164:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: refactor/cs21a157-docente-recursos-canonicos
          fetch-depth: 0
      - name: Apply once when transformer exists
        shell: bash
        run: |
          set -euo pipefail
          if ! test -f scripts/apply_cs21a164_once.py; then
            echo 'Transformer not published yet.'
            exit 0
          fi
          python3 scripts/apply_cs21a164_once.py
          git rm scripts/apply_cs21a164_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/book_unit_starts_cs21a60.jsx scripts/test_teacher_resources_canonical_cs21a157.mjs
          git commit -m 'CS21A164 convierte CS21A75 en componente reutilizable puro'
          git push origin HEAD:refactor/cs21a157-docente-recursos-canonicos
