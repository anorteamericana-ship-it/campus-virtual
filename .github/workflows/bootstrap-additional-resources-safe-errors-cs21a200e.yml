name: Bootstrap Additional Resources Safe Errors CS21A200E

on:
  push:
    branches:
      - fix/additional-resources-safe-errors-cs21a200e
    paths:
      - 'scripts/bootstrap_patch_additional_resources_safe_errors_cs21a200e.mjs'
      - '.github/workflows/bootstrap-additional-resources-safe-errors-cs21a200e.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify exact base ancestry
        run: git merge-base --is-ancestor 46323b1796efa977bcdb9278bb40ba85c48e3ca8 HEAD
      - name: Apply exact patch
        run: node scripts/bootstrap_patch_additional_resources_safe_errors_cs21a200e.mjs
      - name: Run CS21A200E guard
        run: node scripts/qa_additional_resources_safe_errors_cs21a200e.mjs
      - name: Regress CS21A200D
        run: node scripts/qa_admin_additional_resources_route_cs21a200d.mjs
      - name: Regress CS21A200C
        run: node scripts/qa_cronograma_safe_errors_cs21a200c.mjs
      - name: Regress CS21A200B
        run: node scripts/qa_admin_resources_safe_errors_cs21a200b.mjs
      - name: Regress CS21A200A
        run: node scripts/qa_admin_security_consolidated_cs21a200a.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Remove bootstrap artifacts and push verified candidate
        run: |
          rm scripts/bootstrap_patch_additional_resources_safe_errors_cs21a200e.mjs
          rm .github/workflows/bootstrap-additional-resources-safe-errors-cs21a200e.yml
          git add -A
          git commit -m 'CS21A200E · safe errors in additional resources'
          git push origin HEAD:fix/additional-resources-safe-errors-cs21a200e
